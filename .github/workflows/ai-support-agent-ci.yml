name: AI Support Agent CI

run-name: ${{ inputs.correlation_id != '' && format('post-merge-{0}', inputs.correlation_id) || format('{0} {1}', github.workflow, github.event_name) }}

on:
  workflow_dispatch:
    inputs:
      result_sha:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      merge_pr:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_attempt:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      correlation_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
  pull_request:
    paths:
      - "agents/ai-support-agent/**"
      - ".github/workflows/ai-support-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "agents/ai-support-agent/**"
      - ".github/workflows/ai-support-agent-ci.yml"

permissions:
  contents: read

concurrency:
  group: ai-support-agent-ci-${{ inputs.result_sha || github.ref }}
  cancel-in-progress: ${{ inputs.result_sha == '' }}

jobs:
  # Load the validator from the trusted workflow revision. For completion runs,
  # the exact-result artifact identifies the tested commit, not the run's SHA.
  merge-inputs:
    name: Validate CI checkout identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      post_merge: ${{ steps.identity.outputs.post_merge }}
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - if: inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          POST_MERGE_INPUTS: ${{ inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' }}
        run: |
          if [ "$POST_MERGE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/merge_completion.py ci-inputs --workflow ai-support-agent-ci.yml
          else
            printf 'post_merge=false\ncheckout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze result routing identity before tests
        if: steps.identity.outputs.post_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-route --workflow ai-support-agent-ci.yml --output "$RUNNER_TEMP/route.json"
      - name: Preserve result routing identity
        if: steps.identity.outputs.post_merge == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/route.json
          retention-days: 30
          if-no-files-found: error

  contracts:
    needs: [merge-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow ai-support-agent-ci.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test boundary tooling
        working-directory: agents/ai-support-agent
        run: python3 -B -m unittest discover -s tests
      - name: Check public product files
        working-directory: agents/ai-support-agent
        run: python3 -B tools/check_boundaries.py scan --root . --destination public --git-files
      - name: Check this workflow as public content
        run: |
          python3 -B - <<'PYTHON'
          import importlib.util
          import pathlib
          import sys
          tool = pathlib.Path('agents/ai-support-agent/tools/check_boundaries.py')
          spec = importlib.util.spec_from_file_location('boundary_check', tool)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          scanner = module.Scanner('public')
          path = pathlib.Path('.github/workflows/ai-support-agent-ci.yml')
          scanner.content(path.name, path.read_bytes())
          if scanner.findings:
              raise SystemExit('Workflow boundary check failed; review locally')
          PYTHON

  result-evidence:
    name: Post-merge result evidence
    needs: [merge-inputs, contracts]
    if: always() && needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify job settlement and record result
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["contracts"]'
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-evidence --workflow ai-support-agent-ci.yml --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: error
