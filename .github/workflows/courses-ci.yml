name: courses-ci

run-name: ${{ inputs.correlation_id != '' && format('post-merge-{0}', inputs.correlation_id) || format('{0} {1}', github.workflow, github.event_name) }}

on:
  workflow_dispatch:
    inputs:
      result_sha:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      merge_pr:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_attempt:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      correlation_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
  pull_request:
    paths:
      - "courses/**"
      - ".github/workflows/courses-ci.yml"
  push:
    branches: [main]
    paths:
      - "courses/**"
      - ".github/workflows/courses-ci.yml"

permissions:
  contents: read

concurrency:
  group: courses-ci-${{ inputs.result_sha || github.ref }}
  cancel-in-progress: ${{ inputs.result_sha == '' }}

jobs:
  # Load the validator from the trusted workflow revision. For completion runs,
  # the exact-result artifact identifies the tested commit, not the run's SHA.
  merge-inputs:
    name: Validate CI checkout identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      post_merge: ${{ steps.identity.outputs.post_merge }}
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - if: inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          POST_MERGE_INPUTS: ${{ inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' }}
        run: |
          if [ "$POST_MERGE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/merge_completion.py ci-inputs --workflow courses-ci.yml
          else
            printf 'post_merge=false\ncheckout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  labs:
    name: courses-lab-contracts
    needs: [merge-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: courses
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow courses-ci.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install offline lab validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync procps
          # Reuse the validation pin without downloading GPU dependencies.
          python -m pip install \
            "$(sed -n '/^pytest==/p' requirements-validation.txt)" \
            "$(sed -n '/^prometheus-client==/p' requirements-validation.txt)" \
            "$(sed -n '/^PyYAML==/p' requirements-validation.txt)"
      - name: Validate shared copies and every course
        run: |
          set -euo pipefail
          python -B tools/validate_all_courses.py
      - name: Test preparation, distribution and Linux process cleanup
        run: |
          set -euo pipefail
          python -B -m pytest -q -p no:cacheprovider \
            tests/test_course_distribution.py \
            tests/test_course_preparation.py \
            tests/test_preparation_groups.py \
            tests/test_setup_publication.py \
            tests/test_sync_labs.py \
            tests/test_consolidated_jobs.py \
            tests/test_native_job_execution.py \
            tests/test_automatic_publication.py \
            tests/test_result_publication.py \
            tests/test_observability_integration.py \
            tests/test_profiling_contracts.py

  result-evidence:
    name: Post-merge result evidence
    needs: [merge-inputs, labs]
    if: always() && needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify job settlement and record result
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["labs"]'
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-evidence --workflow courses-ci.yml --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: error
