name: dependabot-auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: dependabot-auto-merge
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: dependabot-automerge
    env:
      DEPENDABOT_AUTOMERGE_APP_ID: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_ID }}
      DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY: ${{ secrets.DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY }}
      DEPENDABOT_AUTOMERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create automerge app token
        id: automerge_token
        if: env.DEPENDABOT_AUTOMERGE_APP_ID != '' && env.DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.DEPENDABOT_AUTOMERGE_APP_ID }}
          private-key: ${{ env.DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Evaluate automerge eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMERGE_TOKEN: ${{ steps.automerge_token.outputs.token || env.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          package_ecosystem="${PACKAGE_ECOSYSTEM}"
          update_type="${UPDATE_TYPE}"
          eligible=false
          reason=""

          is_allowed_ecosystem() {
            local package_ecosystem="$1"
            [[ "${package_ecosystem}" == "github_actions" ]] || \
              [[ "${package_ecosystem}" == "uv" ]] || \
              [[ "${package_ecosystem}" == "pip" ]]
          }

          is_allowed_path() {
            local package_ecosystem="$1"
            local path="$2"

            case "${package_ecosystem}" in
              github_actions)
                [[ "${path}" =~ ^\.github/workflows/[^/]+\.ya?ml$ ]] || \
                  [[ "${path}" =~ ^\.github/actions/.+/action\.ya?ml$ ]]
                ;;
              uv|pip)
                [[ "${path}" =~ (^|/)(pyproject\.toml|uv\.lock|poetry\.lock|pdm\.lock|Pipfile|Pipfile\.lock)$ ]] || \
                  [[ "${path}" =~ (^|/)(requirements|constraints)([-._/][^/]+)?\.txt$ ]]
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_allowed_update_type() {
            local update_type="$1"
            [[ "${update_type}" == "version-update:semver-major" ]] || \
            [[ "${update_type}" == "version-update:semver-patch" ]] || \
              [[ "${update_type}" == "version-update:semver-minor" ]]
          }

          if ! is_allowed_ecosystem "${package_ecosystem}"; then
            reason="Dependabot package ecosystem '${package_ecosystem}' is not eligible for automerge."
          elif [[ -z "${AUTOMERGE_TOKEN}" ]]; then
            reason="No automerge credential is configured. Set GitHub App secrets DEPENDABOT_AUTOMERGE_APP_ID and DEPENDABOT_AUTOMERGE_APP_PRIVATE_KEY, or set DEPENDABOT_AUTOMERGE_TOKEN."
          elif ! is_allowed_update_type "${update_type}"; then
            reason="Dependabot update type '${update_type}' is not eligible for automerge."
          else
            mapfile -t files < <(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json files --jq '.files[].path')
            if [[ "${#files[@]}" -eq 0 ]]; then
              reason="Dependabot PR has no changed files."
            else
              for path in "${files[@]}"; do
                if ! is_allowed_path "${package_ecosystem}" "${path}"; then
                  if [[ "${package_ecosystem}" == "github_actions" ]]; then
                    reason="Changed file '${path}' is outside workflow automation scope."
                  else
                    reason="Changed file '${path}' is outside Python dependency manifest and lockfile scope."
                  fi
                  eligible=false
                  break
                fi
              done

              if [[ -z "${reason}" ]]; then
                eligible=true
              fi
            fi
          fi

          {
            echo "eligible=${eligible}"
            echo "update_type=${update_type}"
            echo "reason=${reason}"
          } >> "$GITHUB_OUTPUT"

      - name: Auto-approve Dependabot update
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.automerge_token.outputs.token || env.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "${PR_URL}"

      - name: Enable auto-merge
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.automerge_token.outputs.token || env.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "${PR_URL}"

      - name: Skip auto-merge for ineligible Dependabot updates
        if: steps.eligibility.outputs.eligible != 'true'
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          REASON: ${{ steps.eligibility.outputs.reason }}
        run: |
          echo "Skipping auto-merge for Dependabot update."
          echo "Dependency names: ${DEPENDENCY_NAMES}"
          echo "Update type: ${UPDATE_TYPE}"
          echo "Reason: ${REASON}"
