name: GitHub AI automation CI
on:
  pull_request:
    paths: ["github-ai-automation/**", ".github/workflows/github-ai-*.yml", "skills/merge-pr/scripts/candidate_ci.py"]
  push:
    branches: [main]
    paths: ["github-ai-automation/**", ".github/workflows/github-ai-*.yml", "skills/merge-pr/scripts/candidate_ci.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Validate controller contracts and installed artifact
        working-directory: github-ai-automation
        run: make all
