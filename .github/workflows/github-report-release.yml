name: github-report-release-publish

on:
  push:
    tags:
      - "github-report-v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: github-report-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  APP_DIR: misc/github-report
  TAG_PREFIX: github-report
  MAIN_BRANCH: main
  ASSET_GLOB: "dist/*.whl"

jobs:
  release:
    name: github-report-release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" version --tag "$REF_NAME" --prefix "$TAG_PREFIX"

      - name: Resolve tagged commit
        id: revision
        run: |
          set -euo pipefail
          echo "commit=$(git rev-list -n 1 "${{ steps.version.outputs.tag }}")" >> "$GITHUB_OUTPUT"

      - name: Ensure tag commit belongs to main history
        env:
          RELEASE_COMMIT: ${{ steps.revision.outputs.commit }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" ancestry --commit "$RELEASE_COMMIT" --branch "$MAIN_BRANCH"

      - name: Verify existing release or establish absence
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" release-state --workflow github-report-release.yml --tag "$RELEASE_TAG"

      - name: Set up Python
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          make install

      - name: Lint
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          make lint

      - name: Unit tests
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          make test-unit

      - name: Integration tests
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          make test-integration

      - name: Coverage
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          make coverage

      - name: Build artifact
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          make build

      - name: Resolve and verify artifact
        if: steps.state.outputs.release_exists == 'false'
        id: asset
        run: |
          set -euo pipefail
          mapfile -t assets < <(compgen -G "${ASSET_GLOB}" | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release asset found with glob ${ASSET_GLOB}"
            exit 1
          fi
          asset="${assets[0]}"

          wheel_version="$(python - "${asset}" <<'PY'
          import sys
          import zipfile
          from email import message_from_bytes

          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as zf:
              metadata_names = [n for n in zf.namelist() if n.endswith("METADATA")]
              if not metadata_names:
                  raise SystemExit("No METADATA found in wheel")
              metadata = message_from_bytes(zf.read(metadata_names[0]))
              print(metadata.get("Version", ""))
          PY
          )"

          if [[ "${wheel_version}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Wheel version (${wheel_version}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

          echo "path=${asset}" >> "$GITHUB_OUTPUT"

      - name: Package release assets
        if: steps.state.outputs.release_exists == 'false'
        id: package
        run: |
          set -euo pipefail

          release_dir="release-assets"
          installer_name="install-github-report.sh"
          guide_name="INSTALL.txt"
          bundle_name="github-report-install-${{ steps.version.outputs.version }}.tar.gz"
          checksums_name="github-report-${{ steps.version.outputs.version }}-SHA256SUMS.txt"

          rm -rf "${release_dir}"
          mkdir -p "${release_dir}/bundle"

          cp "${{ steps.asset.outputs.path }}" "${release_dir}/"
          cp "${installer_name}" "${release_dir}/${installer_name}"
          chmod 0755 "${release_dir}/${installer_name}"

          python - "${release_dir}/${guide_name}" "${bundle_name}" "${{ steps.version.outputs.tag }}" <<'PY'
          import os
          import sys
          from pathlib import Path
          from textwrap import dedent

          guide_path, bundle_name, tag = sys.argv[1:4]
          repository = os.environ["GITHUB_REPOSITORY"]

          content = dedent(
              f"""
              github-report install guide
              =========================

              Recommended install path: use the bundled install archive from this release.

              1. Extract this archive.
              2. Open a terminal in the extracted folder.
              3. Run:

                 bash ./install-github-report.sh

              What the installer does:
              - installs Python automatically when needed on macOS and Ubuntu/Debian-style Linux
              - installs the bundled github-report wheel
              - creates the github-report launcher in ~/.local/bin
              - verifies the installed version
              - explains the GitHub token permissions needed for report access

              If you want to install directly from the release page without extracting first:

                 curl -fsSLO https://github.com/{repository}/releases/download/{tag}/{bundle_name}
                 tar -xzf {bundle_name}
                 bash ./install-github-report.sh
              """
          ).lstrip()

          Path(guide_path).write_text(content, encoding="utf-8")
          PY

          cp "${release_dir}/${installer_name}" "${release_dir}/bundle/${installer_name}"
          cp "${release_dir}/${guide_name}" "${release_dir}/bundle/${guide_name}"
          cp "${{ steps.asset.outputs.path }}" "${release_dir}/bundle/"

          tar -C "${release_dir}/bundle" -czf "${release_dir}/${bundle_name}" \
            "${installer_name}" \
            "${guide_name}" \
            "$(basename -- "${{ steps.asset.outputs.path }}")"

          (
            cd "${release_dir}"
            shasum -a 256 \
              "$(basename -- "${{ steps.asset.outputs.path }}")" \
              "${installer_name}" \
              "${guide_name}" \
              "${bundle_name}" > "${checksums_name}"
          )

          {
            echo "wheel_path=${release_dir}/$(basename -- "${{ steps.asset.outputs.path }}")"
            echo "installer_path=${release_dir}/${installer_name}"
            echo "guide_path=${release_dir}/${guide_name}"
            echo "bundle_path=${release_dir}/${bundle_name}"
            echo "checksums_path=${release_dir}/${checksums_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes from changelog
        if: steps.state.outputs.release_exists == 'false'
        id: notes
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" notes \
            --tag "${{ steps.version.outputs.tag }}" --prefix "$TAG_PREFIX" --output release-notes.md
          python - "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.version }}" <<'PY'
          import pathlib
          import sys
          from textwrap import dedent

          tag = sys.argv[1]
          version = sys.argv[2]

          notes_text = pathlib.Path("release-notes.md").read_text(encoding="utf-8").strip()

          install_section = dedent(
              f"""
              ## Install

              Recommended: download the bundled install archive from this release and run:

              ```bash
              curl -fsSLO https://github.com/${{ github.repository }}/releases/download/{tag}/github-report-install-{version}.tar.gz
              tar -xzf github-report-install-{version}.tar.gz
              bash ./install-github-report.sh
              ```

              No git clone is required.
              """
          ).strip()

          pathlib.Path("release-notes.md").write_text(
              notes_text + "\n\n" + install_section + "\n",
              encoding="utf-8",
          )
          PY
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Freeze asset hashes before publication
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" release-manifest --workflow github-report-release.yml --tag "$RELEASE_TAG"
          --asset "${{ steps.package.outputs.wheel_path }}" --asset "${{ steps.package.outputs.installer_path }}" --asset "${{ steps.package.outputs.guide_path }}" --asset "${{ steps.package.outputs.bundle_path }}" --asset "${{ steps.package.outputs.checksums_path }}"
          --output publication.json

      - name: Preserve immutable pre-publication evidence
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: publication-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.APP_DIR }}/publication.json
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.wheel_path }}" \
            "${{ steps.package.outputs.installer_path }}" \
            "${{ steps.package.outputs.guide_path }}" \
            "${{ steps.package.outputs.bundle_path }}" \
            "${{ steps.package.outputs.checksums_path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.path }}"

      - name: Verify published release against original evidence
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" release-verify --workflow github-report-release.yml --tag "$RELEASE_TAG"

      - name: Write release manifest
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          jq -n \
            --arg actor "${GITHUB_ACTOR}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha "${{ steps.revision.outputs.commit }}" \
            --arg wheel "${{ steps.package.outputs.wheel_path }}" \
            --arg installer "${{ steps.package.outputs.installer_path }}" \
            --arg guide "${{ steps.package.outputs.guide_path }}" \
            --arg bundle "${{ steps.package.outputs.bundle_path }}" \
            --arg checksums "${{ steps.package.outputs.checksums_path }}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '{
              actor: $actor,
              repository: $repository,
              event: $event,
              ref: $ref,
              tag: $tag,
              version: $version,
              sha: $sha,
              assets: {
                wheel: $wheel,
                installer: $installer,
                guide: $guide,
                bundle: $bundle,
                checksums: $checksums
              },
              run_id: $run_id,
              run_attempt: $run_attempt,
              timestamp_utc: now | todate
            }' > release-manifest.json

      - name: Upload release manifest artifact
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: github-report-release-manifest-${{ github.run_id }}
          path: ${{ env.APP_DIR }}/release-manifest.json

      - name: Release already exists
        if: steps.state.outputs.release_exists == 'true'
        run: |
          echo "Release ${{ steps.version.outputs.tag }} already exists and its assets match trusted original hashes."

      - name: Publish run summary
        run: |
          {
            echo "### github-report release publish"
            echo ""
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Commit: \`${{ steps.revision.outputs.commit }}\`"
            echo "- Release exists: \`${{ steps.state.outputs.release_exists }}\`"
            if [[ "${{ steps.state.outputs.release_exists }}" == "false" ]]; then
              echo "- Wheel asset: \`${{ steps.package.outputs.wheel_path }}\`"
              echo "- Installer asset: \`${{ steps.package.outputs.installer_path }}\`"
              echo "- Install guide asset: \`${{ steps.package.outputs.guide_path }}\`"
              echo "- Bundle asset: \`${{ steps.package.outputs.bundle_path }}\`"
              echo "- Checksums asset: \`${{ steps.package.outputs.checksums_path }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
