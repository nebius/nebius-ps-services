name: helm-chart-publish

on:
  push:
    tags:
      - "*-chart-v*"

permissions:
  contents: read

concurrency:
  group: helm-chart-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART_PUBLISH_CATALOG: .github/helm-chart-publish.json
  MAIN_BRANCH: main
  OCI_REPOSITORY_PREFIX: charts

jobs:
  publish:
    name: helm-chart-publish
    runs-on: ubuntu-latest
    environment:
      name: nb-image-chart-publish
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Resolve release metadata
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${REF_NAME}" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '${REF_NAME}' must match <chart-tag-prefix>-vMAJOR.MINOR.PATCH"
            exit 1
          fi

          tag_prefix="${BASH_REMATCH[1]}"
          publish_version="${BASH_REMATCH[2]}"

          if [[ ! -f "${CHART_PUBLISH_CATALOG}" ]]; then
            echo "::error::Missing chart publish catalog ${CHART_PUBLISH_CATALOG}"
            exit 1
          fi

          chart_entry="$(jq -c --arg tag_prefix "${tag_prefix}" '.charts[] | select(.tagPrefix == $tag_prefix)' "${CHART_PUBLISH_CATALOG}")"
          if [[ -z "${chart_entry}" ]]; then
            echo "::error::Unsupported Helm chart publish tag prefix '${tag_prefix}'"
            echo "::error::Register the chart in ${CHART_PUBLISH_CATALOG} before publishing."
            exit 1
          fi

          chart_dir="$(jq -r '.chartDir' <<< "${chart_entry}")"
          chart_name="$(jq -r '.chartName' <<< "${chart_entry}")"
          smoke_templates="$(jq -c '.smokeTemplates // []' <<< "${chart_entry}")"
          commit="$(git rev-list -n 1 "${REF_NAME}")"
          chart_version="$(helm show chart "${chart_dir}" | awk -F': ' '$1 == "version" {print $2; exit}')"

          if [[ -z "${chart_version}" ]]; then
            echo "::error::Unable to resolve chart version from ${chart_dir}/Chart.yaml"
            exit 1
          fi

          if [[ "${chart_version}" != "${publish_version}" ]]; then
            echo "::error::Chart version ${chart_version} does not match release version ${publish_version}"
            exit 1
          fi

          {
            echo "chart_dir=${chart_dir}"
            echo "chart_name=${chart_name}"
            echo "chart_version=${chart_version}"
            echo "commit=${commit}"
            echo "publish_ref=${REF_NAME}"
            echo "publish_version=${publish_version}"
            echo "smoke_templates=${smoke_templates}"
            echo "tag_prefix=${tag_prefix}"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure tag commit belongs to main history
        run: |
          set -euo pipefail
          git fetch origin "${MAIN_BRANCH}" --depth=1
          if ! git merge-base --is-ancestor "${{ steps.release.outputs.commit }}" "origin/${MAIN_BRANCH}"; then
            echo "::error::Tag commit ${{ steps.release.outputs.commit }} is not in origin/${MAIN_BRANCH} history"
            exit 1
          fi

      - name: Resolve fixed target registry
        id: registry
        env:
          CHART_NAME: ${{ steps.release.outputs.chart_name }}
          NB_REGION_ID: ${{ vars.NB_REGION_ID }}
          NB_REGISTRY_ID: ${{ vars.NB_REGISTRY_ID }}
          NB_REGISTRY_NAME: ${{ vars.NB_REGISTRY_NAME }}
        run: |
          set -euo pipefail

          if [[ -z "${NB_REGION_ID:-}" || -z "${NB_REGISTRY_ID:-}" ]]; then
            echo "::error::Missing required registry settings NB_REGION_ID or NB_REGISTRY_ID"
            exit 1
          fi

          if [[ "${NB_REGISTRY_ID}" != registry-* ]]; then
            echo "::error::NB_REGISTRY_ID must be a full registry id like registry-<id>"
            exit 1
          fi

          registry_id="${NB_REGISTRY_ID}"
          registry_name="${NB_REGISTRY_NAME:-${registry_id}}"
          registry_path="${registry_id#registry-}"
          registry_host="cr.${NB_REGION_ID}.nebius.cloud"
          push_ref="oci://${registry_host}/${registry_path}/${OCI_REPOSITORY_PREFIX}"
          chart_ref="${push_ref}/${CHART_NAME}"
          duplicate_chart_ref="${chart_ref}/${CHART_NAME}"

          {
            echo "chart_ref=${chart_ref}"
            echo "duplicate_chart_ref=${duplicate_chart_ref}"
            echo "push_ref=${push_ref}"
            echo "registry_host=${registry_host}"
            echo "registry_id=${registry_id}"
            echo "registry_name=${registry_name}"
            echo "registry_path=${registry_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Package chart
        id: package
        env:
          CHART_DIR: ${{ steps.release.outputs.chart_dir }}
          CHART_NAME: ${{ steps.release.outputs.chart_name }}
          PUBLISH_VERSION: ${{ steps.release.outputs.publish_version }}
          SMOKE_TEMPLATES: ${{ steps.release.outputs.smoke_templates }}
        run: |
          set -euo pipefail

          if grep -q '^dependencies:' "${CHART_DIR}/Chart.yaml"; then
            if [[ -f "${CHART_DIR}/Chart.lock" ]]; then
              helm dependency build "${CHART_DIR}"
            else
              helm dependency update "${CHART_DIR}"
            fi
          fi

          helm lint --strict "${CHART_DIR}"
          helm template smoke "${CHART_DIR}" --namespace "${CHART_NAME}" >/dev/null

          smoke_count="$(jq 'length' <<< "${SMOKE_TEMPLATES}")"
          for ((i = 0; i < smoke_count; i += 1)); do
            mapfile -t smoke_args < <(jq -r ".[$i][]" <<< "${SMOKE_TEMPLATES}")
            helm template smoke "${CHART_DIR}" --namespace "${CHART_NAME}" "${smoke_args[@]}" >/dev/null
          done

          rm -rf dist
          mkdir -p dist
          helm package "${CHART_DIR}" -d dist

          package_path="dist/${CHART_NAME}-${PUBLISH_VERSION}.tgz"
          if [[ ! -f "${package_path}" ]]; then
            echo "::error::Expected package ${package_path} was not produced"
            exit 1
          fi

          package_sha256="$(sha256sum "${package_path}" | awk '{print $1}')"

          {
            echo "package_path=${package_path}"
            echo "package_sha256=${package_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check existing public chart version
        id: existing
        env:
          CHART_NAME: ${{ steps.release.outputs.chart_name }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
          PUBLISH_VERSION: ${{ steps.release.outputs.publish_version }}
        run: |
          set -euo pipefail

          helm_tmp="$(mktemp -d)"
          export HELM_CONFIG_HOME="${helm_tmp}/config"
          export HELM_CACHE_HOME="${helm_tmp}/cache"
          export HELM_DATA_HOME="${helm_tmp}/data"
          export HELM_REGISTRY_CONFIG="${helm_tmp}/registry.json"
          mkdir -p "${HELM_CONFIG_HOME}" "${HELM_CACHE_HOME}" "${HELM_DATA_HOME}"

          pull_dir="$(mktemp -d)"
          if pull_output="$(helm pull "${{ steps.registry.outputs.chart_ref }}" --version "${PUBLISH_VERSION}" -d "${pull_dir}" 2>&1)"; then
            printf '%s\n' "${pull_output}"
            remote_package="${pull_dir}/${CHART_NAME}-${PUBLISH_VERSION}.tgz"
            remote_sha256="$(sha256sum "${remote_package}" | awk '{print $1}')"
            if [[ "${remote_sha256}" != "${PACKAGE_SHA256}" ]]; then
              echo "::error::Registry already contains ${{ steps.registry.outputs.chart_ref }}:${PUBLISH_VERSION} with different content"
              echo "::error::Local package sha256=${PACKAGE_SHA256}, remote package sha256=${remote_sha256}"
              exit 1
            fi
            echo "publish_needed=false" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "${pull_output}" >&2
            if grep -Eiq 'not found|manifest unknown|404' <<< "${pull_output}"; then
              echo "publish_needed=true" >> "${GITHUB_OUTPUT}"
            else
              echo "::error::Failed to check existing public chart version"
              exit 1
            fi
          fi

      - name: Install Nebius CLI
        if: steps.existing.outputs.publish_needed == 'true'
        run: |
          set -euo pipefail
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash
          echo "${HOME}/.nebius/bin" >> "${GITHUB_PATH}"

      - name: Guard against duplicate nested chart repository
        if: steps.existing.outputs.publish_needed == 'true'
        run: |
          set -euo pipefail

          helm_tmp="$(mktemp -d)"
          export HELM_CONFIG_HOME="${helm_tmp}/config"
          export HELM_CACHE_HOME="${helm_tmp}/cache"
          export HELM_DATA_HOME="${helm_tmp}/data"
          export HELM_REGISTRY_CONFIG="${helm_tmp}/registry.json"
          mkdir -p "${HELM_CONFIG_HOME}" "${HELM_CACHE_HOME}" "${HELM_DATA_HOME}"

          duplicate_ref="${{ steps.registry.outputs.duplicate_chart_ref }}"
          if duplicate_output="$(helm show chart "${duplicate_ref}" 2>&1)"; then
            printf '%s\n' "${duplicate_output}"
            echo "::error::Duplicate nested chart repository detected at ${duplicate_ref}."
            echo "::error::Delete the nested repository/artifacts first, then rerun the publish workflow."
            echo "::error::The canonical public chart reference must stay ${{ steps.registry.outputs.chart_ref }}."
            exit 1
          fi

          if grep -Eiq 'not found|manifest unknown|404|unable to locate any tags' <<< "${duplicate_output}"; then
            printf '%s\n' "${duplicate_output}"
            echo "::notice::No tagged duplicate nested chart repository detected at ${duplicate_ref}."
            exit 0
          fi

          printf '%s\n' "${duplicate_output}" >&2
          echo "::error::Unable to verify whether duplicate nested chart repository ${duplicate_ref} exists."
          exit 1

      - name: Configure Nebius CLI profile
        if: steps.existing.outputs.publish_needed == 'true'
        env:
          NB_PROJECT_ID: ${{ vars.NB_PROJECT_ID }}
          NB_SERVICE_ACCOUNT_ID: ${{ vars.NB_SERVICE_ACCOUNT_ID }}
          NB_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.NB_SERVICE_ACCOUNT_PRIVATE_KEY }}
          NB_SERVICE_ACCOUNT_PUBLIC_KEY_ID: ${{ vars.NB_SERVICE_ACCOUNT_PUBLIC_KEY_ID }}
          NB_TENANT_ID: ${{ vars.NB_TENANT_ID }}
        run: |
          set -euo pipefail

          for required_var in NB_PROJECT_ID NB_SERVICE_ACCOUNT_ID NB_SERVICE_ACCOUNT_PUBLIC_KEY_ID NB_SERVICE_ACCOUNT_PRIVATE_KEY; do
            if [[ -z "${!required_var:-}" ]]; then
              echo "::error::Missing required Nebius environment setting ${required_var}"
              exit 1
            fi
          done

          install -d -m 700 "${HOME}/.nebius"
          private_key_path="${HOME}/.nebius/helm-chart-publish.pem"
          printf '%s\n' "${NB_SERVICE_ACCOUNT_PRIVATE_KEY}" > "${private_key_path}"
          chmod 600 "${private_key_path}"

          profile_args=(
            ci
            --config "${HOME}/.nebius/config.yaml"
            --endpoint api.nebius.cloud
            --service-account-id "${NB_SERVICE_ACCOUNT_ID}"
            --public-key-id "${NB_SERVICE_ACCOUNT_PUBLIC_KEY_ID}"
            --private-key-file-path "${private_key_path}"
            --parent-id "${NB_PROJECT_ID}"
            --skip-auth
          )
          if [[ -n "${NB_TENANT_ID:-}" ]]; then
            profile_args+=( --tenant-id "${NB_TENANT_ID}" )
          fi

          nebius profile create "${profile_args[@]}" >/dev/null

      - name: Login to Nebius Container Registry
        if: steps.existing.outputs.publish_needed == 'true'
        run: |
          set -euo pipefail
          nebius --config "${HOME}/.nebius/config.yaml" --profile ci iam get-access-token | \
            helm registry login "${{ steps.registry.outputs.registry_host }}" \
              --username iam \
              --password-stdin

      - name: Push chart package
        if: steps.existing.outputs.publish_needed == 'true'
        id: push
        run: |
          set -euo pipefail
          if push_output="$(helm push "${{ steps.package.outputs.package_path }}" "${{ steps.registry.outputs.push_ref }}" 2>&1)"; then
            printf '%s\n' "${push_output}"
          else
            printf '%s\n' "${push_output}" >&2
            exit 1
          fi
          digest="$(printf '%s\n' "${push_output}" | awk '/^Digest:/ {print $2; exit}')"
          if [[ -z "${digest}" ]]; then
            echo "::error::Unable to resolve OCI digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Verify anonymous public chart pull
        id: verify_public
        env:
          CHART_NAME: ${{ steps.release.outputs.chart_name }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
          PUBLISH_VERSION: ${{ steps.release.outputs.publish_version }}
        run: |
          set -euo pipefail

          helm_tmp="$(mktemp -d)"
          export HELM_CONFIG_HOME="${helm_tmp}/config"
          export HELM_CACHE_HOME="${helm_tmp}/cache"
          export HELM_DATA_HOME="${helm_tmp}/data"
          export HELM_REGISTRY_CONFIG="${helm_tmp}/registry.json"
          mkdir -p "${HELM_CONFIG_HOME}" "${HELM_CACHE_HOME}" "${HELM_DATA_HOME}"

          pull_dir="$(mktemp -d)"
          if pull_output="$(helm pull "${{ steps.registry.outputs.chart_ref }}" --version "${PUBLISH_VERSION}" -d "${pull_dir}" 2>&1)"; then
            printf '%s\n' "${pull_output}"
          else
            printf '%s\n' "${pull_output}" >&2
            exit 1
          fi
          public_package="${pull_dir}/${CHART_NAME}-${PUBLISH_VERSION}.tgz"
          public_sha256="$(sha256sum "${public_package}" | awk '{print $1}')"

          if [[ "${public_sha256}" != "${PACKAGE_SHA256}" ]]; then
            echo "::error::Anonymous pull sha256 ${public_sha256} does not match packaged sha256 ${PACKAGE_SHA256}"
            exit 1
          fi

          digest="$(printf '%s\n' "${pull_output}" | awk '/^Digest:/ {print $2; exit}')"
          if [[ -z "${digest}" ]]; then
            digest="${{ steps.push.outputs.digest }}"
          fi

          {
            echo "digest=${digest}"
            echo "public_sha256=${public_sha256}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write publish manifest
        run: |
          set -euo pipefail
          jq -n \
            --arg actor "${GITHUB_ACTOR}" \
            --arg chart_dir "${{ steps.release.outputs.chart_dir }}" \
            --arg chart_name "${{ steps.release.outputs.chart_name }}" \
            --arg commit "${{ steps.release.outputs.commit }}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg oci_ref "${{ steps.registry.outputs.chart_ref }}" \
            --arg package_path "${{ steps.package.outputs.package_path }}" \
            --arg package_sha256 "${{ steps.package.outputs.package_sha256 }}" \
            --arg project_id "${{ vars.NB_PROJECT_ID }}" \
            --arg public_pull_sha256 "${{ steps.verify_public.outputs.public_sha256 }}" \
            --arg publish_needed "${{ steps.existing.outputs.publish_needed }}" \
            --arg publish_ref "${{ steps.release.outputs.publish_ref }}" \
            --arg published_digest "${{ steps.verify_public.outputs.digest }}" \
            --arg ref "${GITHUB_REF}" \
            --arg ref_name "${GITHUB_REF_NAME}" \
            --arg registry_id "${{ steps.registry.outputs.registry_id }}" \
            --arg registry_name "${{ steps.registry.outputs.registry_name }}" \
            --arg registry_path "${{ steps.registry.outputs.registry_path }}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg tag_prefix "${{ steps.release.outputs.tag_prefix }}" \
            --arg tenant_id "${{ vars.NB_TENANT_ID }}" \
            --arg version "${{ steps.release.outputs.publish_version }}" \
            '{
              actor: $actor,
              chart_dir: $chart_dir,
              chart_name: $chart_name,
              commit: $commit,
              event: $event,
              oci_ref: $oci_ref,
              package_path: $package_path,
              package_sha256: $package_sha256,
              project_id: $project_id,
              public_pull_sha256: $public_pull_sha256,
              publish_needed: ($publish_needed == "true"),
              publish_ref: $publish_ref,
              published_digest: $published_digest,
              ref: $ref,
              ref_name: $ref_name,
              registry_id: $registry_id,
              registry_name: $registry_name,
              registry_path: $registry_path,
              repository: $repository,
              run_attempt: $run_attempt,
              run_id: $run_id,
              tag_prefix: $tag_prefix,
              tenant_id: $tenant_id,
              timestamp_utc: now | todate,
              version: $version
            }' > publish-manifest.json

      - name: Upload publish manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.chart_name }}-chart-publish-manifest-${{ github.run_id }}
          path: publish-manifest.json

      - name: Publish run summary
        run: |
          set -euo pipefail
          {
            echo "### ${{ steps.release.outputs.chart_name }} chart publish"
            echo ""
            echo "- Version: \`${{ steps.release.outputs.publish_version }}\`"
            echo "- Commit: \`${{ steps.release.outputs.commit }}\`"
            echo "- Registry name: \`${{ steps.registry.outputs.registry_name }}\`"
            echo "- Registry: \`${{ steps.registry.outputs.registry_id }}\`"
            echo "- OCI reference: \`${{ steps.registry.outputs.chart_ref }}:${{ steps.release.outputs.publish_version }}\`"
            echo "- Package sha256: \`${{ steps.package.outputs.package_sha256 }}\`"
            echo "- OCI digest: \`${{ steps.verify_public.outputs.digest }}\`"
            echo "- Anonymous pull sha256: \`${{ steps.verify_public.outputs.public_sha256 }}\`"
            echo "- Pushed in this run: \`${{ steps.existing.outputs.publish_needed }}\`"
            echo ""
            echo "Public pull example:"
            echo ""
            echo '```bash'
            echo "helm pull ${{ steps.registry.outputs.chart_ref }} --version ${{ steps.release.outputs.publish_version }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
