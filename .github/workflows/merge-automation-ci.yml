name: Merge automation CI

run-name: ${{ inputs.qualification_sha != '' && format('release-qualification-{0}-{1}-{2}', inputs.qualification_profile, inputs.qualification_sha, inputs.qualification_id) || inputs.candidate_head != '' && format('ai-candidate-{0}-{1}-{2}-{3}', inputs.candidate_pr, inputs.candidate_head, inputs.candidate_base, inputs.candidate_request_id) || inputs.correlation_id != '' && format('post-merge-{0}', inputs.correlation_id) || format('{0} {1}', github.workflow, github.event_name) }}

on:
  workflow_dispatch:
    inputs:
      qualification_sha:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      qualification_profile:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      qualification_id:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      candidate_pr:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_head:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_base:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_request_id:
        description: Active automation request ID
        required: false
        type: string
      candidate_source:
        description: Trusted admission run ID and attempt separated by a colon
        required: false
        type: string
      result_sha:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      merge_pr:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_attempt:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      correlation_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: merge-automation-ci-${{ inputs.qualification_sha || inputs.candidate_head || inputs.result_sha || github.ref }}
  cancel-in-progress: ${{ inputs.qualification_sha == '' && inputs.result_sha == '' && inputs.candidate_head == '' }}

jobs:
  # Load the validator from the trusted workflow revision. For completion runs,
  # the exact-result artifact identifies the tested commit, not the run's SHA.
  merge-inputs:
    name: Validate CI checkout identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      qualification: ${{ steps.identity.outputs.qualification }}
      candidate: ${{ steps.identity.outputs.candidate }}
      post_merge: ${{ steps.identity.outputs.post_merge }}
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - if: (inputs.candidate_pr != '' || inputs.candidate_head != '' || inputs.candidate_base != '' || inputs.candidate_request_id != '' || inputs.candidate_source != '') || inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' || inputs.qualification_sha != '' || inputs.qualification_profile != '' || inputs.qualification_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CANDIDATE_INPUTS: ${{ (inputs.candidate_pr != '' || inputs.candidate_head != '' || inputs.candidate_base != '' || inputs.candidate_request_id != '' || inputs.candidate_source != '') }}
          QUALIFICATION_INPUTS: ${{ inputs.qualification_sha != '' || inputs.qualification_profile != '' || inputs.qualification_id != '' }}
          POST_MERGE_INPUTS: ${{ inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' }}
        run: |
          if [ "$QUALIFICATION_INPUTS" = true ]; then
            python3 skills/github-workflows/scripts/release_qualification.py inputs --workflow merge-automation-ci.yml
          elif [ "$CANDIDATE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/candidate_ci.py inputs --workflow merge-automation-ci.yml
          elif [ "$POST_MERGE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/merge_completion.py ci-inputs --workflow merge-automation-ci.yml
          else
            printf 'post_merge=false\ncheckout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze result routing identity before tests
        if: steps.identity.outputs.post_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-route --workflow merge-automation-ci.yml --output "$RUNNER_TEMP/route.json"
      - name: Preserve result routing identity
        if: steps.identity.outputs.post_merge == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/route.json
          retention-days: 30
          if-no-files-found: error

  contracts:
    needs: [merge-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the admitted PR candidate
        if: needs.merge-inputs.outputs.candidate == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py checkout --workflow merge-automation-ci.yml
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow merge-automation-ci.yml
      - name: Check out the release qualification commit
        if: needs.merge-inputs.outputs.qualification == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/github-workflows/scripts/release_qualification.py checkout --workflow merge-automation-ci.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test deterministic merge admission
        run: python3 -B skills/merge-pr/scripts/test_merge_gate.py
      - name: Test exact-result recovery
        run: python3 -B skills/merge-pr/scripts/test_merge_completion.py
      - name: Test publication primitives
        run: python3 -B skills/merge-pr/scripts/test_publication_helpers.py
      - name: Install workflow parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test CI partition coverage and scheduling
        run: python3 -B .github/scripts/test_ci_parallelism.py
      - name: Test publishing and workflow contracts
        run: |
          python3 -B -m unittest discover -s skills/publish-release/scripts -p 'test_release_*.py'
          python3 -B skills/github-workflows/scripts/test_release_qualification.py
          python3 -B skills/github-workflows/scripts/test_publication.py
          python3 -B skills/github-workflows/scripts/test_workflow_contracts.py
          python3 -B skills/github-workflows/scripts/test_image_workflow_asset_ownership.py

  result-evidence:
    name: Post-merge result evidence
    needs: [merge-inputs, contracts]
    if: always() && needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify job settlement and record result
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["contracts"]'
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-evidence --workflow merge-automation-ci.yml --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: error

  candidate-evidence:
    name: Exact candidate CI evidence
    needs: [merge-inputs, contracts]
    if: always() && needs.merge-inputs.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Independently collect job outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py evidence --workflow merge-automation-ci.yml --output "$RUNNER_TEMP/candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 30

  release-qualification-vpngw:
    name: Release qualification for vpngw
    needs: [merge-inputs, contracts]
    if: >-
      always() && needs.merge-inputs.result == 'success' &&
      ((github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      needs.merge-inputs.outputs.post_merge == 'true' ||
      (needs.merge-inputs.outputs.qualification == 'true' && inputs.qualification_profile == 'services/vpngw'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record complete qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: >-
          python3 skills/github-workflows/scripts/release_qualification.py emit
          --workflow merge-automation-ci.yml --project services/vpngw --commit "$TESTED_SHA"
          --output "$RUNNER_TEMP/qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-qualification-services-vpngw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          retention-days: 14
          if-no-files-found: error

  release-qualification-nebius-cxcli:
    name: Release qualification for nebius-cxcli
    needs: [merge-inputs, contracts]
    if: >-
      always() && needs.merge-inputs.result == 'success' &&
      ((github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      needs.merge-inputs.outputs.post_merge == 'true' ||
      (needs.merge-inputs.outputs.qualification == 'true' && inputs.qualification_profile == 'services/nebius-cxcli'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record complete qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: >-
          python3 skills/github-workflows/scripts/release_qualification.py emit
          --workflow merge-automation-ci.yml --project services/nebius-cxcli --commit "$TESTED_SHA"
          --output "$RUNNER_TEMP/qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-qualification-services-nebius-cxcli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          retention-days: 14
          if-no-files-found: error
