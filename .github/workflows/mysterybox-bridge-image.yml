name: mysterybox-bridge-image

on:
  push:
    branches: ["main"]
    tags:
      - "mysterybox-bridge-v*"
    paths:
      - "services/mysterybox-bridge/webhook/**"
      - ".github/workflows/mysterybox-bridge-image.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref (branch, tag, or SHA) to build"
        required: false
        default: "main"
        type: string
      release_version:
        description: "Optional release SemVer (X.Y.Z) to publish X.Y.Z-g<sha> on manual runs"
        required: false
        type: string
      publish_latest:
        description: "Also publish :latest (recommended only for main)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mysterybox-bridge-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: quay.io/nebius/mysterybox-bridge
  WEBHOOK_DIR: services/mysterybox-bridge/webhook

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WEBHOOK_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q tests

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    needs: [test]
    environment:
      name: mysterybox-image-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Authorize workflow_dispatch actor
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.actor;
            const response = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });
            const permission = response.data.permission;
            core.info(`workflow_dispatch actor '${username}' permission: ${permission}`);
            if (permission !== "admin") {
              core.setFailed(
                `workflow_dispatch publish is restricted to repository admins; actor '${username}' has '${permission}'.`
              );
            }

      - name: Validate workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail

          if [[ -n "${RELEASE_VERSION}" && ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_version must match X.Y.Z"
            exit 1
          fi

          if [[ "${PUBLISH_LATEST}" == "true" && "${SOURCE_REF}" != "main" ]]; then
            echo "::error::publish_latest=true is only allowed with source_ref=main"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Quay credentials
        id: quay_creds
        env:
          QUAY_SECRET: ${{ secrets.QUAY_MYSTERYBOX }}
          QUAY_USERNAME_VAR: ${{ vars.QUAY_MYSTERYBOX_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${QUAY_SECRET:-}" ]; then
            echo "::error::Missing required secret QUAY_MYSTERYBOX"
            exit 1
          fi

          if [[ "${QUAY_SECRET}" == *":"* ]]; then
            echo "username=${QUAY_SECRET%%:*}" >> "$GITHUB_OUTPUT"
            echo "password=${QUAY_SECRET#*:}" >> "$GITHUB_OUTPUT"
          else
            username="${QUAY_USERNAME_VAR:-nebius}"
            echo "::notice::Using QUAY_MYSTERYBOX as token and username '${username}'."
            echo "::notice::For robot accounts, prefer secret format 'username:token' or set repo variable QUAY_MYSTERYBOX_USERNAME."
            echo "username=${username}" >> "$GITHUB_OUTPUT"
            echo "password=${QUAY_SECRET}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ steps.quay_creds.outputs.username }}
          password: ${{ steps.quay_creds.outputs.password }}

      - name: Resolve image tags
        id: image_tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail

          short_sha="${SHA::7}"
          tags="${IMAGE_NAME}:sha-${short_sha}"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${PUBLISH_LATEST}" == "true" ]]; then
              tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
            fi
            if [[ -n "${RELEASE_VERSION}" ]]; then
              tags="${tags}"$'\n'"${IMAGE_NAME}:${RELEASE_VERSION}-g${short_sha}"
            fi
          else
            if [[ "${REF_TYPE}" == "branch" && "${REF_NAME}" == "main" ]]; then
              tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
            fi

            if [[ "${REF_TYPE}" == "tag" ]]; then
              if [[ "${REF_NAME}" =~ ^mysterybox-bridge-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                semver="${BASH_REMATCH[1]}"
                tags="${tags}"$'\n'"${IMAGE_NAME}:${semver}"
                tags="${tags}"$'\n'"${IMAGE_NAME}:${semver}-g${short_sha}"
              else
                echo "::error::Tag '${REF_NAME}' must match mysterybox-bridge-vMAJOR.MINOR.PATCH"
                exit 1
              fi
            fi
          fi

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WEBHOOK_DIR }}
          file: ${{ env.WEBHOOK_DIR }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publish manifest
        env:
          TAGS: ${{ steps.image_tags.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tags_json="$(printf '%s\n' "${TAGS}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          jq -n \
            --arg actor "${GITHUB_ACTOR}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg ref_name "${GITHUB_REF_NAME}" \
            --arg sha "${GITHUB_SHA}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson tags "${tags_json}" \
            '{
              actor: $actor,
              repository: $repository,
              event: $event,
              ref: $ref,
              ref_name: $ref_name,
              sha: $sha,
              tags: $tags,
              digest: $digest,
              run_id: $run_id,
              run_attempt: $run_attempt,
              timestamp_utc: now | todate
            }' > publish-manifest.json

      - name: Upload publish manifest artifact
        uses: actions/upload-artifact@v6
        with:
          name: mysterybox-bridge-publish-manifest-${{ github.run_id }}
          path: publish-manifest.json

      - name: Publish run summary
        env:
          TAGS: ${{ steps.image_tags.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### mysterybox-bridge image publish"
            echo ""
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo ""
            echo "#### Tags"
            while IFS= read -r tag; do
              [ -n "${tag}" ] && echo "- \`${tag}\`"
            done <<< "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
