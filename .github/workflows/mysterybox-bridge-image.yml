name: mysterybox-bridge-image

on:
  push:
    tags:
      - "mysterybox-bridge-v*"

permissions:
  contents: read

concurrency:
  group: mysterybox-bridge-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: quay.io/nebius/mysterybox-bridge
  WEBHOOK_DIR: services/mysterybox-bridge/webhook
  MAIN_BRANCH: main

jobs:
  test:
    name: mysterybox-bridge-lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WEBHOOK_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Unit tests
        run: python -m pytest -q -m "not integration" tests/unit

      - name: Integration smoke tests
        run: python -m pytest -q -m integration tests/integration

  build-and-push:
    name: mysterybox-bridge-build-and-push
    runs-on: ubuntu-latest
    needs: [test]
    environment:
      name: mysterybox-image-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tagged release metadata
        id: release
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${REF_NAME}" =~ ^mysterybox-bridge-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '${REF_NAME}' must match mysterybox-bridge-vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-list -n 1 "${REF_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Ensure tag commit belongs to main history
        run: |
          set -euo pipefail
          git fetch origin "${MAIN_BRANCH}" --depth=1
          if ! git merge-base --is-ancestor "${{ steps.release.outputs.commit }}" "origin/${MAIN_BRANCH}"; then
            echo "::error::Tag commit ${{ steps.release.outputs.commit }} is not in origin/${MAIN_BRANCH} history"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Quay credentials
        id: quay_creds
        env:
          QUAY_SECRET: ${{ secrets.QUAY_MYSTERYBOX }}
          QUAY_USERNAME_VAR: ${{ vars.QUAY_MYSTERYBOX_USERNAME }}
        run: |
          set -euo pipefail

          if [[ -z "${QUAY_SECRET:-}" ]]; then
            echo "::error::Missing required secret QUAY_MYSTERYBOX"
            exit 1
          fi

          if [[ "${QUAY_SECRET}" == *":"* ]]; then
            echo "username=${QUAY_SECRET%%:*}" >> "$GITHUB_OUTPUT"
            echo "password=${QUAY_SECRET#*:}" >> "$GITHUB_OUTPUT"
          else
            username="${QUAY_USERNAME_VAR:-}"
            if [[ -z "${username}" ]]; then
              echo "::error::Token-only secret QUAY_MYSTERYBOX requires repo variable QUAY_MYSTERYBOX_USERNAME"
              exit 1
            fi
            echo "username=${username}" >> "$GITHUB_OUTPUT"
            echo "password=${QUAY_SECRET}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Quay
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ steps.quay_creds.outputs.username }}
          password: ${{ steps.quay_creds.outputs.password }}

      - name: Resolve image metadata
        id: image
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          short_sha="${COMMIT::7}"
          tags="${IMAGE_NAME}:sha-${short_sha}"$'\n'"${IMAGE_NAME}:${VERSION}"$'\n'"${IMAGE_NAME}:${VERSION}-g${short_sha}"

          {
            echo "package_version=${VERSION}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.WEBHOOK_DIR }}
          file: ${{ env.WEBHOOK_DIR }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            MYSTERYBOX_BRIDGE_WEBHOOK_VERSION=${{ steps.image.outputs.package_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publish manifest
        env:
          TAGS: ${{ steps.image.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PACKAGE_VERSION: ${{ steps.image.outputs.package_version }}
        run: |
          set -euo pipefail
          tags_json="$(printf '%s\n' "${TAGS}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          jq -n \
            --arg actor "${GITHUB_ACTOR}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg ref_name "${GITHUB_REF_NAME}" \
            --arg tag "${{ steps.release.outputs.tag }}" \
            --arg version "${{ steps.release.outputs.version }}" \
            --arg sha "${{ steps.release.outputs.commit }}" \
            --arg package_version "${PACKAGE_VERSION}" \
            --arg digest "${IMAGE_DIGEST}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson tags "${tags_json}" \
            '{
              actor: $actor,
              repository: $repository,
              event: $event,
              ref: $ref,
              ref_name: $ref_name,
              tag: $tag,
              version: $version,
              sha: $sha,
              package_version: $package_version,
              tags: $tags,
              digest: $digest,
              run_id: $run_id,
              run_attempt: $run_attempt,
              timestamp_utc: now | todate
            }' > publish-manifest.json

      - name: Upload publish manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: mysterybox-bridge-publish-manifest-${{ github.run_id }}
          path: publish-manifest.json

      - name: Publish run summary
        env:
          TAGS: ${{ steps.image.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PACKAGE_VERSION: ${{ steps.image.outputs.package_version }}
        run: |
          set -euo pipefail
          {
            echo "### mysterybox-bridge image publish"
            echo ""
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- Commit: \`${{ steps.release.outputs.commit }}\`"
            echo "- Package version: \`${PACKAGE_VERSION}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo ""
            echo "#### Tags"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] && echo "- \`${tag}\`"
            done <<< "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"
