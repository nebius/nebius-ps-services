name: mysterybox-bridge-image

on:
  push:
    branches: ["main"]
    paths:
      - "services/mysterybox-bridge/webhook/**"
      - ".github/workflows/mysterybox-bridge-image.yml"

permissions:
  contents: read

concurrency:
  group: mysterybox-bridge-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: quay.io/nebius/mysterybox-bridge
  WEBHOOK_DIR: services/mysterybox-bridge/webhook

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WEBHOOK_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q tests

  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Quay credentials
        id: quay_creds
        env:
          QUAY_SECRET: ${{ secrets.QUAY_MYSTERYBOX }}
          QUAY_USERNAME_VAR: ${{ vars.QUAY_MYSTERYBOX_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${QUAY_SECRET:-}" ]; then
            echo "::error::Missing required secret QUAY_MYSTERYBOX"
            exit 1
          fi

          if [[ "${QUAY_SECRET}" == *":"* ]]; then
            echo "username=${QUAY_SECRET%%:*}" >> "$GITHUB_OUTPUT"
            echo "password=${QUAY_SECRET#*:}" >> "$GITHUB_OUTPUT"
          else
            username="${QUAY_USERNAME_VAR:-nebius}"
            echo "::notice::Using QUAY_MYSTERYBOX as token and username '${username}'."
            echo "::notice::For robot accounts, prefer secret format 'username:token' or set repo variable QUAY_MYSTERYBOX_USERNAME."
            echo "username=${username}" >> "$GITHUB_OUTPUT"
            echo "password=${QUAY_SECRET}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ steps.quay_creds.outputs.username }}
          password: ${{ steps.quay_creds.outputs.password }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WEBHOOK_DIR }}
          file: ${{ env.WEBHOOK_DIR }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
