name: mysterybox-bridge-webhook-ci

on:
  pull_request:
    paths:
      - "services/mysterybox-bridge/webhook/**"
      - ".github/workflows/mysterybox-bridge-webhook-ci.yml"
      - ".github/workflows/mysterybox-bridge-image.yml"
  push:
    branches: ["main"]
    paths:
      - "services/mysterybox-bridge/webhook/**"
      - ".github/workflows/mysterybox-bridge-webhook-ci.yml"
      - ".github/workflows/mysterybox-bridge-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysterybox-bridge-webhook-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBHOOK_DIR: services/mysterybox-bridge/webhook

jobs:
  verify:
    name: mysterybox-bridge-webhook-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WEBHOOK_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Unit tests
        run: python -m pytest -q -m "not integration" tests/unit

      - name: Integration smoke tests
        run: python -m pytest -q -m integration tests/integration

      - name: Build container image
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${SHA::7}"
          docker build \
            -t mysterybox-bridge:webhook-ci \
            --build-arg "MYSTERYBOX_BRIDGE_WEBHOOK_VERSION=0.0.0.dev0+g${short_sha}" \
            .
