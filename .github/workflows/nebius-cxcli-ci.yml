name: nebius-cxcli-ci

on:
  pull_request:
    paths:
      - "services/nebius-cxcli/**"
      - "platform-infra/modules/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  push:
    branches: [main]
    paths:
      - "services/nebius-cxcli/**"
      - "platform-infra/modules/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: nebius-cxcli-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify service with local make contract
        env:
          RELEASE_REF: ${{ github.sha }}
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: portable
        run: |
          set -euo pipefail
          make all

      - name: Validate active component sources catalog
        env:
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: local
        run: |
          set -euo pipefail
          .venv/bin/python -m nebius_cxcli validate-sources component_sources.yaml

      - name: Verify bundled component sources are packaged in wheel
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' | sort | head -n 1)"
          if [[ -z "${wheel}" ]]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          .venv/bin/python -m nebius_cxcli.release_catalog verify-wheel-bundle \
            --wheel "${wheel}"
          echo "Verified bundled component_sources.yaml is packaged in ${wheel}"
