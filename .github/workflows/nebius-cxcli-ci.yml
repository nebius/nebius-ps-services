name: nebius-cxcli-ci

on:
  pull_request:
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  push:
    branches: [main]
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: nebius-cxcli-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf build dist
          backup="$(mktemp)"
          cp component_sources.yaml "${backup}"
          trap 'mv "${backup}" component_sources.yaml' EXIT
          python -m nebius_cxcli.release_catalog render \
            --input component_sources.release.yaml \
            --output component_sources.yaml \
            --release-ref "${RELEASE_REF}"
          python -m build --wheel

      - name: Verify bundled component sources in wheel
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' | sort | head -n 1)"
          if [[ -z "${wheel}" ]]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          python -m nebius_cxcli.release_catalog verify-wheel \
            --wheel "${wheel}" \
            --release-ref "${RELEASE_REF}"
          echo "Verified bundled portable component_sources.yaml in ${wheel}"
