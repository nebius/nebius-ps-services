name: nebius-cxcli-ci

run-name: ${{ inputs.qualification_sha != '' && format('release-qualification-{0}-{1}-{2}', inputs.qualification_profile, inputs.qualification_sha, inputs.qualification_id) || inputs.candidate_head != '' && format('ai-candidate-{0}-{1}-{2}-{3}', inputs.candidate_pr, inputs.candidate_head, inputs.candidate_base, inputs.candidate_request_id) || inputs.correlation_id != '' && format('post-merge-{0}', inputs.correlation_id) || format('{0} {1}', github.workflow, github.event_name) }}

on:
  pull_request:
    paths:
      - ".github/merge-policy.json"
      - "skills/publish-release/scripts/**"
      - "skills/github-workflows/scripts/release_qualification.py"
      - "skills/github-workflows/scripts/publication.py"
      - ".github/helm-chart-publish.json"
      - "services/nebius-cxcli/**"
      - "services/nccl-test/**"
      - "helm-charts/nccl-test/**"
      - "platform-infra/modules/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  push:
    branches: [main]
    paths:
      - ".github/merge-policy.json"
      - "skills/publish-release/scripts/**"
      - "skills/github-workflows/scripts/release_qualification.py"
      - "skills/github-workflows/scripts/publication.py"
      - ".github/helm-chart-publish.json"
      - "services/nebius-cxcli/**"
      - "services/nccl-test/**"
      - "helm-charts/nccl-test/**"
      - "platform-infra/modules/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  workflow_dispatch:
    inputs:
      qualification_sha:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      qualification_profile:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      qualification_id:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      candidate_pr:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_head:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_base:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_request_id:
        description: Active automation request ID
        required: false
        type: string
      candidate_source:
        description: Trusted admission run ID and attempt separated by a colon
        required: false
        type: string
      result_sha:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      merge_pr:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_attempt:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      correlation_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-ci-${{ github.workflow }}-${{ inputs.qualification_sha || inputs.candidate_head || inputs.result_sha || github.ref }}
  cancel-in-progress: ${{ inputs.qualification_sha == '' && inputs.result_sha == '' && inputs.candidate_head == '' }}

jobs:
  merge-inputs:
    name: Validate CI checkout identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      qualification: ${{ steps.identity.outputs.qualification }}
      candidate: ${{ steps.identity.outputs.candidate }}
      post_merge: ${{ steps.identity.outputs.post_merge }}
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - if: (inputs.candidate_pr != '' || inputs.candidate_head != '' || inputs.candidate_base != '' || inputs.candidate_request_id != '' || inputs.candidate_source != '') || inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' || inputs.qualification_sha != '' || inputs.qualification_profile != '' || inputs.qualification_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CANDIDATE_INPUTS: ${{ (inputs.candidate_pr != '' || inputs.candidate_head != '' || inputs.candidate_base != '' || inputs.candidate_request_id != '' || inputs.candidate_source != '') }}
          QUALIFICATION_INPUTS: ${{ inputs.qualification_sha != '' || inputs.qualification_profile != '' || inputs.qualification_id != '' }}
          POST_MERGE_INPUTS: ${{ inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' }}
        run: |
          if [ "$QUALIFICATION_INPUTS" = true ]; then
            python3 skills/github-workflows/scripts/release_qualification.py inputs --workflow nebius-cxcli-ci.yml
          elif [ "$CANDIDATE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/candidate_ci.py inputs --workflow nebius-cxcli-ci.yml
          elif [ "$POST_MERGE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/merge_completion.py ci-inputs --workflow nebius-cxcli-ci.yml
          else
            printf 'post_merge=false\ncheckout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze result routing identity before tests
        if: steps.identity.outputs.post_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-route --workflow nebius-cxcli-ci.yml --output "$RUNNER_TEMP/route.json"
      - name: Preserve result routing identity
        if: steps.identity.outputs.post_merge == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/route.json
          retention-days: 30
          if-no-files-found: error

  python-compatibility:
    needs: [merge-inputs]
    name: Python ${{ matrix.python-version }} offline suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the admitted PR candidate
        if: needs.merge-inputs.outputs.candidate == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py checkout --workflow nebius-cxcli-ci.yml
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow nebius-cxcli-ci.yml
      - name: Check out the release qualification commit
        if: needs.merge-inputs.outputs.qualification == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/github-workflows/scripts/release_qualification.py checkout --workflow nebius-cxcli-ci.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: services/nebius-cxcli/uv.lock
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Install service dependencies
        run: |
          set -euo pipefail
          make env
      - name: Prepare Terraform CLI for service tests
        run: |
          set -euo pipefail
          terraform_output="$(
            uv run --locked --no-sync --no-python-downloads python - <<'PY'
          from nebius_cxcli.managed_tools import resolve_terraform_binary

          print(resolve_terraform_binary())
          PY
          )"
          terraform_bin="$(printf '%s\n' "${terraform_output}" | tail -n 1)"
          if [[ ! -x "${terraform_bin}" ]]; then
            echo "::error::Resolved Terraform binary is not executable: ${terraform_bin}"
            exit 1
          fi
          dirname "${terraform_bin}" >> "${GITHUB_PATH}"
          "${terraform_bin}" version
      - name: Run full offline suite
        env:
          RELEASE_REF: ${{ needs.merge-inputs.outputs.checkout_sha }}
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: portable
        run: |
          set -euo pipefail
          make ci-python

  verify:
    needs: [merge-inputs]
    name: Quality, coverage, and wheel
    runs-on: ubuntu-latest
    env:
      DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the admitted PR candidate
        if: needs.merge-inputs.outputs.candidate == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py checkout --workflow nebius-cxcli-ci.yml
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow nebius-cxcli-ci.yml
      - name: Check out the release qualification commit
        if: needs.merge-inputs.outputs.qualification == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/github-workflows/scripts/release_qualification.py checkout --workflow nebius-cxcli-ci.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: services/nebius-cxcli/uv.lock
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Install service dependencies
        run: |
          set -euo pipefail
          make env
      - name: Prepare Terraform CLI for service tests
        run: |
          set -euo pipefail
          terraform_output="$(
            uv run --locked --no-sync --no-python-downloads python - <<'PY'
          from nebius_cxcli.managed_tools import resolve_terraform_binary

          print(resolve_terraform_binary())
          PY
          )"
          terraform_bin="$(printf '%s\n' "${terraform_output}" | tail -n 1)"
          if [[ ! -x "${terraform_bin}" ]]; then
            echo "::error::Resolved Terraform binary is not executable: ${terraform_bin}"
            exit 1
          fi
          dirname "${terraform_bin}" >> "${GITHUB_PATH}"
          "${terraform_bin}" version
      - name: Prepare pinned Tailscale policy helper toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify service with local make contract
        env:
          RELEASE_REF: ${{ needs.merge-inputs.outputs.checkout_sha }}
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: portable
        run: |
          set -euo pipefail
          CXCLI_BUILD_TAILSCALE_HELPER=1 make ci-quality verify-wheel-cli

      - name: Qualify native Tailscale policy preservation
        run: uv run --locked --no-sync --no-python-downloads pytest -m integration tests/test_tailscale_policy.py

      - name: Verify Tailscale module without cloud access
        timeout-minutes: 5
        run: python3 scripts/verify_tailscale_module.py

      - name: Verify NAT SSH protection in isolated Ubuntu systemd
        timeout-minutes: 20
        run: python3 ../../platform-infra/modules/nat-gateway/tests/systemd/run.py

      - name: Verify WireGuard rendered cloud-init size and decoded scripts
        timeout-minutes: 5
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads pytest \
            -p no:cacheprovider -m integration tests/test_wireguard_guest_access.py

      - name: Verify private NAT probe SSH transport
        timeout-minutes: 10
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          docker info >/dev/null
          uv run --locked --no-sync --no-python-downloads pytest \
            -p no:cacheprovider -m integration tests/test_nat_gateway_probe_ssh_integration.py

      - name: Qualify pinned Grafana charts, API and PostgreSQL persistence
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads python scripts/verify_grafana_postgres.py
          uv run --locked --no-sync --no-python-downloads python scripts/verify_grafana_api.py
          uv run --locked --no-sync --no-python-downloads python scripts/verify_grafana_persistence.py

      - name: Upload exact nebius-cxcli wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nebius-cxcli-wheel
          path: services/nebius-cxcli/dist/*.whl
          if-no-files-found: error

      - name: Validate NCCL chart transport rendering
        run: |
          set -euo pipefail
          helm lint ../../helm-charts/nccl-test
          helm template smoke ../../helm-charts/nccl-test \
            --namespace nccl-test \
            --set worker.replicas=2 \
            --set benchmark.transport.mode=socket >/dev/null
          helm template smoke ../../helm-charts/nccl-test \
            --namespace nccl-test \
            --set worker.replicas=2 \
            --set benchmark.transport.mode=rdma >/dev/null

      - name: Validate active component sources catalog
        env:
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: local
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli validate-sources component_sources.yaml

      - name: Verify bundled component sources are packaged in wheel
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' | sort | head -n 1)"
          if [[ -z "${wheel}" ]]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli.release_catalog verify-wheel-bundle \
            --wheel "${wheel}"
          echo "Verified bundled component_sources.yaml is packaged in ${wheel}"

  wheel-compatibility:
    needs: [merge-inputs, verify]
    name: Python ${{ matrix.python-version }} exact wheel contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the admitted PR candidate
        if: needs.merge-inputs.outputs.candidate == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py checkout --workflow nebius-cxcli-ci.yml
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow nebius-cxcli-ci.yml
      - name: Check out the release qualification commit
        if: needs.merge-inputs.outputs.qualification == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/github-workflows/scripts/release_qualification.py checkout --workflow nebius-cxcli-ci.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: services/nebius-cxcli/uv.lock
      - name: Install service dependencies
        run: |
          set -euo pipefail
          make env
      - name: Download exact nebius-cxcli wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nebius-cxcli-wheel
          path: services/nebius-cxcli/dist
      - name: Verify exact installed wheel CLI contract
        run: |
          set -euo pipefail
          make verify-wheel-cli-dist

  result-evidence:
    name: Post-merge result evidence
    needs: [merge-inputs, python-compatibility, verify, wheel-compatibility]
    if: always() && needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify job settlement and record result
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["python-compatibility", "verify", "wheel-compatibility"]'
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-evidence --workflow nebius-cxcli-ci.yml --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: error

  candidate-evidence:
    name: Exact candidate CI evidence
    needs: [merge-inputs, python-compatibility, verify, wheel-compatibility]
    if: always() && needs.merge-inputs.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Independently collect job outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py evidence --workflow nebius-cxcli-ci.yml --output "$RUNNER_TEMP/candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 30

  release-qualification-nebius-cxcli:
    name: Release qualification for nebius-cxcli
    needs: [merge-inputs, python-compatibility, verify, wheel-compatibility]
    if: >-
      always() && needs.merge-inputs.result == 'success' &&
      ((github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      needs.merge-inputs.outputs.post_merge == 'true' ||
      (needs.merge-inputs.outputs.qualification == 'true' && inputs.qualification_profile == 'services/nebius-cxcli'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record complete qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: >-
          python3 skills/github-workflows/scripts/release_qualification.py emit
          --workflow nebius-cxcli-ci.yml --project services/nebius-cxcli --commit "$TESTED_SHA"
          --output "$RUNNER_TEMP/qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-qualification-services-nebius-cxcli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          retention-days: 14
          if-no-files-found: error
