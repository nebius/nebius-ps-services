name: nebius-cxcli-ci

on:
  pull_request:
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  push:
    branches: [main]
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: nebius-cxcli-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf build dist
          backup="$(mktemp)"
          cp component_sources.yaml "${backup}"
          trap 'mv "${backup}" component_sources.yaml' EXIT
          python - "${RELEASE_REF}" <<'PY'
          import pathlib
          import sys
          import yaml

          release_ref = sys.argv[1]
          repo_prefix = "git::https://github.com/nebius/nebius-ps-services.git//"
          payload = yaml.safe_load(
              pathlib.Path("component_sources.release.yaml").read_text(encoding="utf-8")
          ) or {}
          modules = (((payload or {}).get("infra") or {}).get("tf_modules") or [])
          for module in modules:
              if not isinstance(module, dict):
                  continue
              source = str(module.get("source", "")).strip()
              if source.startswith(repo_prefix):
                  module["source"] = source.replace("?ref=main", f"?ref={release_ref}")
          pathlib.Path("component_sources.yaml").write_text(
              yaml.safe_dump(payload, sort_keys=False),
              encoding="utf-8",
          )
          PY
          python -m build --wheel

      - name: Verify bundled component sources in wheel
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - "${RELEASE_REF}" <<'PY'
          import pathlib
          import re
          import sys
          import yaml
          import zipfile

          release_ref = sys.argv[1]
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel found in dist/")

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              candidate_names = [
                  name for name in names if name.endswith("nebius_cxcli/component_sources.yaml")
              ]
              if not candidate_names:
                  raise SystemExit(
                      f"{wheel.name} is missing bundled nebius_cxcli/component_sources.yaml"
                  )
              bundled = yaml.safe_load(zf.read(candidate_names[0]).decode("utf-8")) or {}

          modules = (((bundled or {}).get("infra") or {}).get("tf_modules") or [])
          if not isinstance(modules, list) or not modules:
              raise SystemExit(f"{wheel.name} bundled component sources has no infra.tf_modules entries")

          repo_prefix = "git::https://github.com/nebius/nebius-ps-services.git//"
          local_path_pattern = re.compile(r"^(?:\.\.?/|/|[A-Za-z]:[\\/])")
          bad_sources = []
          for module in modules:
              if not isinstance(module, dict):
                  continue
              source = str(module.get("source", "")).strip()
              if not source:
                  bad_sources.append("<empty>")
                  continue
              if local_path_pattern.match(source):
                  bad_sources.append(source)
                  continue
              if source.startswith(repo_prefix):
                  if f"?ref={release_ref}" not in source or "?ref=main" in source:
                      bad_sources.append(source)
                  continue
              if "?ref=main" in source:
                  bad_sources.append(source or "<empty>")

          if bad_sources:
              raise SystemExit(
                  f"{wheel.name} bundled component sources contains non-portable or incorrectly pinned module sources: "
                  + ", ".join(bad_sources)
              )

          print(f"Verified bundled portable component_sources.yaml in {wheel.name}")
          PY
