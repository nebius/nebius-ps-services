name: nebius-cxcli-ci

run-name: ${{ inputs.correlation_id != '' && format('post-merge-{0}', inputs.correlation_id) || format('{0} {1}', github.workflow, github.event_name) }}

on:
  pull_request:
    paths:
      - ".github/helm-chart-publish.json"
      - "services/nebius-cxcli/**"
      - "services/nccl-test/**"
      - "helm-charts/nccl-test/**"
      - "platform-infra/modules/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  push:
    branches: [main]
    paths:
      - ".github/helm-chart-publish.json"
      - "services/nebius-cxcli/**"
      - "services/nccl-test/**"
      - "helm-charts/nccl-test/**"
      - "platform-infra/modules/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  workflow_dispatch:
    inputs:
      result_sha:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      merge_pr:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_attempt:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      correlation_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-ci-${{ github.workflow }}-${{ inputs.result_sha || github.ref }}
  cancel-in-progress: ${{ inputs.result_sha == '' }}

jobs:
  merge-inputs:
    name: Validate CI checkout identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      post_merge: ${{ steps.identity.outputs.post_merge }}
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - if: inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          POST_MERGE_INPUTS: ${{ inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' }}
        run: |
          if [ "$POST_MERGE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/merge_completion.py ci-inputs --workflow nebius-cxcli-ci.yml
          else
            printf 'post_merge=false\ncheckout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  python-compatibility:
    needs: [merge-inputs]
    name: Python ${{ matrix.python-version }} offline suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: services/nebius-cxcli/uv.lock
      - uses: azure/setup-helm@v5
      - name: Install service dependencies
        run: |
          set -euo pipefail
          make env
      - name: Prepare Terraform CLI for service tests
        run: |
          set -euo pipefail
          terraform_output="$(
            uv run --locked --no-sync --no-python-downloads python - <<'PY'
          from nebius_cxcli.managed_tools import resolve_terraform_binary

          print(resolve_terraform_binary())
          PY
          )"
          terraform_bin="$(printf '%s\n' "${terraform_output}" | tail -n 1)"
          if [[ ! -x "${terraform_bin}" ]]; then
            echo "::error::Resolved Terraform binary is not executable: ${terraform_bin}"
            exit 1
          fi
          dirname "${terraform_bin}" >> "${GITHUB_PATH}"
          "${terraform_bin}" version
      - name: Run full offline suite
        env:
          RELEASE_REF: ${{ github.sha }}
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: portable
        run: |
          set -euo pipefail
          make ci-python

  verify:
    needs: [merge-inputs]
    name: Quality, coverage, and wheel
    runs-on: ubuntu-latest
    env:
      DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: services/nebius-cxcli/uv.lock
      - uses: azure/setup-helm@v5
      - name: Install service dependencies
        run: |
          set -euo pipefail
          make env
      - name: Prepare Terraform CLI for service tests
        run: |
          set -euo pipefail
          terraform_output="$(
            uv run --locked --no-sync --no-python-downloads python - <<'PY'
          from nebius_cxcli.managed_tools import resolve_terraform_binary

          print(resolve_terraform_binary())
          PY
          )"
          terraform_bin="$(printf '%s\n' "${terraform_output}" | tail -n 1)"
          if [[ ! -x "${terraform_bin}" ]]; then
            echo "::error::Resolved Terraform binary is not executable: ${terraform_bin}"
            exit 1
          fi
          dirname "${terraform_bin}" >> "${GITHUB_PATH}"
          "${terraform_bin}" version
      - name: Verify service with local make contract
        env:
          RELEASE_REF: ${{ github.sha }}
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: portable
        run: |
          set -euo pipefail
          make ci-quality verify-wheel-cli

      - name: Qualify pinned Grafana charts, API and PostgreSQL persistence
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads python scripts/verify_grafana_postgres.py
          uv run --locked --no-sync --no-python-downloads python scripts/verify_grafana_api.py
          uv run --locked --no-sync --no-python-downloads python scripts/verify_grafana_persistence.py

      - name: Upload exact nebius-cxcli wheel
        uses: actions/upload-artifact@v7
        with:
          name: nebius-cxcli-wheel
          path: services/nebius-cxcli/dist/*.whl
          if-no-files-found: error

      - name: Validate NCCL chart transport rendering
        run: |
          set -euo pipefail
          helm lint ../../helm-charts/nccl-test
          helm template smoke ../../helm-charts/nccl-test \
            --namespace nccl-test \
            --set worker.replicas=2 \
            --set benchmark.transport.mode=socket >/dev/null
          helm template smoke ../../helm-charts/nccl-test \
            --namespace nccl-test \
            --set worker.replicas=2 \
            --set benchmark.transport.mode=rdma >/dev/null

      - name: Validate active component sources catalog
        env:
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: local
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli validate-sources component_sources.yaml

      - name: Verify bundled component sources are packaged in wheel
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' | sort | head -n 1)"
          if [[ -z "${wheel}" ]]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli.release_catalog verify-wheel-bundle \
            --wheel "${wheel}"
          echo "Verified bundled component_sources.yaml is packaged in ${wheel}"

  wheel-compatibility:
    needs: [merge-inputs, verify]
    name: Python ${{ matrix.python-version }} exact wheel contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: services/nebius-cxcli/uv.lock
      - name: Install service dependencies
        run: |
          set -euo pipefail
          make env
      - name: Download exact nebius-cxcli wheel
        uses: actions/download-artifact@v8
        with:
          name: nebius-cxcli-wheel
          path: services/nebius-cxcli/dist
      - name: Verify exact installed wheel CLI contract
        run: |
          set -euo pipefail
          make verify-wheel-cli-dist

  result-evidence:
    name: Post-merge result evidence
    needs: [merge-inputs, python-compatibility, verify, wheel-compatibility]
    if: always() && needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify job settlement and record result
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["python-compatibility", "verify", "wheel-compatibility"]'
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-evidence --workflow nebius-cxcli-ci.yml --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: error
