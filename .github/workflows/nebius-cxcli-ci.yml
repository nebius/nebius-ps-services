name: nebius-cxcli-ci

on:
  pull_request:
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  push:
    branches: [main]
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: nebius-cxcli-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf build dist
          backup="$(mktemp)"
          cp component_sources.yaml "${backup}"
          trap 'mv "${backup}" component_sources.yaml' EXIT
          python - "${RELEASE_REF}" <<'PY'
          import pathlib
          import re
          import sys

          release_ref = sys.argv[1]
          source = pathlib.Path("component_sources.release.yaml").read_text(encoding="utf-8")
          rendered = re.sub(r"\?ref=main\b", f"?ref={release_ref}", source)
          pathlib.Path("component_sources.yaml").write_text(rendered, encoding="utf-8")
          PY
          python -m build --wheel

      - name: Verify bundled component sources in wheel
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel found in dist/")

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()

          if not any(name.endswith("nebius_cxcli/component_sources.yaml") for name in names):
              raise SystemExit(
                  f"{wheel.name} is missing bundled nebius_cxcli/component_sources.yaml"
              )

          print(f"Verified bundled component_sources.yaml in {wheel.name}")
          PY
