name: nebius-cxcli-ci

on:
  pull_request:
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  push:
    branches: [main]
    paths:
      - "services/nebius-cxcli/**"
      - ".github/workflows/nebius-cxcli-ci.yml"
      - ".github/workflows/nebius-cxcli-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: nebius-cxcli-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nebius-cxcli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build --wheel
