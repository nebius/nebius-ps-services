name: nebius-cxcli-nsight

run-name: ${{ inputs.qualification_sha != '' && format('release-qualification-{0}-{1}-{2}', inputs.qualification_profile, inputs.qualification_sha, inputs.qualification_id) || inputs.candidate_head != '' && format('ai-candidate-{0}-{1}-{2}-{3}', inputs.candidate_pr, inputs.candidate_head, inputs.candidate_base, inputs.candidate_request_id) || inputs.correlation_id != '' && format('post-merge-{0}', inputs.correlation_id) || format('{0} {1}', github.workflow, github.event_name) }}

on:
  pull_request:
    paths:
      - "services/nebius-cxcli/uv.lock"
      - "services/nebius-cxcli/pyproject.toml"
      - "services/nebius-cxcli/src/nebius_cxcli/nsight*.py"
      - "services/nebius-cxcli/src/nebius_cxcli/flux_render.py"
      - "services/nebius-cxcli/scripts/verify_nsight*.py"
      - "services/nebius-cxcli/tests/test_nsight*.py"
      - ".github/workflows/nebius-cxcli-nsight.yml"
  push:
    branches: [main]
    paths:
      - "services/nebius-cxcli/uv.lock"
      - "services/nebius-cxcli/pyproject.toml"
      - "services/nebius-cxcli/src/nebius_cxcli/nsight*.py"
      - "services/nebius-cxcli/src/nebius_cxcli/flux_render.py"
      - "services/nebius-cxcli/scripts/verify_nsight*.py"
      - "services/nebius-cxcli/tests/test_nsight*.py"
      - ".github/workflows/nebius-cxcli-nsight.yml"
  workflow_dispatch:
    inputs:
      qualification_sha:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      qualification_profile:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      qualification_id:
        description: Explicit release qualification identity (all three required together)
        required: false
        type: string
      candidate_pr:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_head:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_base:
        description: Trusted candidate identity (all five fields required together)
        required: false
        type: string
      candidate_request_id:
        description: Active automation request ID
        required: false
        type: string
      candidate_source:
        description: Trusted admission run ID and attempt separated by a colon
        required: false
        type: string
      result_sha:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      merge_pr:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_attempt:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      correlation_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nebius-cxcli-nsight-${{ inputs.qualification_sha || inputs.candidate_head || inputs.result_sha || github.ref }}
  cancel-in-progress: ${{ inputs.qualification_sha == '' && inputs.result_sha == '' && inputs.candidate_head == '' }}

defaults:
  run:
    shell: bash
    working-directory: services/nebius-cxcli

jobs:
  merge-inputs:
    name: Validate CI checkout identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      qualification: ${{ steps.identity.outputs.qualification }}
      candidate: ${{ steps.identity.outputs.candidate }}
      post_merge: ${{ steps.identity.outputs.post_merge }}
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - if: (inputs.candidate_pr != '' || inputs.candidate_head != '' || inputs.candidate_base != '' || inputs.candidate_request_id != '' || inputs.candidate_source != '') || inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' || inputs.qualification_sha != '' || inputs.qualification_profile != '' || inputs.qualification_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CANDIDATE_INPUTS: ${{ (inputs.candidate_pr != '' || inputs.candidate_head != '' || inputs.candidate_base != '' || inputs.candidate_request_id != '' || inputs.candidate_source != '') }}
          QUALIFICATION_INPUTS: ${{ inputs.qualification_sha != '' || inputs.qualification_profile != '' || inputs.qualification_id != '' }}
          POST_MERGE_INPUTS: ${{ inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' }}
        run: |
          if [ "$QUALIFICATION_INPUTS" = true ]; then
            python3 skills/github-workflows/scripts/release_qualification.py inputs --workflow nebius-cxcli-nsight.yml
          elif [ "$CANDIDATE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/candidate_ci.py inputs --workflow nebius-cxcli-nsight.yml
          elif [ "$POST_MERGE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/merge_completion.py ci-inputs --workflow nebius-cxcli-nsight.yml
          else
            printf 'post_merge=false\ncheckout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze result routing identity before tests
        if: steps.identity.outputs.post_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-route --workflow nebius-cxcli-nsight.yml --output "$RUNNER_TEMP/route.json"
      - name: Preserve result routing identity
        if: steps.identity.outputs.post_merge == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/route.json
          retention-days: 30
          if-no-files-found: error

  native-packages:
    needs: [merge-inputs]
    name: Nsight Ubuntu ${{ matrix.ubuntu }} native ${{ matrix.host.arch }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
        host:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the admitted PR candidate
        if: needs.merge-inputs.outputs.candidate == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py checkout --workflow nebius-cxcli-nsight.yml
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow nebius-cxcli-nsight.yml
      - name: Check out the release qualification commit
        if: needs.merge-inputs.outputs.qualification == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/github-workflows/scripts/release_qualification.py checkout --workflow nebius-cxcli-nsight.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Verify native packages with offline execution after admission
        env:
          NSIGHT_UBUNTU: ${{ matrix.ubuntu }}
          NSIGHT_ARCH: ${{ matrix.host.arch }}
        run: |
          set -euo pipefail
          uv sync --locked
          uv run --locked --no-sync python scripts/verify_nsight_native.py \
            --ubuntu "$NSIGHT_UBUNTU" --arch "$NSIGHT_ARCH" --output nsight-native.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nsight-native-${{ matrix.ubuntu }}-${{ matrix.host.arch }}
          path: services/nebius-cxcli/nsight-native.json
          if-no-files-found: error

  official-chart:
    needs: [merge-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the admitted PR candidate
        if: needs.merge-inputs.outputs.candidate == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py checkout --workflow nebius-cxcli-nsight.yml
      - name: Check out the authoritative merged result
        if: needs.merge-inputs.outputs.post_merge == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
        run: python3 -B skills/merge-pr/scripts/merge_completion.py ci-checkout --workflow nebius-cxcli-nsight.yml
      - name: Check out the release qualification commit
        if: needs.merge-inputs.outputs.qualification == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B skills/github-workflows/scripts/release_qualification.py checkout --workflow nebius-cxcli-nsight.yml
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Verify pinned official chart and production postrenderers
        run: |
          set -euo pipefail
          command -v kubectl
          uv sync --locked
          uv run --locked --no-sync python scripts/verify_nsight_chart.py

  result-evidence:
    name: Post-merge result evidence
    needs: [merge-inputs, native-packages, official-chart]
    if: always() && needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify job settlement and record result
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["native-packages", "official-chart"]'
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-evidence --workflow nebius-cxcli-nsight.yml --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: error

  candidate-evidence:
    name: Exact candidate CI evidence
    needs: [merge-inputs, native-packages, official-chart]
    if: always() && needs.merge-inputs.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Independently collect job outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B skills/merge-pr/scripts/candidate_ci.py evidence --workflow nebius-cxcli-nsight.yml --output "$RUNNER_TEMP/candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 30

  release-qualification-nebius-cxcli:
    name: Release qualification for nebius-cxcli
    needs: [merge-inputs, native-packages, official-chart]
    if: >-
      always() && needs.merge-inputs.result == 'success' &&
      ((github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      needs.merge-inputs.outputs.post_merge == 'true' ||
      (needs.merge-inputs.outputs.qualification == 'true' && inputs.qualification_profile == 'services/nebius-cxcli'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record complete qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: >-
          python3 skills/github-workflows/scripts/release_qualification.py emit
          --workflow nebius-cxcli-nsight.yml --project services/nebius-cxcli --commit "$TESTED_SHA"
          --output "$RUNNER_TEMP/qualification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-qualification-services-nebius-cxcli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          retention-days: 14
          if-no-files-found: error
