name: nebius-cxcli-release-publish

on:
  push:
    tags:
      - "nebius-cxcli-v*"

permissions:
  contents: write

concurrency:
  group: nebius-cxcli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: services/nebius-cxcli
  TAG_PREFIX: nebius-cxcli
  PACKAGE_IMPORT_NAME: nebius_cxcli
  MAIN_BRANCH: main
  ASSET_GLOB: "dist/*.whl"
  NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: portable

jobs:
  release:
    name: nebius-cxcli-release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${REF_NAME}" =~ ^${TAG_PREFIX}-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '${REF_NAME}' must match ${TAG_PREFIX}-vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Resolve tagged commit
        id: revision
        run: |
          set -euo pipefail
          echo "commit=$(git rev-list -n 1 "${{ steps.version.outputs.tag }}")" >> "$GITHUB_OUTPUT"

      - name: Ensure tag commit belongs to main history
        run: |
          set -euo pipefail
          git fetch origin "${MAIN_BRANCH}" --depth=1
          if ! git merge-base --is-ancestor "${{ steps.revision.outputs.commit }}" "origin/${MAIN_BRANCH}"; then
            echo "::error::Tag commit ${{ steps.revision.outputs.commit }} is not in origin/${MAIN_BRANCH} history"
            exit 1
          fi

      - name: Check release existence
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned uv
        if: steps.state.outputs.release_exists == 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true
          cache-dependency-glob: services/nebius-cxcli/uv.lock

      - name: Set up Helm
        if: steps.state.outputs.release_exists == 'false'
        uses: azure/setup-helm@v5

      - name: Verify source-checkout runtime version
        if: steps.state.outputs.release_exists == 'false'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! resolved_version="$(
            PYTHONPATH=src python - "${EXPECTED_VERSION}" "${PACKAGE_IMPORT_NAME}" <<'PY'
          import importlib
          import sys

          expected = sys.argv[1]
          module_name = sys.argv[2]
          package = importlib.import_module(module_name)
          resolved = getattr(package, "__version__", "")

          if resolved != expected:
              print(resolved, end="")
              raise SystemExit(1)

          print(resolved, end="")
          PY
          )"; then
            echo "::error::Source checkout resolved runtime version '${resolved_version:-unknown}' instead of '${EXPECTED_VERSION}'"
            exit 1
          fi
          echo "Verified source-checkout runtime version ${resolved_version}."

      - name: Install service dependencies
        if: steps.state.outputs.release_exists == 'false'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make env

      - name: Prepare Terraform CLI for service tests
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          terraform_output="$(
            uv run --locked --no-sync --no-python-downloads python - <<'PY'
          from nebius_cxcli.managed_tools import resolve_terraform_binary

          print(resolve_terraform_binary())
          PY
          )"
          terraform_bin="$(printf '%s\n' "${terraform_output}" | tail -n 1)"
          if [[ ! -x "${terraform_bin}" ]]; then
            echo "::error::Resolved Terraform binary is not executable: ${terraform_bin}"
            exit 1
          fi
          dirname "${terraform_bin}" >> "${GITHUB_PATH}"
          "${terraform_bin}" version

      - name: Verify service with local make contract
        if: steps.state.outputs.release_exists == 'false'
        env:
          DIFF_BASE: ${{ steps.revision.outputs.commit }}^
          RELEASE_REF: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make ci-quality verify-wheel-cli

      - name: Validate active component sources catalog
        if: steps.state.outputs.release_exists == 'false'
        env:
          NEBIUS_CXCLI_COMPONENT_SOURCES_PROFILE: portable
        run: |
          set -euo pipefail
          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli validate-sources component_sources.yaml

      - name: Resolve and verify release assets
        if: steps.state.outputs.release_exists == 'false'
        id: asset
        env:
          RELEASE_REF: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(compgen -G "${ASSET_GLOB}" | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release asset found with glob ${ASSET_GLOB}"
            exit 1
          fi
          asset="${assets[0]}"

          wheel_version="$(python - "${asset}" <<'PY'
          import sys
          import zipfile
          from email import message_from_bytes

          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as zf:
              metadata_names = [n for n in zf.namelist() if n.endswith("METADATA")]
              if not metadata_names:
                  raise SystemExit("No METADATA found in wheel")
              metadata = message_from_bytes(zf.read(metadata_names[0]))
              print(metadata.get("Version", ""))
          PY
          )"

          if [[ "${wheel_version}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Wheel version (${wheel_version}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli.release_catalog verify-wheel \
            --wheel "${asset}" \
            --release-ref "${RELEASE_REF}"

          release_dir="release-assets"
          catalog_asset="${release_dir}/component_sources.yaml"
          rm -rf "${release_dir}"
          mkdir -p "${release_dir}"
          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli.release_catalog render \
            --input component_sources.yaml \
            --output "${catalog_asset}" \
            --release-ref "${RELEASE_REF}"

          uv run --locked --no-sync --no-python-downloads \
            python -m nebius_cxcli.release_catalog verify-catalog \
            --catalog "${catalog_asset}" \
            --release-ref "${RELEASE_REF}"

          echo "path=${asset}" >> "$GITHUB_OUTPUT"
          echo "catalog_path=${catalog_asset}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from changelog
        if: steps.state.outputs.release_exists == 'false'
        id: notes
        run: |
          set -euo pipefail
          python - "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.version }}" <<'PY'
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          version = sys.argv[2]

          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          patterns = [
              re.compile(rf"^##\s+\[?{re.escape(tag)}\]?(?:\s+-.*)?$"),
              re.compile(rf"^##\s+\[?{re.escape(version)}\]?(?:\s+-.*)?$"),
          ]
          any_heading = re.compile(r"^##\s+")

          capture = False
          notes = []
          for line in lines:
              stripped = line.strip()
              if not capture and any(p.match(stripped) for p in patterns):
                  capture = True
                  continue
              if capture and any_heading.match(stripped):
                  break
              if capture:
                  notes.append(line)

          if not capture:
              raise SystemExit(f"Missing changelog section for {tag} in CHANGELOG.md")

          notes_text = "\n".join(notes).strip()
          if not notes_text:
              raise SystemExit(f"Changelog section for {tag} is empty")

          pathlib.Path("release-notes.md").write_text(notes_text + "\n", encoding="utf-8")
          PY
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.asset.outputs.path }}" \
            "${{ steps.asset.outputs.catalog_path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.path }}"

      - name: Write release manifest
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          jq -n \
            --arg actor "${GITHUB_ACTOR}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha "${{ steps.revision.outputs.commit }}" \
            --arg asset "${{ steps.asset.outputs.path }}" \
            --arg component_sources_asset "${{ steps.asset.outputs.catalog_path }}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '{
              actor: $actor,
              repository: $repository,
              event: $event,
              ref: $ref,
              tag: $tag,
              version: $version,
              sha: $sha,
              asset: $asset,
              component_sources_asset: $component_sources_asset,
              run_id: $run_id,
              run_attempt: $run_attempt,
              timestamp_utc: now | todate
            }' > release-manifest.json

      - name: Upload release manifest artifact
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: nebius-cxcli-release-manifest-${{ github.run_id }}
          path: ${{ env.APP_DIR }}/release-manifest.json
          if-no-files-found: error

      - name: Release already exists
        if: steps.state.outputs.release_exists == 'true'
        run: |
          echo "Release ${{ steps.version.outputs.tag }} already exists. Skipping."

      - name: Publish run summary
        run: |
          {
            echo "### nebius-cxcli release publish"
            echo ""
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Commit: \`${{ steps.revision.outputs.commit }}\`"
            echo "- Release exists: \`${{ steps.state.outputs.release_exists }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
