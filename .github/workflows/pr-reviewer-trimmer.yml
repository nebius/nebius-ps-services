name: PR reviewer routing

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-reviewer-trimmer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-reviewers:
    name: Request configured reviewers
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add reviewers from trusted base policy
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number});
            if (pr.state !== 'open' || pr.draft || pr.head.repo?.full_name !== `${owner}/${repo}`) return;
            const path = '.github/REVIEWERS';
            let response;
            try {
              response = await github.rest.repos.getContent({owner, repo, path, ref: pr.base.sha});
            } catch (error) {
              if (error.status !== 404) throw error;
              core.notice('No reviewer policy on the trusted base; no requests added.');
              return;
            }
            if (Array.isArray(response.data) || response.data.type !== 'file') {
              throw new Error('Reviewer policy must be a regular file.');
            }
            const content = Buffer.from(response.data.content, response.data.encoding).toString('utf8');
            const reviewers = [...new Set(content.split(/\r?\n/)
              .map(line => line.replace(/#.*/, '').trim().replace(/^@/, '').toLowerCase()).filter(Boolean))];
            if (!reviewers.length || reviewers.some(login => !/^[a-z\d](?:[a-z\d-]{0,37}[a-z\d])?$/.test(login))) {
              throw new Error('Reviewer policy must contain GitHub usernames.');
            }
            const {data: requested} = await github.rest.pulls.listRequestedReviewers({owner, repo, pull_number});
            const existing = new Set(requested.users.map(user => user.login.toLowerCase()));
            const additions = reviewers.filter(login => login !== pr.user.login.toLowerCase() && !existing.has(login));
            if (additions.length) {
              await github.rest.pulls.requestReviewers({owner, repo, pull_number, reviewers: additions});
            }
            core.info(`Added ${additions.length} configured reviewer(s); existing requests preserved.`);
