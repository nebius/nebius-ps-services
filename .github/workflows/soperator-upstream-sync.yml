name: soperator-upstream-sync

on:
  pull_request:
    paths:
      - ".github/workflows/soperator-upstream-sync.yml"
      - "helm-charts/soperator/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/soperator-upstream-sync.yml"
      - "helm-charts/soperator/**"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soperator-upstream-sync-verify:
    name: soperator upstream sync verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pinned upstream scripts
        run: helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh

  soperator-upstream-release-check:
    name: soperator upstream release check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest upstream release
        run: helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh --check-latest
