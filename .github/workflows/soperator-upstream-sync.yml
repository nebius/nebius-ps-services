name: soperator-upstream-sync

on:
  pull_request:
    paths:
      - ".github/workflows/soperator-upstream-sync.yml"
      - "helm-charts/soperator/**"
      - "helm-charts/soperator-activechecks/**"
      - "helm-charts/soperator-backup-config/**"
      - "helm-charts/soperator-checks/**"
      - "helm-charts/soperator-dcgm-exporter/**"
      - "helm-charts/soperator-notifier/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/soperator-upstream-sync.yml"
      - "helm-charts/soperator/**"
      - "helm-charts/soperator-activechecks/**"
      - "helm-charts/soperator-backup-config/**"
      - "helm-charts/soperator-checks/**"
      - "helm-charts/soperator-dcgm-exporter/**"
      - "helm-charts/soperator-notifier/**"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soperator-upstream-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soperator-upstream-imports-verify:
    name: soperator upstream imports verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify pinned upstream imports
        run: helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh --scope all --report

  soperator-upstream-auto-sync-pr:
    name: soperator upstream auto sync PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Sync highest upstream SemVer release
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="automation/soperator-upstream-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"

          helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh --latest --sync --report

          release="$(ruby -ryaml -e 'puts YAML.safe_load(File.read("helm-charts/soperator/upstream-soperator.lock.yaml"), aliases: true).fetch("release")')"
          {
            echo "branch=${branch}"
            echo "release=${release}"
          } >> "${GITHUB_OUTPUT}"

          sync_changes="$(git status --porcelain --untracked-files=all)"
          if [[ -n "${sync_changes}" ]]; then
            chart_version="$(yq -r '.version' helm-charts/soperator/Chart.yaml)"
            python3 - "${release}" "${chart_version}" helm-charts/soperator/CHANGELOG.md <<'PY'
          import pathlib
          import re
          import sys

          release, chart_version, changelog_path = sys.argv[1], sys.argv[2], sys.argv[3]
          path = pathlib.Path(changelog_path)
          text = path.read_text(encoding="utf-8")

          header_re = re.compile(r"^## \[.+?\].*$", re.MULTILINE)
          headers = list(header_re.finditer(text))
          if not headers:
              print("No CHANGELOG headers found", file=sys.stderr)
              sys.exit(1)

          unreleased_idx = None
          for idx, header in enumerate(headers):
              if header.group(0).strip() == "## [Unreleased]":
                  unreleased_idx = idx
                  break

          if unreleased_idx is None:
              print("Unable to locate Unreleased heading", file=sys.stderr)
              sys.exit(1)

          unreleased_header = headers[unreleased_idx]
          section_end = headers[unreleased_idx + 1].start() if unreleased_idx + 1 < len(headers) else len(text)
          unreleased_content = text[unreleased_header.end() : section_end]
          if unreleased_content.strip():
              sys.exit(0)

          note = (
              "\n\n"
              f"- Bumped Soperator upstream release to {release} and Helm chart package to {chart_version}.\n"
              "\n"
          )
          path.write_text(text[: unreleased_header.end()] + note + text[section_end:], encoding="utf-8")
          PY
          fi

          changed_files="$(git status --porcelain --untracked-files=all)"
          if [[ -z "${changed_files}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update sync PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          RELEASE: ${{ steps.sync.outputs.release }}
        run: |
          set -euo pipefail

          git add \
            helm-charts/soperator \
            helm-charts/soperator-activechecks \
            helm-charts/soperator-backup-config \
            helm-charts/soperator-checks \
            helm-charts/soperator-dcgm-exporter \
            helm-charts/soperator-notifier

          status_output="$(git status --short --untracked-files=all)"
          unstaged_status="$(printf '%s\n' "${status_output}" | awk 'substr($0, 1, 2) == "??" || substr($0, 2, 1) != " " { print }')"
          if [[ -n "${unstaged_status}" ]]; then
            echo "Sync produced changes outside the expected staged chart paths." >&2
            printf '%s\n' "${status_output}" >&2
            exit 1
          fi

          git diff --cached --check
          git commit -m "Sync Soperator upstream ${RELEASE}"

          remote_sha="$(git ls-remote --heads origin "${BRANCH}" | awk '{print $1}')"
          if [[ -n "${remote_sha}" ]]; then
            git push --force-with-lease="refs/heads/${BRANCH}:${remote_sha}" origin "HEAD:${BRANCH}"
          else
            git push origin "HEAD:${BRANCH}"
          fi

          body_file="$(mktemp)"
          cat > "${body_file}" <<BODY
          Syncs the Nebius Soperator Helm chart tracking files to upstream Soperator ${RELEASE}.

          This PR was created by the scheduled upstream sync workflow. The sync script updated the lock pin, script imports, CRD imports, tracked image values, chart package versions, chart appVersions, local child-chart dependency versions, and review-only upstream hashes without copying review-only templates.

          Validation run by the workflow:
          - helm dependency build
          - helm lint --strict --with-subcharts
          - helm template default and example values
          BODY

          pr_number="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" \
              --title "Sync Soperator upstream ${RELEASE}" \
              --body-file "${body_file}"
          else
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "Sync Soperator upstream ${RELEASE}" \
              --body-file "${body_file}"
          fi
