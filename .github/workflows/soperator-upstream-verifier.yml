name: soperator-upstream-verifier

on:
  pull_request:
    paths:
      - ".github/workflows/soperator-upstream-verifier.yml"
      - "helm-charts/soperator/**"
      - "helm-charts/soperator-activechecks/**"
      - "helm-charts/soperator-backup-config/**"
      - "helm-charts/soperator-checks/**"
      - "helm-charts/soperator-dcgm-exporter/**"
      - "helm-charts/soperator-notifier/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/soperator-upstream-verifier.yml"
      - "helm-charts/soperator/**"
      - "helm-charts/soperator-activechecks/**"
      - "helm-charts/soperator-backup-config/**"
      - "helm-charts/soperator-checks/**"
      - "helm-charts/soperator-dcgm-exporter/**"
      - "helm-charts/soperator-notifier/**"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      accept_review_baseline:
        description: >-
          After reviewing the upstream logic diff, allow this disposable preview
          to update review-only hashes. This never writes back to the repository.
        required: false
        default: false
        type: boolean
      accept_image_baseline:
        description: >-
          After reviewing every runtime-image reference, image-index digest, and
          required-platform digest, allow this disposable preview to update the
          image baseline. This never writes back to the repository.
        required: false
        default: false
        type: boolean
      live_upgrade_evidence_run_id:
        description: >-
          Successful workflow run ID that produced the target-bound disposable
          Soperator upgrade-campaign evidence artifact. Required when either
          baseline acceptance input is true.
        required: false
        default: ""
        type: string
      live_upgrade_evidence_artifact:
        description: >-
          Artifact name from the evidence-producing workflow run. The artifact
          must contain soperator-disposable-upgrade-evidence.json.
        required: false
        default: soperator-disposable-upgrade-evidence
        type: string

permissions:
  contents: read

concurrency:
  group: soperator-upstream-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soperator-upstream-imports-verify:
    name: soperator upstream imports verify
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Install pinned Helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.1

      - name: Verify pinned upstream imports
        run: helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh --scope all --report

  soperator-upstream-release-check:
    name: soperator upstream release check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      attestations: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check latest upstream release
        id: latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          set +e
          output="$(helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh --check-latest 2>&1)"
          status=$?
          set -e

          printf '%s\n' "${output}"
          {
            printf '## Soperator upstream release check\n\n'
            printf '%s\n%s\n%s\n' '```text' "${output}" '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${status}" -eq 0 ]]; then
            echo "new_release=false" >> "${GITHUB_OUTPUT}"
            echo "Pinned Soperator release is current." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          release_message_re="Highest Soperator release is '([^']*)', but lock is pinned to '([^']*)'\\."
          if [[ "${output}" =~ ${release_message_re} ]]; then
            highest="${BASH_REMATCH[1]}"
            locked="${BASH_REMATCH[2]}"
            {
              echo "new_release=true"
              echo "highest=${highest}"
              echo "locked=${locked}"
            } >> "${GITHUB_OUTPUT}"
            printf '::warning title=New upstream Soperator release::Highest release is %s; chart lock is pinned to %s. Create an operator-owned feature branch and run the sync manually after reviewing this workflow summary.\n' "${highest}" "${locked}"
            exit 0
          fi

          printf '::error title=Soperator upstream release check failed::The read-only latest-release check failed. See logs and step summary.\n'
          exit "${status}"

      - name: Setup Helm
        if: steps.latest.outputs.new_release == 'true'
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Install pinned Helm unittest plugin
        if: steps.latest.outputs.new_release == 'true'
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.1

      - name: Install yq
        if: steps.latest.outputs.new_release == 'true'
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate disposable evidence request
        if: steps.latest.outputs.new_release == 'true'
        id: evidence-request
        env:
          ACCEPT_IMAGE_BASELINE: ${{ inputs.accept_image_baseline }}
          ACCEPT_REVIEW_BASELINE: ${{ inputs.accept_review_baseline }}
          EVIDENCE_ARTIFACT: ${{ inputs.live_upgrade_evidence_artifact }}
          EVIDENCE_RUN_ID: ${{ inputs.live_upgrade_evidence_run_id }}
        run: |
          set -euo pipefail

          required=false
          if [[ "${ACCEPT_REVIEW_BASELINE:-false}" == "true" || "${ACCEPT_IMAGE_BASELINE:-false}" == "true" ]]; then
            required=true
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          if [[ "${required}" != "true" ]]; then
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            printf '::error title=Invalid evidence request::Baseline acceptance is available only through manual dispatch.\n'
            exit 1
          fi
          producer_repository="$(ruby -ryaml -e 'document = YAML.safe_load(File.read(ARGV[0]), aliases: true); puts document.dig("conformance", "live_upgrade_evidence", "producer_repository").to_s' helm-charts/soperator/upstream-soperator.lock.yaml)"
          producer_workflow="$(ruby -ryaml -e 'document = YAML.safe_load(File.read(ARGV[0]), aliases: true); puts document.dig("conformance", "live_upgrade_evidence", "producer_workflow").to_s' helm-charts/soperator/upstream-soperator.lock.yaml)"
          trusted_ref="$(ruby -ryaml -e 'document = YAML.safe_load(File.read(ARGV[0]), aliases: true); puts document.dig("conformance", "live_upgrade_evidence", "trusted_ref").to_s' helm-charts/soperator/upstream-soperator.lock.yaml)"
          trusted_event="$(ruby -ryaml -e 'document = YAML.safe_load(File.read(ARGV[0]), aliases: true); puts document.dig("conformance", "live_upgrade_evidence", "trusted_event").to_s' helm-charts/soperator/upstream-soperator.lock.yaml)"
          configured_artifact="$(ruby -ryaml -e 'document = YAML.safe_load(File.read(ARGV[0]), aliases: true); puts document.dig("conformance", "live_upgrade_evidence", "artifact_name").to_s' helm-charts/soperator/upstream-soperator.lock.yaml)"
          if [[ -z "${producer_repository}" || -z "${producer_workflow}" ]]; then
            printf '::error title=No trusted evidence producer::Pin promotion and baseline acceptance remain unavailable until the lock names a dedicated, attested disposable-campaign workflow.\n'
            exit 1
          fi
          if [[ "${producer_repository}" != "${GITHUB_REPOSITORY}" ]]; then
            printf '::error title=Untrusted evidence repository::The configured evidence producer repository must equal this repository.\n'
            exit 1
          fi
          if [[ ! "${EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            printf '::error title=Missing live-upgrade evidence::Provide a positive live_upgrade_evidence_run_id when accepting either baseline.\n'
            exit 1
          fi
          if [[ "${EVIDENCE_ARTIFACT}" != "${configured_artifact}" ]]; then
            printf '::error title=Invalid evidence artifact::The requested artifact name does not match the locked evidence contract.\n'
            exit 1
          fi
          {
            echo "producer_repository=${producer_repository}"
            echo "producer_workflow=${producer_workflow}"
            echo "trusted_ref=${trusted_ref}"
            echo "trusted_event=${trusted_event}"
          } >> "${GITHUB_OUTPUT}"
          if [[ ! "${EVIDENCE_ARTIFACT}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            printf '::error title=Invalid evidence artifact::live_upgrade_evidence_artifact must use only letters, digits, dot, underscore, and dash.\n'
            exit 1
          fi

      - name: Download disposable live-upgrade evidence
        if: steps.latest.outputs.new_release == 'true' && steps.evidence-request.outputs.required == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.live_upgrade_evidence_artifact }}
          path: ${{ runner.temp }}/soperator-live-upgrade-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.live_upgrade_evidence_run_id }}

      - name: Verify disposable live-upgrade evidence provenance
        if: steps.latest.outputs.new_release == 'true' && steps.evidence-request.outputs.required == 'true'
        id: live-evidence
        env:
          EVIDENCE_RUN_ID: ${{ inputs.live_upgrade_evidence_run_id }}
          EVIDENCE_REPOSITORY: ${{ steps.evidence-request.outputs.producer_repository }}
          EVIDENCE_WORKFLOW: ${{ steps.evidence-request.outputs.producer_workflow }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_EVENT: ${{ steps.evidence-request.outputs.trusted_event }}
          TRUSTED_REF: ${{ steps.evidence-request.outputs.trusted_ref }}
        run: |
          set -euo pipefail

          evidence_file="${RUNNER_TEMP}/soperator-live-upgrade-evidence/soperator-disposable-upgrade-evidence.json"
          if [[ ! -f "${evidence_file}" || -L "${evidence_file}" ]]; then
            printf '::error title=Invalid evidence artifact::Artifact must contain one regular, non-symlink soperator-disposable-upgrade-evidence.json file.\n'
            exit 1
          fi

          run_metadata="${RUNNER_TEMP}/soperator-live-upgrade-evidence-run.json"
          evidence_head_sha="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0])).fetch("producer").fetch("head_sha")' "${evidence_file}")"
          gh attestation verify "${evidence_file}" \
            --repo "${EVIDENCE_REPOSITORY}" \
            --signer-workflow "${EVIDENCE_REPOSITORY}/${EVIDENCE_WORKFLOW}" \
            --source-ref "${TRUSTED_REF}" \
            --source-digest "${evidence_head_sha}" \
            --deny-self-hosted-runners >/dev/null
          gh api "repos/${EVIDENCE_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" > "${run_metadata}"
          ruby -rjson - "${run_metadata}" "${evidence_file}" "${EVIDENCE_REPOSITORY}" "${EVIDENCE_WORKFLOW}" "${EVIDENCE_RUN_ID}" "${TRUSTED_REF}" "${TRUSTED_EVENT}" <<'RUBY'
          run_file, evidence_file, repository, expected_workflow, run_id, trusted_ref, trusted_event = ARGV
          raise "evidence file exceeds 1 MiB" if File.size(evidence_file) > 1_048_576
          run = JSON.parse(File.read(run_file))
          evidence = JSON.parse(File.read(evidence_file))
          producer = evidence.fetch("producer")
          raise "evidence source run did not succeed" unless run["conclusion"] == "success"
          raise "evidence source repository differs from this repository" unless run.dig("head_repository", "full_name") == repository
          raise "evidence source workflow differs from the locked producer" unless run["path"] == expected_workflow
          raise "evidence source event differs from the locked producer event" unless run["event"] == trusted_event
          raise "evidence source ref differs from the locked producer ref" unless run["head_branch"] == trusted_ref.delete_prefix("refs/heads/")
          raise "evidence producer repository differs from this repository" unless producer["repository"] == repository
          raise "evidence producer run_id differs from the requested run" unless producer["run_id"] == Integer(run_id, 10)
          raise "evidence producer run_attempt differs from the source run" unless producer["run_attempt"] == run["run_attempt"]
          raise "evidence producer head_sha differs from the source run" unless producer["head_sha"] == run["head_sha"]
          raise "evidence producer workflow differs from the source run" unless producer["workflow"] == expected_workflow
          unless producer["workflow"].to_s.match?(%r{\A\.github/workflows/[A-Za-z0-9_.-]+\.ya?ml\z})
            raise "evidence producer must name one repository workflow file"
          end
          if producer["workflow"] == ".github/workflows/soperator-upstream-verifier.yml"
            raise "the upstream verifier workflow cannot produce its own upgrade evidence"
          end
          raise "evidence producer workflow is absent from this checkout" unless File.file?(producer["workflow"])
          RUBY
          echo "path=${evidence_file}" >> "${GITHUB_OUTPUT}"

      - name: Generate ephemeral sync preview
        if: steps.latest.outputs.new_release == 'true'
        env:
          ACCEPT_IMAGE_BASELINE: ${{ inputs.accept_image_baseline }}
          ACCEPT_REVIEW_BASELINE: ${{ inputs.accept_review_baseline }}
          GITHUB_TOKEN: ${{ github.token }}
          HIGHEST_RELEASE: ${{ steps.latest.outputs.highest }}
          LIVE_UPGRADE_EVIDENCE: ${{ steps.live-evidence.outputs.path }}
          LOCKED_RELEASE: ${{ steps.latest.outputs.locked }}
        run: |
          # Literal Markdown fences are intentional.
          # shellcheck disable=SC2016
          set -euo pipefail

          preview_args=(
            helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh
            --latest
            --sync
            --report
            --ci-preview-no-branch
          )
          if [[ "${ACCEPT_REVIEW_BASELINE:-false}" == "true" ]]; then
            preview_args+=(--accept-review-baseline)
          fi
          if [[ "${ACCEPT_IMAGE_BASELINE:-false}" == "true" ]]; then
            preview_args+=(--accept-image-baseline)
          fi
          if [[ -n "${LIVE_UPGRADE_EVIDENCE:-}" ]]; then
            preview_args+=(--live-upgrade-evidence "${LIVE_UPGRADE_EVIDENCE}")
          fi

          set +e
          preview_output="$("${preview_args[@]}" 2>&1)"
          preview_status=$?
          set -e

          printf '%s\n' "${preview_output}"
          {
            printf '\n## Ephemeral sync preview\n\n'
            printf 'Upstream Soperator %s is available; this chart is pinned to %s.\n\n' "${HIGHEST_RELEASE}" "${LOCKED_RELEASE}"
            printf 'This preview was generated only in the disposable GitHub Actions runner checkout. It did not create a branch, stage, commit, push, open a PR, configure email, or post to Slack.\n\n'
            if [[ "${ACCEPT_REVIEW_BASELINE:-false}" == "true" ]]; then
              printf 'This manual dispatch explicitly authorized review-only hash updates for the disposable preview.\n\n'
            else
              printf 'Review-only hashes were not accepted. If upstream logic changed, this report stops before promotion and lists every changed baseline.\n\n'
            fi
            if [[ "${ACCEPT_IMAGE_BASELINE:-false}" == "true" ]]; then
              printf 'This manual dispatch explicitly authorized runtime-image reference, image-index, and required-platform digest updates for the disposable preview.\n\n'
            else
              printf 'Runtime-image baselines were not accepted. If a reference, image-index digest, or required-platform digest changed, this report stops before promotion and lists every changed baseline.\n\n'
            fi
            printf 'After reviewing the upstream logic and runtime-image changes, apply them from an operator-owned feature branch with:\n\n'
            printf '%s\n%s\n%s\n\n' '```bash' 'helm-charts/soperator/scripts/verify-upstream-soperator-sync.sh --latest --sync --accept-review-baseline --accept-image-baseline --live-upgrade-evidence /path/to/soperator-disposable-upgrade-evidence.json --report' '```'
            printf 'Then review, test, commit, and open the PR manually.\n\n'
            printf '### Sync report\n\n'
            printf '%s\n%s\n%s\n' '```text' "${preview_output}" '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${preview_status}" -ne 0 ]]; then
            missing_review_baseline=false
            missing_image_baseline=false
            if [[ "${ACCEPT_REVIEW_BASELINE:-false}" != "true" && "${preview_output}" == *"--accept-review-baseline"* ]]; then
              missing_review_baseline=true
            fi
            if [[ "${ACCEPT_IMAGE_BASELINE:-false}" != "true" && "${preview_output}" == *"--accept-image-baseline"* ]]; then
              missing_image_baseline=true
            fi
            if [[ "${missing_review_baseline}" == "true" || "${missing_image_baseline}" == "true" ]]; then
              {
                printf '\n### Manual review required\n\n'
                if [[ "${missing_review_baseline}" == "true" ]]; then
                  printf 'Upstream review-only logic changed. Scheduled runs never accept that change automatically.\n\n'
                fi
                if [[ "${missing_image_baseline}" == "true" ]]; then
                  printf 'One or more runtime-image references, image-index digests, or required-platform digests changed. Scheduled runs never accept those changes automatically.\n\n'
                fi
                printf 'Review every reported change, then either use the local command above or manually dispatch this workflow with each reported baseline input set to true for a full disposable preview.\n'
              } >> "${GITHUB_STEP_SUMMARY}"
              printf '::warning title=Soperator baseline approval required::Review every reported upstream logic and runtime-image change, then authorize only the corresponding baseline flags.\n'
              if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
                exit 1
              fi
              exit 0
            fi
            printf '::error title=Soperator sync preview failed::The disposable sync preview failed. See logs and step summary.\n'
            exit "${preview_status}"
          fi

          {
            printf '\n### Changed files\n\n'
            if git status --short --untracked-files=all | grep -q .; then
              printf '%s\n' '```text'
              git status --short --untracked-files=all
              printf '%s\n\n' '```'
              printf '### Diff stat\n\n'
              printf '%s\n' '```text'
              git diff --stat
              printf '%s\n' '```'
            else
              printf 'The validated candidate remained in the isolated staging checkout by design; see the sync report above for its changed-file summary.\n'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          printf '::warning title=Manual Soperator sync needed::Upstream %s is available. Complete the disposable upgrade campaign, review upstream logic and runtime images, then run the evidence-gated local sync from a feature branch.\n' "${HIGHEST_RELEASE}"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            exit 1
          fi

          echo "Manual dispatch preview completed without failing the run; scheduled runs fail here as the notification marker." >> "${GITHUB_STEP_SUMMARY}"
