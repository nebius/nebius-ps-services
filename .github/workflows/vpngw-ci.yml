name: vpngw-ci

permissions:
  contents: read

run-name: ${{ inputs.correlation_id != '' && format('post-merge-{0}', inputs.correlation_id) || format('{0} {1}', github.workflow, github.event_name) }}

on:
  pull_request:
    paths:
      - "services/vpngw/**"
      - ".github/workflows/vpngw-ci.yml"
      - ".github/workflows/vpngw-release.yml"
  push:
    branches: ["main"]
    paths:
      - "services/vpngw/**"
      - ".github/workflows/vpngw-ci.yml"
      - ".github/workflows/vpngw-release.yml"
  workflow_dispatch:
    inputs:
      result_sha:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      merge_pr:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      broker_run_attempt:
        description: Post-merge identity (all fields required together)
        required: false
        type: string
      correlation_id:
        description: Post-merge identity (all fields required together)
        required: false
        type: string

defaults:
  run:
    shell: bash
    working-directory: services/vpngw

concurrency:
  group: vpngw-${{ github.workflow }}-${{ inputs.result_sha || github.ref }}
  cancel-in-progress: ${{ inputs.result_sha == '' }}

jobs:
  merge-inputs:
    name: Validate CI checkout identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    outputs:
      post_merge: ${{ steps.identity.outputs.post_merge }}
      checkout_sha: ${{ steps.identity.outputs.checkout_sha }}
    steps:
      - if: inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          POST_MERGE_INPUTS: ${{ inputs.result_sha != '' || inputs.merge_pr != '' || inputs.broker_run_id != '' || inputs.broker_run_attempt != '' || inputs.correlation_id != '' }}
        run: |
          if [ "$POST_MERGE_INPUTS" = true ]; then
            python3 skills/merge-pr/scripts/merge_completion.py ci-inputs --workflow vpngw-ci.yml
          else
            printf 'post_merge=false\ncheckout_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  ordinary-job-settlement:
    needs: [merge-inputs]
    name: Ordinary systemd and networkd settlement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify delegated work in isolated systemd
        working-directory: services/vpngw
        run: python3 tests/systemd/run.py

  lint:
    needs: [merge-inputs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          repo_root = Path.cwd().resolve().parents[1]
          workflow_dir = repo_root / ".github" / "workflows"
          for name in ("vpngw-ci.yml", "vpngw-release.yml"):
              workflow_path = workflow_dir / name
              loaded = yaml.load(workflow_path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(loaded, dict):
                  raise SystemExit(f"{workflow_path} did not parse as a mapping")
              print(f"Validated {workflow_path}")
          PY
      - name: Helper shell checks
        run: |
          set -euo pipefail
          bash -n misc/gcp-vpngw.sh
          bash -n misc/gcp-vpngw-vm-ha.sh
          bash -n misc/gcp-vpngw-classic-vm-ha.sh
          bash -n misc/fix-vpngw-esp4.sh
          ./misc/gcp-vpngw.sh --help >/dev/null
          ./misc/gcp-vpngw.sh --vm-ha-peer --help >/dev/null
          ./misc/gcp-vpngw.sh --classic-vm-ha-peer --help >/dev/null
          ./misc/fix-vpngw-esp4.sh --help >/dev/null
      - name: Ruff
        run: python -m ruff check src tests misc
      - name: Mypy
        run: python -m mypy

  unit-tests:
    needs: [merge-inputs, lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: |
          python -m pytest -n auto tests/unit \
            --deselect=tests/unit/test_cli_helpers.py::test_vm_ha_apply_prepares_default_directory_but_not_a_retained_member_key \
            --deselect=tests/unit/test_cli_helpers.py::test_vm_ha_apply_ssh_recovery_is_shared_across_routing_modes \
            --deselect=tests/unit/test_cli_helpers.py::test_vm_ha_apply_treats_lifecycle_bound_missing_compute_as_retained \
            --deselect=tests/unit/test_vm_manager_allocations.py::test_vm_ha_ssh_compute_reread_uses_bounded_request_policy \
            --deselect=tests/unit/test_ssh_policy.py::test_required_vm_ha_trust_rejects_missing_enrollment \
            --deselect=tests/unit/test_ssh_policy.py::test_vm_ha_policy_rejects_public_only_host_key \
            --deselect=tests/unit/test_ssh_policy.py::test_apply_imports_exact_retained_ed25519_pin_from_default_known_hosts \
            --deselect=tests/unit/test_ssh_policy.py::test_apply_recovers_retained_product_host_key_only_at_publication \
            --deselect=tests/unit/test_ssh_push.py::test_vm_ha_stage_classifies_missing_pinned_host_identity \
            --deselect=tests/unit/test_ssh_push.py::test_vm_ha_activation_classifies_host_identity_rejection
      - name: VM-HA safety regressions
        run: |
          python -m pytest -n auto \
            tests/integration/test_vm_ha_runtime_composed.py \
            tests/integration/test_vm_ha_migration_package.py \
            tests/integration/test_vm_ha_failover.py \
            tests/unit/test_cli_helpers.py::test_vm_ha_apply_prepares_default_directory_but_not_a_retained_member_key \
            tests/unit/test_cli_helpers.py::test_vm_ha_apply_ssh_recovery_is_shared_across_routing_modes \
            tests/unit/test_cli_helpers.py::test_vm_ha_apply_treats_lifecycle_bound_missing_compute_as_retained \
            tests/unit/test_vm_manager_allocations.py::test_vm_ha_ssh_compute_reread_uses_bounded_request_policy \
            tests/unit/test_ssh_policy.py::test_required_vm_ha_trust_rejects_missing_enrollment \
            tests/unit/test_ssh_policy.py::test_vm_ha_policy_rejects_public_only_host_key \
            tests/unit/test_ssh_policy.py::test_apply_imports_exact_retained_ed25519_pin_from_default_known_hosts \
            tests/unit/test_ssh_policy.py::test_apply_recovers_retained_product_host_key_only_at_publication \
            tests/unit/test_ssh_push.py::test_vm_ha_stage_classifies_missing_pinned_host_identity \
            tests/unit/test_ssh_push.py::test_vm_ha_activation_classifies_host_identity_rejection
      - name: CLI integration smoke tests
        run: python -m pytest -n auto tests/integration/test_cli_commands.py
      - name: Release helper regressions
        run: python -m pytest tests/integration/test_publish_release.py

  build:
    needs: [merge-inputs, unit-tests]
    if: (github.event_name != 'workflow_dispatch') || needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Release build regressions
        run: python -m pytest tests/integration/test_release_build.py
      - name: Build wheel
        run: |
          set -euo pipefail
          rm -rf build dist
          PYTHONWARNINGS="ignore:No GlobalOverrides context is active:UserWarning" \
            python -m build --wheel --no-isolation

  integration-tests:
    needs: [merge-inputs, unit-tests]
    if: github.event_name == 'workflow_dispatch' && needs.merge-inputs.outputs.post_merge != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: python -m pytest -n auto tests/integration

  coverage:
    needs: [merge-inputs, unit-tests]
    if: github.event_name == 'workflow_dispatch' && needs.merge-inputs.outputs.post_merge != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --cov=nebius_vpngw --cov-report=term-missing --cov-report=xml tests/unit
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: vpngw-coverage
          path: services/vpngw/coverage.xml

  packaging:
    needs: [merge-inputs, ordinary-job-settlement, integration-tests, coverage]
    if: github.event_name == 'workflow_dispatch' && needs.merge-inputs.outputs.post_merge != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.merge-inputs.outputs.checkout_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact checkout identity
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ needs.merge-inputs.outputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build wheel
        run: |
          set -euo pipefail
          rm -rf build dist
          PYTHONWARNINGS="ignore:No GlobalOverrides context is active:UserWarning" \
            python -m build --wheel --no-isolation
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: nebius-vpngw-wheel
          path: services/vpngw/dist/*.whl

  result-evidence:
    name: Post-merge result evidence
    needs: [merge-inputs, ordinary-job-settlement, lint, unit-tests, build, integration-tests, coverage, packaging]
    if: always() && needs.merge-inputs.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify job settlement and record result
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_OPERATOR_IDS: ${{ vars.MERGE_OPERATOR_IDS }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EXPECTED_JOBS: '["ordinary-job-settlement", "lint", "unit-tests", "build"]'
        run: python3 skills/merge-pr/scripts/merge_completion.py ci-evidence --workflow vpngw-ci.yml --output "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/result.json
          retention-days: 30
          if-no-files-found: error
