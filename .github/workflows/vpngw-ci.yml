name: vpngw-ci

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "services/vpngw/**"
      - ".github/workflows/vpngw-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: services/vpngw

concurrency:
  group: vpngw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fast unit tests
        run: python -m pytest -n auto -m "not integration" tests/unit

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build wheel
        run: python -m build --wheel

  integration-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: python -m pytest -n auto -m integration tests/integration

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --cov=nebius_vpngw --cov-report=term-missing --cov-report=xml tests/unit
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: vpngw-coverage
          path: services/vpngw/coverage.xml

  packaging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: nebius-vpngw-wheel
          path: services/vpngw/dist/*.whl
