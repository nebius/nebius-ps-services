name: vpngw-ci

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "services/vpngw/**"
      - ".github/workflows/vpngw-ci.yml"
      - ".github/workflows/vpngw-release.yml"
  push:
    branches: ["main"]
    paths:
      - "services/vpngw/**"
      - ".github/workflows/vpngw-ci.yml"
      - ".github/workflows/vpngw-release.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: services/vpngw

concurrency:
  group: vpngw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          repo_root = Path.cwd().resolve().parents[1]
          workflow_dir = repo_root / ".github" / "workflows"
          for name in ("vpngw-ci.yml", "vpngw-release.yml"):
              workflow_path = workflow_dir / name
              loaded = yaml.load(workflow_path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              if not isinstance(loaded, dict):
                  raise SystemExit(f"{workflow_path} did not parse as a mapping")
              print(f"Validated {workflow_path}")
          PY
      - name: Helper shell checks
        run: |
          set -euo pipefail
          bash -n misc/gcp-vpngw.sh
          bash -n misc/gcp-vpngw-vm-ha.sh
          bash -n misc/gcp-vpngw-classic-vm-ha.sh
          bash -n misc/fix-vpngw-esp4.sh
          ./misc/gcp-vpngw.sh --help >/dev/null
          ./misc/gcp-vpngw.sh --vm-ha-peer --help >/dev/null
          ./misc/gcp-vpngw.sh --classic-vm-ha-peer --help >/dev/null
          ./misc/fix-vpngw-esp4.sh --help >/dev/null
      - name: Ruff
        run: python -m ruff check src tests misc
      - name: Mypy
        run: python -m mypy

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: |
          python -m pytest -n auto tests/unit \
            --deselect=tests/unit/test_cli_helpers.py::test_vm_ha_apply_prepares_default_directory_but_not_a_retained_member_key \
            --deselect=tests/unit/test_cli_helpers.py::test_vm_ha_apply_ssh_recovery_is_shared_across_routing_modes \
            --deselect=tests/unit/test_cli_helpers.py::test_vm_ha_apply_treats_lifecycle_bound_missing_compute_as_retained \
            --deselect=tests/unit/test_vm_manager_allocations.py::test_vm_ha_ssh_compute_reread_uses_bounded_request_policy \
            --deselect=tests/unit/test_ssh_policy.py::test_required_vm_ha_trust_rejects_missing_enrollment \
            --deselect=tests/unit/test_ssh_policy.py::test_vm_ha_policy_rejects_public_only_host_key \
            --deselect=tests/unit/test_ssh_policy.py::test_apply_imports_exact_retained_ed25519_pin_from_default_known_hosts \
            --deselect=tests/unit/test_ssh_policy.py::test_apply_recovers_retained_product_host_key_only_at_publication \
            --deselect=tests/unit/test_ssh_push.py::test_vm_ha_stage_classifies_missing_pinned_host_identity \
            --deselect=tests/unit/test_ssh_push.py::test_vm_ha_activation_classifies_host_identity_rejection
      - name: VM-HA safety regressions
        run: |
          python -m pytest -n auto \
            tests/integration/test_vm_ha_runtime_composed.py \
            tests/integration/test_vm_ha_failover.py \
            tests/unit/test_cli_helpers.py::test_vm_ha_apply_prepares_default_directory_but_not_a_retained_member_key \
            tests/unit/test_cli_helpers.py::test_vm_ha_apply_ssh_recovery_is_shared_across_routing_modes \
            tests/unit/test_cli_helpers.py::test_vm_ha_apply_treats_lifecycle_bound_missing_compute_as_retained \
            tests/unit/test_vm_manager_allocations.py::test_vm_ha_ssh_compute_reread_uses_bounded_request_policy \
            tests/unit/test_ssh_policy.py::test_required_vm_ha_trust_rejects_missing_enrollment \
            tests/unit/test_ssh_policy.py::test_vm_ha_policy_rejects_public_only_host_key \
            tests/unit/test_ssh_policy.py::test_apply_imports_exact_retained_ed25519_pin_from_default_known_hosts \
            tests/unit/test_ssh_policy.py::test_apply_recovers_retained_product_host_key_only_at_publication \
            tests/unit/test_ssh_push.py::test_vm_ha_stage_classifies_missing_pinned_host_identity \
            tests/unit/test_ssh_push.py::test_vm_ha_activation_classifies_host_identity_rejection
      - name: CLI integration smoke tests
        run: python -m pytest -n auto tests/integration/test_cli_commands.py
      - name: Release helper regressions
        run: python -m pytest tests/integration/test_publish_release.py

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Release build regressions
        run: python -m pytest tests/integration/test_release_build.py
      - name: Build wheel
        run: |
          set -euo pipefail
          rm -rf build dist
          PYTHONWARNINGS="ignore:No GlobalOverrides context is active:UserWarning" \
            python -m build --wheel --no-isolation

  integration-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Integration tests
        run: python -m pytest -n auto tests/integration

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: python -m pytest --cov=nebius_vpngw --cov-report=term-missing --cov-report=xml tests/unit
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: vpngw-coverage
          path: services/vpngw/coverage.xml

  packaging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - coverage
    defaults:
      run:
        shell: bash
        working-directory: services/vpngw
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build wheel
        run: |
          set -euo pipefail
          rm -rf build dist
          PYTHONWARNINGS="ignore:No GlobalOverrides context is active:UserWarning" \
            python -m build --wheel --no-isolation
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: nebius-vpngw-wheel
          path: services/vpngw/dist/*.whl
