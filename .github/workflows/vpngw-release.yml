name: nebius-vpngw-release-publish

on:
  push:
    tags:
      - "nebius-vpngw-v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: nebius-vpngw-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  APP_DIR: services/vpngw
  TAG_PREFIX: nebius-vpngw
  PACKAGE_IMPORT_NAME: nebius_vpngw
  MAIN_BRANCH: main
  ASSET_GLOB: "dist/*.whl"

jobs:
  ordinary-job-settlement:
    name: Ordinary systemd and networkd settlement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify delegated work in isolated systemd
        working-directory: services/vpngw
        run: python3 tests/systemd/run.py

  release:
    needs: ordinary-job-settlement
    name: nebius-vpngw-release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" version --tag "$REF_NAME" --prefix "$TAG_PREFIX"

      - name: Resolve tagged commit
        id: revision
        run: |
          set -euo pipefail
          echo "commit=$(git rev-list -n 1 "${{ steps.version.outputs.tag }}")" >> "$GITHUB_OUTPUT"

      - name: Ensure tag commit belongs to main history
        env:
          RELEASE_COMMIT: ${{ steps.revision.outputs.commit }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" ancestry --commit "$RELEASE_COMMIT" --branch "$MAIN_BRANCH"

      - name: Verify existing release or establish absence
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" release-state --workflow vpngw-release.yml --tag "$RELEASE_TAG"

      - name: Set up Python
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify source-checkout runtime version
        if: steps.state.outputs.release_exists == 'false'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! resolved_version="$(
            PYTHONPATH=src python - "${EXPECTED_VERSION}" "${PACKAGE_IMPORT_NAME}" <<'PY'
          import importlib
          import sys

          expected = sys.argv[1]
          module_name = sys.argv[2]
          package = importlib.import_module(module_name)
          resolved = getattr(package, "__version__", "")

          if resolved != expected:
              print(resolved, end="")
              raise SystemExit(1)

          print(resolved, end="")
          PY
          )"; then
            echo "::error::Source checkout resolved runtime version '${resolved_version:-unknown}' instead of '${EXPECTED_VERSION}'"
            exit 1
          fi
          echo "Verified source-checkout runtime version ${resolved_version}."

      - name: Install dependencies
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Helper shell checks
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          bash -n misc/gcp-vpngw.sh
          bash -n misc/gcp-vpngw-vm-ha.sh
          bash -n misc/gcp-vpngw-classic-vm-ha.sh
          bash -n misc/fix-vpngw-esp4.sh
          ./misc/gcp-vpngw.sh --help >/dev/null
          ./misc/gcp-vpngw.sh --vm-ha-peer --help >/dev/null
          ./misc/gcp-vpngw.sh --classic-vm-ha-peer --help >/dev/null
          ./misc/fix-vpngw-esp4.sh --help >/dev/null

      - name: Lint
        if: steps.state.outputs.release_exists == 'false'
        run: python -m ruff check src tests misc

      - name: Test
        if: steps.state.outputs.release_exists == 'false'
        run: python -m pytest -q

      - name: Build artifact
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          rm -rf build dist
          PYTHONWARNINGS="ignore:No GlobalOverrides context is active:UserWarning" \
            python -m build --wheel --no-isolation

      - name: Resolve and verify artifact
        if: steps.state.outputs.release_exists == 'false'
        id: asset
        run: |
          set -euo pipefail
          assets=()
          mapfile -t assets < <(compgen -G "${ASSET_GLOB}" | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release asset found with glob ${ASSET_GLOB}"
            exit 1
          fi
          asset="${assets[0]}"

          wheel_version="$(python - "${asset}" <<'PY'
          import sys
          import zipfile
          from email import message_from_bytes

          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as zf:
              metadata_names = [n for n in zf.namelist() if n.endswith("METADATA")]
              if not metadata_names:
                  raise SystemExit("No METADATA found in wheel")
              metadata = message_from_bytes(zf.read(metadata_names[0]))
              print(metadata.get("Version", ""))
          PY
          )"

          if [[ "${wheel_version}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Wheel version (${wheel_version}) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

          echo "path=${asset}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from changelog
        if: steps.state.outputs.release_exists == 'false'
        id: notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" notes --tag "$RELEASE_TAG" --prefix "$TAG_PREFIX" --output release-notes.md
          echo 'path=release-notes.md' >> "$GITHUB_OUTPUT"

      - name: Freeze asset hashes before publication
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: >-
          python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" release-manifest --workflow vpngw-release.yml --tag "$RELEASE_TAG"
          --asset "${{ steps.asset.outputs.path }}"
          --output publication.json

      - name: Preserve immutable pre-publication evidence
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: publication-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.APP_DIR }}/publication.json
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.asset.outputs.path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.path }}"

      - name: Verify published release against original evidence
        if: steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python3 "${GITHUB_WORKSPACE}/skills/github-workflows/scripts/publication.py" release-verify --workflow vpngw-release.yml --tag "$RELEASE_TAG"

      - name: Write release manifest
        if: steps.state.outputs.release_exists == 'false'
        run: |
          set -euo pipefail
          jq -n \
            --arg actor "${GITHUB_ACTOR}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha "${{ steps.revision.outputs.commit }}" \
            --arg asset "${{ steps.asset.outputs.path }}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '{
              actor: $actor,
              repository: $repository,
              event: $event,
              ref: $ref,
              tag: $tag,
              version: $version,
              sha: $sha,
              asset: $asset,
              run_id: $run_id,
              run_attempt: $run_attempt,
              timestamp_utc: now | todate
            }' > release-manifest.json

      - name: Upload release manifest artifact
        if: steps.state.outputs.release_exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: nebius-vpngw-release-manifest-${{ github.run_id }}
          path: ${{ env.APP_DIR }}/release-manifest.json

      - name: Release already exists
        if: steps.state.outputs.release_exists == 'true'
        run: |
          echo "Release ${{ steps.version.outputs.tag }} already exists and its assets match trusted original hashes."

      - name: Publish run summary
        run: |
          {
            echo "### nebius-vpngw release publish"
            echo ""
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            echo "- Version: \`${{ steps.version.outputs.version }}\`"
            echo "- Commit: \`${{ steps.revision.outputs.commit }}\`"
            echo "- Release exists: \`${{ steps.state.outputs.release_exists }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
