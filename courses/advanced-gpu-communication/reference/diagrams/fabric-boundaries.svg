<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="fabric-boundaries-title fabric-boundaries-desc"><title id="fabric-boundaries-title">Two communication domains</title><desc id="fabric-boundaries-desc">Within each worker, eight GPUs share the NVLink and NVSwitch domain. InfiniBand connects the workers through their adapters. The arrows identify paths to qualify, not measured bandwidth.</desc><rect x="1" y="1" width="958" height="298" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/><g font-family="system-ui,sans-serif" fill="#0f172a" text-anchor="middle"><rect x="35" y="65" width="330" height="115" rx="12" fill="#dbeafe" stroke="#2563eb"/><rect x="595" y="65" width="330" height="115" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="200" y="110" font-size="23">Worker A: GPUs 0–7</text><text x="200" y="150" font-size="19">NVLink / NVSwitch</text><text x="760" y="110" font-size="23">Worker B: GPUs 8–15</text><text x="760" y="150" font-size="19">NVLink / NVSwitch</text><path d="M375 120 H585 M572 110 L585 120 L572 130" fill="none" stroke="#475569" stroke-width="3"/><text x="480" y="240" font-size="23">HCA ↔ InfiniBand ↔ HCA</text></g></svg>
