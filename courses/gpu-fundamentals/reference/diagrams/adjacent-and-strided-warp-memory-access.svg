<title id="detail-adjacent-and-strided-warp-memory-access-coalesce-title">Adjacent and strided warp memory access</title>
<desc id="detail-adjacent-and-strided-warp-memory-access-coalesce-desc">In the upper example, adjacent warp lanes request adjacent words that fit into a small set of memory sectors. In the lower example, strided lanes request one word from many separated sectors, transferring more bytes than the warp uses.</desc>
<text x="35" y="45" font-size="20" font-weight="700">Lane addresses determine useful bytes per transaction</text>
<text x="45" y="88" font-weight="700"><tspan x="45">Adjacent</tspan><tspan x="45" dy="23">lanes</tspan></text>
