<svg viewBox="0 0 1200 560" role="img" aria-labelledby="detail-conditions-for-a-tensor-core-execution-path-tensor-route-title detail-conditions-for-a-tensor-core-execution-path-tensor-route-desc">
<title id="detail-conditions-for-a-tensor-core-execution-path-tensor-route-title">Conditions for a Tensor Core execution path</title>
<desc id="detail-conditions-for-a-tensor-core-execution-path-tensor-route-desc">Storage format is only the first condition. The operation must be matrix-oriented, shapes and layouts must be supported, and the selected library or compiled kernel must issue a compatible Tensor Core instruction. Pointwise operations take a different execution path. Both paths require numerical and application validation.</desc>
<defs>
<marker id="detail-conditions-for-a-tensor-core-execution-path-tensor-route-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0,0 L0,8 L8,4 z" fill="#245880"/>
</marker>
</defs>
<g text-anchor="middle">
<rect x="35" y="80" width="190" height="90" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="130" y="113" font-weight="700">input storage</text>
<text x="130" y="134" class="diagram-label"><tspan x="130">FP32 / BF16 /</tspan><tspan x="130" dy="21">FP16 / FP8</tspan></text>
<rect x="290" y="65" width="210" height="120" rx="10" fill="#fff7e7" stroke="#86500e"/>
<text x="395" y="100" font-weight="700">eligible operation?</text>
<text x="395" y="128" class="diagram-label">matrix-oriented math</text>
<text x="395" y="153" class="diagram-label">supported shape + layout</text>
<rect x="565" y="65" width="230" height="120" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="680" y="100" font-weight="700">selected kernel?</text>
<text x="680" y="128" class="diagram-label">issues compatible</text>
<text x="680" y="153" class="diagram-label">Tensor Core instructions?</text>
<rect x="860" y="65" width="285" height="120" rx="10" fill="#e0f0e6" stroke="#206757"/>
<text x="1002" y="100" font-weight="700">Tensor Core path</text>
<text x="1002" y="128" class="diagram-label">compatible matrix instructions</text>
<text x="1002" y="153" class="diagram-label">declared accumulation format</text>
<rect x="565" y="280" width="230" height="105" rx="10" fill="#eee5f5" stroke="#654886"/>
<text x="680" y="316" font-weight="700">general CUDA path</text>
<text x="680" y="344" class="diagram-label">no Tensor Core instruction</text>
<text x="680" y="369" class="diagram-label">may still be highly optimized</text>
<rect x="860" y="280" width="285" height="105" rx="10" fill="#fff" stroke="#245880"/>
<text x="1002" y="316" font-weight="700">measure the selected path</text>
<text x="1002" y="344" class="diagram-label">time · kernel · shape · precision</text>
<text x="1002" y="369" class="diagram-label">never infer from dtype alone</text>
</g>
<g fill="none" stroke="#245880" stroke-width="3" marker-end="url(#detail-conditions-for-a-tensor-core-execution-path-tensor-route-arr)">
<line x1="225" y1="125" x2="290" y2="125"/>
<line x1="500" y1="125" x2="565" y2="125"/>
<line x1="795" y1="125" x2="860" y2="125"/>
<path d="M395 185 V332 H565"/>
<path d="M680 185 V280"/>
<path d="M1002 185 V280"/>
<path d="M1002 385 V410 H600 V445"/>
<line x1="795" y1="332" x2="860" y2="332"/>
</g>
<text x="515" y="310" class="diagram-label">no</text>
<text x="525" y="107" class="diagram-label">yes</text>
<text x="815" y="107" class="diagram-label">yes</text>
<text x="695" y="239" class="diagram-label">no</text>
<rect x="245" y="445" width="710" height="78" rx="12" fill="#fff" stroke="#dbe5e1"/>
<text x="600" y="475" text-anchor="middle" font-weight="700">Acceptance gate for either path</text>
<text x="600" y="503" text-anchor="middle" class="diagram-label">reference error + finite values + training or task quality + end-to-end objective</text>
</svg>
