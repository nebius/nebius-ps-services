<svg viewBox="0 0 1200 640" role="img" aria-labelledby="detail-copy-path-and-kernel-memory-demand-path-memory-path-title detail-copy-path-and-kernel-memory-demand-path-memory-path-desc">
<title id="detail-copy-path-and-kernel-memory-demand-path-memory-path-title">Copy path and kernel memory-demand path</title>
<desc id="detail-copy-path-and-kernel-memory-demand-path-memory-path-desc">The host copy path moves data between host memory and HBM through PCI Express and a copy engine. A separate kernel-demand path moves data between HBM, device-wide L2, the SM unified L1 and shared-memory subsystem, registers, and execution pipelines.</desc>
<defs>
<marker id="detail-copy-path-and-kernel-memory-demand-path-memory-path-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
<path d="M0,0 L0,8 L8,4 z" fill="#245880"/>
</marker>
</defs>
<text x="35" y="45" font-size="20" font-weight="700">Host-device copy path</text>
<g text-anchor="middle">
<rect x="55" y="80" width="230" height="95" rx="10" fill="#eef5fc" stroke="#245880"/>
<rect x="380" y="80" width="220" height="95" rx="10" fill="#fff7e7" stroke="#86500e"/>
<rect x="695" y="80" width="220" height="95" rx="10" fill="#e0f0e6" stroke="#206757"/>
<text x="170" y="113" font-weight="700">host memory</text>
<text x="170" y="141" class="diagram-label">pageable or pinned</text>
<text x="490" y="113" font-weight="700">PCIe + copy engine</text>
<text x="490" y="141" class="diagram-label">explicit CUDA copy</text>
<text x="805" y="113" font-weight="700">HBM allocation</text>
<text x="805" y="138" class="diagram-label"><tspan x="805">PyTorch CUDA</tspan><tspan x="805" dy="20">tensor storage</tspan></text>
</g>
<g stroke="#245880" stroke-width="3" marker-start="url(#detail-copy-path-and-kernel-memory-demand-path-memory-path-arr)" marker-end="url(#detail-copy-path-and-kernel-memory-demand-path-memory-path-arr)">
<line x1="285" y1="127" x2="380" y2="127"/>
<line x1="600" y1="127" x2="695" y2="127"/>
</g>
<text x="945" y="104" class="diagram-label">copies target device memory;</text>
<text x="945" y="129" class="diagram-label">they do not explicitly fill</text>
<text x="945" y="154" class="diagram-label">each hardware cache in order</text>
<text x="35" y="260" font-size="20" font-weight="700">Kernel demand and reuse path</text>
<g text-anchor="middle">
<rect x="55" y="300" width="190" height="105" rx="10" fill="#e0f0e6" stroke="#206757"/>
<rect x="310" y="300" width="160" height="105" rx="10" fill="#fff7e7" stroke="#86500e"/>
<rect x="515" y="280" width="315" height="165" rx="12" fill="#eef5fc" stroke="#245880"/>
<rect x="875" y="300" width="250" height="105" rx="10" fill="#eee5f5" stroke="#654886"/>
<text x="150" y="337" font-weight="700">HBM</text>
<text x="150" y="366" class="diagram-label">device-wide capacity</text>
<text x="390" y="337" font-weight="700">L2 cache</text>
<text x="390" y="366" class="diagram-label">shared across SMs</text>
<text x="672" y="318" font-weight="700">one SM</text>
<text x="672" y="345" class="diagram-label"><tspan x="672">unified L1 / texture /</tspan><tspan x="672" dy="20">shared capacity</tspan></text>
<text x="672" y="396" class="diagram-label">shared memory is block-managed;</text>
<text x="672" y="421" class="diagram-label">L1 caching is hardware-managed</text>
<text x="1000" y="337" font-weight="700">registers + execution</text>
<text x="1000" y="366" class="diagram-label">thread values and pipelines</text>
</g>
<g stroke="#245880" stroke-width="3" marker-start="url(#detail-copy-path-and-kernel-memory-demand-path-memory-path-arr)" marker-end="url(#detail-copy-path-and-kernel-memory-demand-path-memory-path-arr)">
<line x1="245" y1="352" x2="310" y2="352"/>
<line x1="470" y1="352" x2="515" y2="352"/>
<line x1="830" y1="352" x2="875" y2="352"/>
</g>
<rect x="175" y="475" width="850" height="80" rx="12" fill="#fff" stroke="#dbe5e1"/>
<text x="600" y="507" text-anchor="middle" font-weight="700">Reuse changes traffic at a named boundary</text>
<text x="600" y="535" text-anchor="middle" class="diagram-label">an L2 hit avoids HBM · a shared tile avoids repeated L2/HBM demand · a register value avoids repeated loads</text>
<text x="600" y="605" text-anchor="middle" fill="#52626b">Local memory from register spills is an address space backed by device memory, not on-chip “local storage.”</text>
</svg>
