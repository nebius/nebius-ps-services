<title id="detail-discovered-two-node-communication-path-topology-title">Discovered two-node communication path</title>
<desc id="detail-discovered-two-node-communication-path-topology-desc">Rank zero owns one H100 on node zero and rank one owns one H100 on node one. Data traverses each node's GPU-to-host or network path and the inter-node fabric. The diagram deliberately does not assume NVLink, InfiniBand, RoCE, or GPUDirect RDMA; those capabilities must be discovered and preserved as run evidence.</desc>
