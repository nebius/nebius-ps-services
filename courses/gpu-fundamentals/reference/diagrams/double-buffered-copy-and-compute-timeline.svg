<svg viewBox="0 0 1200 560" role="img" aria-labelledby="detail-double-buffered-copy-and-compute-timeline-buffer-title detail-double-buffered-copy-and-compute-timeline-buffer-desc">
<title id="detail-double-buffered-copy-and-compute-timeline-buffer-title">Double-buffered copy and compute timeline</title>
<desc id="detail-double-buffered-copy-and-compute-timeline-buffer-desc">A fill phase copies batch zero. During steady state, the copy stream transfers the next batch into the free device buffer while the compute stream consumes the current buffer. Events make each consumer wait for its batch and prevent a producer from overwriting a buffer still in use.</desc>
<defs>
<marker id="detail-double-buffered-copy-and-compute-timeline-buffer-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0,0 L0,8 L8,4 z" fill="#245880"/>
</marker>
</defs>
<g font-weight="700">
<text x="35" y="65">phase</text>
<text x="35" y="155">copy stream</text>
<text x="35" y="285">compute stream</text>
</g>
<g stroke="#dbe5e1" stroke-width="2">
<line x1="180" y1="85" x2="180" y2="390"/>
<line x1="400" y1="85" x2="400" y2="390"/>
<line x1="620" y1="85" x2="620" y2="390"/>
<line x1="840" y1="85" x2="840" y2="390"/>
<line x1="1060" y1="85" x2="1060" y2="390"/>
</g>
<g text-anchor="middle" class="diagram-label">
<text x="290" y="65">fill</text>
<text x="510" y="65">steady state</text>
<text x="730" y="65">steady state</text>
<text x="950" y="65">drain</text>
</g>
<g text-anchor="middle">
<rect x="190" y="115" width="200" height="75" rx="9" fill="#e0edfa" stroke="#245880"/>
<text x="290" y="145" font-weight="700">copy batch 0</text>
<text x="290" y="171" class="diagram-label">host → device buffer A</text>
<rect x="410" y="115" width="200" height="75" rx="9" fill="#e0edfa" stroke="#245880"/>
<text x="510" y="145" font-weight="700">copy batch 1</text>
<text x="510" y="171" class="diagram-label">host → device buffer B</text>
<rect x="630" y="115" width="200" height="75" rx="9" fill="#e0edfa" stroke="#245880"/>
<text x="730" y="139" font-weight="700">copy batch 2</text>
<text x="730" y="160" class="diagram-label"><tspan x="730">reuse buffer A</tspan><tspan x="730" dy="20"> after compute 0</tspan></text>
<rect x="410" y="245" width="200" height="75" rx="9" fill="#e0f0e6" stroke="#206757"/>
<text x="510" y="275" font-weight="700">compute batch 0</text>
<text x="510" y="301" class="diagram-label">consume buffer A</text>
<rect x="630" y="245" width="200" height="75" rx="9" fill="#e0f0e6" stroke="#206757"/>
<text x="730" y="275" font-weight="700">compute batch 1</text>
<text x="730" y="301" class="diagram-label">consume buffer B</text>
<rect x="850" y="245" width="200" height="75" rx="9" fill="#e0f0e6" stroke="#206757"/>
<text x="950" y="275" font-weight="700">compute batch 2</text>
<text x="950" y="301" class="diagram-label">consume buffer A</text>
</g>
<g fill="none" stroke="#245880" stroke-width="3" marker-end="url(#detail-double-buffered-copy-and-compute-timeline-buffer-arr)">
<path d="M390 152 C405 152 405 225 430 245"/>
<path d="M610 152 C625 152 625 225 650 245"/>
<path d="M830 152 C845 152 845 225 870 245"/>
<path d="M610 282 C620 282 620 205 630 190" stroke-dasharray="7 6"/>
</g>
<g class="diagram-small" fill="#52626b">
<text x="450" y="215">ready A</text>
<text x="670" y="215">ready B</text>
<text x="890" y="215">ready A</text>
<text x="646" y="363">buffer A is free only after compute 0</text>
</g>
<rect x="150" y="430" width="900" height="78" rx="12" fill="#fff" stroke="#dbe5e1"/>
<text x="600" y="460" text-anchor="middle" font-weight="700">What the trace must prove</text>
<text x="600" y="488" text-anchor="middle" class="diagram-label">copy 1 overlaps compute 0 · copy 2 overlaps compute 1 · every consumer waits · every reused buffer is safe</text>
</svg>
