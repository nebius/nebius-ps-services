<svg viewBox="0 0 1100 550" role="img" aria-labelledby="net-gpu-networking-layers-title net-gpu-networking-layers-desc">
<title id="net-gpu-networking-layers-title">GPU networking layers and their roles</title>
<desc id="net-gpu-networking-layers-desc">Applications request collectives from NCCL. NCCL can use local GPU interconnects or network transports. InfiniBand and Ethernet with RoCE provide RDMA fabrics; GPUDirect RDMA describes direct access to GPU memory, not a separate fabric.</desc>
<defs><marker id="net-gpu-networking-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245880"/></marker></defs>
<g font-family="sans-serif" font-size="19" fill="#17324d">
<rect x="310" y="15" width="480" height="70" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="550" y="56" text-anchor="middle">Application: PyTorch or another framework</text><path d="M550 85 V115" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-gpu-networking-layers-arrow)"/><rect x="310" y="115" width="480" height="65" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="550" y="153.5" text-anchor="middle">NCCL: collective communication software</text><path d="M550 180 V210 H265 V240" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-gpu-networking-layers-arrow)"/><path d="M550 210 H835 V240" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-gpu-networking-layers-arrow)"/><rect x="35" y="240" width="460" height="95" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="265" y="280.5" text-anchor="middle">Local GPU communication</text>
<text x="265" y="306.5" text-anchor="middle">NVLink / NVSwitch or supported PCIe</text><rect x="605" y="240" width="460" height="95" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="835" y="280.5" text-anchor="middle">Inter-node communication</text>
<text x="835" y="306.5" text-anchor="middle">RDMA transport or IP sockets</text><path d="M835 335 V365" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-gpu-networking-layers-arrow)"/><rect x="605" y="365" width="460" height="75" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="835" y="408.5" text-anchor="middle">RDMA fabrics: InfiniBand or Ethernet/RoCE</text><rect x="35" y="365" width="460" height="75" rx="10" fill="#e0f0e6" stroke="#245880"/>
<text x="265" y="395.5" text-anchor="middle">GPUDirect RDMA: GPU-memory access</text>
<text x="265" y="421.5" text-anchor="middle">Used with a supported NIC and platform</text><text x="35" y="490" font-weight="700">Read each box as a distinct role, not interchangeable technologies</text><text x="35" y="525">NCCL selects available paths; software cannot create absent links or fabric capabilities.</text>
</g>
</svg>
