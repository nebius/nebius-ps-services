<title id="h100-whole-title">H100 SXM 80 GB: SMs, L2 cache and HBM</title>
<desc id="h100-whole-desc">A simplified whole-device view shows representative SM boxes for 132 streaming multiprocessors, linked to the shared 50 MB L2 cache and then 80 GB HBM3. Lines mean data-access connections, not timing or a mandatory path for every access. The ellipsis omits repeated SMs. This is not a silicon floorplan.</desc>
