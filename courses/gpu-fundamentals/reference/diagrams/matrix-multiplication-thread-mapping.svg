<svg viewBox="0 0 520 1800" style="max-width: 600px; margin-inline: auto" role="img" aria-labelledby="detail-matrix-multiplication-thread-mapping-title detail-matrix-multiplication-thread-mapping-desc">
<title id="detail-matrix-multiplication-thread-mapping-title">Matrix multiplication: from four outputs to one scheduled warp</title>
<desc id="detail-matrix-multiplication-thread-mapping-desc">Read downward. Dimensions mean rows by columns: A (2 by 3) times B (3 by 2) gives C (2 by 2). The highlighted row 0 of A and column 1 of B give C[0,1] = 1×2 + 2×4 + 3×6 = 28. This example kernel assigns T0 to C[0,0], T1 to C[0,1], T2 to C[1,0] and T3 to C[1,1]. A one-block grid contains a 2-by-2-thread block, with x selecting columns and y selecting rows. That block resides on one SM. Its warp has 32 lane positions: T0–T3 use lanes 0–3; lanes 4–31 have no threads from this block. The scheduler issues ready instructions; each thread accumulates all three products and stores one result. C=[[22,28],[49,64]]. In the output panel, x increases to the right across columns and y increases downward across rows. Matrix indices name the row first and column second: C[row, column] = C[y, x] for this kernel. For example, (x=1, y=0) selects C[0,1] = 28. The kernel chooses this mapping; CUDA does not require it. Output-axis arrows show increasing coordinates; arrows between panels show conceptual assignment and result flow, not clock cycles. One output per thread is a kernel design choice; optimized kernels can use different mappings.</desc>
<defs><marker id="detail-matrix-multiplication-thread-mapping-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#577580"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#203640">
<text x="24" y="38" font-size="30" font-weight="700" text-anchor="start" fill="#203640">Matrix multiplication on a GPU</text>
<text x="24" y="72" font-size="22" font-weight="400" text-anchor="start" fill="#526974">One simple kernel · four output elements</text>
<rect x="16" y="100" width="488" height="338" rx="12" fill="#f7fafc" stroke="#d5e1e5" stroke-width="1.2"/>
