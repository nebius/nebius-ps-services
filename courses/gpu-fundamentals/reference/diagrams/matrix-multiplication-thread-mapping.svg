<text x="36" y="166" font-size="20" font-weight="400" text-anchor="start" fill="#526974">Dimensions = rows × columns</text>
<text x="142" y="201" font-size="22" font-weight="700" text-anchor="middle" fill="#203640">A · 2 × 3</text>
<text x="362" y="201" font-size="22" font-weight="700" text-anchor="middle" fill="#203640">B · 3 × 2</text>
