<svg viewBox="0 0 640 1720" role="img" aria-labelledby="detail-matrix-multiplication-thread-mapping-title detail-matrix-multiplication-thread-mapping-desc">
<title id="detail-matrix-multiplication-thread-mapping-title">Matrix multiplication: from four outputs to one scheduled warp</title>
<desc id="detail-matrix-multiplication-thread-mapping-desc">Read downward: A (2 by 3) times B (3 by 2) produces C=[[22,28],[49,64]]. This simple kernel assigns T0 to C[0,0], T1 to C[0,1], T2 to C[1,0] and T3 to C[1,1]. One grid contains one 2-by-2-thread block; the same block resides on one SM. Its single warp has 32 lanes: lanes 0–3 contain T0–T3 and lanes 4–31 are unused. A warp scheduler issues ready instructions; each active thread accumulates three products and stores its output. Arrows show conceptual assignment and result flow, not clock cycles. One thread per output is a choice for this kernel, not a universal matrix mapping.</desc>
<defs><marker id="detail-matrix-multiplication-thread-mapping-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" viewBox="0 0 10 10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#245880"/></marker></defs>
