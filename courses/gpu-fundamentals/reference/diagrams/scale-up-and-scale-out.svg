<svg viewBox="0 0 1100 610" role="img" aria-labelledby="net-scale-up-and-scale-out-title net-scale-up-and-scale-out-desc">
<title id="net-scale-up-and-scale-out-title">Supported scale-up and the course scale-out target</title>
<desc id="net-scale-up-and-scale-out-desc">The left comparison depicts multiple GPUs connected by an NVSwitch inside a supported system. The right depicts the course's two nodes, each with one GPU connected through a NIC to a network fabric. This target contains no intra-node GPU pair to test NVLink.</desc>
<defs><marker id="net-scale-up-and-scale-out-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245880"/></marker></defs>
<g font-family="sans-serif" font-size="19" fill="#17324d">
<text x="35" y="35" font-weight="700">Comparison: supported multi-GPU system</text><rect x="35" y="60" width="455" height="460" rx="10" fill="#f4f8fc" stroke="#245880"/>
<rect x="65" y="105" width="170" height="75" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="150" y="148.5" text-anchor="middle">GPU A</text><rect x="285" y="105" width="170" height="75" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="370" y="148.5" text-anchor="middle">GPU B</text><path d="M150 180 V265" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-scale-up-and-scale-out-arrow)"/><path d="M370 180 V265" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-scale-up-and-scale-out-arrow)"/><rect x="65" y="265" width="390" height="90" rx="10" fill="#e0f0e6" stroke="#245880"/>
<text x="260" y="303" text-anchor="middle">NVSwitch fabric</text>
<text x="260" y="329" text-anchor="middle">NVLink-connected GPU endpoints</text><text x="180" y="222">NVLink</text><text x="400" y="222">NVLink</text><rect x="65" y="395" width="390" height="80" rx="10" fill="#fff7e7" stroke="#245880"/>
<text x="260" y="428" text-anchor="middle">Network adapters add scale-out</text>
<text x="260" y="454" text-anchor="middle">NVSwitch is not an IB switch</text><text x="580" y="35" font-weight="700">Required target: two one-GPU nodes</text><rect x="575" y="60" width="225" height="250" rx="10" fill="#f4f8fc" stroke="#245880"/>
<rect x="845" y="60" width="225" height="250" rx="10" fill="#f4f8fc" stroke="#245880"/>
<rect x="595" y="90" width="185" height="70" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="687.5" y="131" text-anchor="middle">Node A: H100</text><rect x="865" y="90" width="185" height="70" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="957.5" y="131" text-anchor="middle">Node B: H100</text><path d="M687 160 V220" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-scale-up-and-scale-out-arrow)"/><path d="M957 160 V220" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-scale-up-and-scale-out-arrow)"/><rect x="595" y="220" width="185" height="65" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="687.5" y="258.5" text-anchor="middle">NIC A</text><rect x="865" y="220" width="185" height="65" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="957.5" y="258.5" text-anchor="middle">NIC B</text><path d="M687 285 V375" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-scale-up-and-scale-out-arrow)"/><path d="M957 285 V375" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-scale-up-and-scale-out-arrow)"/><rect x="575" y="375" width="495" height="100" rx="10" fill="#e0f0e6" stroke="#245880"/>
<text x="822.5" y="418" text-anchor="middle">Inter-node network fabric</text>
<text x="822.5" y="444" text-anchor="middle">InfiniBand or Ethernet; path is site-specific</text><text x="580" y="530">GPU/NIC placement and registration need checks.</text><text x="35" y="580">Schematic connections carry traffic in both directions; capacities and wiring are not to scale.</text>
</g>
</svg>
