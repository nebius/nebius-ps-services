<title id="detail-simplified-hopper-sm-resource-model-hopper-sm-title">Simplified Hopper SM resource model</title>
<desc id="detail-simplified-hopper-sm-resource-model-hopper-sm-desc">Four scheduler and execution subpartitions each contain a warp scheduler, a register-file partition, and execution pipelines. A unified L1, texture, and shared-memory resource spans the SM, while L2 and HBM are outside it.</desc>
