<svg viewBox="0 0 340 568" role="img" aria-labelledby="tools-compute-report-title tools-compute-report-desc">
<title id="tools-compute-report-title">Counters guide the next experiment</title>
<desc id="tools-compute-report-desc">Illustrative values: memory and compute throughput are percentages of their respective peak rates; occupancy is the fraction of supported resident warps. Bars share a 0–100% drawing scale but measure different quantities. They suggest a hypothesis, not a proven bottleneck.</desc>
<rect x="1" y="1" width="338" height="566" rx="12" fill="#ffffff" stroke="#52626b"/>
<g font-family="Arial, sans-serif"><text x="18" y="30" font-size="21" text-anchor="start" fill="#24343d" font-weight="700">Nsight Compute</text><text x="18" y="56" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">Synthetic vector-add report</text><rect x="16" y="77" width="308" height="67" rx="8" fill="#eef5fc" stroke="#245880" stroke-width="1.5"/><text x="30" y="101" font-size="16" text-anchor="start" fill="#24343d" font-weight="700">Selected kernel: vector_add</text><text x="30" y="126" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">Inspect this launch in Details</text><text x="24" y="178" font-size="16" text-anchor="start" fill="#24343d" font-weight="400">Memory throughput</text><text x="310" y="178" font-size="16" text-anchor="end" fill="#206757" font-weight="700">80%</text><rect x="24" y="191" width="286" height="22" rx="8" fill="#f4f7f9" stroke="#52626b" stroke-width="1.5"/><rect x="25" y="192" width="227.2" height="20" rx="6" fill="#206757"/><text x="24" y="255" font-size="16" text-anchor="start" fill="#24343d" font-weight="400">Compute throughput</text><text x="310" y="255" font-size="16" text-anchor="end" fill="#245880" font-weight="700">20%</text><rect x="24" y="268" width="286" height="22" rx="8" fill="#f4f7f9" stroke="#52626b" stroke-width="1.5"/><rect x="25" y="269" width="56.8" height="20" rx="6" fill="#245880"/><text x="24" y="332" font-size="16" text-anchor="start" fill="#24343d" font-weight="400">Achieved occupancy</text><text x="310" y="332" font-size="16" text-anchor="end" fill="#86500e" font-weight="700">50%</text><rect x="24" y="345" width="286" height="22" rx="8" fill="#f4f7f9" stroke="#52626b" stroke-width="1.5"/><rect x="25" y="346" width="142.0" height="20" rx="6" fill="#86500e"/><text x="24" y="398" font-size="17" text-anchor="start" fill="#24343d" font-weight="700">Different denominators</text><text x="24" y="423" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">These values do not sum to 100%.</text><rect x="16" y="449" width="308" height="100" rx="8" fill="#eef8f2" stroke="#206757" stroke-width="1.5"/><text x="30" y="474" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">Hypothesis: memory traffic limits</text><text x="30" y="497" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">this kernel. Check bytes and access</text><text x="30" y="520" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">patterns, then test unprofiled.</text></g>
</svg>
