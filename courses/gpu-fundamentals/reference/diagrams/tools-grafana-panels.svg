<svg viewBox="0 0 340 568" role="img" aria-labelledby="tools-grafana-panels-title tools-grafana-panels-desc">
<title id="tools-grafana-panels-title">Benchmark summaries and telemetry answer different questions</title>
<desc id="tools-grafana-panels-desc">The synthetic selected pair has 8 ms and 6 ms median durations with passing correctness. The sampled-utilization graph gives device context, not kernel timings. Its horizontal axis orders samples; spacing is illustrative. Changing the time picker does not replace the selected pair.</desc>
<rect x="1" y="1" width="338" height="566" rx="12" fill="#ffffff" stroke="#52626b"/>
