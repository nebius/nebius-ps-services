<svg viewBox="0 0 340 558" role="img" aria-labelledby="tools-nvtx-ranges-title tools-nvtx-ranges-desc">
<title id="tools-nvtx-ranges-title">Names identify submission and completion</title>
<desc id="tools-nvtx-ranges-desc">This schematic follows the code example; positions and box heights are not measured durations. Point markers name instants. Nested CPU ranges name parts of step. GPU kernels may outlast their submission ranges. The explicit synchronize call waits before result_ready; NVTX alone does not wait.</desc>
<rect x="1" y="1" width="338" height="556" rx="12" fill="#ffffff" stroke="#52626b"/>
<g font-family="Arial, sans-serif"><text x="18" y="30" font-size="21" text-anchor="start" fill="#24343d" font-weight="700">NVTX annotations</text><text x="18" y="55" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">Schematic order · time ↓</text><text x="108" y="86" font-size="16" text-anchor="middle" fill="#245880" font-weight="700">CPU annotations</text><text x="272" y="86" font-size="16" text-anchor="middle" fill="#206757" font-weight="700">GPU work</text><text x="22" y="113" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">◆ input_ready</text><rect x="18" y="127" width="183" height="325" rx="8" fill="#f4f7f9" stroke="#52626b" stroke-width="1.5"/><text x="31" y="150" font-size="16" text-anchor="start" fill="#24343d" font-weight="700">step</text><rect x="30" y="164" width="157" height="48" rx="8" fill="#eef5fc" stroke="#245880" stroke-width="1.5"/><text x="108" y="192" font-size="16" text-anchor="middle" fill="#24343d" font-weight="400">square</text><rect x="224" y="190" width="100" height="101" rx="8" fill="#eef8f2" stroke="#206757" stroke-width="1.5"/><text x="274" y="232" font-size="15" text-anchor="middle" fill="#24343d" font-weight="400">Square</text><text x="274" y="254" font-size="15" text-anchor="middle" fill="#24343d" font-weight="400">kernel</text><line x1="187" y1="181" x2="223" y2="202" stroke="#245880" stroke-width="2" stroke-dasharray="3 3"/><text x="30" y="236" font-size="14" text-anchor="start" fill="#24343d" font-weight="400">◆ square_submitted</text><rect x="30" y="252" width="157" height="45" rx="8" fill="#eef5fc" stroke="#245880" stroke-width="1.5"/><text x="108" y="280" font-size="16" text-anchor="middle" fill="#24343d" font-weight="400">reduce</text><rect x="224" y="312" width="100" height="65" rx="8" fill="#eef8f2" stroke="#206757" stroke-width="1.5"/><text x="274" y="338" font-size="15" text-anchor="middle" fill="#24343d" font-weight="400">Reduce</text><text x="274" y="359" font-size="15" text-anchor="middle" fill="#24343d" font-weight="400">kernel</text><line x1="187" y1="273" x2="223" y2="322" stroke="#245880" stroke-width="2" stroke-dasharray="3 3"/><rect x="30" y="315" width="157" height="119" rx="8" fill="#fff7e7" stroke="#86500e" stroke-width="1.5"/><text x="108" y="344" font-size="14" text-anchor="middle" fill="#24343d" font-weight="400">wait_for_result</text><text x="108" y="376" font-size="15" text-anchor="middle" fill="#24343d" font-weight="400">Explicit</text><text x="108" y="399" font-size="15" text-anchor="middle" fill="#24343d" font-weight="400">synchronize()</text><line x1="224" y1="379" x2="193" y2="419" stroke="#86500e" stroke-width="2" stroke-dasharray="3 3"/><text x="22" y="481" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">◆ result_ready</text><text x="20" y="513" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">◆ = instant   Box = interval</text><text x="20" y="537" font-size="15" text-anchor="start" fill="#24343d" font-weight="400">Dashed lines = work / wait links</text></g>
</svg>
