<svg viewBox="0 0 1100 425" role="img" aria-labelledby="net-all-reduce-result-units-title net-all-reduce-result-units-desc">
<title id="net-all-reduce-result-units-title">Reading an illustrative all-reduce result</title>
<desc id="net-all-reduce-result-units-desc">An illustrative two-rank result has a 64 MiB logical payload and 4000 microseconds duration. It yields about 16.78 decimal GB per second. All-reduce's normalized bus bandwidth factor equals one for two ranks. Each out-of-place and in-place result also needs a zero incorrect-element count.</desc>
<defs><marker id="net-all-reduce-result-units-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245880"/></marker></defs>
<g font-family="sans-serif" font-size="19" fill="#17324d">
<text x="30" y="35" font-weight="700">Illustration only — not a measured H100 result</text><rect x="30" y="70" width="300" height="95" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="180" y="110.5" text-anchor="middle">Payload: 64 MiB</text>
<text x="180" y="136.5" text-anchor="middle">67,108,864 bytes</text><rect x="400" y="70" width="300" height="95" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="550" y="110.5" text-anchor="middle">Duration: 4,000 μs</text>
<text x="550" y="136.5" text-anchor="middle">0.004 seconds</text><rect x="770" y="70" width="300" height="95" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="920" y="110.5" text-anchor="middle">Rank count: 2</text>
<text x="920" y="136.5" text-anchor="middle">Sum all-reduce</text><path d="M180 165 V230" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-all-reduce-result-units-arrow)"/><path d="M550 165 V230" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-all-reduce-result-units-arrow)"/><path d="M920 165 V230" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-all-reduce-result-units-arrow)"/><rect x="30" y="230" width="670" height="85" rx="10" fill="#e0f0e6" stroke="#245880"/>
<text x="365" y="278.5" text-anchor="middle">algbw = bytes / seconds / 10⁹ ≈ 16.78 GB/s</text><rect x="770" y="230" width="300" height="85" rx="10" fill="#e0f0e6" stroke="#245880"/>
<text x="920" y="265.5" text-anchor="middle">busbw factor: 2(N−1)/N</text>
<text x="920" y="291.5" text-anchor="middle">N = 2 → factor = 1</text><text x="30" y="370">Read both buffer modes; require enabled checks and #wrong = 0 for each.</text><text x="30" y="405">Normalized bus bandwidth is not a NIC wire counter or proof of link saturation.</text>
</g>
</svg>
