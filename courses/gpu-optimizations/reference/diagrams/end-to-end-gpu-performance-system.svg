<text x="1100" y="111">complete</text>
<text x="1100" y="137" class="diagram-label">user metric</text>
</g>
<g stroke="#245880" stroke-width="3" marker-end="url(#detail-end-to-end-gpu-performance-system-perf-system-arr)">
