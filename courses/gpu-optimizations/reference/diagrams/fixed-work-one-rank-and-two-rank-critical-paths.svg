<text x="30" y="245">rank 0</text>
<text x="30" y="345">rank 1</text>
</g>
<g stroke="#24343d" stroke-width="2">
<line x1="145" y1="85" x2="1030" y2="85"/>
<line x1="145" y1="235" x2="1030" y2="235"/>
<line x1="145" y1="335" x2="1030" y2="335"/>
</g>
