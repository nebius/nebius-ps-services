<svg viewBox="0 0 1100 520" role="img" aria-labelledby="detail-fixed-work-one-rank-and-two-rank-critical-paths-timeline-title detail-fixed-work-one-rank-and-two-rank-critical-paths-timeline-desc">
<title id="detail-fixed-work-one-rank-and-two-rank-critical-paths-timeline-title">Fixed-work one-rank and two-rank critical paths</title>
<desc id="detail-fixed-work-one-rank-and-two-rank-critical-paths-timeline-desc">A one-rank baseline contains the complete compute interval. A two-rank fixed-global-work run shortens per-rank compute but adds an arrival wait for the early rank and collective communication. The non-overlapped collective is exposed communication, not an additional interval after the collective. Speedup is determined by the slowest rank's complete interval, not by shorter local compute alone.</desc>
