<svg viewBox="0 0 400 600" style="max-width: 460px; margin-inline: auto" role="img" aria-labelledby="h2d-slot-ownership-title h2d-slot-ownership-desc">
<title id="h2d-slot-ownership-title">Input slots protect copy and compute</title>
<desc id="h2d-slot-ownership-desc">Follow one paired host/device slot downward. Its previous computation must finish before refill. The host source stays unchanged until the copy completes; computation waits for that completion. Only finished computation permits the next reuse. The return arrow repeats this ownership cycle. Other slots may overlap independent work; heights are not measurements.</desc>
<defs><marker id="h2d-slot-ownership-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#206757"/></marker></defs>
<g transform="translate(20 0)" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24343d">
<rect x="14" y="12" width="332" height="103" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="180" y="56" text-anchor="middle">1. Wait for prior</text>
<text x="180" y="85" text-anchor="middle">slot computation</text>
<path d="M180 116 V148" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#h2d-slot-ownership-arrow)"/>
<rect x="14" y="151" width="332" height="103" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="180" y="195" text-anchor="middle">2. Fill pinned host</text>
<text x="180" y="224" text-anchor="middle">and enqueue H2D</text>
<path d="M180 255 V287" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#h2d-slot-ownership-arrow)"/>
<rect x="14" y="290" width="332" height="103" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="180" y="334" text-anchor="middle">3. Copy completes;</text>
<text x="180" y="363" text-anchor="middle">compute may read</text>
<path d="M180 394 V426" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#h2d-slot-ownership-arrow)"/>
<rect x="14" y="429" width="332" height="103" rx="12" fill="#eef8f2" stroke="#245880" stroke-width="2"/>
<text x="180" y="473" text-anchor="middle">4. Compute finishes;</text>
<text x="180" y="502" text-anchor="middle">slot may be reused</text>
</g>
<path d="M368 480 H382 V64 H368" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#h2d-slot-ownership-arrow)"/>
<text x="200" y="575" text-anchor="middle" font-size="20">Reuse for the next batch</text>
</svg>
