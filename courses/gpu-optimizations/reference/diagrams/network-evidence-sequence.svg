<svg viewBox="0 0 1100 535" role="img" aria-labelledby="net-network-evidence-sequence-title net-network-evidence-sequence-desc">
<title id="net-network-evidence-sequence-title">Network evidence before application tuning</title>
<desc id="net-network-evidence-sequence-desc">Four ordered evidence stages distinguish platform capability, the path selected by a job, correct collective timing and application benefit. Each stage has a different observation. A failed or unknown prerequisite prevents a stronger claim.</desc>
<defs><marker id="net-network-evidence-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245880"/></marker></defs>
<g font-family="sans-serif" font-size="19" fill="#17324d">
<rect x="25" y="15" width="265" height="85" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="157.5" y="63.5" text-anchor="middle">1  Capability</text><rect x="330" y="15" width="745" height="85" rx="10" fill="#f4f8fc" stroke="#245880"/>
<text x="702.5" y="63.5" text-anchor="middle">GPU/NIC topology, active fabric, qualified registration</text><path d="M155 100 V138" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-network-evidence-sequence-arrow)"/><rect x="25" y="140" width="265" height="85" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="157.5" y="188.5" text-anchor="middle">2  Selected path</text><rect x="330" y="140" width="745" height="85" rx="10" fill="#f4f8fc" stroke="#245880"/>
<text x="702.5" y="188.5" text-anchor="middle">NCCL startup diagnostics; not an adapter-name guess</text><path d="M155 225 V263" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-network-evidence-sequence-arrow)"/><rect x="25" y="265" width="265" height="85" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="157.5" y="313.5" text-anchor="middle">3  Collective result</text><rect x="330" y="265" width="745" height="85" rx="10" fill="#f4f8fc" stroke="#245880"/>
<text x="702.5" y="313.5" text-anchor="middle">Zero errors, full size curve, three independent runs</text><path d="M155 350 V388" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#net-network-evidence-sequence-arrow)"/><rect x="25" y="390" width="265" height="85" rx="10" fill="#e0edfa" stroke="#245880"/>
<text x="157.5" y="438.5" text-anchor="middle">4  Application benefit</text><rect x="330" y="390" width="745" height="85" rx="10" fill="#e0f0e6" stroke="#245880"/>
<text x="702.5" y="438.5" text-anchor="middle">Repeat fixed-work scaling and exposed-overlap checks</text><text x="330" y="515">Unknown or failed evidence is a limitation, not permission to configure the cluster.</text>
</g>
</svg>
