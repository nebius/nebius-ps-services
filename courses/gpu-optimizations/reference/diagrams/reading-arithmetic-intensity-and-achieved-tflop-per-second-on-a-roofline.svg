<title id="detail-reading-arithmetic-intensity-and-achieved-tflop-per-second-on-a-roofline-roofline-tools-title">Reading arithmetic intensity and achieved TFLOP per second on a roofline</title>
<desc id="detail-reading-arithmetic-intensity-and-achieved-tflop-per-second-on-a-roofline-roofline-tools-desc">A log-scale conceptual roofline has arithmetic intensity on the horizontal axis and achieved FLOP per second on the vertical axis. A low-intensity pointwise kernel lies on the memory side; a reused matrix multiply lies on the compute side. A point below both ceilings requires investigation of other inefficiencies.</desc>
