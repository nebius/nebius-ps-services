<svg viewBox="0 0 1150 560" role="img" aria-labelledby="detail-tool-scope-from-service-objective-to-selected-kernel-tool-map-title detail-tool-scope-from-service-objective-to-selected-kernel-tool-map-desc">
<title id="detail-tool-scope-from-service-objective-to-selected-kernel-tool-map-title">Tool scope from service objective to selected kernel</title>
<desc id="detail-tool-scope-from-service-objective-to-selected-kernel-tool-map-desc">A vertical diagnostic ladder moves from inference load and end-to-end metrics through device telemetry, framework operators, system timeline, and one selected kernel. Side labels show the artifact produced at each level.</desc>
