<rect x="340" y="100" width="240" height="255" rx="8" fill="#eef8f2" stroke="#9ac0ad" stroke-width="1.5"/>
<text x="355" y="132" font-size="22" text-anchor="start" fill="#24343d" font-weight="700">Investigate</text>
<text x="355" y="174" font-size="22" text-anchor="start" fill="#24343d" font-weight="400">Memory traffic</text>
<text x="355" y="207" font-size="22" text-anchor="start" fill="#24343d" font-weight="400">may limit this</text>
<text x="355" y="240" font-size="22" text-anchor="start" fill="#24343d" font-weight="400">kernel. Check</text>
<text x="355" y="273" font-size="22" text-anchor="start" fill="#24343d" font-weight="400">bytes and</text>
