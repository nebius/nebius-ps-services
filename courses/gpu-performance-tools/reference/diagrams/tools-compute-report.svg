<svg viewBox="0 0 600 410" role="img" aria-labelledby="tools-compute-report-title tools-compute-report-desc">
<title id="tools-compute-report-title">Counters guide the next experiment</title>
<desc id="tools-compute-report-desc">Read the selected kernel counters on the left, then the investigation on the right. The arrow means evidence informs a hypothesis, not proof of a bottleneck. Memory and compute throughput use their respective peak rates; achieved occupancy uses supported resident warps. The three percentages do not add to 100%.</desc>
