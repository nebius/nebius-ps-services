<rect x="36" y="252" width="47.6" height="13" rx="3" fill="#245880" stroke="#245880" stroke-width="1.5"/>
<text x="34" y="308" font-size="20" text-anchor="start" fill="#24343d" font-weight="400">Occupancy</text>
<text x="275" y="308" font-size="28" text-anchor="end" fill="#86500e" font-weight="700">50%</text>
