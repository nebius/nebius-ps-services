<svg viewBox="0 0 320 210" style="max-width: 380px; margin-inline: auto" role="img" aria-labelledby="tools-title tools-desc"><title id="tools-title">A measured optimization loop</title><desc id="tools-desc">Measure an unprofiled baseline; inspect with Systems, Compute and Grafana; change one variable; measure again and check correctness before keeping it.</desc><rect x="5" y="5" width="310" height="200" rx="10" fill="#edf3f7"/><g fill="#172b3a" font-size="15"><text x="20" y="35">Measure → inspect → predict</text><text x="20" y="70">↓ Change one variable</text><text x="20" y="105">↓ Measure again → check correctness</text><text x="20" y="140">↓ Explain the result</text></g><text x="20" y="170" fill="#172b3a" font-size="13">Profiler runs explain.</text><text x="20" y="190" fill="#172b3a" font-size="13">Unprofiled runs establish the outcome.</text></svg>
