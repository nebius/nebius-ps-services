<text x="441" y="268" font-size="20" text-anchor="middle" fill="#24343d" font-weight="400">wait_for_result</text>
<text x="20" y="363" font-size="20" text-anchor="start" fill="#206757" font-weight="700">GPU</text>
<rect x="127" y="338" width="171" height="51" rx="8" fill="#eef8f2" stroke="#206757" stroke-width="1.5"/>
<text x="212" y="371" font-size="20" text-anchor="middle" fill="#24343d" font-weight="400">Square</text>
<rect x="318" y="338" width="167" height="51" rx="8" fill="#eef8f2" stroke="#206757" stroke-width="1.5"/>
