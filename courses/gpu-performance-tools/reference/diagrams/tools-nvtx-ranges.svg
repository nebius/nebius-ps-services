<svg viewBox="0 0 600 455" role="img" aria-labelledby="tools-nvtx-ranges-title tools-nvtx-ranges-desc">
<title id="tools-nvtx-ranges-title">Names identify submission and completion</title>
<desc id="tools-nvtx-ranges-desc">Read left to right. Diamonds mark instants; boxes span intervals. The CPU ranges square, reduce and wait_for_result are nested inside step. GPU work can continue after its submission range ends. Blue dashed arrows link submissions to kernels; the amber arrow links GPU completion to the explicit wait returning before result_ready. Positions and widths are schematic, not measured durations.</desc>
<rect x="1" y="1" width="598" height="453" rx="16" fill="#ffffff" stroke="#c9d5dc" stroke-width="1.5"/>
<g font-family="Arial, sans-serif">
<line x1="24" y1="91" x2="576" y2="91" stroke="#dce5e9" stroke-width="1"/>
<text x="24" y="40" font-size="32" text-anchor="start" fill="#24343d" font-weight="700">NVTX annotations</text>
<text x="24" y="75" font-size="20" text-anchor="start" fill="#52626b" font-weight="400">Schematic order · time →</text>
<text x="24" y="115" font-size="18" text-anchor="start" fill="#245880" font-weight="400">input_ready</text>
<text x="576" y="115" font-size="18" text-anchor="end" fill="#245880" font-weight="400">result_ready</text>
<text x="210" y="151" font-size="18" text-anchor="middle" fill="#245880" font-weight="400">square_submitted</text>
<polygon points="84,170 91,177 84,184 77,177" fill="#245880"/>
