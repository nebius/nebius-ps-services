<text x="20" y="229" font-size="20" text-anchor="start" fill="#245880" font-weight="700">CPU</text>
<rect x="85" y="195" width="467" height="105" rx="8" fill="#f6f8fa" stroke="#aabcc6" stroke-width="1.5"/>
<text x="99" y="222" font-size="22" text-anchor="start" fill="#24343d" font-weight="700">step</text>
<rect x="95" y="237" width="102" height="49" rx="8" fill="#eef5fc" stroke="#245880" stroke-width="1.5"/>
<text x="146" y="268" font-size="20" text-anchor="middle" fill="#24343d" font-weight="400">square</text>
