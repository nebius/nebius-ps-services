<svg viewBox="0 0 600 392" role="img" aria-labelledby="tools-systems-timeline-title tools-systems-timeline-desc">
<title id="tools-systems-timeline-title">A kernel is only part of a request</title>
<desc id="tools-systems-timeline-desc">Read left to right in milliseconds. Rows separate CPU activity from GPU work and copies. The synthetic request contains 2 ms of preparation, 1 ms of input copy, 3 ms of kernel execution and 1 ms of output copy. In and Out label the input and output copies. The arrow connects a brief host launch to its GPU kernel; it does not measure duration.</desc>
