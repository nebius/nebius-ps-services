<line x1="200" y1="125" x2="230" y2="125"/>
<line x1="430" y1="125" x2="460" y2="125"/>
<line x1="660" y1="125" x2="690" y2="125"/>
<line x1="870" y1="125" x2="900" y2="125"/>
