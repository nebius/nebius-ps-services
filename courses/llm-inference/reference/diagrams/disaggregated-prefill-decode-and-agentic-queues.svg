<svg viewBox="0 0 1160 590" role="img" aria-labelledby="detail-disaggregated-prefill-decode-and-agentic-queues-queue-title detail-disaggregated-prefill-decode-and-agentic-queues-queue-desc">
<title id="detail-disaggregated-prefill-decode-and-agentic-queues-queue-title">Disaggregated prefill, decode, and agentic queues</title>
<desc id="detail-disaggregated-prefill-decode-and-agentic-queues-queue-desc">A request moves through admission, tokenization and prefill, optional KV transfer, decode, and streaming or completion. A validated tool call moves to an authority-controlled tool, and the untrusted result is formatted and tokenized before it re-enters prefill. No tool result bypasses tokenization or prefill to enter decode directly.</desc>
<defs>
<marker id="detail-disaggregated-prefill-decode-and-agentic-queues-queue-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0,0 L0,8 L8,4 z" fill="#245880"/>
</marker>
</defs>
<g fill="#fff" stroke="#245880" stroke-width="2">
