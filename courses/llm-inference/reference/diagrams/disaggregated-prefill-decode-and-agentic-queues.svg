<g class="diagram-small" fill="#52626b">
<text x="810" y="235">validated tool call</text>
<text x="255" y="226" text-anchor="end"><tspan x="255">new model round</tspan><tspan x="255" dy="20">begins at prefill</tspan></text>
</g>
<rect x="145" y="435" width="870" height="92" rx="12" fill="#fff" stroke="#dbe5e1"/>
<text x="580" y="468" text-anchor="middle" font-weight="700">Every stage has its own arrival rate, service rate, queue, and failure boundary</text>
<text x="580" y="498" text-anchor="middle" class="diagram-label">stability needs sustainable service rate above arrival rate, with headroom for length and tool variance</text>
<text x="580" y="565" text-anchor="middle" fill="#52626b">Tool output becomes model input only after application validation, formatting, tokenization, and a new prefill.</text>
</svg>
