<text x="110" y="154" class="diagram-label">request policy</text>
<text x="330" y="100" font-weight="700"><tspan x="330">tokenize</tspan><tspan x="330" dy="24">+ prefill</tspan></text>
<text x="330" y="154" class="diagram-label">prompt tokens/s</text>
<text x="560" y="100" font-weight="700"><tspan x="560">KV handoff</tspan><tspan x="560" dy="24">queue</tspan></text>
<text x="560" y="154" class="diagram-label">bytes/s + failures</text>
<text x="780" y="112" font-weight="700">decode pool</text>
<text x="780" y="146" class="diagram-label">output tokens/s</text>
<text x="1015" y="112" font-weight="700">stream / finish</text>
<text x="1015" y="146" class="diagram-label">user-visible result</text>
<text x="780" y="323" font-weight="700">tool execution</text>
<text x="780" y="357" class="diagram-label">schema · authority</text>
<text x="560" y="313" font-weight="700"><tspan x="560">untrusted tool</tspan><tspan x="560" dy="24">result</tspan></text>
<text x="560" y="362" class="diagram-label"><tspan x="560">validate output</tspan><tspan x="560" dy="20">boundary</tspan></text>
<text x="330" y="313" font-weight="700"><tspan x="330">format</tspan><tspan x="330" dy="24">+ tokenize</tspan></text>
<text x="330" y="367" class="diagram-label">append context IDs</text>
</g>
