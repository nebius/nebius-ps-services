<svg viewBox="0 0 400 915" style="max-width: 460px; margin-inline: auto" role="img" aria-labelledby="kv-tier-retention-title kv-tier-retention-desc">
<title id="kv-tier-retention-title">Choose reuse, restoration or recomputation</title>
<desc id="kv-tier-retention-desc">Follow the labeled branches from the top. A miss, expired entry or incompatible identity requires recomputation. A valid device-resident hit goes directly to reuse. A host or storage hit is restored only when its complete restoration cost is justified against recomputing prefill. Reuse covers only the matching prefix. Arrows show decisions, not physical storage links; retention and eviction are separate policies.</desc>
<defs><marker id="kv-tier-retention-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#206757"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#24343d">
<rect x="50" y="20" width="300" height="90" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="200" y="58.5" text-anchor="middle">Compatible entry</text>
<text x="200" y="85.5" text-anchor="middle">still retained and valid?</text>
<rect x="50" y="175" width="300" height="90" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="200" y="227" text-anchor="middle">Already in GPU memory?</text>
<rect x="50" y="330" width="300" height="90" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="200" y="368.5" text-anchor="middle">Restore cheaper</text>
<text x="200" y="395.5" text-anchor="middle">than recomputing?</text>
<rect x="50" y="485" width="300" height="90" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="200" y="523.5" text-anchor="middle">Restore from</text>
<text x="200" y="550.5" text-anchor="middle">host or storage</text>
<rect x="50" y="640" width="300" height="90" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="200" y="678.5" text-anchor="middle">Reuse the valid prefix</text>
<text x="200" y="705.5" text-anchor="middle">then process the rest</text>
<rect x="50" y="795" width="300" height="90" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="200" y="833.5" text-anchor="middle">Recompute the</text>
<text x="200" y="860.5" text-anchor="middle">missing prefix</text>
<path d="M200 114 V167" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#kv-tier-retention-arrow)"/>
<path d="M200 269 V322" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#kv-tier-retention-arrow)"/>
<path d="M200 424 V477" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#kv-tier-retention-arrow)"/>
<path d="M200 579 V632" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#kv-tier-retention-arrow)"/>
<path d="M350 65 H380 V840 H358" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#kv-tier-retention-arrow)"/>
<path d="M350 375 H380" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#kv-tier-retention-arrow)"/>
<path d="M50 220 H20 V685 H42" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#kv-tier-retention-arrow)"/>
<text x="225" y="148" text-anchor="middle" font-size="18">Yes</text>
<text x="225" y="302" text-anchor="middle" font-size="18">No</text>
<text x="225" y="458" text-anchor="middle" font-size="18">Yes</text>
<text x="366" y="48" text-anchor="middle" font-size="18">No</text>
<text x="365" y="355" text-anchor="middle" font-size="18">No</text>
<text x="25" y="198" text-anchor="middle" font-size="18">Yes</text>
</g>
</svg>
