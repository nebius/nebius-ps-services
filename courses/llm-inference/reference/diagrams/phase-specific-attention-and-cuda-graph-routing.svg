<svg viewBox="0 0 1200 570" role="img" aria-labelledby="detail-phase-specific-attention-and-cuda-graph-routing-attention-graph-title detail-phase-specific-attention-and-cuda-graph-routing-attention-graph-desc">
<title id="detail-phase-specific-attention-and-cuda-graph-routing-attention-graph-title">Phase-specific attention and CUDA Graph routing</title>
<desc id="detail-phase-specific-attention-and-cuda-graph-routing-attention-graph-desc">Prefill processes many prompt positions through an SDPA or engine API selecting a supported fused or math backend and writes key-value state. Decode processes one new position per active sequence through a selected decode backend; paged KV is an engine example, not a universal requirement. The scheduler sends stable shape and address buckets to a captured CUDA Graph and unmatched work to a fallback path.</desc>
