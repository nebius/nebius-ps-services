<rect x="680" y="120" width="215" height="110" rx="9" fill="#fff" stroke="#206757"/>
<rect x="920" y="120" width="225" height="110" rx="9" fill="#fff" stroke="#206757"/>
<text x="787" y="154" font-weight="700">one new position</text>
<text x="787" y="181" class="diagram-label">per active sequence</text>
<text x="1032" y="151" font-weight="700"><tspan x="1032">decode backend</tspan><tspan x="1032" dy="22"> (engine example)</tspan></text>
<text x="1032" y="207" class="diagram-label">may use paged KV blocks</text>
<text x="290" y="266" class="diagram-label">write prompt K,V and produce first-token logits</text>
<text x="910" y="266" class="diagram-label">read growing history and produce next-token logits</text>
