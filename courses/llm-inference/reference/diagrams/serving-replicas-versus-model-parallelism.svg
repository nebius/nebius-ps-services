<svg viewBox="0 0 1100 500" role="img" aria-labelledby="detail-serving-replicas-versus-model-parallelism-parallel-title detail-serving-replicas-versus-model-parallelism-parallel-desc">
<title id="detail-serving-replicas-versus-model-parallelism-parallel-title">Serving replicas versus model parallelism</title>
<desc id="detail-serving-replicas-versus-model-parallelism-parallel-desc">The data-parallel side shows a request router assigning independent requests to two full-model replicas with no per-request cross-rank synchronization. The model-parallel side shows one request traversing two model partitions and adding inter-node communication to its critical path.</desc>
<defs>
<marker id="detail-serving-replicas-versus-model-parallelism-parallel-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
<path d="M0,0 L0,8 L8,4 z" fill="#245880"/>
</marker>
</defs>
<g font-weight="700" text-anchor="middle">
<text x="270" y="42">serving data parallel</text>
<text x="825" y="42">model parallel</text>
<rect x="25" y="70" width="490" height="340" rx="16" fill="#eef5fc" stroke="#245880"/>
<rect x="585" y="70" width="490" height="340" rx="16" fill="#f7f2fb" stroke="#654886"/>
<rect x="175" y="100" width="190" height="65" rx="9" fill="#fff" stroke="#245880"/>
<text x="270" y="140">request router</text>
<rect x="75" y="245" width="150" height="110" rx="10" fill="#e0edfa"/>
<text x="150" y="292">full model</text>
<text x="150" y="318">replica 0</text>
<rect x="315" y="245" width="150" height="110" rx="10" fill="#e0edfa"/>
<text x="390" y="292">full model</text>
<text x="390" y="318">replica 1</text>
<rect x="620" y="205" width="170" height="120" rx="10" fill="#eee5f5"/>
<text x="705" y="255">partition A</text>
<text x="705" y="282">rank 0</text>
<rect x="870" y="205" width="170" height="120" rx="10" fill="#eee5f5"/>
<text x="955" y="255">partition B</text>
<text x="955" y="282">rank 1</text>
</g>
<g fill="none" stroke="#245880" stroke-width="3" marker-end="url(#detail-serving-replicas-versus-model-parallelism-parallel-arr)">
<path d="M230 165 V205 H150 V245"/>
<path d="M310 165 V205 H390 V245"/>
<line x1="790" y1="265" x2="870" y2="265"/>
</g>
<g text-anchor="middle" fill="#52626b">
<text x="270" y="379" class="diagram-label"><tspan x="270">independent request paths;</tspan><tspan x="270" dy="21">each replica owns weights and KV state</tspan></text>
<text x="830" y="355" class="diagram-label">one request depends on a cross-rank edge</text>
<text x="550" y="465">Choose the state placement and communication pattern that serves the measured objective.</text>
