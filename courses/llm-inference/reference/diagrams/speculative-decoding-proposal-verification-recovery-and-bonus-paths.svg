<text x="410" y="135" class="diagram-label">draft / ngram / MTP</text>
<text x="690" y="84" font-weight="700"><tspan x="690">evaluate k</tspan><tspan x="690" dy="24">proposals</tspan></text>
<text x="690" y="130" class="diagram-small"><tspan x="690">possible next-position</tspan><tspan x="690" dy="18">distribution for an</tspan><tspan x="690" dy="18">algorithm-specific bonus</tspan></text>
