<svg viewBox="0 0 1160 500" role="img" aria-labelledby="detail-speculative-decoding-proposal-verification-recovery-and-bonus-paths-spec-title detail-speculative-decoding-proposal-verification-recovery-and-bonus-paths-spec-desc">
<title id="detail-speculative-decoding-proposal-verification-recovery-and-bonus-paths-spec-title">Speculative decoding proposal, verification, recovery, and bonus paths</title>
<desc id="detail-speculative-decoding-proposal-verification-recovery-and-bonus-paths-spec-desc">A cheaper proposer drafts several tokens. The target evaluates proposed positions under the selected acceptance rule. Commit the accepted prefix; recover at the first rejection or, if the algorithm allows, sample a bonus after full acceptance. Stochastic acceptance is not simple token equality; stop rules also apply.</desc>
<defs>
<marker id="detail-speculative-decoding-proposal-verification-recovery-and-bonus-paths-spec-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto">
