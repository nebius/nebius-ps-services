<svg viewBox="0 0 1120 590" role="img" aria-labelledby="detail-two-node-serving-communication-by-parallelism-type-parallel-detail-title detail-two-node-serving-communication-by-parallelism-type-parallel-detail-desc">
<title id="detail-two-node-serving-communication-by-parallelism-type-parallel-detail-title">Two-node serving communication by parallelism type</title>
<desc id="detail-two-node-serving-communication-by-parallelism-type-parallel-detail-desc">Serving data parallel has two full-model replicas handling independent requests and no mandatory edge between ranks. Tensor parallel uses bidirectional collectives inside layers. Pipeline parallel sends activations forward from early to later layers. Expert parallel dispatches tokens to expert owners and combines results through bidirectional all-to-all traffic.</desc>
