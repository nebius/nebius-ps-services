<marker id="detail-two-node-serving-communication-by-parallelism-type-parallel-detail-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
