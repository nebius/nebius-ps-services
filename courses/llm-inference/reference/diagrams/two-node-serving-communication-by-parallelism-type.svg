<text x="850" y="188">rank 1: matrix/head shard</text>
<text x="850" y="214" class="diagram-label">inside each layer</text>
<text x="270" y="318">rank 0: early layers</text>
<text x="270" y="344" class="diagram-label">pipeline stage 0</text>
<text x="850" y="318">rank 1: later layers</text>
