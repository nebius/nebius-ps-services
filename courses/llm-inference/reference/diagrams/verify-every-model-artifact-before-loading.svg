<text x="140" y="455" font-weight="700">CPU staging</text>
<text x="140" y="481" class="diagram-label">read and map files</text>
<text x="370" y="455" font-weight="700">Load on GPU</text>
<text x="370" y="481" class="diagram-label">weights + buffers</text>
<text x="600" y="455" font-weight="700">warm / compile</text>
<text x="600" y="481" class="diagram-label">separate cold cost</text>
<text x="830" y="455" font-weight="700">ready</text>
<text x="830" y="481" class="diagram-label">health + capacity</text>
<text x="1060" y="455" font-weight="700">serve</text>
<text x="1060" y="481" class="diagram-label">request lifecycle</text>
