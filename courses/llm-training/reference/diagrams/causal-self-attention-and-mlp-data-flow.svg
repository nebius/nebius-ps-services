<svg viewBox="0 0 1200 650" role="img" aria-labelledby="detail-causal-self-attention-and-mlp-data-flow-attention-block-title detail-causal-self-attention-and-mlp-data-flow-attention-block-desc">
<title id="detail-causal-self-attention-and-mlp-data-flow-attention-block-title">Causal self-attention and MLP data flow</title>
<desc id="detail-causal-self-attention-and-mlp-data-flow-attention-block-desc">Input x feeds normalization and the first residual bypass. Normalized states form Q, K and V. Scaled QK scores receive a causal mask before softmax, then probability weights mix V and the output projection restores the hidden width. Adding x forms y. Normalization and a position-wise MLP transform y; adding the bypassed y produces the block output.</desc>
<defs><marker id="detail-causal-self-attention-and-mlp-data-flow-attention-block-title-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#245880"/></marker></defs>
<rect x="20" y="60" width="170" height="85" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="105" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Hidden state x</text>
<text x="105" y="120.5" text-anchor="middle" font-size="16">[B,T,H]</text>
<rect x="220" y="60" width="120" height="85" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="280" y="108.5" text-anchor="middle" font-size="18" font-weight="700">Norm</text>
<rect x="380" y="30" width="150" height="55" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="455" y="63.5" text-anchor="middle" font-size="18" font-weight="700">Q: queries</text>
<rect x="380" y="105" width="150" height="55" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="455" y="138.5" text-anchor="middle" font-size="18" font-weight="700">K: keys</text>
<rect x="380" y="180" width="150" height="55" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="455" y="213.5" text-anchor="middle" font-size="18" font-weight="700">V: values</text>
<rect x="580" y="60" width="185" height="100" rx="10" fill="#fff7e7" stroke="#245880"/>
<text x="672.5" y="92" text-anchor="middle" font-size="18" font-weight="700">Scaled QKᵀ</text>
<text x="672.5" y="116" text-anchor="middle" font-size="16">Causal mask</text>
<text x="672.5" y="140" text-anchor="middle" font-size="16">Then softmax</text>
<rect x="820" y="60" width="320" height="100" rx="10" fill="#eef8f2" stroke="#245880"/>
<text x="980" y="92" text-anchor="middle" font-size="18" font-weight="700">Attention output</text>
<text x="980" y="116" text-anchor="middle" font-size="16">Weights × V → output projection</text>
<text x="980" y="140" text-anchor="middle" font-size="16">[B,T,H]</text>
