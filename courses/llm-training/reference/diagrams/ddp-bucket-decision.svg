<svg viewBox="0 0 360 560" style="max-width: 420px; margin-inline: auto" role="img" aria-labelledby="ddp-bucket-decision-title ddp-bucket-decision-desc">
<title id="ddp-bucket-decision-title">Observe DDP before choosing a hook</title>
<desc id="ddp-bucket-decision-desc">A ready bucket can communicate during independent backward work. Smaller buckets may start sooner but add collective calls. Lossy hooks also need task-quality evidence. Arrows show the dependency within one bucket.</desc>
<defs><marker id="ddp-bucket-decision-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#206757"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24343d">
<rect x="14" y="12" width="332" height="103" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="180" y="56" text-anchor="middle">Backward makes</text>
<text x="180" y="85" text-anchor="middle">gradients ready</text>
<path d="M180 116 V148" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#ddp-bucket-decision-arrow)"/>
<rect x="14" y="151" width="332" height="103" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="180" y="195" text-anchor="middle">DDP groups them;</text>
<text x="180" y="224" text-anchor="middle">observe bucket bytes</text>
<path d="M180 255 V287" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#ddp-bucket-decision-arrow)"/>
<rect x="14" y="290" width="332" height="103" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2"/>
<text x="180" y="334" text-anchor="middle">Hook reduces or</text>
<text x="180" y="363" text-anchor="middle">approximates gradients</text>
<path d="M180 394 V426" fill="none" stroke="#206757" stroke-width="2" marker-end="url(#ddp-bucket-decision-arrow)"/>
<rect x="14" y="429" width="332" height="103" rx="12" fill="#eef8f2" stroke="#245880" stroke-width="2"/>
<text x="180" y="473" text-anchor="middle">SGD waits; check</text>
<text x="180" y="502" text-anchor="middle">update and trajectory</text>
</g>
</svg>
