<svg viewBox="0 0 1200 640" role="img" aria-labelledby="detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-desc">
<title id="detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title">Decoder-only language model from token IDs to logits</title>
<desc id="detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-desc">Token IDs select embeddings. Position information is used by the model, including within attention for RoPE. N decoder blocks with distinct weights preserve hidden width; final normalization and the language-model head produce vocabulary logits. In a pre-normalized block, y=x+Attention(Norm(x)), then output=y+MLP(Norm(y)). Each residual addition has both the transformed branch and the incoming residual as inputs.</desc>
<defs><marker id="detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#245880"/></marker></defs>
<rect x="25" y="55" width="140" height="90" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="95" y="94" text-anchor="middle" font-size="18" font-weight="700">Token IDs</text>
<text x="95" y="118" text-anchor="middle" font-size="16">[B,T]</text>
<rect x="205" y="55" width="170" height="90" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="290" y="94" text-anchor="middle" font-size="18" font-weight="700">Embeddings</text>
<text x="290" y="118" text-anchor="middle" font-size="16">[B,T,H]</text>
<rect x="415" y="55" width="210" height="90" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="520" y="82" text-anchor="middle" font-size="18" font-weight="700">N decoder blocks</text>
<text x="520" y="106" text-anchor="middle" font-size="16">Position-aware attention</text>
<text x="520" y="130" text-anchor="middle" font-size="16">Distinct block weights</text>
<rect x="675" y="55" width="155" height="90" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="752.5" y="94" text-anchor="middle" font-size="18" font-weight="700">Final norm</text>
<text x="752.5" y="118" text-anchor="middle" font-size="16">[B,T,H]</text>
<rect x="880" y="55" width="260" height="90" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="1010" y="94" text-anchor="middle" font-size="18" font-weight="700">LM head</text>
<text x="1010" y="118" text-anchor="middle" font-size="16">Vocabulary logits [B,T,V]</text>
<path d="M165 100 H205" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M375 100 H415" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M625 100 H675" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M830 100 H880" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<text x="600" y="193" text-anchor="middle" font-size="16" fill="#52626b">Position handling is architecture-specific: RoPE acts on attention coordinates, not by adding a token.</text>
<rect x="30" y="230" width="1140" height="315" rx="15" fill="#f7f9f7" stroke="#245880"/>
<text x="600" y="258" text-anchor="middle" font-size="16" fill="#52626b">Inside one pre-normalized decoder block</text>
<rect x="120" y="330" width="105" height="75" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="172.5" y="373.5" text-anchor="middle" font-size="18" font-weight="700">Norm</text>
<rect x="260" y="320" width="190" height="100" rx="10" fill="#eef8f2" stroke="#245880"/>
<text x="355" y="350" text-anchor="middle" font-size="18" font-weight="700">Causal attention</text>
<text x="355" y="379" text-anchor="middle" font-size="16"><tspan x="355">Plus output</tspan><tspan x="355" dy="22">projection</tspan></text>
<rect x="490" y="330" width="105" height="75" rx="10" fill="#fff7e7" stroke="#245880"/>
<text x="542.5" y="373.5" text-anchor="middle" font-size="18" font-weight="700">Add x</text>
<rect x="645" y="330" width="105" height="75" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="697.5" y="373.5" text-anchor="middle" font-size="18" font-weight="700">Norm</text>
<rect x="795" y="330" width="145" height="75" rx="10" fill="#eef8f2" stroke="#245880"/>
<text x="867.5" y="361.5" text-anchor="middle" font-size="18" font-weight="700">MLP</text>
<text x="867.5" y="385.5" text-anchor="middle" font-size="16">Per position</text>
<rect x="1000" y="330" width="105" height="75" rx="10" fill="#fff7e7" stroke="#245880"/>
<text x="1052.5" y="373.5" text-anchor="middle" font-size="18" font-weight="700">Add y</text>
<path d="M70 367 H120" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M225 367 H260" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M450 367 H490" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M595 367 H645" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M750 367 H795" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M940 367 H1000" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M1105 367 H1140" fill="none" stroke="#245880" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<path d="M90 367 V295 H542 V330" fill="none" stroke="#86500e" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<text x="315" y="285" text-anchor="middle" font-size="16" fill="#52626b">x: incoming hidden state</text>
<path d="M620 367 V465 H1052 V405" fill="none" stroke="#86500e" stroke-width="2.5" marker-end="url(#detail-decoder-only-language-model-from-token-ids-to-logits-decoder-stack-title-flow)"/>
<text x="835" y="490" text-anchor="middle" font-size="16" fill="#52626b">y: first residual result</text>
<text x="600" y="526" text-anchor="middle" font-size="16" fill="#52626b">y = x + Attention(Norm(x)); output = y + MLP(Norm(y))</text>
<text x="600" y="600" text-anchor="middle" font-size="16" fill="#52626b">Training uses many positions for loss; generation selects the newest position's output distribution.</text>
</svg>
