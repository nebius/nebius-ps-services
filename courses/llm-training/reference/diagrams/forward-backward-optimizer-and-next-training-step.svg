<text x="715" y="105.5" text-anchor="middle" font-size="16">[B,T,V]</text>
<rect x="895" y="40" width="220" height="95" rx="10" fill="#fff7e7" stroke="#245880"/>
<text x="1005" y="81.5" text-anchor="middle" font-size="18" font-weight="700">Loss</text>
<text x="1005" y="105.5" text-anchor="middle" font-size="16">Valid-token normalization</text>
<rect x="330" y="200" width="220" height="95" rx="10" fill="#eef5fc" stroke="#245880"/>
<text x="440" y="241.5" text-anchor="middle" font-size="18" font-weight="700">Parameters θ</text>
