<svg viewBox="0 0 1200 650" role="img" aria-labelledby="detail-forward-backward-optimizer-and-next-training-step-training-step-title detail-forward-backward-optimizer-and-next-training-step-training-step-desc">
<title id="detail-forward-backward-optimizer-and-next-training-step-training-step-title">Forward, backward, optimizer, and next training step</title>
<desc id="detail-forward-backward-optimizer-and-next-training-step-training-step-desc">Batch IDs, attention metadata, and current parameters are separate inputs to the forward pass. The loss calculation takes logits, target labels and loss masks as inputs. Backward uses loss and the forward graph to accumulate gradients. The optimizer reads the current parameters, gradients, moment state and learning rate. Updated parameters become next-step parameters; clear gradients before the next accumulation window.</desc>
<defs><marker id="detail-forward-backward-optimizer-and-next-training-step-training-step-title-flow" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#245880"/></marker></defs>
