<svg viewBox="0 0 1200 560" role="img" aria-labelledby="detail-llm-training-lifecycle-train-life-title detail-llm-training-lifecycle-train-life-desc">
<title id="detail-llm-training-lifecycle-train-life-title">LLM training lifecycle</title>
<desc id="detail-llm-training-lifecycle-train-life-desc">Data is curated and tokenized, a model runs forward to logits and loss, backward computes gradients, an optimizer updates trainable parameters, and evaluation plus checkpoints govern repeated training. Pretraining, supervised fine-tuning, and reward-based post-training use different data and objectives.</desc>
<defs>
<marker id="detail-llm-training-lifecycle-train-life-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" orient="auto">
<path d="M0,0 L0,8 L8,4 z" fill="#245880"/>
</marker>
</defs>
<g text-anchor="middle">
<rect x="35" y="85" width="155" height="80" rx="10" fill="#eef5fc" stroke="#245880"/>
<rect x="235" y="85" width="155" height="80" rx="10" fill="#eef5fc" stroke="#245880"/>
<rect x="435" y="85" width="155" height="80" rx="10" fill="#e0f0e6" stroke="#206757"/>
<rect x="635" y="85" width="155" height="80" rx="10" fill="#e0f0e6" stroke="#206757"/>
<rect x="835" y="85" width="155" height="80" rx="10" fill="#fff7e7" stroke="#86500e"/>
<rect x="1035" y="85" width="130" height="80" rx="10" fill="#eee5f5" stroke="#654886"/>
<text x="112" y="116" font-weight="700">curate data</text>
<text x="112" y="142" class="diagram-label">split + govern</text>
<text x="312" y="116" font-weight="700">tokenize</text>
<text x="312" y="142" class="diagram-label">IDs + masks</text>
<text x="512" y="116" font-weight="700">forward</text>
<text x="512" y="142" class="diagram-label">logits + loss</text>
<text x="712" y="116" font-weight="700">backward</text>
<text x="712" y="142" class="diagram-label">gradients</text>
<text x="912" y="116" font-weight="700">optimizer</text>
<text x="912" y="142" class="diagram-label">parameter update</text>
<text x="1100" y="116" font-weight="700">evaluate</text>
<text x="1100" y="142" class="diagram-label">save / decide</text>
</g>
<g stroke="#245880" stroke-width="3" marker-end="url(#detail-llm-training-lifecycle-train-life-arr)">
<line x1="190" y1="125" x2="235" y2="125"/>
<line x1="390" y1="125" x2="435" y2="125"/>
<line x1="590" y1="125" x2="635" y2="125"/>
<line x1="790" y1="125" x2="835" y2="125"/>
<line x1="990" y1="125" x2="1035" y2="125"/>
<path d="M1100 165 V220 H512 V165" fill="none"/>
</g>
<text x="805" y="210" text-anchor="middle" class="diagram-label">repeat with new batches; resume from complete checkpoint state</text>
<g text-anchor="middle">
<rect x="70" y="310" width="310" height="150" rx="12" fill="#eef5fc" stroke="#245880"/>
<rect x="445" y="310" width="310" height="150" rx="12" fill="#e0f0e6" stroke="#206757"/>
<rect x="820" y="310" width="310" height="150" rx="12" fill="#fff7e7" stroke="#86500e"/>
<text x="225" y="339" font-weight="700"><tspan x="225">pretraining /</tspan><tspan x="225" dy="24">continued pretraining</tspan></text>
<text x="225" y="391" class="diagram-label">large unlabeled or domain corpus</text>
<text x="225" y="416" class="diagram-label">next-token objective</text>
<text x="225" y="441" class="diagram-label">broad capability or domain adaptation</text>
<text x="600" y="345" font-weight="700">SFT / LoRA</text>
<text x="600" y="391" class="diagram-label">curated demonstrations</text>
<text x="600" y="416" class="diagram-label">selected-token supervised loss</text>
<text x="600" y="441" class="diagram-label">full or adapter-only updates</text>
<text x="975" y="339" font-weight="700"><tspan x="975">preference / reward</tspan><tspan x="975" dy="24">post-training</tspan></text>
<text x="975" y="391" class="diagram-label">candidate generation + scoring</text>
<text x="975" y="416" class="diagram-label">policy objective + constraints</text>
<text x="975" y="441" class="diagram-label">quality and stability gates</text>
</g>
<text x="600" y="525" text-anchor="middle" fill="#52626b">Each stage changes the data contract, objective, trainable state, evaluation, and performance profile.</text>
</svg>
