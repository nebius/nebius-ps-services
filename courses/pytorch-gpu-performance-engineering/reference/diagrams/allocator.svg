<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="pt-allocator-title pt-allocator-desc" style="max-width: 400px; margin-inline: auto">
  <title id="pt-allocator-title">GPU memory moves between live use and cached reuse</title>
  <desc id="pt-allocator-desc">Reserved memory contains live allocations and cached blocks. Unneeded storage becomes reusable; a new tensor can use a suitable cached block. The arrows show reuse, not data copies. Other GPU allocations can exist outside this schematic pool.</desc>
  <defs>
    <marker id="pt-allocator-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#24343d" text-anchor="middle">
    <rect x="8" y="12" width="304" height="426" rx="12" fill="#f7f9f7" stroke="#24343d" stroke-width="2" />
    <text x="160" y="48" font-size="22">Reserved pool</text>
    <rect x="24" y="70" width="272" height="90" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="160" y="106" font-size="22" fill="#206757">Allocated</text>
    <text x="160" y="138">Live tensor storage</text>
    <g fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-allocator-arrow)">
      <path d="M87 170 V305" />
      <path d="M233 305 V170" />
    </g>
    <rect x="30" y="207" width="114" height="64" fill="#f7f9f7" />
    <rect x="170" y="207" width="126" height="64" fill="#f7f9f7" />
    <text x="87" y="230">No longer</text>
    <text x="87" y="259">needed</text>
    <text x="233" y="230">New tensor</text>
    <text x="233" y="259">requested</text>
    <rect x="24" y="318" width="272" height="94" rx="12" fill="#fff7e7" stroke="#86500e" stroke-width="2" />
    <text x="160" y="355" font-size="22" fill="#86500e">Cached blocks</text>
    <text x="160" y="389">Free storage to reuse</text>
    <text x="160" y="475">Other GPU allocations</text>
    <text x="160" y="506">can exist outside this pool</text>
  </g>
</svg>
