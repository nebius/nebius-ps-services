<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 504.0" role="img" aria-labelledby="pt-autograd-title pt-autograd-desc" style="max-width: 360px; margin-inline: auto">
  <title id="pt-autograd-title">Forward values lead to gradients and an update</title>
  <desc id="pt-autograd-desc">With w equal to 2, the prediction is 6 and squared loss is 4. Backward computes gradient 12. An SGD update with learning rate 0.1 changes w to 0.8.</desc>
  <defs>
    <marker id="pt-autograd-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" transform="translate(0 74)">
    <rect x="16" y="10" width="288" height="82" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="160" y="41" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>FORWARD</tspan></text>
    <text x="160" y="72" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>w = 2 → prediction = 6</tspan></text>
    <path d="M160 99 V129" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-autograd-arrow)" />
    <rect x="16" y="141" width="288" height="82" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="160" y="172" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>LOSS</tspan></text>
    <text x="160" y="203" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>(6 − 4)² = 4</tspan></text>
    <path d="M160 230 V260" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-autograd-arrow)" />
    <rect x="16" y="272" width="288" height="82" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="160" y="303" font-size="22.0" font-weight="400" fill="#206757" text-anchor="middle"><tspan>BACKWARD</tspan></text>
    <text x="160" y="334" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>gradient of loss: dw = 12</tspan></text>
    <text x="160" y="404" font-size="21.0" font-weight="400" fill="#206757" text-anchor="middle"><tspan>UPDATE: 2 − 0.1 × 12 = 0.8</tspan></text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="160" y="24" font-size="20" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>All tensors: </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">shape</tspan><tspan> []</tspan></text>
    <text x="160" y="54" font-size="20" font-weight="400" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">dtype</tspan><tspan>: FP32 · </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">device</tspan><tspan>: CPU</tspan></text>
  </g>
</svg>
