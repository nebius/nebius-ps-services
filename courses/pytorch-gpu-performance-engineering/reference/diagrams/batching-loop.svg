<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="pt-batching-loop-title pt-batching-loop-desc" style="max-width: 360px; margin-inline: auto">
<title id="pt-batching-loop-title">Compute each sample, then collect the results</title>
<desc id="pt-batching-loop-desc">Three separate two-feature inputs are processed one at a time in a Python loop. Each row is multiplied by two and then increased by one. Stack only the completed outputs into a three-by-two result.</desc>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect x="12" y="12" width="296" height="88" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
<text x="160" y="43" font-size="20" fill="#24343d" text-anchor="middle">Three samples, each [2]</text>
<text x="160" y="77" font-size="19" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">[1, 2]  [3, 4]  [5, 6]</text>
<path d="M160 107 V136 m-6 -8 l6 8 l6 -8" stroke="#206757" stroke-width="2" fill="none" />
<rect x="12" y="148" width="296" height="178" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
<text x="160" y="179" font-size="19" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">Repeat row * 2 + 1</text>
<text x="160" y="216" font-size="20" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">[1, 2] → [3, 5]</text>
<text x="160" y="256" font-size="20" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">[3, 4] → [7, 9]</text>
<text x="160" y="296" font-size="20" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">[5, 6] → [11, 13]</text>
<path d="M160 332 V354 m-6 -8 l6 8 l6 -8" stroke="#206757" stroke-width="2" fill="none" />
<text x="160" y="377" font-size="20" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">torch.stack</tspan><tspan font-family="ui-monospace, monospace">(rows)</tspan></text>
<rect x="12" y="392" width="296" height="116" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
<text x="160" y="418" font-size="20" fill="#24343d" text-anchor="middle">Output [3, 2]</text>
<text x="160" y="445" font-size="20" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">[ 3,  5]</text>
<text x="160" y="471" font-size="20" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">[ 7,  9]</text>
<text x="160" y="497" font-size="20" fill="#24343d" text-anchor="middle" font-family="ui-monospace, monospace">[11, 13]</text>
</g>
</svg>
