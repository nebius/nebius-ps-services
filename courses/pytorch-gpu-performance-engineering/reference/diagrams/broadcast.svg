    <rect x="184" y="256" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="208.0" y="287.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>33</tspan></text>
    <rect x="88" y="304" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
