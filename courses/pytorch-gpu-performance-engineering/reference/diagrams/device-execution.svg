<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" role="img" aria-labelledby="pt-device-execution-title pt-device-execution-desc" style="max-width: 520px; margin-inline: auto">
  <title id="pt-device-execution-title">A scalar comes back; the tensor stays on the GPU</title>
  <desc id="pt-device-execution-desc">The input copy goes from CPU memory to GPU memory. Multiplication and summation produce a GPU scalar tensor. The return arrow copies its value into a Python float for printing; total remains in GPU memory. Arrows show data flow, not elapsed time.</desc>
  <defs>
    <marker id="pt-device-execution-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#24343d" text-anchor="middle">
    <text x="74" y="32" fill="#245880">CPU memory</text>
    <text x="292" y="32" fill="#206757">GPU memory</text>
    <rect x="8" y="68" width="132" height="98" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <rect x="232" y="52" width="120" height="458" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="74" y="105" font-family="ui-monospace, monospace">cpu_x</text>
    <text x="74" y="140" font-family="ui-monospace, monospace">[1, 2, 3]</text>
    <text x="292" y="105" font-family="ui-monospace, monospace">x</text>
    <text x="292" y="140" font-family="ui-monospace, monospace">[1, 2, 3]</text>
    <path d="M140 123 H228" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-device-execution-arrow)" />
    <text x="186" y="99" font-family="ui-monospace, monospace" font-weight="700">.to()</text>
    <path d="M292 160 V210" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-device-execution-arrow)" />
    <text x="329" y="191">× 2</text>
    <text x="292" y="244" font-family="ui-monospace, monospace">y</text>
    <text x="292" y="277" font-family="ui-monospace, monospace">[2, 4, 6]</text>
    <text x="292" y="315" font-family="ui-monospace, monospace" font-weight="700">.sum()</text>
    <path d="M292 331 V358" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-device-execution-arrow)" />
    <text x="292" y="379" font-family="ui-monospace, monospace">total</text>
    <text x="292" y="414" font-family="ui-monospace, monospace">12.0</text>
    <rect x="8" y="352" width="132" height="88" rx="12" fill="#fff7e7" stroke="#86500e" stroke-width="2" />
    <text x="74" y="383" fill="#86500e">Python float</text>
    <text x="74" y="416" font-family="ui-monospace, monospace">12.0</text>
    <path d="M232 414 H142" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-device-execution-arrow)" />
    <text x="186" y="387" font-family="ui-monospace, monospace" font-weight="700">.item()</text>
    <path d="M74 446 V483" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-device-execution-arrow)" />
    <text x="74" y="516" font-family="ui-monospace, monospace">print(12.0)</text>
    <text x="292" y="461" font-family="ui-monospace, monospace">total</text>
    <text x="292" y="490">stays here</text>
  </g>
</svg>
