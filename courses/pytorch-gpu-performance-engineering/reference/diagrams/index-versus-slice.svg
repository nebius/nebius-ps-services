<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" role="img" aria-labelledby="pt-index-versus-slice-title pt-index-versus-slice-desc" style="max-width: 360px; margin-inline: auto">
  <title id="pt-index-versus-slice-title">One grid and a group containing one grid</title>
  <desc id="pt-index-versus-slice-desc">Two arrows start at x. The first leads to x[0], a grid with shape [3, 4]. The second leads to x[0:1], a group of one grid with shape [1, 3, 4]. Both selections contain the same twelve values from the first grid.</desc>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" text-anchor="middle">
    <text x="166" y="28" fill="#24343d"><tspan font-family="ui-monospace, monospace" font-weight="700">dtype</tspan>: int64 · <tspan font-family="ui-monospace, monospace" font-weight="700">device</tspan>: CPU</text>
    <rect x="28" y="48" width="276" height="52" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="166" y="80" fill="#245880">x · <tspan font-family="ui-monospace, monospace" font-weight="700">shape</tspan>: [2, 3, 4]</text>
    <path d="M166 100 V140 m-6 -8 l6 8 l6 -8" stroke="#245880" stroke-width="2" fill="none" />
    <path d="M166 118 H10 V322 H28 m-8 -6 l8 6 l-8 6" stroke="#206757" stroke-width="2" fill="none" />
    <rect x="28" y="140" width="276" height="104" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="166" y="170" fill="#245880">x[0] · one grid</text>
    <text x="166" y="200" fill="#24343d"><tspan font-family="ui-monospace, monospace" font-weight="700">shape</tspan>: [3, 4]</text>
    <text x="166" y="228" fill="#24343d">3 rows, 4 columns</text>
    <rect x="28" y="274" width="276" height="104" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="166" y="304" fill="#206757">x[0:1] · a group of one grid</text>
    <text x="166" y="334" fill="#24343d"><tspan font-family="ui-monospace, monospace" font-weight="700">shape</tspan>: [1, 3, 4]</text>
    <text x="166" y="362" fill="#24343d">1 grid, 3 rows, 4 columns</text>
    <text x="160" y="426" fill="#24343d">Both select the first 12 values</text>
  </g>
</svg>
