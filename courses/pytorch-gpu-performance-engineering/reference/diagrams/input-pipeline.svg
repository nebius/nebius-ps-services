<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 510.0" role="img" aria-labelledby="pt-input-pipeline-title pt-input-pipeline-desc" style="max-width: 360px; margin-inline: auto">
  <title id="pt-input-pipeline-title">A batch crosses preparation, copy and compute</title>
  <desc id="pt-input-pipeline-desc">Python prepares a CPU batch; a host-to-device copy moves it to GPU memory; a model consumes it. The model uses the batch after its copy completes.</desc>
  <defs>
    <marker id="pt-input-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" transform="translate(0 104)">
    <rect x="16" y="12" width="288" height="82" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="160" y="43" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>CPU: prepare</tspan></text>
    <text x="160" y="74" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>Make a batch: [2, 4]</tspan></text>
    <path d="M160 101 V139" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-input-pipeline-arrow)" />
    <rect x="16" y="151" width="288" height="82" rx="12" fill="#fff7e7" stroke="#86500e" stroke-width="2" />
    <text x="160" y="182" font-size="22.0" font-weight="400" fill="#86500e" text-anchor="middle"><tspan>H2D: copy</tspan></text>
    <text x="160" y="213" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>CPU memory → GPU memory</tspan></text>
    <path d="M160 240 V278" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-input-pipeline-arrow)" />
    <rect x="16" y="290" width="288" height="82" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="160" y="321" font-size="22.0" font-weight="400" fill="#206757" text-anchor="middle"><tspan>GPU: compute</tspan></text>
    <text x="160" y="352" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>Model uses the copied batch</tspan></text>
    <text x="160" y="399" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>Each stage has its own cost</tspan></text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="160" y="24" font-size="20" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>Batch </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">shape</tspan><tspan>: [2, 4]</tspan></text><text x="160" y="54" font-size="20" font-weight="400" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">dtype</tspan><tspan>: FP32</tspan></text><text x="160" y="84" font-size="20" font-weight="400" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">device</tspan><tspan>: CPU → CUDA</tspan></text></g>
</svg>
