<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 704" role="img" aria-labelledby="pt-module-shapes-title pt-module-shapes-desc" style="max-width: 520px; margin-inline: auto">
  <title id="pt-module-shapes-title">One network, two views: neurons and tensor shapes</title>
  <desc id="pt-module-shapes-desc">Read both views from top to bottom. On the left, four input features connect to two hidden neurons, then one output neuron. Connections represent learned weights; each neuron also has a bias, omitted from the drawing. Hidden circles represent values after ReLU. On the right, the same network processes all six vectors: [2, 3, 4] becomes [2, 3, 2], ReLU keeps that shape, and the output layer produces [2, 3, 1].</desc>
  <defs>
    <marker id="pt-module-shapes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#24343d" text-anchor="middle">
    <text x="86" y="28">One vector</text>
    <text x="274" y="28">Tensor shapes</text>
    <line x1="180" y1="44" x2="180" y2="621" stroke="#dce6e2" stroke-width="1.5" />
    <text x="86" y="76" fill="#245880">Input layer</text>
    <text x="86" y="106">4 features</text>
    <g stroke="#739e94" stroke-width="1.7" fill="none">
      <path d="M26 137 L56 247 M26 137 L116 247" />
      <path d="M66 137 L56 247 M66 137 L116 247" />
      <path d="M106 137 L56 247 M106 137 L116 247" />
      <path d="M146 137 L56 247 M146 137 L116 247" />
      <path d="M45 257 L20 296 V384 L86 543" />
      <path d="M127 257 L152 296 V384 L86 543" />
    </g>
    <g fill="#eef5fc" stroke="#245880" stroke-width="2">
      <circle cx="26" cy="137" r="11" />
      <circle cx="66" cy="137" r="11" />
      <circle cx="106" cy="137" r="11" />
      <circle cx="146" cy="137" r="11" />
    </g>
    <g fill="#eef8f2" stroke="#206757" stroke-width="2">
      <circle cx="56" cy="247" r="14" />
      <circle cx="116" cy="247" r="14" />
    </g>
    <text x="86" y="291" fill="#206757">Hidden layer</text>
    <text x="86" y="321">2 neurons</text>
    <text x="86" y="351">after ReLU</text>
    <circle cx="86" cy="543" r="16" fill="#fff7e7" stroke="#86500e" stroke-width="2" />
    <text x="86" y="588" fill="#86500e">Output layer</text>
    <text x="86" y="618">1 neuron</text>

    <rect x="196" y="58" width="156" height="110" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="274" y="89" fill="#245880">Input</text>
    <text x="274" y="123" font-family="ui-monospace, monospace">[2, 3, 4]</text>
    <text x="274" y="153">6 vectors</text>
    <path d="M274 174 V197" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-module-shapes-arrow)" />
    <rect x="196" y="206" width="156" height="168" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="274" y="236" font-family="ui-monospace, monospace" font-weight="700">nn.Linear</text>
    <text x="274" y="265" font-family="ui-monospace, monospace">(4, 2)</text>
    <text x="274" y="297" font-family="ui-monospace, monospace">[2, 3, 2]</text>
    <text x="274" y="329">weights [2,4]</text>
    <text x="274" y="357">bias [2]</text>
    <path d="M274 380 V403" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-module-shapes-arrow)" />
    <rect x="196" y="412" width="156" height="72" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="274" y="441" font-family="ui-monospace, monospace" font-weight="700">nn.ReLU</text>
    <text x="274" y="471" font-family="ui-monospace, monospace">[2, 3, 2]</text>
    <path d="M274 490 V510" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-module-shapes-arrow)" />
    <rect x="196" y="519" width="156" height="102" rx="12" fill="#fff7e7" stroke="#86500e" stroke-width="2" />
    <text x="274" y="549" font-family="ui-monospace, monospace" font-weight="700">nn.Linear</text>
    <text x="274" y="579" font-family="ui-monospace, monospace">(2, 1)</text>
    <text x="274" y="609" font-family="ui-monospace, monospace">[2, 3, 1]</text>
    <text x="180" y="662"><tspan font-family="ui-monospace, monospace" font-weight="700">nn.Linear</tspan><tspan font-family="ui-monospace, monospace">(4, 2)</tspan></text>
    <text x="180" y="692">4 input features → 2 neurons</text>
  </g>
</svg>
