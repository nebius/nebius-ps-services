<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 416.0" role="img" aria-labelledby="pt-reduction-title pt-reduction-desc" style="max-width: 360px; margin-inline: auto">
  <title id="pt-reduction-title">Keep one mean per row</title>
  <desc id="pt-reduction-desc">Averaging along the last axis turns each three-value row into one value. Keeping that axis with size one gives two rows and one column, ready to broadcast back across the original rows.</desc>
  <defs>
    <marker id="pt-reduction-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" transform="translate(0 44)">
    <text x="160" y="28" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>x: [2, 3]</tspan></text>
    <rect x="88" y="44" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="112.0" y="75.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>1</tspan></text>
    <rect x="136" y="44" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="160.0" y="75.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>2</tspan></text>
    <rect x="184" y="44" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="208.0" y="75.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>3</tspan></text>
    <rect x="88" y="92" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="112.0" y="123.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>4</tspan></text>
    <rect x="136" y="92" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="160.0" y="123.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>5</tspan></text>
    <rect x="184" y="92" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="208.0" y="123.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>6</tspan></text>
    <path d="M160 151 V197" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-reduction-arrow)" />
    <text x="160" y="225" font-size="20.0" font-weight="400" fill="#206757" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">mean</tspan><tspan>(-1, </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">keepdim</tspan><tspan>=True)</tspan></text>
    <rect x="136" y="242" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="160.0" y="273.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>2</tspan></text>
    <rect x="136" y="290" width="48" height="48" rx="5" fill="#eef5fc" stroke="#245880" stroke-width="1.5" />
    <text x="160.0" y="321.0" font-size="22.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>5</tspan></text>
    <text x="160" y="368" font-size="22.0" font-weight="400" fill="#206757" text-anchor="middle"><tspan>means: [2, 1]</tspan></text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="160" y="24" font-size="20" font-weight="400" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">dtype</tspan><tspan>: FP32 · </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">device</tspan><tspan>: CPU</tspan></text>
  </g>
</svg>
