  <title id="pt-shape-axes-title">Choose a grid, a row and a column</title>
  <desc id="pt-shape-axes-desc">An index chooses an entry, counting from zero. In x[1, 2, 3], 1 chooses the second grid, 2 its third row and 3 its fourth column. The highlighted cell contains 23. Each grid has three rows and four columns. The tensor contains 64-bit integers on the CPU.</desc>
