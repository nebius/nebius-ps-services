<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 448" role="img" aria-labelledby="pt-timing-title pt-timing-desc" style="max-width: 360px; margin-inline: auto">
  <title id="pt-timing-title">Mark the device interval, then wait before reading it</title>
  <desc id="pt-timing-desc">In one stream, the start event precedes twenty matrix multiplications and the end event follows them. The CPU waits for the end marker before querying elapsed milliseconds.</desc>
  <defs>
    <marker id="pt-timing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="16" y="12" width="288" height="82" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="160" y="43" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>Start event</tspan></text>
    <text x="160" y="74" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">record</tspan><tspan>()</tspan></text>
    <path d="M160 101 V136" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-timing-arrow)" />
    <rect x="16" y="148" width="288" height="82" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="160" y="179" font-size="22.0" font-weight="400" fill="#206757" text-anchor="middle"><tspan>20 matrix products</tspan></text>
    <text x="160" y="210" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>Measured stream interval</tspan></text>
    <path d="M160 237 V272" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-timing-arrow)" />
    <rect x="16" y="284" width="288" height="82" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="160" y="315" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>End event</tspan></text>
    <text x="160" y="346" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">record</tspan><tspan>()</tspan></text>
    <text x="160" y="404" font-size="21.0" font-weight="400" fill="#86500e" text-anchor="middle"><tspan>CPU: end.</tspan><tspan font-family="ui-monospace, monospace" font-weight="700">synchronize</tspan><tspan>()</tspan></text>
    <text x="160" y="435" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>Then read elapsed milliseconds</tspan></text>
  </g>
</svg>
