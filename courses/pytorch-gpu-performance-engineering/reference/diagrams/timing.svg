<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" role="img" aria-labelledby="pt-timing-title pt-timing-desc" style="max-width: 400px; margin-inline: auto">
  <title id="pt-timing-title">CPU submits the work; GPU events mark its timing</title>
  <desc id="pt-timing-desc">CPU submissions queue a start marker, matrix multiplication and end marker in one CUDA stream. The GPU executes them in order. The CPU waits for device completion, then reads the milliseconds between the two timestamps. Warm-up is outside this diagram; arrows show order, not durations.</desc>
  <defs>
    <marker id="pt-timing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#24343d" text-anchor="middle">
    <text x="81" y="28" font-weight="600">CPU / Python</text>
    <text x="279" y="28" font-weight="600">GPU / CUDA</text>
    <path d="M81 44 V712 M279 44 V712" stroke="#aec0c9" stroke-width="2" fill="none" />
    <rect x="194" y="86" width="166" height="365" rx="14" fill="#eef8f2" />
    <rect x="8" y="62" width="146" height="74" rx="10" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="81" y="91">Record</text>
    <text x="81" y="120">start</text>
    <path d="M157 114 L201 133" stroke="#206757" stroke-width="2" fill="none" marker-end="url(#pt-timing-arrow)" />
    <rect x="206" y="99" width="146" height="74" rx="10" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="279" y="128">Start</text>
    <text x="279" y="157">timestamp</text>
    <path d="M279 178 V217" stroke="#206757" stroke-width="2" fill="none" marker-end="url(#pt-timing-arrow)" />
    <rect x="8" y="191" width="146" height="74" rx="10" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="81" y="220">Submit</text>
    <text x="81" y="249" font-family="ui-monospace, monospace">x @ x</text>
    <path d="M157 243 L201 255" stroke="#206757" stroke-width="2" fill="none" marker-end="url(#pt-timing-arrow)" />
    <rect x="206" y="225" width="146" height="92" rx="10" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="279" y="259">Execute</text>
    <text x="279" y="292" font-family="ui-monospace, monospace">x @ x</text>
    <path d="M279 323 V360" stroke="#206757" stroke-width="2" fill="none" marker-end="url(#pt-timing-arrow)" />
    <rect x="8" y="324" width="146" height="74" rx="10" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="81" y="353">Record</text>
    <text x="81" y="382">end</text>
    <path d="M157 378 L201 396" stroke="#206757" stroke-width="2" fill="none" marker-end="url(#pt-timing-arrow)" />
    <rect x="206" y="367" width="146" height="74" rx="10" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="279" y="396">End</text>
    <text x="279" y="425">timestamp</text>
    <rect x="8" y="440" width="146" height="136" rx="10" fill="#fff6e5" stroke="#86500e" stroke-width="2" />
    <text x="81" y="476">CPU waits</text>
    <text x="81" y="507">for device</text>
    <rect x="206" y="485" width="146" height="74" rx="10" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="279" y="515">Work</text>
    <text x="279" y="544">complete</text>
    <path d="M201 547 H159" stroke="#206757" stroke-width="2" fill="none" marker-end="url(#pt-timing-arrow)" />
    <path d="M81 582 V612" stroke="#206757" stroke-width="2" fill="none" marker-end="url(#pt-timing-arrow)" />
    <rect x="8" y="620" width="146" height="74" rx="10" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="81" y="651">Read time</text>
    <text x="81" y="680">in ms</text>
    <text x="180" y="746">One stream · read downward</text>
  </g>
</svg>
