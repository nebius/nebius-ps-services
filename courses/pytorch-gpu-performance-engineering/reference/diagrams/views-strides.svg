<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 482.0" role="img" aria-labelledby="pt-views-strides-title pt-views-strides-desc" style="max-width: 360px; margin-inline: auto">
  <title id="pt-views-strides-title">Two index maps share the same storage</title>
  <desc id="pt-views-strides-desc">x uses strides (3, 1); its transpose y uses (1, 3). Both maps refer to the same six stored elements. A contiguous copy of y would store 0, 3, 1, 4, 2, 5 separately.</desc>
  <defs>
    <marker id="pt-views-strides-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#206757" stroke-width="1.8" />
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" transform="translate(0 44)">
    <rect x="16" y="12" width="288" height="82" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="160" y="43" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>x: </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">shape</tspan><tspan> [2, 3]</tspan></text>
    <text x="160" y="74" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>strides (3, 1)</tspan></text>
    <path d="M160 100 V144" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-views-strides-arrow)" />
    <rect x="16" y="154" width="288" height="82" rx="12" fill="#eef8f2" stroke="#206757" stroke-width="2" />
    <text x="160" y="185" font-size="22.0" font-weight="400" fill="#206757" text-anchor="middle"><tspan>Shared storage</tspan></text>
    <text x="160" y="216" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>0   1   2   3   4   5</tspan></text>
    <path d="M160 310 V247" fill="none" stroke="#206757" stroke-width="2.5" marker-end="url(#pt-views-strides-arrow)" />
    <rect x="16" y="322" width="288" height="82" rx="12" fill="#eef5fc" stroke="#245880" stroke-width="2" />
    <text x="160" y="353" font-size="22.0" font-weight="400" fill="#245880" text-anchor="middle"><tspan>y: </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">shape</tspan><tspan> [3, 2]</tspan></text>
    <text x="160" y="384" font-size="20.0" font-weight="400" fill="#24343d" text-anchor="middle"><tspan>strides (1, 3)</tspan></text>
    <text x="143" y="282" font-size="20.0" font-weight="400" fill="#206757" text-anchor="end"><tspan>same values</tspan></text>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="160" y="24" font-size="20" font-weight="400" fill="#24343d" text-anchor="middle"><tspan font-family="ui-monospace, monospace" font-weight="700">dtype</tspan><tspan>: int64 · </tspan><tspan font-family="ui-monospace, monospace" font-weight="700">device</tspan><tspan>: CPU</tspan></text>
  </g>
</svg>
