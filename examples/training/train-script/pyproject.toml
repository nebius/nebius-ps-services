[project]
name = "nebius-train-script"
dynamic = ["version"]
description = "Reproducible PyTorch training on Slurm"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pydantic>=2.14.4,<3",
  "PyYAML>=6.0.4,<7",
  "rich>=15.0.0,<16",
  "typer>=0.29.2,<0.30",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.15.0,<2.16",
  "transformers>=5.24.0,<6",
  "datasets>=5.2.0,<6",
  "huggingface-hub>=2.4.0,<3",
  "safetensors>=0.8.0,<0.9",
  "numpy>=2.5.5,<3",
  "tensorboard>=2.21.0,<3",
]
ml = [
  "torch>=2.15.0,<2.16",
  "transformers>=5.24.0,<6",
  "datasets>=5.2.0,<6",
  "huggingface-hub>=2.4.0,<3",
  "safetensors>=0.8.0,<0.9",
  "numpy>=2.5.5,<3",
  "tensorboard>=2.21.0,<3",
]

[tool.uv]
conflicts = [[{ extra = "ml" }, { extra = "cpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi-torch"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "pypi-torch", extra = "ml", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
  "pytest>=9.2.0,<10",
  "pytest-cov>=7.1,<8",
  "pytest-socket>=0.8.1,<0.9",
  "ruff>=0.17.6,<0.18",
  "build>=1.6.1,<2",
  "setuptools-scm>=10.3.4,<11",
  "pip-audit>=2.10.1,<3",
]

[project.scripts]
nebius-train-script = "nebius_train.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nebius_train*"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
version_file = "src/nebius_train/_version.py"
tag_regex = "^nebius-train-script-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
fallback_version = "0+unknown"
search_parent_directories = true

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --abbrev=40 --match nebius-train-script-v*"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["dist", "build", ".venv", "src/nebius_train/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
addopts = [
  "-ra", "--strict-config", "--strict-markers", "--import-mode=importlib",
  "--disable-socket", "-m", "not slow and not e2e and not external",
]
strict_xfail = true
required_plugins = ["pytest-socket>=0.8.1,<0.9"]
markers = [
  "unit: focused behavior with isolated external boundaries",
  "integration: collaboration between real components or controlled dependencies",
  "e2e: complete local workflow excluded from the fast feedback lane",
  "slow: excluded from the fast feedback lane",
  "external: requires explicit live-test opt-in and target preflight",
  "local_network: permits loopback TCP for a controlled local dependency",
  "ml: requires the ml extra",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nebius_train"]

[tool.coverage.report]
skip_empty = true

[build-system]
requires = ["setuptools>=84.2.1,<85", "setuptools-scm>=10.3.4,<11"]
build-backend = "setuptools.build_meta"
