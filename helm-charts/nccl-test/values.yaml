# Default MPIJob contract for the NCCL validation workflow. The shared
# first-party image tag and practical benchmark shape now live here in the
# source chart; cxcli only needs to override worker replica count and
# platform-specific MPI extras such as the B200 `-mca coll ^hcoll` overlay.

nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []

imagePullSecrets: []

commonLabels: {}
commonAnnotations: {}

image:
  repository: cr.eu-north1.nebius.cloud/e00th0mgv3zddz7468/images/nccl-test
  tag: 0.2.0
  digest: ""
  pullPolicy: IfNotPresent

initContainer:
  repository: busybox
  tag: "1.36.1"
  digest: ""
  pullPolicy: IfNotPresent

benchmark:
  binaryPath: /opt/nccl_tests/build/all_reduce_perf
  resultJsonPath: /tmp/nccl-tests-results.json
  mpiBaseArgs:
    - -bind-to
    - none
    - -x
    - LD_LIBRARY_PATH
    - -x
    - NCCL_DEBUG=WARN
    - -x
    - NCCL_SOCKET_IFNAME=eth0
    - -x
    - NCCL_IB_HCA=mlx5
  mpiExtraArgs: []
  args:
    - -b
    - 512M
    - -e
    - 8G
    - -f
    - "2"
    - -g
    - "1"
    - -n
    - "10"
    - -w
    - "3"
    - -T
    - "180"

launcher:
  podLabels: {}
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: "2"
      memory: 1208Mi
    limits: {}

worker:
  replicas: 1
  gpus: 8
  podLabels: {}
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: "96"
      memory: 1600G
    limits:
      cpu: "96"
      memory: 1600G

dshm:
  enabled: true
  sizeLimit: ""

report:
  jsonBeginMarker: __NCCL_JSON_BEGIN__
  jsonEndMarker: __NCCL_JSON_END__

job:
  cleanPodPolicy: Running
  launcherPrivileged: true
  workerPrivileged: true
