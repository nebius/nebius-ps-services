# Default MPIJob contract for the NCCL validation workflow. The shared
# first-party image tag and conservative 1-GPU smoke-test baseline now live
# here in the source chart; cxcli still overrides worker replica count, GPU
# count, runtime CPU/memory sizing, and platform-specific MPI extras. Nebius
# docs add `-mca coll ^hcoll` only in the B200 example while the H100/H200
# example omits it, so the shared chart keeps `benchmark.mpiExtraArgs: []` and
# leaves that overlay to the caller.
# Ref: https://docs.nebius.com/kubernetes/gpu/nccl-test

nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []

imagePullSecrets: []

commonLabels: {}
commonAnnotations: {}

image:
  repository: cr.eu-north1.nebius.cloud/e00th0mgv3zddz7468/images/nccl-test
  tag: 0.2.0
  digest: ""
  pullPolicy: IfNotPresent

initContainer:
  repository: busybox
  tag: "1.36.1"
  digest: ""
  pullPolicy: IfNotPresent

benchmark:
  binaryPath: /opt/nccl_tests/build/all_reduce_perf
  resultJsonPath: /tmp/nccl-tests-results.json
  mpiBaseArgs:
    - -bind-to
    - none
    - -x
    - LD_LIBRARY_PATH
    - -x
    - NCCL_DEBUG=WARN
  transport:
    mode: auto
    socketIfName: ""
    ibHca: ""
  mpiExtraArgs: []
  args:
    - -b
    - 512M
    - -e
    - 8G
    - -f
    - "2"
    - -g
    - "1"
    - -n
    - "10"
    - -w
    - "3"
    - -T
    - "180"

launcher:
  podLabels: {}
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  waitForWorkers:
    enabled: true
    timeoutSeconds: 300
    pollSeconds: 2
  resources:
    requests:
      cpu: "2"
      memory: 1208Mi
    limits: {}

worker:
  replicas: 1
  gpus: 1
  podLabels: {}
  podAnnotations: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 16Gi

dshm:
  enabled: true
  sizeLimit: ""

report:
  jsonBeginMarker: __NCCL_JSON_BEGIN__
  jsonEndMarker: __NCCL_JSON_END__

job:
  cleanPodPolicy: Running
  launcherPrivileged: true
  workerPrivileged: true
