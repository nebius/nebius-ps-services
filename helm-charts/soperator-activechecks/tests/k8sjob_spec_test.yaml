suite: test k8sJobSpec structure
templates:
  - templates/active-checks.yaml
tests:
  - it: should render k8sJobSpec with correct structure
    documentSelector:
      path: metadata.name
      value: test-k8sjob
    set:
      slurmClusterRefName: test-cluster
      images:
        k8sJob: "test-image:latest"
        munge: "munge-image:latest"
      jobContainer:
        volumeMounts:
          - mountPath: /mnt/jail
            name: jail
        volumes:
          - name: jail
            persistentVolumeClaim:
              claimName: jail-pvc
      checks:
        test-k8sjob:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            jobContainer:
              command: ["echo", "test"]
            mungeContainer:
              enabled: true
    asserts:
      - isKind:
          of: ActiveCheck
      - equal:
          path: spec.podTemplateNameRef
          value: test-k8sjob
      - exists:
          path: spec.k8sJobSpec.jobContainer.image
      - exists:
          path: spec.k8sJobSpec.jobContainer.command
      - exists:
          path: spec.k8sJobSpec.jobContainer.volumeMounts
      - exists:
          path: spec.k8sJobSpec.jobContainer.volumes
      - exists:
          path: spec.k8sJobSpec.mungeContainer
      - exists:
          path: spec.k8sJobSpec.mungeContainer.image

  - it: should allow overriding k8sJob container image
    documentSelector:
      path: metadata.name
      value: test-k8sjob-image-override
    set:
      slurmClusterRefName: test-cluster
      images:
        k8sJob: "default-k8s-image:latest"
        slurmJob: "slurm-job-image:latest"
        munge: "munge-image:latest"
      jobContainer:
        volumeMounts: []
        volumes: []
      checks:
        test-k8sjob-image-override:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            jobContainer:
              image: "{{ .Values.images.slurmJob }}"
              command: ["echo", "test"]
    asserts:
      - isKind:
          of: ActiveCheck
      - equal:
          path: spec.k8sJobSpec.jobContainer.image
          value: "slurm-job-image:latest"

  - it: should allow overriding PodTemplate reference per check
    documentSelector:
      path: metadata.name
      value: test-k8sjob-podtemplate-override
    set:
      slurmClusterRefName: test-cluster
      hostUsers: true
      images:
        k8sJob: "test-image:latest"
      jobContainer:
        volumeMounts: []
        volumes: []
      checks:
        test-k8sjob-podtemplate-override:
          enabled: true
          checkType: k8sJob
          podTemplateNameRef: custom-template
          k8sJobSpec:
            jobContainer:
              command: ["echo", "test"]
    asserts:
      - isKind:
          of: ActiveCheck
      - equal:
          path: spec.podTemplateNameRef
          value: custom-template

  - it: should render srun ready probe with configured partition
    documentSelector:
      path: metadata.name
      value: wait-for-soperatorchecks-srun-ready
    set:
      slurmClusterRefName: test-cluster
      srunReadyPartition: cpu
    asserts:
      - isKind:
          of: ActiveCheck
      - matchRegex:
          path: spec.k8sJobSpec.jobContainer.command[2]
          pattern: "--partition=cpu"

  - it: should allow overriding slurmJob sbatch script inline
    documentSelector:
      path: metadata.name
      value: test-slurm-inline-script
    set:
      slurmClusterRefName: test-cluster
      images:
        slurmJob: "slurm-job-image:latest"
      checks:
        test-slurm-inline-script:
          enabled: true
          checkType: slurmJob
          slurmJobSpec:
            sbatchScript: |
              #!/bin/bash
              echo inline-script
            eachWorkerJobs: true
    asserts:
      - isKind:
          of: ActiveCheck
      - matchRegex:
          path: spec.slurmJobSpec.sbatchScript
          pattern: "echo inline-script"
      - equal:
          path: spec.slurmJobSpec.eachWorkerJobs
          value: true

  - it: should render default enroot cleanup from a local-owned script file
    documentSelector:
      path: metadata.name
      value: enroot-cleanup
    set:
      slurmClusterRefName: test-cluster
      images:
        slurmJob: "slurm-job-image:latest"
    asserts:
      - isKind:
          of: ActiveCheck
      - matchRegex:
          path: spec.slurmJobSpec.sbatchScript
          pattern: "job-scoped Enroot containers"
      - matchRegex:
          path: spec.slurmJobSpec.sbatchScript
          pattern: "pyxis_\\(\\[0-9\\]"
      - equal:
          path: spec.slurmJobSpec.eachWorkerJobs
          value: true

  - it: should render all default script-backed checks from packaged files
    asserts:
      - notFailedTemplate: {}

  - it: should fail when k8sJob scriptFile references a missing chart file
    set:
      checks:
        test-missing-script-file:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            scriptFile: scripts/does-not-exist.sh
    asserts:
      - failedTemplate:
          errorMessage: 'checks.test-missing-script-file.k8sJobSpec.scriptFile references missing chart file "scripts/does-not-exist.sh"'

  - it: should fail when k8sJob pythonScriptFile references a missing chart file
    set:
      checks:
        test-missing-python-script-file:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            pythonScriptFile: scripts/does-not-exist.py
    asserts:
      - failedTemplate:
          errorMessage: 'checks.test-missing-python-script-file.k8sJobSpec.pythonScriptFile references missing chart file "scripts/does-not-exist.py"'

  - it: should fail when slurmJob sbatchScriptFile references a missing chart file
    set:
      checks:
        test-missing-sbatch-script-file:
          enabled: true
          checkType: slurmJob
          slurmJobSpec:
            sbatchScriptFile: scripts/does-not-exist.sh
    asserts:
      - failedTemplate:
          errorMessage: 'checks.test-missing-sbatch-script-file.slurmJobSpec.sbatchScriptFile references missing chart file "scripts/does-not-exist.sh"'

  - it: should fail when inline slurmJob also configures a missing sbatchScriptFile
    set:
      checks:
        test-inline-missing-sbatch-script-file:
          enabled: true
          checkType: slurmJob
          slurmJobSpec:
            sbatchScript: |
              echo inline-script
            sbatchScriptFile: scripts/does-not-exist.sh
    asserts:
      - failedTemplate:
          errorMessage: 'checks.test-inline-missing-sbatch-script-file.slurmJobSpec.sbatchScriptFile references missing chart file "scripts/does-not-exist.sh"'

  - it: should not render appArmorProfile at k8sJobSpec level (regression test)
    documentSelector:
      path: metadata.name
      value: test-apparmorprofile-placement
    set:
      slurmClusterRefName: test-cluster
      images:
        k8sJob: "test-image:latest"
      jobContainer:
        volumeMounts: []
        volumes: []
      checks:
        test-apparmorprofile-placement:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            jobContainer:
              appArmorProfile: unconfined
              command: ["echo", "test"]
    asserts:
      - isKind:
          of: ActiveCheck
      - notExists:
          path: spec.k8sJobSpec.appArmorProfile
      - equal:
          path: spec.k8sJobSpec.jobContainer.appArmorProfile
          value: unconfined

  - it: should resolve NCCL tests version from map for CUDA 12.9.0
    documentSelector:
      path: metadata.name
      value: test-nccl-map-lookup
    set:
      slurmClusterRefName: test-cluster
      cudaVersion: "12.9.0"
      ncclTestsVersion: ""
      ncclTestsVersions:
        "12.9.0": "2.16.4"
        "13.0.2": "2.17.6"
      images:
        k8sJob: "test-image:latest"
        sansible: "sansible-image:latest"
      jobContainer:
        volumeMounts:
          - mountPath: /mnt/jail
            name: jail
        volumes:
          - name: jail
            persistentVolumeClaim:
              claimName: jail-pvc
      checks:
        test-nccl-map-lookup:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            jobContainer:
              workingDir: /opt/ansible
              image: "{{ .Values.images.sansible }}"
              command: ["echo", "test"]
    asserts:
      - isKind:
          of: ActiveCheck
      - contains:
          path: spec.k8sJobSpec.jobContainer.env
          content:
            name: NCCL_TESTS_VERSION
            value: "2.16.4"

  - it: should resolve NCCL tests version from map for CUDA 13.0.2
    documentSelector:
      path: metadata.name
      value: test-nccl-map-lookup-alt
    set:
      slurmClusterRefName: test-cluster
      cudaVersion: "13.0.2"
      ncclTestsVersion: ""
      ncclTestsVersions:
        "12.9.0": "2.16.4"
        "13.0.2": "2.17.6"
      images:
        k8sJob: "test-image:latest"
        sansible: "sansible-image:latest"
        activeCheckImageRepository: "cr.eu-north1.nebius.cloud#ml-containers/training_diag"
        activeCheckImageTags:
          "13.0.2": "13.0.2-ubuntu24.04-20260206170007"
      jobContainer:
        volumeMounts:
          - mountPath: /mnt/jail
            name: jail
        volumes:
          - name: jail
            persistentVolumeClaim:
              claimName: jail-pvc
      checks:
        test-nccl-map-lookup-alt:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            jobContainer:
              workingDir: /opt/ansible
              image: "{{ .Values.images.sansible }}"
              command: ["echo", "test"]
    asserts:
      - isKind:
          of: ActiveCheck
      - contains:
          path: spec.k8sJobSpec.jobContainer.env
          content:
            name: NCCL_TESTS_VERSION
            value: "2.17.6"

  - it: should use flat override when ncclTestsVersion is set
    documentSelector:
      path: metadata.name
      value: test-nccl-flat-override
    set:
      slurmClusterRefName: test-cluster
      cudaVersion: "12.9.0"
      ncclTestsVersion: "2.99.0"
      ncclTestsVersions:
        "12.9.0": "2.16.4"
      images:
        k8sJob: "test-image:latest"
        sansible: "sansible-image:latest"
      jobContainer:
        volumeMounts:
          - mountPath: /mnt/jail
            name: jail
        volumes:
          - name: jail
            persistentVolumeClaim:
              claimName: jail-pvc
      checks:
        test-nccl-flat-override:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            jobContainer:
              workingDir: /opt/ansible
              image: "{{ .Values.images.sansible }}"
              command: ["echo", "test"]
    asserts:
      - isKind:
          of: ActiveCheck
      - contains:
          path: spec.k8sJobSpec.jobContainer.env
          content:
            name: NCCL_TESTS_VERSION
            value: "2.99.0"

  - it: should fail when CUDA version is not in ncclTestsVersions map
    set:
      slurmClusterRefName: test-cluster
      cudaVersion: "99.0.0"
      ncclTestsVersion: ""
      ncclTestsVersions:
        "12.9.0": "2.16.4"
      images:
        k8sJob: "test-image:latest"
        sansible: "sansible-image:latest"
        activeCheckImageRepository: "cr.eu-north1.nebius.cloud#ml-containers/training_diag"
        activeCheckImageTags:
          "99.0.0": "99.0.0-ubuntu24.04-20260206170007"
      jobContainer:
        volumeMounts:
          - mountPath: /mnt/jail
            name: jail
        volumes:
          - name: jail
            persistentVolumeClaim:
              claimName: jail-pvc
      checks:
        test-nccl-unknown-cuda:
          enabled: true
          checkType: k8sJob
          k8sJobSpec:
            jobContainer:
              workingDir: /opt/ansible
              image: "{{ .Values.images.sansible }}"
              command: ["echo", "test"]
    asserts:
      - failedTemplate:
          errorMessage: "ncclTestsVersions must contain an entry for CUDA 99.0.0, or set ncclTestsVersion explicitly"
