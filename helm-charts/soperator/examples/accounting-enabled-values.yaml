# Enables chart-managed Slurm accounting on top of the default GPU worker
# profile. This example keeps SSH public keys empty; pass them with Helm
# --set-file or a private values file.
clusterName: soperator-accounting
clusterType: gpu

slurmNodes:
  login:
    # Keep public keys out of example files; pass them with Helm --set-file.
    sshRootPublicKeys: []
  accounting:
    enabled: true
    k8sNodeFilterName: accounting
    mariadbOperator:
      enabled: true

volume:
  accounting:
    enabled: true
    size: 256Gi
    filestoreDeviceName: accounting
