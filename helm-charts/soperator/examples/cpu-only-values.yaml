# CPU-only Slurm worker profile. Use this when worker pods should not request
# GPUs and GPU platform apps are not required.
clusterName: soperator-cpu
clusterType: cpu

soperator-activechecks:
  # CPU-only examples render a cpu partition, not the upstream hidden partition.
  srunReadyPartition: cpu
  checks:
    all-reduce-perf-nccl-in-docker:
      enabled: false
    all-reduce-perf-nccl-with-ib:
      enabled: false
    all-reduce-perf-nccl-without-ib:
      enabled: false
    cuda-samples:
      enabled: false
    dcgmi-diag-r2:
      enabled: false
    dcgmi-diag-r3:
      enabled: false
    ensure-healthy-nodes:
      enabled: false
    extensive-check:
      enabled: false
    gpu-fryer:
      enabled: false
    ib-gpu-perf:
      enabled: false
    mem-perf:
      enabled: false
    prepull-container-image:
      enabled: false

slurmNodes:
  login:
    # Keep public keys out of example files; pass them with Helm --set-file.
    sshRootPublicKeys: []
  accounting:
    # CPU-only accounting does not need Gres/gpu in AccountingStorageTRES.
    slurmConfig:
      accountingStorageTRES: CPU,Mem,Node,VMem

partitionConfiguration:
  configType: structured
  partitions:
    - name: cpu
      nodeSetRefs:
        - worker-cpu
      config: Default=YES MaxTime=INFINITE State=UP PriorityTier=5

nodesets:
  - name: worker-cpu
    replicas: 2
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: false
    nodeConfig:
      features:
        - cpu
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 4.0.2-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: "4"
        memory: 16Gi
        ephemeralStorage: 10Gi
      volumes:
        spool:
          emptyDir: {}
        jail:
          persistentVolumeClaim:
            claimName: jail-pvc
        jailSubMounts: []
        sharedMemorySize: 8Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 4.0.2-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: 200m
        memory: 512Mi
        ephemeralStorage: 1Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    sssd:
      enabled: false
    priorityClass: soperator-worker-high-priority
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker-cpu
    workerAnnotations: {}
    customInitContainers: []
