# One-node local Kubernetes learning profile for clusters such as Kind,
# Minikube, or Docker Desktop Kubernetes.
# This profile is intentionally opt-in and does not use Nebius SFS.
# Label the node that owns the local jail and controller-spool paths before
# install:
# kubectl label node <local-storage-node> slurm.nebius.ai/local-storage=true --overwrite
clusterName: soperator-local
clusterType: cpu
# Keep the local learning profile CPU-only and architecture-neutral. The
# production chart keeps the SPANK plug stack enabled for chroot/pyxis, but the
# minimal local profile does not exercise those containerized workload paths.
customSlurmConfig: |
  PlugStackConfig=/dev/null

certManager:
  # Vanilla local clusters usually do not include cert-manager. With this
  # disabled the Soperator admission webhooks are not rendered.
  enabled: false

controllerManager:
  manager:
    env:
      isMariadbCrdInstalled: "false"

mariadb-operator:
  installOperator: false

kruise:
  manager:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

k8sNodeFilters:
  - name: system
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/local-storage: "true"
  - name: controller
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/local-storage: "true"
  - name: login
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/local-storage: "true"
  - name: accounting
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/local-storage: "true"
  - name: no-gpu
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/local-storage: "true"

populateJail:
  k8sNodeFilterName: system

slurmNodes:
  accounting:
    enabled: false
    k8sNodeFilterName: accounting
    mariadbOperator:
      enabled: false
  controller:
    k8sNodeFilterName: controller
    munge:
      resources:
        cpu: "100m"
        memory: 128Mi
        ephemeralStorage: 1Gi
    slurmctld:
      resources:
        cpu: "250m"
        memory: 512Mi
        ephemeralStorage: 2Gi
  login:
    size: 1
    k8sNodeFilterName: login
    sshdServiceType: NodePort
    # Do not put placeholder public keys in this file. Add your own key if you
    # want to SSH to the local login pod; otherwise use kubectl exec for tests.
    sshRootPublicKeys: []
    munge:
      resources:
        cpu: "100m"
        memory: 128Mi
        ephemeralStorage: 1Gi
    sshd:
      resources:
        cpu: "250m"
        memory: 512Mi
        ephemeralStorage: 2Gi
  exporter:
    enabled: false
  rest:
    # Keep REST disabled with accounting in the local profile.
    enabled: false

sConfigController:
  node:
    # SConfigController reconfiguration calls Slurm REST. Upstream Soperator
    # only reconciles Slurm REST when accounting has a database enabled, so this
    # no-accounting local profile scales SConfigController to zero.
    size: 0
    k8sNodeFilterName: controller
  container:
    resources:
      cpu: "100m"
      memory: 128Mi
      ephemeralStorage: 1Gi

partitionConfiguration:
  configType: structured
  partitions:
    - name: cpu
      nodeSetRefs:
        - worker-cpu
      config: Default=YES MaxTime=INFINITE State=UP PriorityTier=5

volume:
  jail:
    size: 10Gi
    type: local
    localPath: /mnt/soperator-local/jail
  controllerSpool:
    size: 2Gi
    type: local
    localPath: /mnt/soperator-local/controller-spool
  accounting:
    enabled: false
    type: local
    localPath: /mnt/soperator-local/accounting

storage:
  mountImage:
    repository: docker.io/library/busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  jail:
    k8sNodeFilterName: system
    matchExpressions:
      - key: slurm.nebius.ai/local-storage
        operator: In
        values:
          - "true"
    tolerations: []
  controllerSpool:
    k8sNodeFilterName: system
    matchExpressions:
      - key: slurm.nebius.ai/local-storage
        operator: In
        values:
          - "true"
    tolerations: []
  accounting:
    k8sNodeFilterName: system
    matchExpressions:
      - key: slurm.nebius.ai/local-storage
        operator: In
        values:
          - "true"
    tolerations: []

nodesets:
  - name: worker-cpu
    replicas: 1
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: false
    nodeConfig:
      features:
        - cpu
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=2 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: "500m"
        memory: 512Mi
        ephemeralStorage: 2Gi
      volumes:
        spool:
          emptyDir: {}
        jail:
          persistentVolumeClaim:
            claimName: jail-pvc
        jailSubMounts: []
        sharedMemorySize: 512Mi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: "100m"
        memory: 128Mi
        ephemeralStorage: 1Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    sssd:
      enabled: false
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/local-storage: "true"
    tolerations: []
    workerAnnotations: {}
    customInitContainers: []
