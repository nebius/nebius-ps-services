# Minimal GPU Slurm profile. It uses the chart's default production 8-GPU
# worker NodeSet and only adds an explicit GPU partition.
slurmNodes:
  login:
    # Keep public keys out of example files; pass them with Helm --set-file.
    sshRootPublicKeys: []

partitionConfiguration:
  configType: structured
  partitions:
    - name: gpu
      nodeSetRefs:
        - worker
      config: Default=YES MaxTime=INFINITE State=UP PriorityTier=10
