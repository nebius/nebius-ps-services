# Mixed CPU and GPU Slurm worker profile. CPU and GPU workers are separate
# homogeneous NodeSets and are exposed through separate Slurm partitions.
clusterName: soperator-mixed
clusterType: gpu

slurmNodes:
  login:
    # Keep public keys out of example files; pass them with Helm --set-file.
    sshRootPublicKeys: []

partitionConfiguration:
  configType: structured
  partitions:
    - name: cpu
      nodeSetRefs:
        - worker-cpu
      config: Default=YES MaxTime=INFINITE State=UP PriorityTier=5
    - name: gpu
      nodeSetRefs:
        - worker-gpu
      config: Default=NO MaxTime=INFINITE State=UP PriorityTier=10

nodesets:
  - name: worker-cpu
    replicas: 2
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: false
    nodeConfig:
      features:
        - cpu
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: "4"
        memory: 16Gi
        ephemeralStorage: 10Gi
      volumes:
        spool:
          emptyDir: {}
        jail:
          persistentVolumeClaim:
            claimName: jail-pvc
        jailSubMounts: []
        sharedMemorySize: 8Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: 200m
        memory: 512Mi
        ephemeralStorage: 1Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    sssd:
      enabled: false
    priorityClass: soperator-worker-high-priority
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker-cpu
    workerAnnotations: {}
    customInitContainers: []

  - name: worker-gpu
    replicas: 2
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: true
      nvidia:
        gdrCopyEnabled: true
    nodeConfig:
      features:
        - gpu
        - cuda
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=64 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
      gresConfig:
        - AutoDetect=nvidia
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      customEnv:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,graphics,utility,video
      resources:
        cpu: "64"
        memory: 512Gi
        ephemeralStorage: 50Gi
        gpu: 8
      volumes:
        spool:
          emptyDir: {}
        jail:
          persistentVolumeClaim:
            claimName: jail-pvc
        jailSubMounts: []
        sharedMemorySize: 64Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: 200m
        memory: 512Mi
        ephemeralStorage: 1Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    sssd:
      enabled: false
    priorityClass: soperator-worker-high-priority
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    workerAnnotations: {}
    customInitContainers: []
