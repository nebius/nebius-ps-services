clusterName: soperator-prod
clusterType: gpu

k8sNodeFilters:
  - name: system
    nodeSelector:
      slurm.nebius.ai/nodeset-name: system
  - name: controller
    nodeSelector:
      slurm.nebius.ai/nodeset-name: controller
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: controller
        effect: NoSchedule
  - name: login
    nodeSelector:
      slurm.nebius.ai/nodeset-name: login
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: login
        effect: NoSchedule
  - name: worker-gpu
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

populateJail:
  k8sNodeFilterName: system

slurmNodes:
  controller:
    k8sNodeFilterName: controller
  login:
    size: 2
    k8sNodeFilterName: login
    sshRootPublicKeys: []
  exporter:
    enabled: true
    k8sNodeFilterName: system

volume:
  jail:
    size: 4Ti
    filestoreDeviceName: jail
  controllerSpool:
    size: 100Gi
    filestoreDeviceName: controller-spool

nodesets:
  - name: worker-gpu
    replicas: 4
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: true
      nvidia:
        gdrCopyEnabled: true
    nodeConfig:
      features:
        - gpu
        - cuda
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
      gresConfig:
        - AutoDetect=nvidia
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 3.0.3-slurm25.11.3
        pullPolicy: IfNotPresent
      customEnv:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,graphics,utility,video
      resources:
        cpu: "8"
        memory: 64Gi
        ephemeralStorage: 50Gi
        gpu: 8
      volumes:
        spool:
          emptyDir: {}
        jail:
          persistentVolumeClaim:
            claimName: jail-pvc
        sharedMemorySize: 32Gi
        customVolumeMounts:
          - name: slurm-scripts
            mountPath: /opt/slurm_scripts/
            volumeSource:
              configMap:
                name: slurm-scripts
                defaultMode: 493
          - name: slurm-scripts-jail
            mountPath: /mnt/jail.upper/opt/slurm_scripts/
            volumeSource:
              configMap:
                name: slurm-scripts
                defaultMode: 493
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 3.0.3-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: 500m
        memory: 1Gi
        ephemeralStorage: 2Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
    sssd:
      enabled: false
    priorityClass: soperator-worker-high-priority
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
