# Production-oriented GPU worker profile for direct Helm review/testing. cxcli
# should normally render target-specific values for real deployments.
clusterName: soperator-prod
clusterType: gpu

k8sNodeFilters:
  - name: system
    nodeSelector:
      slurm.nebius.ai/nodeset-name: system
  - name: controller
    nodeSelector:
      slurm.nebius.ai/nodeset-name: controller
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: controller
        effect: NoSchedule
  - name: login
    nodeSelector:
      slurm.nebius.ai/nodeset-name: login
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: login
        effect: NoSchedule
  - name: accounting
    nodeSelector:
      slurm.nebius.ai/nodeset-name: accounting
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: accounting
        effect: NoSchedule
populateJail:
  k8sNodeFilterName: system

slurmNodes:
  controller:
    k8sNodeFilterName: controller
  login:
    size: 2
    k8sNodeFilterName: login
    # Keep public keys out of example files; pass them with Helm --set-file.
    sshRootPublicKeys: []
  exporter:
    enabled: true
    k8sNodeFilterName: system

partitionConfiguration:
  configType: structured
  partitions:
    - name: gpu
      nodeSetRefs:
        - worker
      config: Default=YES MaxTime=INFINITE State=UP PriorityTier=10

volume:
  jail:
    size: 4Ti
    filestoreDeviceName: jail
  controllerSpool:
    size: 100Gi
    filestoreDeviceName: controller-spool

nodesets:
  - name: worker
    replicas: 4
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: true
      nvidia:
        gdrCopyEnabled: true
    nodeConfig:
      features:
        - gpu
        - cuda
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=64 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
      gresConfig:
        - AutoDetect=nvidia
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      customEnv:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,graphics,utility,video
      resources:
        cpu: "64"
        memory: 512Gi
        ephemeralStorage: 50Gi
        gpu: 8
      volumes:
        spool:
          emptyDir: {}
        jail:
          persistentVolumeClaim:
            claimName: jail-pvc
        sharedMemorySize: 64Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 3.0.4-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: 500m
        memory: 1Gi
        ephemeralStorage: 2Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
    sssd:
      enabled: false
    priorityClass: soperator-worker-high-priority
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
