{{- range $i, $ns := .Values.nodesets }}
{{- with $ns }}
{{- $gpuEnabled := false }}
{{- with .gpu }}
{{- $gpuEnabled = (.enabled | default false) }}
{{- end }}
{{- $gpuDriverJail := $.Values.gpuDriverJail | default dict }}
{{- $gpuDriverJailValueEnabled := true }}
{{- if hasKey $gpuDriverJail "enabled" }}
{{- $gpuDriverJailValueEnabled = (get $gpuDriverJail "enabled") }}
{{- end }}
{{- $gpuDriverJailEnabled := and $gpuEnabled $gpuDriverJailValueEnabled }}
{{- $gpuCount := "" }}
{{- with .slurmd }}
{{- with .resources }}
{{- with .gpu }}
{{- $gpuCount = printf "%v" . }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: slurm.nebius.ai/v1alpha1
kind: NodeSet
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}

  annotations:
    slurm.nebius.ai/parental-cluster-ref: {{ include "slurm-cluster.name" $ | quote }}
    {{- with (.annotations | default dict) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  labels:
    {{- include "nodesets.labels" $ | nindent 4 }}
    {{- with (.labels | default dict) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

spec:
  {{- if hasKey . "replicas" }}
  replicas: {{ .replicas }}
  {{- else }}
  replicas: 1
  {{- end }}

  {{- with (.maxUnavailable | default "20%") }}
  maxUnavailable: {{ . }}
  {{- end }}

  {{- if .ephemeralNodes }}
  ephemeralNodes: {{ .ephemeralNodes }}
  {{- end }}

  {{- if hasKey . "initialNumberEphemeralNodes" }}
  initialNumberEphemeralNodes: {{ .initialNumberEphemeralNodes }}
  {{- end }}

  {{- if hasKey . "ephemeralTopologyWaitTimeout" }}
  ephemeralTopologyWaitTimeout: {{ .ephemeralTopologyWaitTimeout }}
  {{- end }}

  {{- with .gpu }}
  gpu:
    enabled: {{ .enabled | default false }}

    {{- with .nvidia }}
    nvidia:
      gdrCopyEnabled: {{ .gdrCopyEnabled | default false }}
    {{- end }}
  {{- end }}

  {{- with .nodeConfig }}
  nodeConfig:
    {{- $hwFeatures := .features | default list -}}
    {{- $topoFeatures := $ns.topologyLabels | default list -}}
    {{- $allFeatures := concat $hwFeatures $topoFeatures -}}
    {{- if $allFeatures }}
    features:
      {{- toYaml $allFeatures | nindent 6 }}
    {{- end }}

    {{- $static := (.static | default "") }}
    {{- if and $gpuEnabled $gpuCount (not (contains "Gres=" $static)) }}
    static: {{ (printf "%s Gres=gpu:%s" $static $gpuCount | trim) | quote }}
    {{- else }}
    {{- with $static }}
    static: {{ . | quote }}
    {{- end }}
    {{- end }}

    {{- with .dynamic }}
    dynamic: {{ . | quote }}
    {{- end }}

    {{- with .gresConfig }}
    gresConfig:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- with (required ".Values.nodesets[*].slurmd is required." .slurmd) }}
  slurmd:
    image:
    {{- if .image }}
    {{- with .image }}
      repository: {{ (required ".Values.nodesets[*].slurmd.image.repository is required as the custom image is used." .repository) | quote }}

      {{- with .tag }}
      tag: {{ . | quote }}
      {{- end }}

      pullPolicy: {{ default "IfNotPresent" .pullPolicy }}
    {{- end }}
    {{- else }}
      {{- include "nodesets.imageFromFlatString" (list $.Values.images.slurmd ".Values.images.slurmd is required as the default NodeSet slurmd image.") | nindent 6 }}
    {{- end }}

    {{- if .customEnv }}
    customEnv: {{- .customEnv | toYaml | nindent 8 }}
    {{- end }}

    port: {{ .port | default 6818 }}
    {{- with .livenessProbe }}
    livenessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .readinessProbe }}
    readinessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    {{- with (required ".Values.nodesets[*].slurmd.resources is required" .resources) }}
    resources:
      cpu: {{ required ".Values.nodesets[*].slurmd.resources.cpu is required" .cpu | quote }}
      memory: {{ required ".Values.nodesets[*].slurmd.resources.memory is required" .memory | quote }}
      {{- with .ephemeralStorage }}
      ephemeral-storage: {{ . | quote }}
      {{- end }}
      {{- include "nodesets.resource.gpuFrom" (list $ns.gpu $ns.slurmd.resources) | nindent 6 }}
    {{- end }}

    {{- with (required ".Values.nodesets[*].slurmd.volumes is required" .volumes) }}
    volumes:
      {{- with (required ".Values.nodesets[*].slurmd.volumes.spool is required" .spool) }}
      spool:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with (required ".Values.nodesets[*].slurmd.volumes.jail is required" .jail) }}
      jail:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- $jailSubMounts := (.jailSubMounts | default list) }}
      {{- $existingMounts := dict }}
      {{- range $mount := $jailSubMounts }}
      {{- $mountPath := trimSuffix "/" (default "" $mount.mountPath) }}
      {{- if $mountPath }}
      {{- $_ := set $existingMounts $mountPath true }}
      {{- end }}
      {{- end }}
      {{- if $.Values.externalNfs.enabled }}
      {{- $_ := set $existingMounts (trimSuffix "/" (required ".Values.externalNfs.mountPath is required when externalNfs.enabled=true." $.Values.externalNfs.mountPath)) true }}
      {{- end }}
      {{- if or $jailSubMounts $.Values.jailPersistentMounts }}
      jailSubMounts:
        {{- if $jailSubMounts }}
        {{- toYaml $jailSubMounts | nindent 8 }}
        {{- end }}
        {{- if eq (include "slurm-cluster-storage.jailRootfs.activePassive.enabled" $) "true" }}
        {{- range $mount := $.Values.jailPersistentMounts }}
        {{- $mountPath := trimSuffix "/" (required "jailPersistentMounts[].mountPath is required." $mount.mountPath) }}
        {{- if not (hasKey $existingMounts $mountPath) }}
        - name: {{ include "slurm-cluster-storage.jailPersistentMount.name" (list $ $mount) | quote }}
          mountPath: {{ $mountPath | quote }}
          volumeSourceName: {{ include "slurm-cluster-storage.jailPersistentMount.name" (list $ $mount) | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- if $.Values.externalNfs.enabled }}
      {{- if and (not $jailSubMounts) (not $.Values.jailPersistentMounts) }}
      jailSubMounts:
      {{- end }}
        - name: external-home
          mountPath: {{ required ".Values.externalNfs.mountPath is required when externalNfs.enabled=true." $.Values.externalNfs.mountPath | quote }}
          volumeSourceName: external-home
          readOnly: {{ $.Values.externalNfs.readOnly }}
      {{- end }}

      {{- $customVolumeMounts := (.customVolumeMounts | default list) }}
      {{- range $customVolumeMounts }}
      {{- if eq (get . "name") "slurm-scripts" }}
      {{- fail (printf ".Values.nodesets[%s].slurmd.volumes.customVolumeMounts uses reserved name \"slurm-scripts\". The chart owns this mount; use another name for custom mounts." $ns.name) }}
      {{- else if eq (get . "name") "slurm-scripts-jail" }}
      {{- fail (printf ".Values.nodesets[%s].slurmd.volumes.customVolumeMounts uses reserved name \"slurm-scripts-jail\". The chart owns this mount; use another name for custom mounts." $ns.name) }}
      {{- else if and $gpuDriverJailEnabled (eq (get . "name") "nvidia-driver-root") }}
      {{- fail (printf ".Values.nodesets[%s].slurmd.volumes.customVolumeMounts uses reserved name \"nvidia-driver-root\". The chart owns this GPU driver jail mount; remove the custom mount." $ns.name) }}
      {{- else if and $gpuDriverJailEnabled (eq (get . "mountPath") "/run/nvidia/driver") }}
      {{- fail (printf ".Values.nodesets[%s].slurmd.volumes.customVolumeMounts uses mountPath \"/run/nvidia/driver\". The chart owns this GPU driver jail mount; use another mountPath." $ns.name) }}
      {{- end }}
      {{- end }}
      customVolumeMounts:
        {{- include "nodesets.slurmScriptMount" (list $ "slurm-scripts") | nindent 8 }}
        {{- include "nodesets.slurmScriptMount" (list $ "slurm-scripts-jail") | nindent 8 }}
        {{- if $gpuDriverJailEnabled }}
        {{- include "nodesets.gpuDriverJailMount" . | nindent 8 }}
        {{- end }}
        {{- range $customVolumeMounts }}
        {{- toYaml (list .) | nindent 8 }}
        {{- end }}

      {{- with (.sharedMemorySize | default "") }}
      sharedMemorySize: {{ . | quote }}
      {{- end }}
    {{- end }}

    security:
      limitsConfig: {{ get (.security | default dict) "limitsConfig" | quote }}
      appArmorProfile: {{ get (.security | default dict) "appArmorProfile" | default "unconfined" | quote }}
      {{- with get (.security | default dict) "procMount" }}
      procMount: {{ . | quote }}
      {{- end }}
  {{- end }}

  {{- with (required ".Values.nodesets[*].munge is required." .munge) }}
  munge:
    image:
    {{- if .image }}
    {{- with .image }}
      repository: {{ (required ".Values.nodesets[*].munge.image.repository is required as the custom image is used." .repository) | quote }}

      {{- with .tag }}
      tag: {{ . | quote }}
      {{- end }}

      pullPolicy: {{ default "IfNotPresent" .pullPolicy }}
    {{- end }}
    {{- else }}
      {{- include "nodesets.imageFromFlatString" (list $.Values.images.munge ".Values.images.munge is required as the default NodeSet munge image.") | nindent 6 }}
    {{- end }}

    {{- with (required ".Values.nodesets[*].munge.resources is required" .resources) }}
    resources:
      cpu: {{ required ".Values.nodesets[*].munge.resources.cpu is required" .cpu | quote }}
      memory: {{ required ".Values.nodesets[*].munge.resources.memory is required" .memory | quote }}
      {{- with .ephemeralStorage }}
      ephemeral-storage: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .livenessProbe }}
    livenessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .readinessProbe }}
    readinessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    security:
      limitsConfig: {{ get (.security | default dict) "limitsConfig" | quote }}
      appArmorProfile: {{ get (.security | default dict) "appArmorProfile" | default "unconfined" | quote }}
      {{- with get (.security | default dict) "procMount" }}
      procMount: {{ . | quote }}
      {{- end }}
  {{- end }}

  {{- $sssd := (.sssd | default dict) }}
  {{- if $sssd.enabled }}
  sssd:
    image:
    {{- if $sssd.image }}
    {{- with $sssd.image }}
      repository: {{ (required ".Values.nodesets[*].sssd.image.repository is required as the custom image is used." .repository) | quote }}

      {{- with .tag }}
      tag: {{ . | quote }}
      {{- end }}

      pullPolicy: {{ default "IfNotPresent" .pullPolicy }}
    {{- end }}
    {{- else }}
      {{- include "nodesets.imageFromFlatString" (list $.Values.images.sssd ".Values.images.sssd is required as the default NodeSet sssd image.") | nindent 6 }}
    {{- end }}

    resources:
      cpu: {{ default "200m" (get ($sssd.resources | default dict) "cpu") | quote }}
      memory: {{ default "500Mi" (get ($sssd.resources | default dict) "memory") | quote }}
      ephemeral-storage: {{ default "5Gi" (get ($sssd.resources | default dict) "ephemeralStorage") | quote }}
    {{- with $sssd.livenessProbe }}
    livenessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $sssd.readinessProbe }}
    readinessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    security:
      limitsConfig: {{ get ($sssd.security | default dict) "limitsConfig" | quote }}
      appArmorProfile: {{ get ($sssd.security | default dict) "appArmorProfile" | default "unconfined" | quote }}
      {{- with get ($sssd.security | default dict) "procMount" }}
      procMount: {{ . | quote }}
      {{- end }}
  {{- end }}

  sssdDebugLevel: {{ default 0 ($sssd.sssdDebugLevel | default 0) }}

  {{- with (.sssdConfSecretRefName | default "") }}
  sssdConfSecretRefName: {{ . | quote }}
  {{- end }}

  {{- with (.sssdLdapCAConfigMapRefName | default "") }}
  sssdLdapCAConfigMapRefName: {{ . | quote }}
  {{- end }}

  {{- with (.configMapRefSupervisord | default "") }}
  configMapRefSupervisord: {{ . | quote }}
  {{- end }}

  {{- with (.configMapRefSshd | default "") }}
  configMapRefSshd: {{ . | quote }}
  {{- end }}

  {{- with (.enableHostUserNamespace | default false) }}
  enableHostUserNamespace: {{ . }}
  {{- end }}

  {{- with (.priorityClass | default "") }}
  priorityClass: {{ . | quote }}
  {{- end }}

  {{- with .nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with (.affinity | default dict) }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with (.tolerations | default list) }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with (.workerAnnotations | default dict) }}
  workerAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- $customInitContainers := (.customInitContainers | default list) }}
  {{- range $customInitContainers }}
  {{- if and $gpuDriverJailEnabled (eq (get . "name") "cxcli-gpu-driver-jail") }}
  {{- fail (printf ".Values.nodesets[%s].customInitContainers uses reserved name \"cxcli-gpu-driver-jail\". The chart owns this GPU driver jail init guard; use another name." $ns.name) }}
  {{- end }}
  {{- end }}
  {{- if or $gpuDriverJailEnabled $customInitContainers }}
  customInitContainers:
    {{- if $gpuDriverJailEnabled }}
    {{- include "nodesets.gpuDriverJailInitContainer" (list $ $ns) | nindent 4 }}
    {{- end }}
    {{- with $customInitContainers }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
