{{- $type := include "slurm-cluster-storage.volume.jail.type" . }}
{{- $activePassive := eq (include "slurm-cluster-storage.jailRootfs.activePassive.enabled" .) "true" }}
{{- $mountPath := include "slurm-cluster-storage.volume.jail.path" . }}
{{- $mountPath = include "slurm-cluster-storage.safeAbsolutePath" (list "volume.jail.localPath" $mountPath) }}
{{- $createDirList := list }}
{{- if $activePassive }}
{{- $mountPath = include "slurm-cluster-storage.jailRootfs.store.path" . }}
{{- $rootfsPath := include "slurm-cluster-storage.jailRootfs.rootfs.path" . }}
{{- $allPaths := list (printf "%s/slot-a" $rootfsPath) (printf "%s/slot-b" $rootfsPath) }}
{{- range $mount := .Values.jailPersistentMounts }}
{{- $allPaths = append $allPaths (include "slurm-cluster-storage.jailPersistentMount.path" (list $ $mount)) }}
{{- end }}
{{- range $path := $allPaths }}
{{- if eq $path $mountPath }}
{{- fail "active/passive jail rootfs and persistent mount paths must be below jailRootfs.store.mountPath, not equal to it." }}
{{- end }}
{{- if not (hasPrefix (printf "%s/" $mountPath) $path) }}
{{- fail (printf "active/passive jail path %q must be below jailRootfs.store.mountPath %q." $path $mountPath) }}
{{- end }}
{{- $createDirList = append $createDirList (trimPrefix (printf "%s/" $mountPath) $path) }}
{{- end }}
{{- end }}
{{- $createDirs := join " " $createDirList }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "slurm-cluster-storage.volume.jail.mount" . }}
spec:
  selector:
    matchLabels:
      slurm: {{ include "slurm-cluster-storage.volume.jail.mount" . }}
  template:
    metadata:
      labels:
        slurm: {{ include "slurm-cluster-storage.volume.jail.mount" . }}
    spec:
{{- if eq $type "glusterfs" }}
      hostNetwork: true
      hostPID: true
      hostIPC: true
{{- end }}
      containers:
        - name: {{ cat "mount-jail" $type | include "mashedkebab" }}
{{- if or (eq $type "filestore") (eq $type "local") }}
          image: {{ include "slurm-cluster-storage.mount.image" . | quote }}
{{- else }}
          image: cr.eu-north1.nebius.cloud/ml-containers/neubuntu:noble-20260324150527
{{- end }}
          imagePullPolicy: {{ include "slurm-cluster-storage.mount.imagePullPolicy" . }}
          command:
            - /bin/sh
            - -c
{{- if eq $type "filestore" }}
            - /mount-scripts/ensure_mounted_filestore.sh -d {{ include "slurm-cluster-storage.volume.jail.device" . }} -p {{ $mountPath }} -s 60{{- if $createDirs }} -c "{{ $createDirs }}"{{- end }}
{{- else if eq $type "local" }}
            - mkdir -m 755 -p /host{{ $mountPath }}{{- range $path := $createDirList }} /host{{ $mountPath }}/{{ $path }}{{- end }} && while true; do sleep 3600; done
{{- else }}
            - /mount-scripts/ensure_mounted_glusterfs.sh -g {{ include "slurm-cluster-storage.volume.jail.hostname" . }} -p {{ $mountPath }} -s 60{{- if $createDirs }} -c "{{ $createDirs }}"{{- end }}
{{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-mount
              mountPath: /host/mnt
              mountPropagation: Bidirectional
            - name: mount-scripts
              mountPath: /mount-scripts
      volumes:
        - name: host-mount
          hostPath:
            path: /mnt
        - name: mount-scripts
          configMap:
            name: {{ include "slurm-cluster-storage.mountScriptsConfigMapName" . }}
            defaultMode: 0500
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
{{ .Values.storage.jail.matchExpressions | toYaml | indent 18 }}
      tolerations:
{{ .Values.storage.jail.tolerations | toYaml | indent 8 }}
