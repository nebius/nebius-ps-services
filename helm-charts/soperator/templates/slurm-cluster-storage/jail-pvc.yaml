{{- $activePassive := eq (include "slurm-cluster-storage.jailRootfs.activePassive.enabled" .) "true" }}
{{- $adoption := default dict .Values.jailRootfs.adoption }}
{{- $legacyActive := eq (default "" $adoption.activeSource) "legacy-rootfs" }}
{{- $legacyRollback := eq (default "" $adoption.rollbackSource) "legacy-rootfs" }}
{{- $managedLegacyPvc := include "slurm-cluster-storage.volume.jail.pvc" . | trimAll "\"" }}
{{- $legacyPvcName := default $managedLegacyPvc $adoption.legacyPvcName }}
{{- if and (or (not $activePassive) $legacyActive $legacyRollback) (eq $legacyPvcName $managedLegacyPvc) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "slurm-cluster-storage.volume.jail.pvc" . }}
  annotations:
    k8up.io/backup: 'true'
spec:
  storageClassName: {{ include "slurm-cluster-storage.volume.jail.storageClass" . }}
  resources:
    requests:
      storage: {{ include "slurm-cluster-storage.volume.jail.size" . }}
  accessModes:
    - ReadWriteMany
{{- end }}
