{{- if eq (include "slurm-cluster-storage.jailRootfs.activePassive.enabled" .) "true" }}
{{- range $slotName := list "slot-a" "slot-b" }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "slurm-cluster-storage.jailRootfs.slot.pv" (list $ $slotName) }}
spec:
  storageClassName: {{ include "slurm-cluster-storage.volume.jail.storageClass" $ }}
  volumeMode: Filesystem
  mountOptions:
    - rw
    - relatime
    - exec
    - dev
  capacity:
    storage: {{ include "slurm-cluster-storage.volume.jail.size" $ }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  local:
    path: {{ include "slurm-cluster-storage.jailRootfs.slot.path" (list $ $slotName) | quote }}
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ include "slurm-cluster-storage.jailRootfs.slot.pvc" (list $ $slotName) }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
{{ $.Values.storage.jail.matchExpressions | toYaml | indent 12 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ $.Release.Namespace }}
  name: {{ include "slurm-cluster-storage.jailRootfs.slot.pvc" (list $ $slotName) }}
  annotations:
    k8up.io/backup: 'true'
spec:
  storageClassName: {{ include "slurm-cluster-storage.volume.jail.storageClass" $ }}
  resources:
    requests:
      storage: {{ include "slurm-cluster-storage.volume.jail.size" $ }}
  accessModes:
    - ReadWriteMany
{{- end }}
{{- range $mount := .Values.jailPersistentMounts }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "slurm-cluster-storage.jailPersistentMount.pv" (list $ $mount) }}
spec:
  storageClassName: {{ include "slurm-cluster-storage.volume.jail.storageClass" $ }}
  volumeMode: Filesystem
  mountOptions:
    - rw
    - relatime
    - exec
    - dev
  capacity:
    storage: {{ include "slurm-cluster-storage.volume.jail.size" $ }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  local:
    path: {{ include "slurm-cluster-storage.jailPersistentMount.path" (list $ $mount) | quote }}
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ include "slurm-cluster-storage.jailPersistentMount.pvc" (list $ $mount) }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
{{ $.Values.storage.jail.matchExpressions | toYaml | indent 12 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ $.Release.Namespace }}
  name: {{ include "slurm-cluster-storage.jailPersistentMount.pvc" (list $ $mount) }}
  annotations:
    k8up.io/backup: 'true'
spec:
  storageClassName: {{ include "slurm-cluster-storage.volume.jail.storageClass" $ }}
  resources:
    requests:
      storage: {{ include "slurm-cluster-storage.volume.jail.size" $ }}
  accessModes:
    - ReadWriteMany
{{- end }}
{{- end }}
