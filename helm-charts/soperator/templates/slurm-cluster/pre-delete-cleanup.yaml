{{- if .Values.uninstallCleanup.enabled }}
{{- $cleanupName := printf "%s-pre-delete-cleanup" (include "slurm-cluster.name" .) | trunc 63 | trimSuffix "-" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-delete-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-4"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-delete-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
rules:
  - apiGroups:
      - slurm.nebius.ai
    resources:
      - slurmclusters
      - nodesets
      - nodeconfigurators
    verbs:
      - get
      - list
      - delete
  - apiGroups:
      - apps.kruise.io
    resources:
      - statefulsets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-delete-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cleanupName }}
subjects:
  - kind: ServiceAccount
    name: {{ $cleanupName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-delete-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-2"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "slurm-cluster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pre-delete-cleanup
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $cleanupName }}
      containers:
        - name: cleanup
          image: {{ required ".Values.uninstallCleanup.image.repository is required" .Values.uninstallCleanup.image.repository }}:{{ required ".Values.uninstallCleanup.image.tag is required" .Values.uninstallCleanup.image.tag }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.uninstallCleanup.image.pullPolicy }}
          env:
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: CLUSTER_NAME
              value: {{ include "slurm-cluster.name" . | quote }}
            - name: TIMEOUT_SECONDS
              value: {{ default 600 .Values.uninstallCleanup.timeoutSeconds | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ default 5 .Values.uninstallCleanup.pollIntervalSeconds | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              has_resource() {
                kubectl api-resources --api-group="$1" -o name | grep -qx "$2.$1"
              }

              count_resource() {
                if has_resource "$1" "$2"; then
                  kubectl -n "${RELEASE_NAMESPACE}" get "$2.$1" \
                    -l "app.kubernetes.io/instance=${RELEASE_NAME}" \
                    --no-headers 2>/dev/null | wc -l | tr -d ' '
                else
                  printf '0'
                fi
              }

              delete_resource() {
                if has_resource "$1" "$2"; then
                  kubectl -n "${RELEASE_NAMESPACE}" delete "$2.$1" \
                    -l "app.kubernetes.io/instance=${RELEASE_NAME}" \
                    --ignore-not-found --wait=false
                fi
              }

              delete_resource slurm.nebius.ai slurmclusters
              delete_resource slurm.nebius.ai nodesets
              delete_resource slurm.nebius.ai nodeconfigurators

              deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
              while [ "$(date +%s)" -le "${deadline}" ]; do
                slurm_remaining=$(( \
                  $(count_resource slurm.nebius.ai slurmclusters) + \
                  $(count_resource slurm.nebius.ai nodesets) + \
                  $(count_resource slurm.nebius.ai nodeconfigurators) ))

                kruise_remaining=0
                if has_resource apps.kruise.io statefulsets; then
                  kruise_remaining=$(kubectl -n "${RELEASE_NAMESPACE}" get statefulsets.apps.kruise.io \
                    -l "app.kubernetes.io/instance=${CLUSTER_NAME}" \
                    --no-headers 2>/dev/null | wc -l | tr -d ' ')
                fi

                if [ "${slurm_remaining}" -eq 0 ] && [ "${kruise_remaining}" -eq 0 ]; then
                  exit 0
                fi

                printf 'Waiting for Soperator cleanup: slurm_crs=%s kruise_statefulsets=%s\n' \
                  "${slurm_remaining}" "${kruise_remaining}"
                sleep "${POLL_INTERVAL_SECONDS}"
              done

              printf 'Timed out waiting for Soperator cleanup before OpenKruise uninstall.\n' >&2
              exit 1
{{- end }}
