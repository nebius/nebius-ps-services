{{- if .Values.qosConfiguration.enabled }}
{{- $name := printf "%s-qos-reconcile" (include "slurm-cluster.name" .) | trunc 63 | trimSuffix "-" -}}
{{- $cfg := .Values.qosConfiguration -}}
{{- $clusterName := include "slurm-cluster.name" . -}}
{{- $image := required "qosConfiguration.image is required when qosConfiguration.enabled is true; the chart ships a default kubectl image in values.yaml." $cfg.image -}}
{{- $jobCfg := $cfg.job | default dict -}}
{{- $filterName := get $jobCfg "k8sNodeFilterName" | default .Values.slurmNodes.controller.k8sNodeFilterName -}}
{{- $filter := dict -}}
{{- range .Values.k8sNodeFilters -}}
  {{- if eq .name $filterName -}}{{- $filter = . -}}{{- end -}}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: qos-reconcile
  annotations:
    "nebius-cxcli.nebius.ai/include-local-render": "true"
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": {{ default "10" $cfg.hookWeight | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: qos-reconcile
  annotations:
    "nebius-cxcli.nebius.ai/include-local-render": "true"
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": {{ default "10" $cfg.hookWeight | quote }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: qos-reconcile
  annotations:
    "nebius-cxcli.nebius.ai/include-local-render": "true"
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": {{ default "10" $cfg.hookWeight | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: qos-reconcile
  annotations:
    "nebius-cxcli.nebius.ai/include-local-render": "true"
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": {{ default "10" $cfg.hookWeight | quote }}
data:
  reconcile.sh: |
{{ include "renderQosReconcileScript" . | indent 4 }}
  driver.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    NS={{ .Release.Namespace | quote }}
    SELECTOR={{ printf "app.kubernetes.io/instance=%s,app.kubernetes.io/component=accounting" $clusterName | quote }}
    echo "[qos-reconcile] discovering accounting pod via label selector ${SELECTOR}"
    for i in $(seq 1 60); do
      POD=$(kubectl -n "${NS}" get pod -l "${SELECTOR}" --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
      if [ -n "${POD}" ]; then
        echo "[qos-reconcile] using accounting pod ${POD}"
        break
      fi
      echo "[qos-reconcile] no Running accounting pod yet (attempt ${i}); waiting"
      sleep 5
      if [ "$i" -eq 60 ]; then
        echo "[qos-reconcile] gave up waiting for a Running accounting pod" >&2
        exit 1
      fi
    done
    kubectl -n "${NS}" wait --for=condition=Ready "pod/${POD}" --timeout=300s
    kubectl -n "${NS}" exec -i "${POD}" -c accounting -- /bin/bash -s < /scripts/reconcile.sh
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: qos-reconcile
  annotations:
    "nebius-cxcli.nebius.ai/include-local-render": "true"
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": {{ default "10" $cfg.hookWeight | quote }}
spec:
  backoffLimit: {{ default 3 (get $jobCfg "backoffLimit") }}
  activeDeadlineSeconds: {{ default 1200 (get $jobCfg "activeDeadlineSeconds") }}
  ttlSecondsAfterFinished: {{ default 3600 (get $jobCfg "ttlSecondsAfterFinished") }}
  template:
    metadata:
      labels:
        {{- include "slurm-cluster.labels" . | nindent 8 }}
        app.kubernetes.io/component: qos-reconcile
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- $explicitNodeSelector := get $jobCfg "nodeSelector" -}}
      {{- $effectiveNodeSelector := dict -}}
      {{- if $explicitNodeSelector -}}
        {{- $effectiveNodeSelector = $explicitNodeSelector -}}
      {{- else if and $filter $filter.nodeSelector -}}
        {{- $effectiveNodeSelector = $filter.nodeSelector -}}
      {{- end -}}
      {{- if $effectiveNodeSelector }}
      nodeSelector:
        {{- toYaml $effectiveNodeSelector | nindent 8 }}
      {{- end }}
      {{- $explicitAffinity := get $jobCfg "affinity" -}}
      {{- $effectiveAffinity := dict -}}
      {{- if $explicitAffinity -}}
        {{- $effectiveAffinity = $explicitAffinity -}}
      {{- else if and $filter $filter.affinity -}}
        {{- $effectiveAffinity = $filter.affinity -}}
      {{- end -}}
      {{- if $effectiveAffinity }}
      affinity:
        {{- toYaml $effectiveAffinity | nindent 8 }}
      {{- end }}
      {{- $explicitTolerations := get $jobCfg "tolerations" | default list -}}
      {{- $effectiveTolerations := list -}}
      {{- if $explicitTolerations -}}
        {{- $effectiveTolerations = $explicitTolerations -}}
      {{- else if and $filter $filter.tolerations -}}
        {{- $effectiveTolerations = $filter.tolerations -}}
      {{- end -}}
      {{- if $effectiveTolerations }}
      tolerations:
        {{- toYaml $effectiveTolerations | nindent 8 }}
      {{- end }}
      containers:
        - name: qos-reconcile
          image: {{ $image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $cfg.imagePullPolicy | quote }}
          command: ["/bin/bash", "/scripts/driver.sh"]
          {{- with (get $jobCfg "resources") }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}-script
            defaultMode: 0755
{{- end }}
