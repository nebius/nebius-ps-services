suite: large-cluster tuning surface
templates:
  - templates/slurm-cluster/slurm-cluster-cr.yaml
  - templates/soperator/deployment.yaml
tests:
  - it: emits Include= line when partitionConfiguration.includeFile is set
    template: templates/slurm-cluster/slurm-cluster-cr.yaml
    set:
      partitionConfiguration:
        includeFile: /etc/slurm/partitions.conf
    asserts:
      - matchRegex:
          path: spec.customSlurmConfig
          pattern: "Include=/etc/slurm/partitions.conf"

  - it: keeps customSlurmConfig clean when includeFile is empty
    template: templates/slurm-cluster/slurm-cluster-cr.yaml
    set:
      partitionConfiguration:
        includeFile: ""
    asserts:
      - notMatchRegex:
          path: spec.customSlurmConfig
          pattern: "Include="

  - it: emits KUBE_API_QPS and KUBE_API_BURST when kubeClient knobs are set
    template: templates/soperator/deployment.yaml
    set:
      controllerManager:
        manager:
          kubeClient:
            qps: "100"
            burst: "200"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_API_QPS
            value: "100"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_API_BURST
            value: "200"

  - it: omits kubeClient env when knobs are empty (default)
    template: templates/soperator/deployment.yaml
    set:
      controllerManager:
        manager:
          kubeClient:
            qps: ""
            burst: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_API_QPS
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_API_BURST
