suite: mixed CPU and GPU worker NodeSets
templates:
  - templates/nodesets/nodeset.yaml
  - templates/slurm-cluster/slurm-cluster-cr.yaml
tests:
  - it: renders separate CPU and GPU worker NodeSets
    template: templates/nodesets/nodeset.yaml
    set:
      nodesets:
        - name: worker-cpu
          replicas: 2
          gpu:
            enabled: false
          nodeSelector:
            slurm.nebius.ai/nodeset-name: worker-cpu
          slurmd:
            resources:
              cpu: "4"
              memory: 16Gi
            volumes:
              spool:
                emptyDir: {}
              jail:
                emptyDir: {}
          munge:
            resources:
              cpu: 100m
              memory: 128Mi
        - name: worker-gpu
          replicas: 3
          gpu:
            enabled: true
            nvidia:
              gdrCopyEnabled: true
          nodeSelector:
            slurm.nebius.ai/nodeset-name: worker-gpu
          slurmd:
            resources:
              cpu: "64"
              memory: 512Gi
              gpu: 8
            volumes:
              spool:
                emptyDir: {}
              jail:
                emptyDir: {}
          munge:
            resources:
              cpu: 100m
              memory: 128Mi
    asserts:
      - equal:
          path: metadata.name
          value: worker-cpu
        documentIndex: 0
      - equal:
          path: spec.replicas
          value: 2
        documentIndex: 0
      - equal:
          path: spec.gpu.enabled
          value: false
        documentIndex: 0
      - equal:
          path: spec.nodeSelector
          value:
            slurm.nebius.ai/nodeset-name: worker-cpu
        documentIndex: 0
      - notExists:
          path: spec.customInitContainers
        documentIndex: 0
      - notExists:
          path: spec.slurmd.volumes.customVolumeMounts[2]
        documentIndex: 0
      - equal:
          path: metadata.name
          value: worker-gpu
        documentIndex: 1
      - equal:
          path: spec.replicas
          value: 3
        documentIndex: 1
      - equal:
          path: spec.gpu.enabled
          value: true
        documentIndex: 1
      - equal:
          path: spec.nodeSelector
          value:
            slurm.nebius.ai/nodeset-name: worker-gpu
        documentIndex: 1
      - equal:
          path: spec.slurmd.volumes.customVolumeMounts[2]
          value:
            name: nvidia-driver-root
            mountPath: /run/nvidia/driver
            readOnly: false
            volumeSource:
              hostPath:
                path: /
                type: ""
        documentIndex: 1
      - equal:
          path: spec.customInitContainers[0].name
          value: cxcli-gpu-driver-jail
        documentIndex: 1
      - equal:
          path: spec.customInitContainers[0].image
          value: cr.eu-north1.nebius.cloud/soperator/worker_slurmd:4.0.2-slurm25.11.3
        documentIndex: 1
      - equal:
          path: spec.customInitContainers[0].volumeMounts
          value:
            - name: jail
              mountPath: /mnt/jail
            - name: nvidia-driver-root
              mountPath: /run/nvidia/driver
        documentIndex: 1

  - it: renders generated mixed shard NodeSet refs in SlurmCluster partitions
    template: templates/slurm-cluster/slurm-cluster-cr.yaml
    set:
      partitionConfiguration:
        configType: structured
        partitions:
          - name: cpu
            nodeSetRefs:
              - worker-cpu-0
              - worker-cpu-1
            policy:
              default: true
              state: UP
              maxTime: INFINITE
              priorityTier: 5
          - name: gpu
            nodeSetRefs:
              - worker-gpu-0
            policy:
              default: false
              state: UP
              maxTime: INFINITE
              priorityTier: 10
      nodesets:
        - name: worker-cpu-0
          slurmd:
            resources:
              cpu: "4"
              memory: 16Gi
            volumes:
              spool:
                emptyDir: {}
              jail:
                emptyDir: {}
          munge:
            resources:
              cpu: 100m
              memory: 128Mi
        - name: worker-cpu-1
          slurmd:
            resources:
              cpu: "4"
              memory: 16Gi
            volumes:
              spool:
                emptyDir: {}
              jail:
                emptyDir: {}
          munge:
            resources:
              cpu: 100m
              memory: 128Mi
        - name: worker-gpu-0
          gpu:
            enabled: true
          slurmd:
            resources:
              cpu: "64"
              memory: 512Gi
              gpu: 8
            volumes:
              spool:
                emptyDir: {}
              jail:
                emptyDir: {}
          munge:
            resources:
              cpu: 100m
              memory: 128Mi
    asserts:
      - equal:
          path: spec.partitionConfiguration.partitions[0].nodeSetRefs
          value:
            - worker-cpu-0
            - worker-cpu-1
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "Default=YES"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "PriorityTier=5"
      - equal:
          path: spec.partitionConfiguration.partitions[1].nodeSetRefs
          value:
            - worker-gpu-0
      - matchRegex:
          path: spec.partitionConfiguration.partitions[1].config
          pattern: "Default=NO"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[1].config
          pattern: "PriorityTier=10"
