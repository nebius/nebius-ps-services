suite: partition .policy typed surface
templates:
  - templates/slurm-cluster/slurm-cluster-cr.yaml
tests:
  - it: renders default partitions from typed policy blocks
    asserts:
      - equal:
          path: spec.partitionConfiguration.partitions[0].name
          value: main
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "Default=YES"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "State=UP"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "MaxTime=INFINITE"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "PriorityTier=10"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "OverSubscribe=YES"
      - notMatchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "Hidden="
      - matchRegex:
          path: spec.partitionConfiguration.partitions[1].config
          pattern: "Hidden=YES"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[1].config
          pattern: "PreemptMode=OFF"

  - it: emits AllowAccounts and AllowQos as comma-joined values
    set:
      partitionConfiguration:
        configType: structured
        partitions:
          - name: track1
            policy:
              default: false
              state: UP
              maxTime: "1-00:00:00"
              priorityTier: 10
              allowAccounts: [track1, project-x]
              allowQos: [normal, high]
    asserts:
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "AllowAccounts=track1,project-x"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "AllowQos=normal,high"
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "PriorityTier=10"

  - it: concatenates typed policy with raw config escape hatch
    set:
      partitionConfiguration:
        configType: structured
        partitions:
          - name: research
            policy:
              default: true
              priorityTier: 10
            config: "MaxNodes=128 OverTimeLimit=10"
    asserts:
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "^Default=YES PriorityTier=10 MaxNodes=128 OverTimeLimit=10$"

  - it: fails when typed policy field collides with raw config token
    set:
      partitionConfiguration:
        configType: structured
        partitions:
          - name: main
            isAll: true
            policy:
              priorityTier: 10
            config: "PriorityTier=99 OverSubscribe=YES"
    asserts:
      - failedTemplate:
          errorMessage: 'partitionConfiguration.partitions[name="main"].policy.priorityTier is set as a typed field, but the same partition''s .config also contains a raw PriorityTier= token. Pick one source: either remove PriorityTier= from .config, or unset .policy.priorityTier.'

  - it: emits Hidden=NO when explicitly set to false
    set:
      partitionConfiguration:
        configType: structured
        partitions:
          - name: visible
            policy:
              hidden: false
              priorityTier: 5
    asserts:
      - matchRegex:
          path: spec.partitionConfiguration.partitions[0].config
          pattern: "Hidden=NO"

  - it: skips empty policy fields cleanly
    set:
      partitionConfiguration:
        configType: structured
        partitions:
          - name: bare
            policy:
              priorityTier: 1
    asserts:
      - equal:
          path: spec.partitionConfiguration.partitions[0].config
          value: "PriorityTier=1"
