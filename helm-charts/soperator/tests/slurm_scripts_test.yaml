suite: slurmScripts built-in file overrides
templates:
  - templates/slurm-cluster/slurm-scripts-cm.yaml
tests:
  - it: renders built-in script content from customContentFile
    set:
      slurmScripts:
        builtIn:
          cleanup_enroot.sh:
            enabled: true
            customContent: null
            customContentFile: local_slurm_scripts/cleanup_enroot.sh
            customConfig: null
    asserts:
      - matchRegex:
          path: data["cleanup_enroot.sh"]
          pattern: "Cleanup leftover Enroot containers for this job"
      - matchRegex:
          path: data["cleanup_enroot.sh"]
          pattern: "pyxis_\\$\\{SLURM_JOB_ID\\}"

  - it: fails when customContentFile references a missing chart file
    set:
      slurmScripts:
        builtIn:
          cleanup_enroot.sh:
            enabled: true
            customContent: null
            customContentFile: local_slurm_scripts/does-not-exist.sh
            customConfig: null
    asserts:
      - failedTemplate:
          errorMessage: 'slurmScripts.builtIn.cleanup_enroot.sh.customContentFile references missing file "local_slurm_scripts/does-not-exist.sh"'
