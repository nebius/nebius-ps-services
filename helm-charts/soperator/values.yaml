      customConfig: null
    chmod_enroot_layers.sh:
      enabled: true
      customContent: null
      customConfig: null
    cleanup_enroot.sh:
      enabled: true
      customContent: null
      customContentFile: local_slurm_scripts/cleanup_enroot.sh
      customConfig: null
    cleanup_scratch_data.sh:
      enabled: true
      customContent: null
      customConfig: null
    drop_page_cache.sh:
      enabled: true
      customContent: null
      customConfig: null
    drop_posix_shmem.sh:
      enabled: true
      customContent: null
      customConfig: null
    gpu_health_check.py:
      enabled: true
