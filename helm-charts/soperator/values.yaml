# ---------------------------------------------------------------------------
# SlurmCluster identity and global behavior
# ---------------------------------------------------------------------------

# Kubernetes-safe SlurmCluster name. Keep this to 38 lowercase DNS-label
# characters or fewer, starting with a letter, so generated suffixed resources
# stay within 63 chars.
clusterName: "soperator"
# Additional annotations on the rendered SlurmCluster.
annotations: {}
# Add AppArmor profile to the cluster. The default worker security profile below
# is intentionally unconfined for the Slurm chroot/pyxis runtime used by the
# pinned Soperator images; tighten per component only after validating that path.
useDefaultAppArmorProfile: false
# Maintenance action applied by Soperator.
# It can have the following values:
# - none: No maintenance is performed. The cluster operates normally.
# - downscale: Scales down all components to 0.
# - downscaleAndDeletePopulateJail: Scales down all components to 0 and deletes the populateJail Job.
# - skipPopulateJail: Skips the execution of the populateJail job during maintenance.
maintenance: "none"
# Slurm cluster type. Use gpu when any worker NodeSet requests GPUs.
clusterType: gpu
# CUDA version used for populate-jail image selection.
cudaVersion: 12.9.0
# ---------------------------------------------------------------------------
# Optional Soperator-family child charts
# ---------------------------------------------------------------------------

# These charts are packaged as optional dependencies of this parent chart so
# cxcli can expose one Soperator app while preserving opt-in feature behavior.
# Keep this section to parent-owned integration overrides; each child chart
# retains its full default values in its own chart folder.
soperator-checks:
  enabled: false
  fullnameOverride: soperator-checks
  serviceMonitor:
    enabled: false
soperator-activechecks:
  enabled: false
  fullnameOverride: soperator-activechecks
  slurmClusterRefName: soperator
  waitForChecks:
    enabled: false
  # Keep active checks safe by default: install definitions only when enabled,
  # do not block Helm on check completion, and do not immediately launch
  # expensive GPU, NCCL, jail, or prepull jobs.
  checks:
    all-reduce-perf-nccl-in-docker:
      runAfterCreation: false
    all-reduce-perf-nccl-with-ib:
      runAfterCreation: false
    all-reduce-perf-nccl-without-ib:
      runAfterCreation: false
    cuda-samples:
      runAfterCreation: false
    dcgmi-diag-r2:
      runAfterCreation: false
    dcgmi-diag-r3:
      runAfterCreation: false
    gpu-fryer:
      runAfterCreation: false
    ib-gpu-perf:
      runAfterCreation: false
    manage-jail-state:
      runAfterCreation: false
    mem-perf:
      runAfterCreation: false
    prepull-container-image:
      runAfterCreation: false
soperator-notifier:
  enabled: false
  fullnameOverride: soperator-notifier
  slack:
    mode: existing-webhook
    webhookSource: deploy-time
    existingSecret: soperator-notifier-slack-webhook
    existingSecretKey: url
    channelName: ""
    channelId: ""
    mysterybox:
      secretId: ""
      property: url
    oauth:
      clientId: ""
      redirectUri: ""
soperator-backup-config:
  enabled: false
  fullnameOverride: soperator-jail-backup
  secret:
    name: jail-backup
    keys:
      accessKeyID: aws-access-key-id
      secretAccessKey: aws-access-secret-key
      backupPassword: backup-password
soperator-dcgm-exporter:
  enabled: false
  fullnameOverride: soperator-dcgm-exporter
  serviceMonitor:
    enabled: false
# ---------------------------------------------------------------------------
# Slurm partition, node filter, and volume source model
# ---------------------------------------------------------------------------

# Slurm partition configuration for worker NodeSets.
# https://slurm.schedmd.com/slurm.conf.html#SECTION_PARTITION-CONFIGURATION
partitionConfiguration:
  # configType selects how Soperator generates partition lines.
  # - default: generates upstream standard partitions without explicit NodeSet registration
  # - custom: uses raw partition configuration strings from rawConfig
  # - structured: enables NodeSet references and structured partition definitions
  configType: "structured"
  # Optional Slurm.conf Include= directive. When set, a single
  # `Include=<path>` line is appended to customSlurmConfig so operators or
  # customers can hand-edit a partition file mounted into the controller
  # outside the chart-managed partition list. Use this only when the
  # mounted path is provisioned by external IaC; the chart does not create
  # the included file or its volume mount.
  includeFile: ""
  # Raw Slurm partition lines. Used only when configType is "custom".
  rawConfig: []
  #    - PartitionName=low_priority Nodes=low_priority Default=YES MaxTime=INFINITE State=UP PriorityTier=1
  #    - PartitionName=high_priority  Nodes=high_priority Default=NO MaxTime=INFINITE State=UP PriorityTier=2
  # If Nodes present, they must not contain node names: use only nodeset values, "ALL" or "".
  # Specifying specific nodes is not supported since Dynamic Nodes are used.
  # For more details, see https://slurm.schedmd.com/dynamic_nodes.html#partitions.

  # Structured partitions. Used only when configType is "structured".
  #
  # Each partition supports a typed `policy` block plus a free-form `config`
  # escape hatch. The renderer joins typed `policy` tokens first, then appends
  # `config` verbatim, so an unmodeled Slurm.conf knob can still be set via
  # `config`. Setting the same key in both `policy` and `config` (e.g.
  # PriorityTier in `config` while policy.priorityTier is non-null) fails the
  # template render to prevent silent overrides.
  #
  # `policy` fields (all nullable; null means "do not emit"):
  #   priorityTier        integer; scheduler evaluation tier
  #   preemptMode         OFF|CANCEL|REQUEUE|SUSPEND|GANG (or comma-joined)
  #   default             bool; sets Default=YES/NO
  #   hidden              bool; sets Hidden=YES/NO
  #   state               UP|DOWN|DRAIN|INACTIVE
  #   maxTime             Slurm time spec (e.g. "1-00:00:00", "INFINITE")
  #   defaultTime         Slurm time spec
  #   defMemPerNode       integer (MB)
  #   defMemPerCPU        integer (MB); mutually exclusive with defMemPerNode
  #   defMemPerGPU        integer (MB)
  #   defCpuPerGPU        integer
  #   overSubscribe       NO|YES|EXCLUSIVE|FORCE[:N]
  #   allowAccounts       list of account names (joined with comma)
  #   allowQos            list of QOS names
  #   denyAccounts        list of account names
  #   denyQos             list of QOS names
  partitions:
    - name: "main"
      isAll: true
      policy:
        default: true
        maxTime: "INFINITE"
        state: "UP"
        priorityTier: 10
        overSubscribe: "YES"
    - name: "hidden"
      isAll: true
      policy:
        default: false
        hidden: true
        maxTime: "INFINITE"
        state: "UP"
        priorityTier: 10
        preemptMode: "OFF"
        overSubscribe: "YES"
        # Example partitions with NodeSet references:
        #  - name: "gpu"
        #    nodeSetRefs:
        #      - "gpu-nodesets"
        #    policy:
        #      default: true
        #      maxTime: "8:00:00"
        #      priorityTier: 10
        #      allowQos: ["normal", "high"]
        #  - name: "cpu"
        #    nodeSetRefs:
        #      - "cpu-nodesets"
        #    policy:
        #      maxTime: "INFINITE"
        #      priorityTier: 5
        #    config: "OverSubscribe=YES"   # escape hatch, appended after typed tokens
# Slurm features are defined per worker NodeSet under nodesets[].nodeConfig.features.
# Partitions reference NodeSet names through partitionConfiguration.partitions[].nodeSetRefs.
# To expose hardware labels such as h100, highmem, or infiniband, put those labels
# on the matching homogeneous NodeSet and optionally create a partition that points
# to that NodeSet.

# Optional Slurm health check override. When null and clusterType is gpu, the
# chart renders the default GPU health check program from slurm-scripts.
healthCheckConfig: null
# Kubernetes node filters used by SlurmCluster roles such as controller, login,
# accounting, exporter, REST, and populateJail. Worker NodeSets schedule through
# nodesets[].nodeSelector and tolerations instead of this list.
k8sNodeFilters:
  - name: no-gpu
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "nebius.com/gpu"
                  operator: NotIn
                  values:
                    - "true"
  - name: system
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "slurm.nebius.ai/nodeset-name"
                  operator: In
                  values:
                    - "system"
  - name: controller
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "slurm.nebius.ai/nodeset-name"
                  operator: In
                  values:
                    - "controller"
    tolerations:
      - key: "slurm.nebius.ai/nodeset-name"
        operator: "Equal"
        value: "controller"
        effect: "NoSchedule"
  - name: login
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "slurm.nebius.ai/nodeset-name"
                  operator: In
                  values:
                    - "login"
    tolerations:
      - key: "slurm.nebius.ai/nodeset-name"
        operator: "Equal"
        value: "login"
        effect: "NoSchedule"
  - name: accounting
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "slurm.nebius.ai/nodeset-name"
                  operator: In
                  values:
                    - "accounting"
    tolerations:
      - key: "slurm.nebius.ai/nodeset-name"
        operator: "Equal"
        value: "accounting"
        effect: "NoSchedule"
# Volume sources exposed to Soperator in SlurmCluster.spec.volumeSources.
# Defaults point at chart-managed PVC names. Set createPVC=true only for an
# extra generic PVC created from this list; the default jail/controller-spool
# PVCs are managed by templates/slurm-cluster-storage/.
volumeSources:
  - name: controller-spool
    createPVC: false
    storageClassName: ""
    size: ""
    persistentVolumeClaim:
      claimName: "controller-spool-pvc"
      readOnly: false
#  - name: jail-snapshot
#    createPVC: false
#    storageClassName: ""
#    size: ""
#    persistentVolumeClaim:
#      claimName: "jail-snapshot-pvc"
#      readOnly: true
#  - name: mlperf-sd
#    createPVC: false
#    storageClassName: ""
#    size: ""
#    persistentVolumeClaim:
#      claimName: "jail-submount-mlperf-sd-pvc"
#      readOnly: false

# Secret references needed for Slurm cluster operation.
secrets: {}
# Example: secret reference for login sshd. If the name is empty, Soperator
# generates its own SSH host key secret.
# sshdKeysName: ""

# ---------------------------------------------------------------------------
# Slurm configuration and populate-jail
# ---------------------------------------------------------------------------

# Job that initializes the shared jail filesystem.
populateJail:
  imagePullPolicy: "IfNotPresent"
  appArmorProfile: "unconfined"
  # Name of the k8sNodeFilters entry used for the populateJail pod.
  k8sNodeFilterName: "system"
  # Uncomment to control whether pod containers use the host user namespace.
  # hostUsers: false
  # Optional volume containing custom initial jail content. When null, the
  # default populate-jail image content is used.
  jailSnapshotVolume: null
  #  jailSnapshotVolume:
  #    volumeSourceName: "jail-snapshot"
  overwrite: false
slurmConfig:
  # Soperator 4.0.2 defaults defMemPerNode to 0 in the CRD. Do not add
  # DefMemPerCPU to customSlurmConfig; Slurm treats it as mutually exclusive
  # with DefMemPerNode. For GPU workers, prefer DefMemPerGPU with DefCpuPerGPU.
  defMemPerNode: 0
  defCpuPerGPU: 4
  completeWait: 5
  prolog: /opt/slurm_scripts/prolog.sh
  epilog: /opt/slurm_scripts/epilog.sh
  taskPluginParam: ""
  maxJobCount: 20000
  minJobAge: 3600
  messageTimeout: 60
  # Leave Slurm topology disabled by default so the chart can run on generic
  # Kubernetes clusters without Soperator tier labels. Set topologyPlugin to
  # "topology/tree" or "topology/block" only when worker nodes expose accurate
  # <controllerManager.manager.env.topologyLabelPrefix>/tier-* labels. This is
  # separate from the five-role Soperator production shape; topology optimizes
  # worker placement for distributed jobs and depends on truthful fabric labels.
  topologyPlugin: ""
  topologyParam: ""
# Raw Slurm.conf escape hatch for settings not modeled by this chart.
# Keep this empty by default: Slurm treats a missing directory in PluginDir as
# fatal, so static multi-architecture PluginDir overrides are unsafe across GPU
# platforms. The pinned Soperator images should own their plugin path defaults.
customSlurmConfig: ""
# Typed Slurm scheduling, accounting-enforcement, and preemption surface. Each
# non-null/non-empty key is rendered as a Slurm.conf line and appended to
# customSlurmConfig at template time. The Soperator CRD does not type these
# fields directly, so this block is the chart's contract for IaC-managed Slurm
# policy.
#
# Setting the same key in both this block and customSlurmConfig (raw) fails
# the template render to prevent silent overrides. Use the typed surface as
# the source of truth and reserve customSlurmConfig for keys not modeled here.
#
# Reference: Slurm scheduling and preemption behavior. See the chart design
# guide for the public policy model and supported typed fields.
schedulingConfig: {}
# Each field below is optional. Set only what you intend to emit; absent
# keys mean "do not emit" and Slurm uses its built-in defaults.
#
# preemptType:
#   Global preemption plugin. Selects which running jobs are preemption
#   victims. One of: preempt/partition_prio, preempt/qos, preempt/none.
#
# accountingStorageEnforce:
#   List of AccountingStorageEnforce tokens, comma-joined into Slurm.conf.
#   Common QOS/fairshare enforcement uses [associations, limits, qos].
#   Valid tokens include: all, associations, limits, nojobs, nosteps, qos,
#   safe, wckeys.
#
# enforcePartLimits:
#   Submit-time partition-limit enforcement. One of: ALL, ANY, NO.
#   Common QOS partition profiles use ANY so multi-partition submissions are
#   accepted when at least one requested partition satisfies the limits.
#
# preemptMode:
#   Cluster-wide default preemption mode applied to victim jobs.
#   Partitions and QOS can override per-victim. One of: OFF, CANCEL,
#   REQUEUE, SUSPEND, GANG (or a comma-joined combination, e.g.
#   "REQUEUE,GANG"). For REQUEUE to take effect, victim jobs must be
#   submitted with --requeue or schedulingConfig.jobRequeue must be 1.
#
# preemptParameters:
#   List of PreemptParameters tokens (comma-joined into the Slurm.conf
#   value). Common: send_user_signal, youngest_first, reclaim_licenses,
#   strict_order.
#
# jobRequeue:
#   Cluster-wide default for whether jobs are requeueable. 0 disables
#   global requeue; 1 enables it for jobs without explicit --requeue or
#   --no-requeue.
#
# schedulerType:
#   Scheduler plugin. Typical: sched/backfill (default), sched/builtin.
#
# schedulerParameters:
#   List of SchedulerParameters tokens (comma-joined). Used for
#   large-cluster tuning (sched_min_interval, max_depend_depth,
#   bf_continue, bf_max_job_test, ...).
#
# priorityType:
#   PriorityType plugin. Typical: priority/multifactor, priority/basic.
#
# priorityWeights:
#   age:       integer; PriorityWeightAge multiplier for queue wait time.
#   assoc:     integer; PriorityWeightAssoc multiplier for association
#     priority.
#   fairshare: integer; PriorityWeightFairshare multiplier for accounting
#     fair-share.
#   partition: integer; PriorityWeightPartition multiplier for the
#     partition's priority job factor in the multifactor priority formula.
#   jobSize:   integer; PriorityWeightJobSize multiplier for the job-size
#     component.
#   qos:       integer; PriorityWeightQOS multiplier for QOS priority.
#   tres:      string; PriorityWeightTRES list, for example
#     "gres/gpu=1000,cpu=100".
#
# Example:
#   schedulingConfig:
#     preemptType: preempt/partition_prio
#     accountingStorageEnforce: [associations, limits, qos]
#     enforcePartLimits: ANY
#     preemptMode: REQUEUE
#     preemptParameters: [send_user_signal]
#     jobRequeue: 1
#     schedulerParameters:
#       - sched_min_interval=2000000
#       - bf_max_job_test=2000
#     priorityType: priority/multifactor
#     priorityWeights:
#       partition: 1000
#       jobSize: 500
#       qos: 1000

# Optional declarative QOS lifecycle. When enabled, a post-install /
# post-upgrade Helm hook Job runs `sacctmgr` against the live SlurmDBD to
# reconcile accounts, QOS objects, and user/account associations defined
# here. The Job is idempotent (`sacctmgr -i` adds when absent, modifies
# when present) and ttl-cleans itself after completion.
#
# Reference: Slurm accounting and QOS lifecycle. See the chart design guide
# for the public reconciliation model and supported typed fields.
#
# Managed Soperator (Nebius AI Cloud Console) does not expose the
# operator namespace, so this Job cannot run there. Keep `enabled: false`
# for Managed Soperator and request QOS changes through Nebius support.
qosConfiguration:
  enabled: false
  # kubectl-capable image used by the reconcile Job. The Job itself only
  # needs Bash plus `kubectl wait` and `kubectl exec`; the actual `sacctmgr`
  # commands run inside the accounting pod's already-authenticated container
  # so the Job does not need to mount the munge key or know the SlurmDBD
  # endpoint.
  image: "alpine/k8s:1.33.5"
  imagePullPolicy: "IfNotPresent"
  # Helm hook ordering. Runs after the SlurmCluster CR is applied; allow
  # SlurmDBD time to come up before reconciling QOS.
  hookWeight: "10"
  # Job-level controls. Override per-cluster to tune cleanup and retry.
  job:
    backoffLimit: 3
    activeDeadlineSeconds: 1200
    ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    nodeSelector: {}
    tolerations: []
    affinity: {}
    # K8s node filter to run the reconcile Job on. Defaults to the same
    # filter Soperator uses for the controller role so the Job lands close
    # to slurmctld and shares its tolerations.
    k8sNodeFilterName: ""
  # Optional shell snippet executed before the reconcile loop. Use this
  # for cluster-specific setup such as exporting a SLURM_CONF override.
  # The chart ships an empty default; the reconcile script always sources
  # /etc/profile.d/slurm.sh when present.
  preReconcileScript: ""
  # Declarative QOS payload. Each list is optional; absent lists mean "do
  # not touch that resource class". Reconcile order is fixed:
  # accounts -> qos -> associations, matching sacctmgr's documented order.
  accounts: []
  #  - name: project1
  #    organization: ""        # optional
  #    description: ""         # optional
  #    parent: ""              # optional parent account name
  qos: []
  #  - name: high
  #    priority: 1000          # optional integer
  #    maxJobs: 200            # optional integer
  #    maxWallSeconds: 7200    # optional integer; rendered as MaxWall=HH:MM:SS
  #    maxTRES: ""             # optional Slurm TRES spec
  #    maxTRESPerJob: ""       # optional
  #    flags: []               # optional list, comma-joined into Flags=
  #    preempt: []             # optional list of QOS names this QOS may
  #                            # preempt (only meaningful under
  #                            # schedulingConfig.preemptType=preempt/qos)
  #    preemptMode: ""         # optional override (CLUSTER, CANCEL, REQUEUE, ...)
  associations: []
  #  - user: alice
  #    account: project1
  #    defaultQos: high
  #    qos: [normal, high]     # optional list of allowed QOS for this user
  #    partition: ""           # optional partition scope
  #    fairshare: ""            # optional integer or "parent"
customCgroupConfig: ""
mpiConfig:
  # Override this if the primary MPI data-plane interface is not eth0.
  pmixEnv: "OMPI_MCA_btl_tcp_if_include=eth0"
plugStackConfig:
  pyxis:
    required: true
    containerImageSave: "/var/cache/enroot-container-images/"
  ncclDebug:
    required: false
    enabled: true
    logLevel: "INFO"
    outputToFile: true
    outputToStdOut: false
    outputDirectory: "/opt/soperator-outputs/nccl_logs"
  customPlugins: []
#  customPlugins:
#    - required: true
#      path: custom.so
#      arguments:
#        foo: bar

# ---------------------------------------------------------------------------
# SlurmCluster role configuration
# ---------------------------------------------------------------------------
slurmNodes:
  sssd:
    enabled: false
    # Optional per-cluster SSSD image override. Defaults to images.sssd.
    image: ""
    sssdDebugLevel: 0
    imagePullPolicy: "IfNotPresent"
    appArmorProfile: "unconfined"
    command: []
    args: []
    livenessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - test -S /var/lib/sss/pipes/nss && test -S /var/lib/sss/pipes/pam
      timeoutSeconds: 1
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    readinessProbe:
      exec:
        command:
          - /bin/sh
          - -c
          - test -S /var/lib/sss/pipes/nss && test -S /var/lib/sss/pipes/pam
      timeoutSeconds: 1
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    resources:
      cpu: "200m"
      memory: "500Mi"
      ephemeralStorage: "5Gi"
    sssdConfSecretRefName: ""
    sssdLdapCAConfigMapRefName: ""
  accounting:
    enabled: true
    k8sNodeFilterName: "accounting"
    # Uncomment to control whether pod containers use the host user namespace.
    # hostUsers: false
    slurmConfig:
      accountingStorageTRES: "CPU,Mem,Node,VMem,Gres/gpu"
      jobAcctGatherType: "jobacct_gather/cgroup"
      jobAcctGatherFrequency: 0
      priorityWeightAge: 0
      priorityWeightFairshare: 0
      priorityWeightQOS: 0
    slurmdbdConfig:
      archiveEvents: "yes"
      archiveJobs: "yes"
      archiveResvs: "yes"
      archiveSteps: "no"
      archiveSuspend: "no"
      archiveTXN: "no"
      archiveUsage: "yes"
      debugLevel: "info"
      tcpTimeout: 2
      purgeEventAfter: "1month"
      purgeJobAfter: "12month"
      purgeResvAfter: "1month"
      purgeStepAfter: "1month"
      purgeSuspendAfter: "1month"
      purgeTXNAfter: "12month"
      purgeUsageAfter: "24month"
    slurmdbd:
      imagePullPolicy: "IfNotPresent"
      appArmorProfile: "unconfined"
      command: []
      args: []
      readinessProbe:
        tcpSocket:
          port: 6819
        failureThreshold: 3
        initialDelaySeconds: 1
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 1
      port: 6819
      resources:
        cpu: "1000m"
        memory: "3Gi"
        ephemeralStorage: "10Gi"
    munge:
      imagePullPolicy: "IfNotPresent"
      appArmorProfile: "unconfined"
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - /usr/bin/munge -n > /dev/null && exit 0 || exit 1
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 3
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - test -S /run/munge/munge.socket.2
        timeoutSeconds: 1
        periodSeconds: 10
        successThreshold: 1
        failureThreshold: 3
      resources:
        cpu: "1000m"
        memory: "1Gi"
        ephemeralStorage: "5Gi"
    customInitContainers: []
    externalDB:
      enabled: false
      # host: ""
      port: 3306
      # user: ""
      # passwordSecretKeyRef:
      #   name: ""
      #   key: ""
      # tls:
      #   serverCASecretRef: ""
      #   clientCertSecretRef: ""
      # storageParameters:
      #   SSL_CIPHER: ""
    mariadbOperator:
      enabled: true
      protectedSecret: false
      resources:
        cpu: "1000m"
        memory: "1Gi"
        ephemeralStorage: "5Gi"
      replicas: 1
      replication: {}
      # enabled: false
      # primary: {}
