# ---------------------------------------------------------------------------
# Soperator operator deployment and webhooks
# ---------------------------------------------------------------------------

# Soperator operator defaults imported from upstream 4.0.2. DCGM Exporter is
# intentionally not deployed by this chart; nebius-cxcli manages DCGM through
# NVIDIA GPU Operator for GPU MK8s targets.
nameOverride: ""
fullnameOverride: ""
controllerManager:
  replicas: 1
  serviceAccount:
    annotations: {}
  kubeRbacProxy:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --upstream=http://127.0.0.1:8080/
      - --logtostderr=true
      - --v=0
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      repository: registry.k8s.io/kubebuilder/kube-rbac-proxy
      tag: v0.15.0
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  manager:
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    controllersEnabled:
      cluster: true
      nodeconfigurator: true
      nodeset: true
      topology: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    env:
      isMariadbCrdInstalled: "true"
      isOpentelemetryCollectorCrdInstalled: "false"
      isApparmorCrdInstalled: "false"
      isPrometheusCrdInstalled: "false"
      slurmOperatorWatchNamespaces: "*"
      topologyLabelPrefix: topology.kubernetes.io
    # Kubernetes client tuning for the Soperator manager. For 2k-5k node
    # clusters the default kube-client QPS/burst can throttle the manager's
    # API calls against a busy mk8s control plane (Big Cluster PoC finding).
    # When non-empty, these are emitted as KUBE_API_QPS / KUBE_API_BURST
    # environment variables on the manager container. The chart leaves them
    # unset on small clusters so client-go's default rate limits apply.
    kubeClient:
      qps: ""
      burst: ""
    image:
      repository: cr.eu-north1.nebius.cloud/soperator/slurm-operator
      tag: 4.0.2
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  affinity: {}
  nodeSelector: {}
  tolerations: []
kubernetesClusterDomain: cluster.local
webhookService:
  type: ClusterIP
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
serviceMonitor:
  enabled: false
  jobLabel: soperator
  interval: 30s
  scrapeTimeout: 20s
  additionalLabels: {}
  metricRelabelings: []
  relabelings: []
certManager:
  # Requires cert-manager CRDs and controller to be installed before this chart.
  # Set to false only for local/dev clusters where Soperator webhooks are not used.
  enabled: true
  privateKey:
    # Match cert-manager >=1.18's secure default explicitly so server warnings
    # do not depend on implicit API defaults.
    rotationPolicy: Always
# ---------------------------------------------------------------------------
# Helm subchart dependencies
# ---------------------------------------------------------------------------
mariadb-operator:
  installOperator: true
  crds:
    enabled: true
  webhook:
    enabled: true
    cert:
      certManager:
        enabled: true
  certController:
    # The parent chart issues the MariaDB webhook certificate with cert-manager.
    # Leave the dependency chart's alternate cert-controller disabled unless
    # cert-manager is intentionally turned off in a direct Helm install.
    enabled: false
  metrics:
    enabled: false
kruise:
  installOperator: true
  crds:
    managed: true
  manager:
    replicas: 1
    image:
      repository: cr.eu-north1.nebius.cloud/soperator/kruise-manager
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 1000m
        memory: 2Gi
  helmHooks:
    image:
      repository: cr.eu-north1.nebius.cloud/soperator/kruise-helm-hook
  featureGates: "ImagePullJobGate=true,RecreatePodWhenChangeVCTInCloneSetGate=true,StatefulSetAutoResizePVCGate=true,StatefulSetAutoDeletePVC=true,PreDownloadImageForInPlaceUpdate=true,ResourceDistributionGate=true"
# ---------------------------------------------------------------------------
# Uninstall cleanup hook
# ---------------------------------------------------------------------------
uninstallCleanup:
  # Deletes Soperator CRs before Helm runs the OpenKruise pre-delete finalizer.
  # OpenKruise refuses to uninstall while Advanced StatefulSets exist, and those
  # StatefulSets are children of the Soperator CRs rendered by this chart.
  enabled: true
  image:
    # Override this with an internal kubectl-capable image in restricted-egress
    # environments. The default is public and not mirrored by this chart.
    repository: alpine/k8s
    tag: 1.36.0
    pullPolicy: IfNotPresent
  timeoutSeconds: 600
  pollIntervalSeconds: 5
# ---------------------------------------------------------------------------
# Storage glue
# ---------------------------------------------------------------------------

# Storage glue for Nebius SFS filesystems created and attached by Terraform.
# The in-cluster PV/PVC and mount DaemonSet lifecycle stays Helm-owned.
storageClass:
  local:
    name: slurm-local-pv
jailRootfs:
  # activePassive provisions two logical rootfs slots under one SFS-backed host
  # mount. Slot names are physical names; active/passive roles swap by changing
  # activeSlot/passiveSlot in values.
  strategy: activePassive
  activeSlot: slot-a
  passiveSlot: slot-b
  adoption:
    # slot selects activeSlot for normal operation. legacy-rootfs makes every
    # rendered controller/login/worker consumer use legacyPvcName and withholds
    # jailPersistentMounts until the one-time copy and slot switch complete.
    activeSource: slot
    # Existing legacy claim used during first adoption and retained when
    # rollbackSource is set to legacy-rootfs by the upgrade workflow.
    legacyPvcName: jail-pvc
  store:
    mountPath: /mnt/jail-store
    rootfsPath: /mnt/jail-store/rootfs
    volumeKey: jail
  slots:
    slot-a:
      volumeSourceName: jail-rootfs-slot-a
      pvcName: jail-rootfs-slot-a-pvc
      localPath: /mnt/jail-store/rootfs/slot-a
    slot-b:
      volumeSourceName: jail-rootfs-slot-b
      pvcName: jail-rootfs-slot-b-pvc
      localPath: /mnt/jail-store/rootfs/slot-b
jailPersistentMounts:
  # Writable customer-owned paths that stay outside rootfs generation slots and
  # are mounted back into every active rootfs. cxcli-managed clusters default
  # /home to /mnt/jail-store/shared/home. Automatic external single-SFS
  # adoption keeps /home, /data, /scripts, and /models in place under
  # /mnt/jail; only an explicit relocation uses another non-overlapping path.
  - mountPath: /home
    localPath: /mnt/jail-store/shared/home
volume:
  jail:
    name: jail
    # Total backing-store capacity for the jail SFS. For active/passive local-path
    # PVs this request is informational; the real capacity is the Terraform-managed
    # SFS mounted at jailRootfs.store.mountPath.
    size: 2Ti
    # filestore: Nebius SFS/Filestore mounted with virtiofs.
    # glusterfs: external GlusterFS server.
    # local: one-node local learning clusters; creates node-local PVs.
    type: filestore
    filestoreDeviceName: jail
    glusterfsHostName: ""
    localPath: /mnt/jail
  controllerSpool:
    name: controller-spool
    size: 30Gi
    type: filestore
    filestoreDeviceName: controller-spool
    localPath: /mnt/controller-spool
  accounting:
    enabled: false
    name: accounting
    size: 128Gi
    type: filestore
    filestoreDeviceName: accounting
    localPath: /mnt/accounting
  jailSubMounts: []
storage:
  mountImage:
    repository: cr.eu-north1.nebius.cloud/soperator/busybox
    tag: latest
    pullPolicy: IfNotPresent
  accounting:
    matchExpressions:
      - key: slurm.nebius.ai/nodeset-name
        operator: In
        values:
          - accounting
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: accounting
        effect: NoSchedule
  controllerSpool:
    matchExpressions:
      - key: slurm.nebius.ai/nodeset-name
        operator: In
        values:
          - controller
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: controller
        effect: NoSchedule
  jail:
    matchExpressions:
      - key: slurm.nebius.ai/jail
        operator: In
        values:
          - "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: controller
        effect: NoSchedule
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: accounting
        effect: NoSchedule
# Optional Terraform-derived output bindings land here when nebius-cxcli has
# Terraform state available. Explicit volume.* values remain usable for direct
# Helm installation.
sfs:
  filesystems: {}
# External VM-based NFS server details from platform-infra/modules/nfs.
externalNfs:
  enabled: false
  server: ""
  path: /srv/nfs/home
  mountPath: /home
  readOnly: false
# ---------------------------------------------------------------------------
# NodeConfigurator CR
# ---------------------------------------------------------------------------

# NodeConfigurator prepares Kubernetes hosts for Soperator worker behavior.
# Keep a no-op custom container enabled by default so the privileged host setup
# initContainers have a valid long-running DaemonSet container even when the
# optional rebooter helper stays disabled.
hostNetwork: true
customContainer:
  enabled: true
  env: []
  image:
    repository: cr.eu-north1.nebius.cloud/soperator/busybox
    tag: latest
    pullPolicy: IfNotPresent
  command:
    - /bin/sh
    - -c
    - "trap : TERM INT; sleep infinity & wait"
  nodeSelector: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccountName: ""
rebooter:
  enabled: false
  generateRBAC: true
  evictionMethod: evict
  logLevel: info
  logFormat: json
  env: []
  image:
    repository: cr.eu-north1.nebius.cloud/soperator/rebooter
    tag: 4.0.2
    pullPolicy: IfNotPresent
  nodeSelector: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccountName: ""
initContainers:
  # Host sysctl setup used by the default Slurm/GPU runtime path.
  - name: node-sysctl-params
    image: cr.eu-north1.nebius.cloud/soperator/busybox
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: true
    command:
      - /bin/sh
      - -c
      - |
        sysctl -w kernel.unprivileged_userns_clone=1
        sysctl -w net.core.rmem_max=536870912
        sysctl -w net.core.wmem_max=536870912
        sysctl -w net.ipv4.tcp_rmem="4096 131072 536870912"
        sysctl -w net.ipv4.tcp_wmem="4096 16384 536870912"
# ---------------------------------------------------------------------------
# Worker NodeSet defaults
# ---------------------------------------------------------------------------
priorityClasses:
  - name: soperator-worker-high-priority
    description: High priority class for Slurm workers
    annotations: {}
    labels: {}
    value: 10000000
    globalDefault: false
    preemptionPolicy: PreemptLowerPriority

# GPU workers on Nebius-image host drivers need the real host driver root at
# /run/nvidia/driver so Soperator tools and the shared Slurm jail can resolve
# libcuda.so.1, libnvidia-ml.so.1, and the host nvidia-smi binary
# consistently. When this is enabled, GPU NodeSets receive the chart-owned
# read-only nvidia-driver-root hostPath mount plus a validation-only init guard
# that requires cxcli's passive-rootfs evidence marker and rejects stale,
# mixed-driver, or corrupt shared-jail state before slurmd starts.
gpuDriverJail:
  enabled: true

nodesets:
  # Each NodeSet should represent one homogeneous worker shape. Use separate
  # NodeSets for CPU workers, GPU workers, or different GPU models.
  # The default GPU worker is sized for 8-GPU production nodes. It requests a
  # conservative Slurm worker slice instead of the full VM capacity so system
  # daemons and sidecars still have scheduling headroom.
  #
  # `topologyLabels` is an optional list of additional Slurm features
  # specific to topology (rack, SU, fabric). The chart appends them to
  # `nodeConfig.features` so jobs can target them with --constraint=. For
  # NVL / GB300 racks, cxcli profiles populate this list from the matching
  # Kubernetes topology labels at render time (e.g. rack-a, su-1). Keep
  # hardware features (gpu, cuda, h100) in `nodeConfig.features` and
  # topology features in `topologyLabels` so the two stay legible.
  - name: worker
    replicas: 1
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: true
      nvidia:
        gdrCopyEnabled: true
    topologyLabels: []
    nodeConfig:
      features:
        - gpu
        - cuda
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=64 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
      gresConfig:
        - AutoDetect=nvidia
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 4.0.2-slurm25.11.3
        pullPolicy: IfNotPresent
      customEnv:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,graphics,utility,video
      resources:
        cpu: "64"
        memory: 512Gi
        ephemeralStorage: 50Gi
        gpu: 8
      volumes:
        spool:
          emptyDir: {}
        jailSubMounts: []
        sharedMemorySize: 64Gi
        # Optional additional worker mounts. The chart injects and owns the
        # slurm-scripts and slurm-scripts-jail mounts; those names are reserved.
        customVolumeMounts: []
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 4.0.2-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: 200m
        memory: 512Mi
        ephemeralStorage: 1Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    sssd:
      enabled: false
    priorityClass: soperator-worker-high-priority
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    workerAnnotations: {}
    customInitContainers: []
