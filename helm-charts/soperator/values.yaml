      customContent: null
      customConfig: null
    boot_disk_full.sh:
      enabled: true
      customContent: null
      customConfig: null
    chmod_enroot_layers.sh:
      enabled: true
      customContent: null
      customConfig: null
    cleanup_enroot.sh:
