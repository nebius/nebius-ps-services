      customConfig: null
    job_tmpfs_delete_leftover.sh:
      enabled: true
      customContent: null
      customConfig: null
    job_tmpfs_recreate.sh:
      enabled: true
      customContent: null
      customConfig: null
    map_job_dcgm.sh:
      enabled: true
      customContent: null
      customConfig: null
    nvme_raid_health.sh:
      enabled: false
      customContent: null
