# Soperator operator defaults imported from upstream 3.0.3. DCGM Exporter is
# intentionally not deployed by this chart; nebius-cxcli manages DCGM through
# NVIDIA GPU Operator for GPU MK8s targets.
nameOverride: ""
fullnameOverride: ""

controllerManager:
  replicas: 1
  serviceAccount:
    annotations: {}
  kubeRbacProxy:
    args:
      - --secure-listen-address=0.0.0.0:8443
      - --upstream=http://127.0.0.1:8080/
      - --logtostderr=true
      - --v=0
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    image:
      repository: registry.k8s.io/kubebuilder/kube-rbac-proxy
      tag: v0.15.0
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  manager:
    args:
      - --health-probe-bind-address=:8081
      - --metrics-bind-address=127.0.0.1:8080
      - --leader-elect
    controllersEnabled:
      cluster: true
      nodeconfigurator: true
      nodeset: true
      topology: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    env:
      isMariadbCrdInstalled: "true"
      isOpentelemetryCollectorCrdInstalled: "false"
      isApparmorCrdInstalled: "false"
      isPrometheusCrdInstalled: "false"
      slurmOperatorWatchNamespaces: "*"
      topologyLabelPrefix: topology.nebius.com
    image:
      repository: cr.eu-north1.nebius.cloud/soperator/slurm-operator
      tag: 3.0.3
    imagePullPolicy: Always
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
  affinity: {}
  nodeSelector: {}
  tolerations: []

kubernetesClusterDomain: cluster.local

webhookService:
  type: ClusterIP
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443

serviceMonitor:
  enabled: false
  jobLabel: soperator
  interval: 30s
  scrapeTimeout: 28s
  additionalLabels: {}
  metricRelabelings: []
  relabelings: []

certManager:
  enabled: true

mariadb-operator:
  installOperator: true
  crds:
    enabled: true
  webhook:
    enabled: true
    cert:
      certManager:
        enabled: true
  metrics:
    enabled: false

kruise:
  installOperator: true
  crds:
    managed: true
  manager:
    replicas: 2
    image:
      repository: cr.eu-north1.nebius.cloud/soperator/kruise-manager
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 1000m
        memory: 2Gi
  helmHooks:
    image:
      repository: cr.eu-north1.nebius.cloud/soperator/kruise-helm-hook
  featureGates: "ImagePullJobGate=true,RecreatePodWhenChangeVCTInCloneSetGate=true,StatefulSetAutoResizePVCGate=true,StatefulSetAutoDeletePVC=true,PreDownloadImageForInPlaceUpdate=true,ResourceDistributionGate=true"

# Storage glue for Nebius SFS filesystems created and attached by Terraform.
# The in-cluster PV/PVC and mount DaemonSet lifecycle stays Helm-owned.
storageClass:
  local:
    name: slurm-local-pv

volume:
  jail:
    name: jail
    size: 2Ti
    # filestore: Nebius SFS/Filestore mounted with virtiofs.
    # glusterfs: external GlusterFS server.
    # local: single-node/local learning clusters; creates host-path backed local PVs.
    type: filestore
    filestoreDeviceName: jail
    glusterfsHostName: ""
    localPath: /mnt/jail
  controllerSpool:
    name: controller-spool
    size: 30Gi
    type: filestore
    filestoreDeviceName: controller-spool
    localPath: /mnt/controller-spool
  accounting:
    enabled: false
    name: accounting
    size: 128Gi
    type: filestore
    filestoreDeviceName: accounting
    localPath: /mnt/accounting
  jailSubMounts: []

storage:
  mountImage:
    repository: cr.eu-north1.nebius.cloud/soperator/busybox
    tag: latest
    pullPolicy: IfNotPresent
  accounting:
    matchExpressions:
      - key: slurm.nebius.ai/nodeset-name
        operator: In
        values:
          - accounting
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: accounting
        effect: NoSchedule
  controllerSpool:
    matchExpressions:
      - key: slurm.nebius.ai/nodeset-name
        operator: In
        values:
          - controller
    tolerations:
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: controller
        effect: NoSchedule
  jail:
    matchExpressions:
      - key: slurm.nebius.ai/jail
        operator: In
        values:
          - "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: controller
        effect: NoSchedule
      - key: slurm.nebius.ai/nodeset-name
        operator: Equal
        value: accounting
        effect: NoSchedule

# Optional Terraform-derived output bindings land here when nebius-cxcli has
# Terraform state available. Explicit volume.* values remain usable for direct
# Helm installation.
sfs:
  filesystems: {}

# External VM-based NFS server details from platform-infra/modules/nfs.
externalNfs:
  enabled: false
  server: ""
  path: /srv/nfs/home
  mountPath: /home
  readOnly: false

# NodeConfigurator CR defaults.
hostNetwork: true
customContainer:
  enabled: false
  env: []
  image:
    repository: cr.eu-north1.nebius.cloud/soperator/busybox
    tag: latest
    pullPolicy: IfNotPresent
  nodeSelector: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccountName: ""
rebooter:
  enabled: true
  generateRBAC: true
  evictionMethod: evict
  logLevel: info
  logFormat: json
  env: []
  image:
    repository: cr.eu-north1.nebius.cloud/soperator/rebooter
    tag: 3.0.3
    pullPolicy: IfNotPresent
  nodeSelector: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccountName: ""
initContainers:
  - name: node-sysctl-params
    image: cr.eu-north1.nebius.cloud/soperator/busybox
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: true
    command:
      - /bin/sh
      - -c
      - |
        sysctl -w kernel.unprivileged_userns_clone=1
        sysctl -w net.core.rmem_max=536870912
        sysctl -w net.core.wmem_max=536870912
        sysctl -w net.ipv4.tcp_rmem="4096 131072 536870912"
        sysctl -w net.ipv4.tcp_wmem="4096 16384 536870912"

priorityClasses:
  - name: soperator-worker-high-priority
    description: High priority class for Slurm workers
    annotations: {}
    labels: {}
    value: 10000000
    globalDefault: false
    preemptionPolicy: PreemptLowerPriority

nodesets:
  - name: worker-gpu
    replicas: 1
    maxUnavailable: 1
    enableHostUserNamespace: true
    gpu:
      enabled: true
      nvidia:
        gdrCopyEnabled: true
    nodeConfig:
      features:
        - gpu
        - cuda
      static: Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1
      dynamic: InstanceId={{ .PodName }}
      gresConfig:
        - AutoDetect=nvidia
    slurmd:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/worker_slurmd
        tag: 3.0.3-slurm25.11.3
        pullPolicy: IfNotPresent
      customEnv:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,graphics,utility,video
      resources:
        cpu: "4"
        memory: 16Gi
        ephemeralStorage: 10Gi
        gpu: 8
      volumes:
        spool:
          emptyDir: {}
        jail:
          persistentVolumeClaim:
            claimName: jail-pvc
        jailSubMounts: []
        customVolumeMounts:
          - name: slurm-scripts
            mountPath: /opt/slurm_scripts/
            volumeSource:
              configMap:
                name: slurm-scripts
                defaultMode: 493
          - name: slurm-scripts-jail
            mountPath: /mnt/jail.upper/opt/slurm_scripts/
            volumeSource:
              configMap:
                name: slurm-scripts
                defaultMode: 493
        sharedMemorySize: 8Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    munge:
      image:
        repository: cr.eu-north1.nebius.cloud/soperator/munge
        tag: 3.0.3-slurm25.11.3
        pullPolicy: IfNotPresent
      resources:
        cpu: 200m
        memory: 512Mi
        ephemeralStorage: 1Gi
      security:
        appArmorProfile: unconfined
        limitsConfig: ""
        procMount: Default
    sssd:
      enabled: false
    priorityClass: soperator-worker-high-priority
    nodeSelector:
      slurm.nebius.ai/nodeset-name: worker-gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    workerAnnotations: {}
    customInitContainers: []
