  #       "node_states": ["any"],
  #       "on_fail": "drain",
  #       "on_ok": "undrain",
  #       "reason_base": "[some tag] $name",
  #       "reason_append_details": true,
  #       "run_in_jail": false,
  #       "log": "slurm_scripts/$worker.$name.$context.out",
