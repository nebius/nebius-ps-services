[project]
name = "github-report"
dynamic = ["version"]
description = "CLI to rank GitHub contributors across accessible organization repositories."
readme = "README.md"
authors = [{ name = "Nebius" }]
requires-python = ">=3.11,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "httpx>=0.28.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "PyGithub>=2.8.0,<3.0.0",
  "rich>=13.9.0,<15.0.0",
  "typer>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "mypy>=1.11.0,<2.0.0",
  "pip-audit>=2.7.0,<3.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "ruff>=0.8.0,<1.0.0",
  "setuptools-scm>=8.1.0,<9.0.0",
]

[project.scripts]
github-report = "github_report.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["github_report*"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
write_to = "src/github_report/_version.py"
fallback_version = "0.0.0.dev0"
tag_regex = "^github-report-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match github-report-v*"
search_parent_directories = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["dist", "build", ".venv", "src/github_report/_version.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "integration: isolated integration tests intended for CI release validation",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["github_report"]

[tool.coverage.report]
skip_empty = true

[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"
