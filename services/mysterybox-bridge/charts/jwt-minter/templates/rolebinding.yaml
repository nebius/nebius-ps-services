{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "jwt-minter.fullname" . }}
  labels:
    {{- include "jwt-minter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "jwt-minter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "jwt-minter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
