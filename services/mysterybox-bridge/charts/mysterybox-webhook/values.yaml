global:
  partOf: mysterybox-bridge
  labels: {}
  annotations: {}
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 2
revisionHistoryLimit: 5

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: quay.io/nebius/mysterybox-bridge
  # Pin to a released image tag in production, and prefer image.digest when available.
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  # This workload does not call the Kubernetes API.
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

tmpDir:
  # Required for readOnlyRootFilesystem because the bridge may write temp key files.
  enabled: true
  mountPath: /tmp

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

gunicorn:
  workers: 2
  bindHost: 0.0.0.0
  logLevel: info
  appModule: mysterybox_bridge.app:create_app
  # Set true when appModule is a Flask app factory callable.
  factory: true
  extraArgs: []

# Secret that contains bridge runtime auth for Nebius API calls:
#   NEBIUS_SA_ID
#   NEBIUS_AUTH_PUBLIC_KEY_ID
#   NEBIUS_AUTH_PRIVATE_KEY_PEM
#   NEBIUS_PROJECT_ID
authSecret:
  name: nebius-mysterybox-auth
  optional: false

service:
  type: ClusterIP
  port: 8080
  annotations: {}

tls:
  enabled: false
  # If empty, defaults to "<release>-mysterybox-webhook-tls".
  secretName: ""
  mountPath: /certs
  certFile: tls.crt
  keyFile: tls.key
  certManager:
    # Enable to auto-issue and rotate a self-signed server certificate.
    enabled: false
    selfSignedIssuer:
      create: true
      name: ""
    certificate:
      duration: 2160h
      renewBefore: 360h

probes:
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    enabled: false
    path: /healthz
    periodSeconds: 5
    failureThreshold: 24

# Optional request authentication between ESO and bridge.
requestAuth:
  enabled: true
  headerName: X-MBX-Request
  tokenSecretName: mysterybox-bridge-webhook-auth
  tokenSecretKey: token

extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: external-secrets

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  behavior: {}

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
    # Empty means auto: https when tls.enabled=true, otherwise http.
    scheme: ""
    # Optional Prometheus Operator TLS config map.
    tlsConfig: {}
