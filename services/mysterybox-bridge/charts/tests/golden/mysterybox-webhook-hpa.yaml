# Source: mysterybox-webhook/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-mysterybox-webhook
  labels:
    helm.sh/chart: mysterybox-webhook-0.2.0
    app.kubernetes.io/name: mysterybox-webhook
    app.kubernetes.io/instance: golden-mysterybox-webhook
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: "mysterybox-bridge"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mysterybox-webhook
      app.kubernetes.io/instance: golden-mysterybox-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysterybox-webhook
        app.kubernetes.io/instance: golden-mysterybox-webhook
    spec:
      serviceAccountName: golden-mysterybox-webhook
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: "quay.io/nebius/mysterybox-bridge:0.1.0"
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args:
            - "--workers=2"
            - "--bind=0.0.0.0:8080"
            - "--log-level=info"
            - "--factory"
            - "mysterybox_bridge.app:create_app"
          envFrom:
            - secretRef:
                name: nebius-mysterybox-auth
                optional: false
          env:
            - name: MYSTERYBOX_WEBHOOK_AUTH_HEADER
              value: "X-MBX-Request"
            - name: MYSTERYBOX_WEBHOOK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mysterybox-bridge-webhook-auth
                  key: token
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - sleep 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: "/tmp"
      volumes:
        - name: tmp
          emptyDir: {}
---
# Source: mysterybox-webhook/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: golden-mysterybox-webhook
  labels:
    helm.sh/chart: mysterybox-webhook-0.2.0
    app.kubernetes.io/name: mysterybox-webhook
    app.kubernetes.io/instance: golden-mysterybox-webhook
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: "mysterybox-bridge"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: golden-mysterybox-webhook
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
