[project]
name = "nebius-acc"
dynamic = ["version"]
description = "Nebius tenant administration CLI for project, IAM, and quota automation"
readme = "README.md"
authors = [ { name = "Reza. B." } ]
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
classifiers = [
	"License :: Copyright 2026 Nebius B.V.",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only"
]

dependencies = [
	"jsonschema>=4.23.0,<5.0.0",
	"nebius>=0.3.28,<0.4.0",
	"PyYAML>=6.0.3,<7.0.0",
	"click>=8.3.0,<9.0.0",
	"rich>=14.2.0,<15.0.0",
	"typer>=0.20.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
	"pytest>=9.0.0,<10.0.0",
	"ruff>=0.14.0,<1.0.0",
	"build>=1.3.0,<2.0.0",
	"setuptools-scm>=8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nebius_acc*"]

[tool.setuptools.package-data]
nebius_acc = ["config_schema.json"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
write_to = "src/nebius_acc/_version.py"
tag_regex = "^v?(?P<version>\\d+\\.\\d+\\.\\d+)$"
fallback_version = "0.0.0"
search_parent_directories = true

[project.scripts]
nebius-acc = "nebius_acc.cli:main_entry"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
extend-exclude = ["dist", "build", ".venv", "src/nebius_acc/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
	"B008",
	"B025",
	"B028",
	"B904",
	"E501",
	"E741",
	"SIM102",
	"SIM105",
	"SIM108",
	"SIM113",
	"SIM116",
	"SIM212",
	"UP022"
]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"
