                # Each profile populates typed `partitions[].policy`
                # fields (PriorityTier, PreemptMode, MaxTime, AllowQos,
                # ...) so the chart can hard-fail on raw/typed overlap.
                # See the conceptual block at the top of the soperator
                # section for the underlying Slurm concepts.
                partition_profiles:
                  shape-default:
                    wizard:
                      # Pattern (a) - Partition only. One partition per
                      # shape: `cpu` covers worker-cpu, `gpu` covers
                      # worker-gpu. Users target capacity by shape
                      # (`-p cpu` or `-p gpu`). PriorityTier set so the
                      # gpu partition evaluates ahead of cpu under
                      # contention. No preemption, no QOS required.
                      label: "Baseline queues: cpu/gpu shape partitions; accounting enabled; no QoS/preemption"
                  with-debug-long:
                    wizard:
                      # Pattern (a) - Partition + tiered scheduling,
                      # mixed workers. Adds policy partitions that span
                      # both worker-cpu and worker-gpu:
                      #   debug  (PriorityTier=100, MaxTime=00:30:00)
                      #   long   (PriorityTier=1,   MaxTime=7-00:00:00)
                      # Shape partitions (cpu, gpu) remain available for
                      # explicit capacity selection.
                      label: "Add debug/long queues across CPU and GPU workers; accounting enabled; no QoS objects"
                    values:
                      partitionConfiguration:
                        configType: structured
                        partitions:
                          - name: cpu
                            nodeSetRefs:
                              - worker-cpu
                            policy:
                              default: true
                              state: UP
                              maxTime: "INFINITE"
                              priorityTier: 5
                          - name: gpu
                            nodeSetRefs:
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "INFINITE"
                              priorityTier: 10
                          - name: debug
                            nodeSetRefs:
                              - worker-cpu
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "00:30:00"
                              priorityTier: 100
                          - name: long
                            nodeSetRefs:
                              - worker-cpu
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "7-00:00:00"
                              priorityTier: 1
                  with-qos-preemption:
                      wizard:
                        requires_qos_configuration: true
                        # Pattern (b) - QOS + preemption, mixed workers.
                        # Same QOS classes as the CPU profile (debug,
                        # eval, train, data) but applied to both cpu and
                        # gpu shape partitions plus the policy overlays.
                        # See the CPU profile's `with-qos-preemption`
                        # entry above for SlurmDBD prerequisites and the
                        # Managed Soperator caveat; the same rules apply.
                        label: "Advanced QoS/fairshare/preemption: cpu/gpu/debug/eval/train/data queues; requires SlurmDBD QOS/account objects"
                      values:
                        qosConfiguration: *soperator_qos_preemption_defaults
                        schedulingConfig:
                          accountingStorageEnforce:
                            - associations
                            - limits
                            - qos
                          enforcePartLimits: ANY
                          preemptType: preempt/qos
                          preemptMode: REQUEUE
                          preemptParameters:
                            - send_user_signal
                          priorityWeights:
                            qos: 1000
                            fairshare: 100
                        partitionConfiguration:
                          configType: structured
                          partitions:
                            - name: cpu
                              nodeSetRefs:
                                - worker-cpu
                              policy:
                                default: true
                                state: UP
                                maxTime: "INFINITE"
                                priorityTier: 20
                                allowQos: [debug, eval, train, data]
                            - name: gpu
                              nodeSetRefs:
                                - worker-gpu
                              policy:
                                default: false
                                state: UP
                                maxTime: "INFINITE"
                                priorityTier: 30
                                allowQos: [debug, eval, train, data]
                            - name: debug
                              nodeSetRefs:
                                - worker-cpu
                                - worker-gpu
                              policy:
                                default: false
                                state: UP
                                maxTime: "00:30:00"
                                priorityTier: 100
                                allowQos: [debug]
                            - name: eval
                              nodeSetRefs:
                                - worker-cpu
                                - worker-gpu
                              policy:
                                default: false
                                state: UP
                                maxTime: "04:00:00"
                                priorityTier: 80
                                allowQos: [eval]
                            - name: train
                              nodeSetRefs:
                                - worker-cpu
                                - worker-gpu
                              policy:
                                default: false
                                state: UP
                                maxTime: "3-00:00:00"
                                priorityTier: 50
                                allowQos: [train]
                            - name: data
                              nodeSetRefs:
                                - worker-cpu
                                - worker-gpu
                              policy:
                                default: false
                                state: UP
                                maxTime: "1-00:00:00"
                                priorityTier: 10
                                allowQos: [data]
                  with-h100-infiniband-debug-long:
                    wizard:
                      # Mixed-only variant of pattern (a) for clusters
                      # where the GPU shape exposes Slurm features `h100`
                      # and `infiniband`. Adds two extra partitions
                      # (`h100`, `infiniband`) that target worker-gpu via
                      # those features so users can request RDMA-capable
                      # nodes with `-p infiniband` instead of relying on
                      # `--constraint=infiniband`. Use only when the
                      # underlying NodeSet sets the corresponding
                      # `nodeConfig.features`.
                      label: "H100/InfiniBand feature partitions plus debug and long across mixed workers"
                    values:
                      partitionConfiguration:
                        configType: structured
                        partitions:
                          - name: cpu
                            nodeSetRefs:
                              - worker-cpu
                            policy:
                              default: true
                              state: UP
                              maxTime: "INFINITE"
                              priorityTier: 5
                          - name: gpu
                            nodeSetRefs:
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "INFINITE"
                              priorityTier: 10
                          - name: h100
                            nodeSetRefs:
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "INFINITE"
                              priorityTier: 20
                          - name: infiniband
                            nodeSetRefs:
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "INFINITE"
                              priorityTier: 15
                          - name: debug
                            nodeSetRefs:
                              - worker-cpu
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "00:30:00"
                              priorityTier: 100
                          - name: long
                            nodeSetRefs:
                              - worker-cpu
                              - worker-gpu
                            policy:
                              default: false
                              state: UP
                              maxTime: "7-00:00:00"
                              priorityTier: 1
                      nodesets:
                        - name: worker-cpu
                          replicas: 2
                          maxUnavailable: 1
                          enableHostUserNamespace: true
                          gpu:
                            enabled: false
                          nodeConfig:
                            features:
                              - cpu
                            static: Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=1
                            dynamic: "InstanceId={{ .PodName }}"
                          slurmd:
                            resources:
                              cpu: "4"
                              memory: 16Gi
                              ephemeralStorage: 10Gi
                            volumes:
                              spool:
                                emptyDir: {}
                              jail:
                                persistentVolumeClaim:
                                  claimName: jail-pvc
                              jailSubMounts: []
                              sharedMemorySize: 8Gi
                            security:
                              appArmorProfile: unconfined
                              limitsConfig: ""
                              procMount: Default
                          munge:
                            resources:
                              cpu: 200m
                              memory: 512Mi
                              ephemeralStorage: 1Gi
                            security:
                              appArmorProfile: unconfined
                              limitsConfig: ""
                              procMount: Default
                          sssd:
                            enabled: false
                          priorityClass: soperator-worker-high-priority
                          nodeSelector:
                            slurm.nebius.ai/nodeset-name: worker-cpu
                          workerAnnotations: {}
                          customInitContainers: []
                        - name: worker-gpu
                          replicas: 2
                          maxUnavailable: 1
                          enableHostUserNamespace: true
                          gpu:
                            enabled: true
                            nvidia:
                              gdrCopyEnabled: true
                          nodeConfig:
                            features:
                              - gpu
                              - cuda
                              - h100
                              - infiniband
                            static: Boards=1 SocketsPerBoard=1 CoresPerSocket=32 ThreadsPerCore=1
                            dynamic: "InstanceId={{ .PodName }}"
                            gresConfig:
                              - AutoDetect=nvidia
                          slurmd:
                            customEnv:
                              - name: NVIDIA_DRIVER_CAPABILITIES
                                value: compute,graphics,utility,video
                            resources:
                              cpu: "32"
                              memory: 16Gi
                              ephemeralStorage: 10Gi
                              gpu: 8
                            volumes:
                              spool:
                                emptyDir: {}
                              jail:
                                persistentVolumeClaim:
                                  claimName: jail-pvc
                              jailSubMounts: []
                              sharedMemorySize: 8Gi
                            security:
                              appArmorProfile: unconfined
                              limitsConfig: ""
                              procMount: Default
                          munge:
                            resources:
                              cpu: 200m
                              memory: 512Mi
                              ephemeralStorage: 1Gi
                            security:
                              appArmorProfile: unconfined
                              limitsConfig: ""
                              procMount: Default
                          sssd:
                            enabled: false
                          priorityClass: soperator-worker-high-priority
                          nodeSelector:
                            slurm.nebius.ai/nodeset-name: worker-gpu
                          tolerations:
                            - key: nvidia.com/gpu
                              operator: Exists
                              effect: NoSchedule
                          workerAnnotations: {}
                          customInitContainers: []
            nebius-gpu-v1:
              wizard:
                # Single homogeneous GPU worker shape. One worker NodeSet
                # plus one `gpu` partition; Slurm features (gpu, cuda) are
                # set on the NodeSet so jobs can use --constraint=cuda.
                # Use this for clusters where every worker has GPUs (H100,
                # H200, B200, B300/GB300). For rack-scoped GB300/NVL
                # placement, pair with the `nebius-nvl-rack-v1` topology
                # profile so Slurm reads NVL rack labels.
                label: "Production GPU layout: system/controller/login/accounting CPU groups, GPU worker NodeSet, accounting DB enabled"
              placements:
                system:
                  kind: platform-support
                  node_group: system
                  default_node_group_kind: cpu
                  filesystem_keys: [jail]
                  soperator_node_filter: system
                  soperator_value_bindings:
                    populateJail.k8sNodeFilterName: system
                  soperator_affinity_bindings:
                    - controllerManager.affinity
                    - soperator-checks.checks.affinity
                    - mariadb-operator.affinity
                    - mariadb-operator.webhook.affinity
                controller:
                  kind: slurm-service
                  node_group: controller
                  default_node_group_kind: cpu
                  filesystem_keys: [jail, controller-spool]
                  soperator_node_filter: controller
                  soperator_value_bindings:
                    slurmNodes.controller.k8sNodeFilterName: controller
                    slurmNodes.rest.k8sNodeFilterName: controller
                    sConfigController.node.k8sNodeFilterName: controller
                login:
                  kind: slurm-service
                  node_group: login
                  default_node_group_kind: cpu
                  filesystem_keys: [jail]
                  soperator_node_filter: login
                  soperator_value_bindings:
                    slurmNodes.login.k8sNodeFilterName: login
                accounting:
                  kind: slurm-service
                  node_group: accounting
                  default_node_group_kind: cpu
                  filesystem_keys: [jail, accounting]
                  soperator_node_filter: accounting
                  soperator_value_bindings:
                    slurmNodes.accounting.k8sNodeFilterName: accounting
                worker:
                  kind: slurm-worker-nodeset
                  default_node_group_kind: gpu
                  filesystem_keys: [jail]
                  nodeset_templates:
                    - worker
              mk8s:
                inputs:
                  node_group_defaults:
                    cpu:
                      platform: cpu-d3
                      preset: 32vcpu-128gb
                    gpu:
                      platform: gpu-h100-sxm
                      preset: 8gpu-128vcpu-1600gb
                      os: ubuntu24.04
                      boot_disk:
                        type: NETWORK_SSD
                      gpu_stack_source: nebius_image
                      gpu_stack_preset: cuda13.0
                gpu_clusters:
                  workers: {}
                gpu_cluster_key: workers
                node_groups:
                  system:
                    placement_name: system
                    workload: system
                    node_count: 3
                    node_count_input: soperator.system_node_count
                    autoscaling_input: soperator.system_autoscaling
                    autoscaling:
                      min_node_count: 3
                      max_node_count: 5
                    gpu: false
                    jail: true
                  controller:
                    placement_name: controller
                    workload: controller
                    node_count: 2
                    node_count_input: soperator.controller_node_count
                    autoscaling_input: soperator.controller_autoscaling
                    gpu: false
                    jail: true
                    sfs_filesystem_keys:
                      - controller-spool
                    taints:
                      - key: slurm.nebius.ai/nodeset-name
                        value: controller
                        effect: NO_SCHEDULE
                  login:
                    placement_name: login
                    workload: login
                    node_count: 2
                    node_count_input: soperator.login_node_count
                    autoscaling_input: soperator.login_autoscaling
                    gpu: false
                    jail: true
                    taints:
                      - key: slurm.nebius.ai/nodeset-name
                        value: login
                        effect: NO_SCHEDULE
                  accounting:
                    placement_name: accounting
                    workload: accounting
                    node_count: 2
                    node_count_input: soperator.accounting_node_count
                    autoscaling_input: soperator.accounting_autoscaling
                    gpu: false
                    jail: true
                    sfs_filesystem_keys:
                      - accounting
                    taints:
                      - key: slurm.nebius.ai/nodeset-name
                        value: accounting
                        effect: NO_SCHEDULE
                worker_nodesets:
                  - name: worker
                    nodeset_name: worker
                    node_group_prefix: worker
                    workload: worker
                    gpu: true
                    jail: true
                    total_nodes_input: soperator.worker_gpu_total_nodes
                    nodes_per_group_input: soperator.worker_gpu_nodes_per_group
                    default_total_nodes: 1
                    default_nodes_per_group: 100
                    max_nodes_per_group: 100
                    node_group:
                      gpu_cluster_key: workers
                      reservation:
                        policy: AUTO
                      taints:
                        - key: nvidia.com/gpu
                          value: "true"
                          effect: NO_SCHEDULE
              sfs:
                filesystems: *soperator_production_sfs_filesystems
              chart:
                topology_profiles:
                  disabled: *soperator_topology_disabled_profile
                  nebius-tiered-tree-v1: *soperator_topology_tiered_tree_profile
                  nebius-nvl-rack-v1: *soperator_topology_nvl_rack_profile
                # Internal profile-owned ActiveChecks plumbing. cxcli derives
                # this into render-time Helm values only when ActiveChecks are
                # enabled; it is not a wizard field or source-config knob.
                activechecks:
                  srunReadyPartition: hidden
                onboarding_values: *soperator_onboarding_compact_resources
                values:
                  mariadb-operator:
                    installOperator: true
                  customSlurmConfig: *soperator_nebius_slurm_plugin_dir
                  soperator-activechecks:
                    checks:
                      ensure-healthy-nodes:
                        runAfterCreation: false
                      wait-for-topology:
                        runAfterCreation: false
                  partitionConfiguration:
                    configType: structured
                    partitions:
                      - name: gpu
                        nodeSetRefs:
                          - worker
                        policy:
                          default: true
                          state: UP
                          maxTime: "INFINITE"
                          priorityTier: 10
                  nodesets:
                    - name: worker
                      replicas: 1
                      maxUnavailable: 1
                      enableHostUserNamespace: true
                      gpu:
                        enabled: true
                        nvidia:
                          gdrCopyEnabled: true
                      nodeConfig:
                        features:
                          - gpu
                          - cuda
                        static: Boards=1 SocketsPerBoard=1 CoresPerSocket=32 ThreadsPerCore=1
                        dynamic: "InstanceId={{ .PodName }}"
                        gresConfig:
                          - AutoDetect=nvidia
                      slurmd:
                        customEnv:
                          - name: NVIDIA_DRIVER_CAPABILITIES
                            value: compute,graphics,utility,video
                        resources:
                          cpu: "32"
                          memory: 16Gi
                          ephemeralStorage: 10Gi
                          gpu: 8
                        volumes:
                          spool:
                            emptyDir: {}
                          jail:
                            persistentVolumeClaim:
                              claimName: jail-pvc
                          jailSubMounts: []
                          sharedMemorySize: 8Gi
                        security:
                          appArmorProfile: unconfined
                          limitsConfig: ""
                          procMount: Default
                      munge:
                        resources:
                          cpu: 200m
                          memory: 512Mi
                          ephemeralStorage: 1Gi
                        security:
                          appArmorProfile: unconfined
                          limitsConfig: ""
                          procMount: Default
                      sssd:
                        enabled: false
                      priorityClass: soperator-worker-high-priority
                      nodeSelector:
                        slurm.nebius.ai/nodeset-name: worker
                      tolerations:
                        - key: nvidia.com/gpu
                          operator: Exists
                          effect: NoSchedule
                      workerAnnotations: {}
                      customInitContainers: []
                  populateJail:
                    k8sNodeFilterName: system
                  slurmNodes:
                    accounting:
                      enabled: true
                      k8sNodeFilterName: accounting
                      mariadbOperator:
                        enabled: true
                        storage:
                          size: 128Gi
                          storageClassName: compute-csi-default-sc
                          volumeClaimTemplate:
                            accessModes:
                              - ReadWriteOnce
                            resources:
                              requests:
                                storage: 128Gi
                            storageClassName: compute-csi-default-sc
                  volume:
                    accounting:
                      enabled: true
                # Partition profile = which Slurm queues the chart
                # renders into SlurmCluster.spec.partitionConfiguration.
                # Each profile populates typed `partitions[].policy`
                # fields (PriorityTier, PreemptMode, MaxTime, AllowQos,
                # ...) so the chart can hard-fail on raw/typed overlap.
                # See the conceptual block at the top of the soperator
                # section for the underlying Slurm concepts.
                partition_profiles:
                  shape-default:
                    wizard:
                      # Pattern (a) - Partition only, GPU-only cluster.
                      # One visible `gpu` partition. Slurm GRES is
                      # automatically derived from the worker
                      # NodeSet's GPU count (no manual Gres= needed).
                      # Recommended baseline for new GPU clusters.
                      label: "Baseline queues: default GPU worker queue; accounting enabled; no QoS/preemption"
                  with-debug-long:
                    wizard:
                      # Pattern (a) - Partition + tiered scheduling,
                      # GPU-only cluster. Overlays two policy partitions
                      # on the single worker NodeSet:
                      #   debug  (PriorityTier=100, MaxTime=00:30:00)
                      #   long   (PriorityTier=1,   MaxTime=7-00:00:00)
                      # Users still target the same GPU capacity; the
                      # partition choice expresses scheduling intent.
                      label: "Add debug/long queues on the same GPU workers; accounting enabled; no QoS objects"
                    values:
                      partitionConfiguration:
                        configType: structured
                        partitions:
                          - name: gpu
                            nodeSetRefs:
                              - worker
                            policy:
                              default: true
                              state: UP
                              maxTime: "INFINITE"
                              priorityTier: 10
                          - name: debug
                            nodeSetRefs:
                              - worker
                            policy:
                              default: false
                              state: UP
                              maxTime: "00:30:00"
                              priorityTier: 100
                          - name: long
                            nodeSetRefs:
                              - worker
                            policy:
                              default: false
                              state: UP
                              maxTime: "7-00:00:00"
                              priorityTier: 1
                  with-qos-preemption:
                      wizard:
                        requires_qos_configuration: true
                        # Pattern (b) - QOS + preemption, GPU-only.
                        # Same QOS class layout as the CPU/Mixed profiles
                        # (debug/eval/train/data) but scoped to the
                        # single GPU worker NodeSet. The gpu partition
                        # is the default queue and accepts every QOS;
                        # debug/eval/train/data are scoped partitions
                        # with single-QOS AllowQos lists. Requires
                        # SlurmDBD to have those QOS objects, accounts,
                        # associations, and explicit QOS Preempt=
                        # relationships before slurmctld can settle with this
                        # partition policy. cxcli-managed
                        # self-deployment uses the chart's `qosConfiguration`
                        # block; this profile is not supported on Managed
                        # Soperator because cxcli cannot run that reconcile Job
                        # in the operator namespace.
                        label: "Advanced QoS/fairshare/preemption: gpu/debug/eval/train/data queues; requires SlurmDBD QOS/account objects"
                      values:
                        qosConfiguration: *soperator_qos_preemption_defaults
                        schedulingConfig:
                          accountingStorageEnforce:
                            - associations
                            - limits
                            - qos
                          enforcePartLimits: ANY
                          preemptType: preempt/qos
                          preemptMode: REQUEUE
                          preemptParameters:
                            - send_user_signal
                          priorityWeights:
                            qos: 1000
                            fairshare: 100
                        partitionConfiguration:
                          configType: structured
                          partitions:
                            - name: gpu
                              nodeSetRefs:
                                - worker
                              policy:
                                default: true
                                state: UP
                                maxTime: "INFINITE"
                                priorityTier: 30
                                allowQos: [debug, eval, train, data]
                            - name: debug
                              nodeSetRefs:
                                - worker
                              policy:
                                default: false
                                state: UP
                                maxTime: "00:30:00"
                                priorityTier: 100
                                allowQos: [debug]
                            - name: eval
                              nodeSetRefs:
                                - worker
                              policy:
                                default: false
                                state: UP
                                maxTime: "04:00:00"
                                priorityTier: 80
                                allowQos: [eval]
                            - name: train
                              nodeSetRefs:
                                - worker
                              policy:
                                default: false
                                state: UP
                                maxTime: "3-00:00:00"
                                priorityTier: 50
                                allowQos: [train]
                            - name: data
                              nodeSetRefs:
                                - worker
                              policy:
                                default: false
                                state: UP
                                maxTime: "1-00:00:00"
                                priorityTier: 10
                                allowQos: [data]
    grafana:
      cli:
        orgId: 1
        logout-timeout: 20m
        admin:
          secret: nebius-cxcli-grafana-admin
          user: admin
          user_key: admin-user
          password_key: admin-password
        read_token:
          env: NEBIUS_OBSERVABILITY_STATIC_TOKEN
          secret: nebius-cxcli-grafana-observability-read
          key: token
        datasources:
          # Keep both Prometheus datasources. The service-provider endpoint
          # reads Nebius/provider service metrics; the user endpoint reads
          # customer/user-ingested Prometheus metrics.
          service-metrics:
            name: Nebius Services
            uid: nebius-service-metrics
            type: prometheus
            read_endpoint: metrics_service_provider_read
            isDefault: true
            description: Nebius/provider service metrics for cloud resources, the cxcli GPU dashboard, and service dashboard examples.
          user-metrics:
            name: Nebius User Metrics
            uid: nebius-user-metrics
            type: prometheus
            read_endpoint: metrics_user_read
            isDefault: false
            description: Customer/user-ingested Prometheus metrics, including Kubernetes metrics written by the Nebius observability agent.
          logs:
            name: Nebius Logs
            uid: nebius-logs
            type: loki
            read_endpoint: logs_loki_read
            isDefault: false
          traces:
            name: Nebius Traces
            uid: nebius-traces
            type: tempo
            read_endpoint: traces_tempo_read
            isDefault: false
        explore_queries:
          metrics: count({__name__=~".+"})
          logs: '{__bucket__="default"}'
        # Dashboard signal bindings are source metadata, not Helm chart values.
        # Keep them next to the chart so signal-specific status URLs can point
        # at dashboards without hardcoding dashboard selection.
        dashboard_signals:
          metrics: nebius-kubernetes/kubernetes-cluster-monitoring
          logs: nebius-kubernetes/kubernetes-logs-from-loki
          traces: nebius-kubernetes/kubernetes-traces
