cli:
  terraform:
    version: 1.15.5
  flux:
    version: v2.8.0
    release_timeout: 5m

compute:
  # Shared cxcli-owned boot-disk recommendations for Compute-backed
  # components. cxcli resolves live preset resources (vCPU, RAM, GPU count),
  # matches the first ordered rule, rounds by the selected disk type allocation
  # unit, and materializes explicit disk inputs before render/quota/deploy.
  boot_disk_defaults:
    disk_types:
      - value: NETWORK_SSD
        allocation_unit_gib: 1
        explicit_encryption_supported: false
        label: NETWORK_SSD  (1-8192 GiB, 450 MiB/s, 20k/40k IOPS, erasure-coded, tolerates 2 hardware failures, encryption always on)
      - value: NETWORK_SSD_NON_REPLICATED
        allocation_unit_gib: 93
        explicit_encryption_supported: true
        label: NETWORK_SSD_NON_REPLICATED  (93 GiB units, 1 GiB/s, 75k/75k IOPS, lowest-cost high-performance, no redundancy, encryption only when explicitly configured)
      - value: NETWORK_SSD_IO_M3
        allocation_unit_gib: 93
        explicit_encryption_supported: true
        label: NETWORK_SSD_IO_M3  (93 GiB units, 1 GiB/s, 75k/75k IOPS, replicated, mirrored to 3 drives, most expensive, encryption only when explicitly configured)
    cpu:
      default_type: NETWORK_SSD
      rules:
        - max_vcpu: 8
          max_memory_gib: 32
          size_gib: 64
        - max_vcpu: 32
          max_memory_gib: 128
          size_gib: 93
        - max_vcpu: 64
          max_memory_gib: 256
          size_gib: 128
        - min_vcpu: 65
          size_gib: 186
    gpu:
      default_type: NETWORK_SSD
      rules:
        - max_gpu: 1
          max_vcpu: 32
          max_memory_gib: 384
          size_gib: 256
        - min_gpu: 2
          max_gpu: 4
          max_vcpu: 96
          max_memory_gib: 768
          size_gib: 512
        - min_gpu: 8
          max_gpu: 8
          size_gib: 1023

observability:
  # Project-scoped Nebius Observability endpoint templates. These Read/Write
  # APIs are not owned by a single component; all Nebius resources in the
  # tenant/project can use the matching read or ingest surface.
  endpoints:
    write:
      metrics_otlp_write:
        label: Metrics write (OTLP HTTP/protobuf)
        template: https://write.monitoring.{region}.nebius.cloud/projects/{project_id}/opentelemetry/v1/metrics
        include_when:
          - kubernetes_metrics
      metrics_prometheus_remote_write:
        label: Metrics write (Prometheus Remote Write)
        template: https://write.monitoring.{region}.nebius.cloud/projects/{project_id}/prometheus/api/v1/write
        include_when:
          - kubernetes_metrics
      logs_otlp_write:
        label: Logs write (direct/self-managed)
        template: https://write.logging.{region}.nebius.cloud
        include_when:
          - kubernetes_logs
      logs_agent_grpc_write:
        label: Logs write (Nebius agent gRPC)
        template: dns:///write.logging.{region}.nebius.cloud:443
        include_when:
          - kubernetes_logs
      traces_otlp_grpc_write:
        label: Traces write (OTLP gRPC)
        template: dns:///write.tracing.{region}.nebius.cloud:443
        include_when:
          - kubernetes_traces
    read:
      metrics_service_provider_read:
        label: Metrics read (Prometheus, Nebius service metrics)
        template: https://read.monitoring.api.nebius.cloud/projects/{project_id}/service-provider/prometheus
        include_when:
          - metrics
      metrics_user_read:
        label: Metrics read (Prometheus, user-ingested metrics)
        template: https://read.monitoring.api.nebius.cloud/projects/{project_id}/prometheus
        include_when:
          - kubernetes_metrics
      metrics_federate_read:
        label: Metrics read (federate)
        template: https://read.monitoring.api.nebius.cloud/projects/{project_id}/buckets/<service-provider>/prometheus/federate
        include_when:
          - metrics
        bucket_placeholder: <service-provider>
      logs_loki_read:
        label: Logs read (Loki)
        template: https://read.logging.api.nebius.cloud/projects/{project_id}
        include_when:
          - logs
      traces_tempo_read:
        label: Traces read (Tempo)
        template: https://read.tracing.api.nebius.cloud/projects/{project_id}/tempo
        include_when:
          - traces
# cxcli-owned behavior for component types declared in component_sources.yaml.
# Entries are linked by the same components.<infra|apps>.<component-id> path.
components:
  infra:
    mk8s:
      cli:
        gpu:
          # Default only for GPU-enabled MK8s contexts. cxcli prunes this from
          # config.yaml when GPU nodes are disabled so CPU-only clusters do not
          # carry stale GPU tuning fields.
          default_stack_source: nebius_image
          # Preference order only. cxcli still resolves the live Nebius
          # compatibility matrix first. Nebius calls the provider field
          # `drivers_preset`, but these values select the bundled GPU software
          # stack/image family, not only a kernel driver.
          image_preferences:
            preferred_gpu_stack_presets:
              - cuda13.0
              - cuda12.8
              - cuda12.4
              - cuda12
            preferred_os:
              - ubuntu24.04
              - ubuntu22.04
          validations:
            operator_readiness:
              # Fast control-plane gate only: operator policy objects plus
              # allocatable GPUs on Ready nodes. This should fail before any
              # workload pod/job validation starts.
              enabled_by_default: true
              timeout: 10m
            cuda_smoke:
              # Single-node CUDA workload smoke test. This intentionally checks
              # a real GPU pod instead of only scheduler-visible allocatable
              # resources, but stays bounded to a small sample so it remains
              # cheap enough for routine deploys.
              # Keep the dedicated namespace for isolation and easy reruns, but
              # delete the transient validation pods after each run.
              enabled_by_default: true
              namespace: gpu-validation
              image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04
              timeout: 5m
              max_nodes: 3
              cleanup: true
            nccl:
              # Multi-node communication validation. This is intentionally
              # separate from CUDA smoke because it validates distributed
              # communication correctness and bandwidth, not just single-node
              # CUDA execution. cxcli keeps it default-on for GPU-cluster /
              # InfiniBand-capable shapes and default-off for 1-GPU
              # Ethernet-only test/dev shapes unless the operator explicitly
              # enables it. Enabled Ethernet-only runs use Socket/TCPIP, while
              # GPU-cluster / InfiniBand shapes switch to RDMA transport. The
              # RDMA bandwidth threshold is enforced only on the RDMA path so
              # Ethernet-only runs stay informative instead of failing against
              # an InfiniBand expectation.
              # Keep the dedicated namespace, but delete the transient MPIJob
              # and transient Training Operator install after each run.
              enabled_by_default: true
              chart_component_id: nccl-test
              timeout: 20m
              max_nodes: 8
              # MPIJob v1 still lives on the Training Operator v1.x line.
              # Keep the transient prerequisite pinned instead of following a
              # floating latest manifest.
              training_operator_manifest: github.com/kubeflow/training-operator/manifests/overlays/standalone?ref=v1.9.3
              training_operator_namespace: kubeflow
              average_bus_bandwidth_threshold_gbps: 300
              # Keep NCCL on the Linux DMA-BUF GPUDirect RDMA path for
              # InfiniBand validation. NVIDIA documents DMA-BUF as the
              # recommended path and `nvidia-peermem` as the legacy path.
              rdma_mpi_extra_args:
                - -x
                - NCCL_DMABUF_ENABLE=1
        observability:
          # Settings-owned MK8s observability contract. The `config.yaml`
          # `deploy.targets[].observability` rows decide whether cxcli deploys
          # it per cluster; this block keeps agent choice, signal defaults, and
          # component-specific service buckets.
          primary_agent:
            kind: kubernetes_agent
            chart_component_id: nebius-observability-agent
            logs:
              default_enabled: true
              collect_agent_logs: false
              # Exclude list; all other namespaces remain eligible.
              excluded_namespaces:
                - kube-system
            metrics:
              default_enabled: true
              collect_agent_metrics: false
              # Include cluster/node/control-plane metrics when this
              # cxcli-managed MK8s path is enabled.
              collect_k8s_cluster_metrics: true
              # Exclude ordinary service/pod annotation scrapes from system
              # namespaces. Chart-owned infrastructure targets such as Hubble
              # remain controlled by the agent chart.
              excluded_namespaces:
                - kube-system
            traces:
              default_enabled: true
            validation: true
          grafana:
            chart_component_id: grafana
            gateway_chart_component_id: gateway-helm
            enabled_by_default: true
          service_metrics:
            buckets:
              compute:
                label: Compute metrics for MK8s node VMs
              nbs:
                label: Compute volume metrics for MK8s node disks
              gpu:
                label: GPU service metrics for GPU-backed MK8s nodes
                include_when:
                  - mk8s_gpu
          service_logs:
            buckets:
              sp_mk8s_control_plane:
                label: Managed Kubernetes control plane logs
              sp_mk8s_audit_logs:
                label: Managed Kubernetes audit logs
    managed-postgresql:
      cli:
        observability:
          service_metrics:
            buckets:
              msp:
                label: Managed Service for PostgreSQL metrics
          service_logs:
            buckets:
              sp_postgres:
                label: Managed Service for PostgreSQL logs
    sfs:
      cli:
        observability:
          service_metrics:
            buckets:
              nbs:
                label: Compute storage metrics for shared filesystem backing resources
    object-storage:
      cli:
        observability:
          service_metrics:
            buckets:
              sp_storage:
                label: Object Storage service metrics
          # Object Storage request logs are exposed through Audit Logs, not
          # through the Loki-compatible Logging read endpoint.
    vm:
      cli:
        observability:
          # VM observability uses the built-in Nebius Monitoring agent. cxcli
          # only materializes supported VM labels for journald logs.
          primary_agent:
            kind: monitoring_agent
            metrics:
              default_enabled: true
            logs:
              default_enabled: true
              systemd_units: []
          service_metrics:
            buckets:
              compute:
                label: Compute VM metrics
              nbs:
                label: Compute volume metrics for VM disks
          service_logs:
            buckets:
              sp_serial:
                label: Compute VM serial logs
  apps:
    nvidia-network-operator:
      cli:
        mk8s_gpu_policy:
          role: network_operator
          default_sets:
            network_operator_nfd:
              values.nfd.enabled: true
              values.nfd.deployNodeFeatureRules: true
            driverful_infiniband_node_selection:
              # Use the Nebius driverful label only as the seed selector for
              # the NFD worker. The standard Mellanox PCI feature label is not
              # available until NFD has already run once.
              values.node-feature-discovery.worker.affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: nebius.com/driverful
                            operator: In
                            values:
                              - "true"
              values.nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: feature.node.kubernetes.io/pci-15b3.present
                          operator: In
                          values:
                            - "true"
          post_render_patch_sets:
            rdma_shared_device_plugin:
              - target:
                  group: mellanox.com
                  version: v1alpha1
                  kind: NicClusterPolicy
                  name: nic-cluster-policy
                patch:
                  apiVersion: mellanox.com/v1alpha1
                  kind: NicClusterPolicy
                  metadata:
                    name: nic-cluster-policy
                  spec:
                    rdmaSharedDevicePlugin:
                      image: k8s-rdma-shared-dev-plugin
                      repository: nvcr.io/nvidia/mellanox
                      # NVIDIA publishes the RDMA shared-device plugin on the
                      # same Network Operator release line, but with the
                      # `network-operator-v*` image tag format.
                      version: network-operator-v{chart_version}
                      # Expose a scheduler-visible `rdma/shared_device`
                      # resource on InfiniBand-capable Mellanox HCAs.
                      config: |
                        {
                          "periodicUpdateInterval": 0,
                          "configList": [
                            {
                              "resourceName": "shared_device",
                              "rdmaHcaMax": 63,
                              "selectors": {
                                "vendors": ["15b3"],
                                "linkTypes": ["infiniband"]
                              }
                            }
                          ]
                        }
          # Top-level app defaults above are unconditional. These rules are
          # conditional: each one can auto-enable the app and/or add chart
          # defaults only when the selected MK8s GPU context matches.
          rules:
            - gpu_cluster_enabled: true
              auto_enable: true
              defaults_from:
                - network_operator_nfd
            - gpu_stack_source: operator_managed
              auto_enable: true
              # Separate Nebius platform ids and regions; both are NVIDIA B200.
              match_platforms:
                - gpu-b200-sxm
                - gpu-b200-sxm-a
              defaults_from:
                - network_operator_nfd
            - gpu_stack_source: nebius_image
              # Nebius-managed GPU images already contain the matching OFED
              # stack, so keep host OFED installs disabled.
              defaults:
                values.operator.ofedDriver.deploy: false
            - gpu_stack_source: nebius_image
              gpu_cluster_enabled: true
              # Driverful InfiniBand nodes need Nebius driverful node selection
              # plus an RDMA shared-device policy so pods can request
              # `rdma/shared_device` without a containerized OFED install.
              defaults_from:
                - driverful_infiniband_node_selection
              post_render_patches_from:
                - rdma_shared_device_plugin
            - gpu_stack_source: operator_managed
              gpu_cluster_enabled: true
              # The driverless InfiniBand path still needs an explicit RDMA
              # shared-device policy; the Network Operator chart default CR
              # installs OFED but does not expose `rdma/shared_device` by
              # itself.
              post_render_patches_from:
                - rdma_shared_device_plugin
            - gpu_stack_source: operator_managed
              # Operator-managed GPU stacks still need the Network Operator to lay down
              # host OFED/RDMA bits for GPUDirect and NCCL validation.
              defaults:
                values.operator.ofedDriver.deploy: true
    nvidia-gpu-operator:
      cli:
        mk8s_gpu_policy:
          role: gpu_operator
          default_sets:
            nebius_image_gpu_nfd:
              # Use the Nebius GPU node label only as the seed selector for
              # GPU Operator's NFD worker when GPU Operator owns NFD. The
              # standard NVIDIA discovery labels are NFD-owned output labels.
              values.node-feature-discovery.worker.affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: nebius.com/gpu
                            operator: In
                            values:
                              - "true"
          # GPU Operator is the default GPU software controller for GPU-enabled
          # MK8s clusters. Rules can both auto-enable the app and add
          # conditional chart defaults.
          rules:
            - auto_enable: true
            - gpu_stack_source: nebius_image
              # Nebius-managed GPU images already ship the host GPU driver and
              # NVIDIA Container Toolkit runtime, so GPU Operator should leave
              # both host-side paths untouched.
              defaults:
                values.driver.enabled: false
                values.toolkit.enabled: false
                values.driver.nvidiaDriverCRD.enabled: false
            - gpu_stack_source: nebius_image
              gpu_cluster_enabled: false
              # When Network Operator is not part of the target, GPU Operator
              # owns NFD. Keep its NFD worker on Nebius GPU nodes so NFD, not
              # cxcli, owns standard NVIDIA discovery labels such as
              # nvidia.com/gpu.present.
              defaults_from:
                - nebius_image_gpu_nfd
            - gpu_cluster_enabled: true
              # Whenever Network Operator is part of the GPU-cluster /
              # InfiniBand path, let it own the single NFD instance.
              defaults:
                values.nfd.enabled: false
            - gpu_stack_source: operator_managed
              # Operator-managed B200/B200A stacks also auto-enable Network Operator for
              # RDMA plumbing, so keep NFD single-owned there too.
              match_platforms:
                - gpu-b200-sxm
                - gpu-b200-sxm-a
              defaults:
                values.nfd.enabled: false
            - gpu_stack_source: operator_managed
              # Operator-managed GPU stacks keep the host driver/toolkit path in
              # GPU Operator, but still avoid the broken Nebius NVIDIADriver
              # CRD template path in the bundled GPU Operator chart.
              defaults:
                values.driver.enabled: true
                values.toolkit.enabled: true
                values.driver.nvidiaDriverCRD.enabled: false
            - gpu_stack_source: operator_managed
              match_platforms:
                - gpu-b300-sxm
              defaults:
                # Ref: https://docs.nebius.com/kubernetes/gpu/set-up
                # Nebius docs pin the B300 operator-managed install path to
                # --set driver.version=580.95.05. Keep it catalog-owned rather
                # than hardcoded in Python.
                values.driver.version: 580.95.05
          # App-only Flux release ordering: when both operators are present,
          # wait for Network Operator first.
          install_after:
            - nvidia-network-operator
        observability:
          metric_targets:
            - job_name: cxcli-nvidia-dcgm-exporter
              # The Nebius Observability Agent discovers service endpoints that
              # carry prometheus.io/scrape=true. GPU Operator creates the
              # nvidia-dcgm-exporter service with that annotation, so cxcli does
              # not add a duplicate agent additionalTarget for DCGM.
              # On `nebius_image` stacks cxcli also owns the Nebius-specific GPU
              # node-label policy required to schedule DCGM Exporter plus the
              # validator without turning on GPU Operator device-plugin or GFD.
              # Keep this as `nebius_image` only. In the operator-managed stack,
              # GPU Operator owns the full driver/toolkit/device-plugin/DCGM
              # lifecycle and should not be short-circuited by cxcli-managed
              # operand labels.
              discovery:
                kind: prometheus_annotations
                service_name: nvidia-dcgm-exporter
                port: 9400
              managed_gpu_node_policy:
                stack_sources:
                  - nebius_image
                selector:
                  nebius.com/gpu: "true"
                labels:
                  nvidia.com/gpu.deploy.operands: "true"
                  nvidia.com/gpu.deploy.dcgm-exporter: "true"
                  nvidia.com/gpu.deploy.operator-validator: "true"
                  nvidia.com/gpu.deploy.device-plugin: "false"
                  nvidia.com/gpu.deploy.gpu-feature-discovery: "false"
    nccl-test:
      cli:
        mk8s_gpu_policy:
          # Shared NCCL image and benchmark defaults come from the chart's own
          # values.yaml. Keep only platform-specific MPI overlays here. Nebius
          # docs add `-mca coll ^hcoll` for the B200 MPIJob example while the
          # H100/H200 example omits it; NVIDIA HPC-X also marks HCOLL unsupported
          # on GB200/GB300. Keep this Blackwell-family override catalog-owned
          # rather than promoting it to a shared chart default.
          # Ref: https://docs.nebius.com/kubernetes/gpu/nccl-test
          rules:
            - match_platforms:
                - gpu-b200-sxm
                - gpu-b200-sxm-a
                - gpu-b300-sxm
              defaults:
                # B200/B200A are covered by the official Nebius B200 NCCL
                # example. B300/GB300 are covered by the NVIDIA HPC-X HCOLL
                # support boundary. Keep the flag on the app policy so the
                # shared nccl-test chart remains hardware-neutral.
                values.benchmark.mpiExtraArgs:
                  - -mca
                  - coll
                  - ^hcoll
    soperator:
      cli:
        mk8s_gpu_policy:
          # Soperator itself is selected explicitly. On GPU MK8s targets,
          # cxcli already auto-enables GPU Operator and, for GPU fabric /
          # InfiniBand cases, Network Operator. This policy only orders the
          # Soperator HelmRelease after whichever GPU platform releases are
          # present. The Soperator DCGM job-mapping exporter is an optional
          # child chart enabled under the parent Soperator values.
          install_after:
            - cert-manager
            - nvidia-network-operator
            - nvidia-gpu-operator
          # Soperator worker pods intentionally consume the selected GPU nodes,
          # so workload checks may skip once the Slurm workers reserve every
          # GPU. Still expose the cxcli-owned MK8s GPU validation toggles during
          # create/component add; Soperator ActiveChecks stay disabled unless an
          # operator explicitly chooses Slurm-level benchmark/diagnostic jobs.
        # ------------------------------------------------------------------
        # Soperator wizard guidance for operators
        # ------------------------------------------------------------------
        # The Soperator wizard surfaces three layered choices, each rendered
        # as Slurm.conf or SlurmDBD content by the chart at template time.
        # Profile-owned settings use the chart's typed values where the chart
        # models the Slurm key; raw customSlurmConfig remains only for
        # unmodeled one-off Slurm keys. See the Scheduling And Preemption
        # section of the soperator chart design doc for the field-to-Slurm.conf
        # mapping.
        #
        # Slurm concepts that drive these choices (vendor terminology):
        #
        #   Partition         A queue plus its policy: which NodeSets the
        #                     queue covers and how jobs behave on those
        #                     nodes (MaxTime, AllowQos, PreemptMode, ...).
        #
        #   PriorityTier      Partition-level scheduling tier. The Slurm
        #                     scheduler evaluates higher tiers first. With
        #                     `PreemptType=preempt/partition_prio` it is
        #                     also the preemption tier: a higher-tier job
        #                     can preempt a lower-tier running job that
        #                     shares the same nodes.
        #
        #   PriorityWeight*   slurm.conf knobs that weight each component
        #                     of the multifactor job-priority formula:
        #                     Age, Fairshare, QOS, TRES, Partition, JobSize.
        #                     A weight of 0 makes that component inert.
        #                     PriorityWeightPartition is the partition's
        #                     numeric contribution (paired with the
        #                     partition's PriorityJobFactor) and is only
        #                     used when PriorityWeightPartition > 0.
        #
        #   PreemptType       Global plugin that decides which running jobs
        #                     are eligible as preemption victims. Common
        #                     values: preempt/partition_prio (use tiers),
        #                     preempt/qos (use SlurmDB QOS relationships),
        #                     preempt/none (disabled).
        #
        #   PreemptMode       Cluster default for how victim jobs are
        #                     handled (OFF, CANCEL, REQUEUE, SUSPEND, GANG).
        #                     Partitions and QOS objects can override the
        #                     cluster default. REQUEUE only takes effect if
        #                     victims were submitted with --requeue or
        #                     `schedulingConfig.jobRequeue: 1`.
        #
        #   QOS               SlurmDBD accounting object that can affect
        #                     three independent things: scheduling priority
        #                     (via PriorityWeightQOS), preemption (under
        #                     preempt/qos with explicit Preempt= lists),
        #                     and resource limits (MaxJobs, MaxWall, TRES).
        #                     QOS objects live in SlurmDBD; numeric priority
        #                     alone is not enough to drive QOS preemption.
        #
        #   Niceness (--nice) Per-job user modifier applied directly to
        #                     priority calculation. Re-orders jobs inside
        #                     the same priority bucket; there is no
        #                     PriorityWeightNice knob.
        #
        # Two operational patterns dominate Nebius Soperator deployments:
        #
        #   (a) Partition + tiering -- deterministic. Distinct PriorityTier
        #       per partition orders queues without SlurmDBD QOS objects.
        #       Operators can add PreemptType=preempt/partition_prio plus an
        #       intentional PreemptMode when actual victim selection is wanted.
        #       PriorityWeight* can stay at 0 so tiers drive the queue policy.
        #
        #   (b) QOS + fairshare -- multi-tenant fairness. Non-zero
        #       PriorityWeightFairshare / PriorityWeightQOS, AllowQos lists
        #       per partition, PreemptType=preempt/qos, and explicit QOS
        #       Preempt= relationships in SlurmDBD. The chart's optional
        #       `qosConfiguration` block reconciles those QOS objects.
        #
        # The catalog overlays expose these patterns through the
        # `partition_profiles` choices; the conceptual mapping for each
        # profile is documented inline below.
        soperator_nodesets_profile:
          # NodeSet profile = capacity shape. It declares the Soperator
          # worker NodeSets and placement defaults; partition selection
          # (queue + policy) is a separate later choice. Per the Slurm
          # guide: "NodeSet = capacity, Partition = policy".
          default: nebius-gpu-v1
          profiles:
            nebius-cpu-v1:
              wizard:
                # Single homogeneous worker shape for CPU-only training,
                # data ETL, or controller-side workloads. One worker
                # NodeSet (worker-cpu) plus one Slurm partition (cpu).
                label: "CPU-only workers: worker-cpu NodeSet, cpu Slurm partition, accounting DB enabled"
              placements:
                system:
                  kind: platform-support
                  node_group: system
                  default_node_group_kind: cpu
                  filesystem_keys: [jail]
                  soperator_node_filter: system
                  soperator_value_bindings:
                    populateJail.k8sNodeFilterName: system
                  soperator_affinity_bindings:
                    - controllerManager.affinity
                    - soperator-checks.checks.affinity
                    - mariadb-operator.affinity
                    - mariadb-operator.webhook.affinity
                controller:
                  kind: slurm-service
                  node_group: controller
                  default_node_group_kind: cpu
                  filesystem_keys: [jail, controller-spool]
                  soperator_node_filter: controller
                  soperator_value_bindings:
                    slurmNodes.controller.k8sNodeFilterName: controller
                    slurmNodes.rest.k8sNodeFilterName: controller
                    sConfigController.node.k8sNodeFilterName: controller
                login:
                  kind: slurm-service
                  node_group: login
                  default_node_group_kind: cpu
                  filesystem_keys: [jail]
                  soperator_node_filter: login
                  soperator_value_bindings:
                    slurmNodes.login.k8sNodeFilterName: login
                accounting:
                  kind: slurm-service
                  node_group: accounting
                  default_node_group_kind: cpu
                  filesystem_keys: [jail, accounting]
                  soperator_node_filter: accounting
                  soperator_value_bindings:
                    slurmNodes.accounting.k8sNodeFilterName: accounting
                worker:
                  kind: slurm-worker-nodeset
                  default_node_group_kind: cpu
