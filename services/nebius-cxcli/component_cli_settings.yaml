                              maxWallSeconds: 14400
                              preempt: [train, data]
                              preemptMode: REQUEUE
                            - name: train
                              priority: 5000
                              maxWallSeconds: 259200
                              preempt: [data]
                              preemptMode: REQUEUE
                            - name: data
