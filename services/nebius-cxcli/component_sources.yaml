shared:
  admin_ssh:
    user_name: ubuntu
# `components.*` defines reusable component types only. Repeated modules or
# charts in one project are modeled in `config.yaml` with distinct instance
# rows; target-bound app charts use the cluster target id as their
# `instance_id` and are unique per chart id plus target.
components:
  infra:
    mk8s:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/mk8s?ref=main
        local: ../../platform-infra/modules/mk8s
      ui:
        title: Managed Kubernetes baseline cluster
        group: Compute
        enabled: true
      status:
        kind: nebius.mk8s.cluster
        parent_input: cluster.parent_id
        name_input: cluster.cluster_name
      defaults:
        inputs.cluster.public_endpoint: true
        inputs.cluster.kube_network.service_cidrs:
          - /20
      wizard_profile: mk8s
    vpc:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/vpc?ref=main
        local: ../../platform-infra/modules/vpc
      ui:
        title: VPC network and optional subnets
        group: Network
        enabled: false
      wizard_profile: vpc
    managed-postgresql:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/managed-postgresql?ref=main
        local: ../../platform-infra/modules/managed-postgresql
      ui:
        title: Managed PostgreSQL database
        group: Storage
        enabled: false
      status:
        kind: nebius.msp.postgresql.cluster
      wizard_profile: managed-postgresql
    sfs:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/sfs?ref=main
        local: ../../platform-infra/modules/sfs
      ui:
        title: Shared filesystem and CSI integration
        group: Storage
        enabled: false
      status:
        kind: nebius.compute.filesystem
        name_inputs:
          - filesystems
          - name
      wizard_profile: sfs
    nfs:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/nfs?ref=main
        local: ../../platform-infra/modules/nfs
      ui:
        title: VM-based NFS bridge (non-HA)
        group: Storage
        enabled: false
      status:
        kind: nebius.compute.instance
      wizard_profile: nfs
      defaults:
        inputs.ssh_user_name: shared.admin_ssh.user_name
    object-storage:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/object-storage?ref=main
        local: ../../platform-infra/modules/object-storage
      ui:
        title: Object storage bucket
        group: Storage
        enabled: false
      status:
        kind: nebius.storage.bucket
      wizard_profile: object-storage
    mysterybox:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/mysterybox?ref=main
        local: ../../platform-infra/modules/mysterybox
      ui:
        title: MysteryBox secrets
        group: Security
        enabled: false
      status:
        kind: nebius.mysterybox.secret
        name_input: secrets
      wizard_profile: mysterybox
    vm:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/vm?ref=main
        local: ../../platform-infra/modules/vm
      ui:
        title: Compute virtual machine
        group: Compute
        enabled: false
      status:
        kind: nebius.compute.instance
      wizard_profile: vm
      defaults:
        # Materialize the shared admin SSH username into customer config.yaml.
        inputs.ssh_user_name: shared.admin_ssh.user_name
    wireguard-gw:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/wireguard-gw?ref=main
        local: ../../platform-infra/modules/wireguard-gw
      ui:
        title: WireGuard VPN gateway
        group: Network
        enabled: false
      status:
        kind: nebius.compute.instance
      wizard_profile: wireguard-gw
      defaults:
        inputs.ssh_user_name: shared.admin_ssh.user_name
        inputs.wireguard_tunnel_cidr: 10.8.0.1/22
        inputs.wireguard_listen_port: 51820
        inputs.client_default_dns:
          - 1.1.1.1
          - 1.0.0.1
    ssh-jumphost:
      source:
        portable: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/ssh-jumphost?ref=main
        local: ../../platform-infra/modules/ssh-jumphost
      ui:
        title: SSH-only hardened jump host
        group: Security
        enabled: false
      status:
        kind: nebius.compute.instance
      wizard_profile: ssh-jumphost
      defaults:
        inputs.ssh_user_name: shared.admin_ssh.user_name
  apps:
    nvidia-network-operator:
      source:
        portable:
          repo: oci://cr.eu-north1.nebius.cloud/marketplace/nebius/nvidia-network-operator/chart/network-operator
          chart: network-operator
          version: 25.7.0
      ui:
        title: NVIDIA Network Operator
        group: Platform
        enabled: false
      release:
        namespace: nvidia-network-operator
        name: network-operator
      defaults:
        # Keep only Nebius-specific deltas here. The live chart already defaults
        # the operator CPU limit to 500m and disables the OFED liveness probe.
        values.operator.resources.limits.memory: 350Mi
        # The chart reuses operator affinity for pre-install/pre-upgrade hooks.
        # Keep those API-discovery hooks on CPU nodes; on fresh GPU-cluster
        # creates, scheduling the hook on the first GPU worker can race service
        # routing while Network Operator is still bootstrapping RDMA plumbing.
        values.operator.affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nebius.com/gpu
                      operator: NotIn
                      values:
                        - "true"
    nvidia-gpu-operator:
      source:
        portable:
          repo: oci://cr.eu-north1.nebius.cloud/marketplace/nebius/nvidia-gpu-operator/chart/gpu-operator
          chart: gpu-operator
          version: v25.10.0
      ui:
        title: NVIDIA GPU Operator
        group: Platform
        enabled: false
      release:
        namespace: nvidia-gpu-operator
        name: gpu-operator
      defaults:
        # The live chart already defaults devicePlugin/DCGM Exporter to enabled.
        # Keep only the Nebius-specific override that disables MIG management in
        # the shared deploy-time baseline.
        values.migManager.enabled: false
    nccl-test:
      source:
        portable:
          repo: oci://cr.eu-north1.nebius.cloud/e00th0mgv3zddz7468/charts/nccl-test
          chart: nccl-test
          version: 0.2.8
        local:
          path: ../../helm-charts/nccl-test
      usage:
        lifecycle: transient
        config:
          ref: deploy.targets[].validations.mk8s_gpu.nccl
      ui:
        title: NCCL benchmark validation chart
        group: Validations
        enabled: false
        selectable: false
      release:
        namespace: nccl-test
        name: nccl-test
      defaults: {}
    soperator:
      source:
        portable:
          repo: https://github.com/nebius/nebius-ps-services/tree/main/helm-charts/soperator
          chart: soperator
          version: 4.0.1-ps.1
        local:
          path: ../../helm-charts/soperator
      ui:
        title: Nebius Soperator self-deployment
        group: Slurm
        enabled: false
      release:
        namespace: soperator
        name: soperator
        timeout: 90m
      wizard_profile: soperator
      defaults:
        values.soperator-checks.enabled: false
        values.soperator-checks.fullnameOverride: soperator-checks
        values.soperator-checks.serviceMonitor.enabled: false
        values.soperator-activechecks.enabled: false
        values.soperator-activechecks.fullnameOverride: soperator-activechecks
        values.soperator-activechecks.waitForChecks.enabled: false
        # ActiveChecks are opt-in only. Keep their individual run-on-create
        # gates false as a second guardrail for benchmark or diagnostic clusters
        # where operators intentionally enable the child chart.
        values.soperator-activechecks.checks.all-reduce-perf-nccl-in-docker.runAfterCreation: false
        values.soperator-activechecks.checks.all-reduce-perf-nccl-with-ib.runAfterCreation: false
        values.soperator-activechecks.checks.all-reduce-perf-nccl-without-ib.runAfterCreation: false
        values.soperator-activechecks.checks.cuda-samples.runAfterCreation: false
        values.soperator-activechecks.checks.dcgmi-diag-r2.runAfterCreation: false
        values.soperator-activechecks.checks.dcgmi-diag-r3.runAfterCreation: false
        values.soperator-activechecks.checks.gpu-fryer.runAfterCreation: false
        values.soperator-activechecks.checks.ib-gpu-perf.runAfterCreation: false
        values.soperator-activechecks.checks.manage-jail-state.runAfterCreation: false
        values.soperator-activechecks.checks.mem-perf.runAfterCreation: false
        values.soperator-activechecks.checks.prepull-container-image.runAfterCreation: false
        values.soperator-notifier.enabled: false
        values.soperator-notifier.fullnameOverride: soperator-notifier
        values.soperator-notifier.slack.mode: existing-webhook
        values.soperator-notifier.slack.webhookSource: deploy-time
        values.soperator-notifier.slack.existingSecret: soperator-notifier-slack-webhook
        values.soperator-notifier.slack.existingSecretKey: url
        values.soperator-notifier.slack.mysterybox.property: url
        values.soperator-backup-config.enabled: false
        values.soperator-backup-config.fullnameOverride: soperator-jail-backup
        values.soperator-backup-config.secret.name: jail-backup
        values.soperator-backup-config.secret.keys.accessKeyID: aws-access-key-id
        values.soperator-backup-config.secret.keys.secretAccessKey: aws-access-secret-key
        values.soperator-backup-config.secret.keys.backupPassword: backup-password
        values.soperator-dcgm-exporter.enabled: false
        values.soperator-dcgm-exporter.fullnameOverride: soperator-dcgm-exporter
        values.soperator-dcgm-exporter.serviceMonitor.enabled: false
        values.certManager.privateKey.rotationPolicy: Always
    csi-driver-nfs:
      source:
        portable:
          repo: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
          chart: csi-driver-nfs
          version: 4.13.2
      ui:
        title: Kubernetes NFS CSI driver
        group: Storage
        enabled: false
      release:
        namespace: kube-system
        name: csi-driver-nfs
        timeout: 10m
      defaults:
        values.controller.replicas: 2
        values.storageClass.name: nfs-rwx-retain
        values.storageClass.parameters.subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
        values.storageClass.parameters.mountPermissions: "0770"
        values.storageClass.parameters.onDelete: retain
        values.storageClass.reclaimPolicy: Retain
        values.storageClass.volumeBindingMode: Immediate
    nebius-observability-agent:
      # Keep this public chart pinned here because the fixed Nebius Kubernetes
      # agent docs identify it as the supported observability-agent Helm chart,
      # and its rendered surface matches cxcli's logs+metrics+traces MK8s contract.
      # Ref: https://docs.nebius.com/observability/agents/nebius-o11y-agent
      # Ref: https://docs.nebius.com/observability/traces/ingest
      source:
        portable:
          repo: oci://cr.nebius.cloud/observability/public/nebius-observability-agent-helm
          chart: nebius-observability-agent-helm
          version: 1.0.5
      ui:
        title: Nebius observability agent
        group: Observability
        enabled: false
      release:
        namespace: observability
        name: nebius-observability-agent
      # Keep customer-facing toggles under config.yaml
      # deploy.targets[].observability and derive them from the paired
      # component_cli_settings.yaml MK8s observability settings at render time.
      # Only put explicit Nebius-specific chart deltas here when cxcli must
      # override an upstream chart default.
      defaults: {}
    grafana:
      # Official Grafana community Helm chart and Docker image. cxcli renders
      # chart references, deploy-time Kubernetes Secrets, and cxcli-owned
      # Kubernetes dashboards. Keep only a small Nebius service-dashboard import
      # as an example; cluster-scoped MK8s dashboards must use cxcli-owned JSON
      # so their variables can be filtered by the exact MK8s cluster ID.
      # Ref: https://github.com/grafana-community/helm-charts/tree/main/charts/grafana
      source:
        portable:
          repo: https://grafana-community.github.io/helm-charts
          chart: grafana
          version: 12.1.3
      ui:
        title: Grafana observability console
        group: Observability
        enabled: false
      release:
        namespace: observability
        name: grafana
        timeout: 10m
        install_after:
          - gateway-helm
      defaults:
        # Keep CPU-only platform/observability pods off expensive GPU nodes by
        # default. Nebius GPU worker nodes carry `nebius.com/gpu=true`; CPU nodes
        # do not, so this hard node affinity still works across CPU platform names.
        values.affinity: &nebius_cpu_only_node_affinity
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nebius.com/gpu
                      operator: NotIn
                      values:
                        - "true"
        values.service.type: ClusterIP
        values.route.main.enabled: true
        values.route.main.apiVersion: gateway.networking.k8s.io/v1
        values.route.main.kind: HTTPRoute
        values.route.main.parentRefs:
          - name: nebius-cxcli-grafana
            namespace: observability
            sectionName: http
        values.extraObjects:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: GatewayClass
            metadata:
              name: nebius-cxcli-envoy
            spec:
              controllerName: gateway.envoyproxy.io/gatewayclass-controller
          - apiVersion: gateway.envoyproxy.io/v1alpha1
            kind: EnvoyProxy
            metadata:
              name: nebius-cxcli-grafana-proxy
              namespace: observability
            spec:
              provider:
                type: Kubernetes
                kubernetes:
                  envoyDeployment:
                    replicas: 2
                    pod:
                      affinity: *nebius_cpu_only_node_affinity
                  envoyService:
                    type: LoadBalancer
                    externalTrafficPolicy: Cluster
          - apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            metadata:
              name: nebius-cxcli-grafana
              namespace: observability
            spec:
              gatewayClassName: nebius-cxcli-envoy
              infrastructure:
                parametersRef:
                  group: gateway.envoyproxy.io
                  kind: EnvoyProxy
                  name: nebius-cxcli-grafana-proxy
              listeners:
                - name: http
                  protocol: HTTP
                  port: 80
                  allowedRoutes:
                    namespaces:
                      from: Same
        values.dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: nebius
                orgId: 1
                folder: Nebius
                folderUid: nebius
                type: file
                disableDeletion: false
                allowUiUpdates: true
                options:
                  path: /var/lib/grafana/dashboards/nebius
              - name: nebius-kubernetes
                orgId: 1
                folder: Nebius Kubernetes
                folderUid: nebius-kubernetes
                type: file
                disableDeletion: false
                allowUiUpdates: true
                options:
                  path: /var/lib/grafana/dashboards/nebius-kubernetes
              - name: nebius-vm
                orgId: 1
                folder: Nebius VMs
                folderUid: nebius-vm
                type: file
                disableDeletion: false
                allowUiUpdates: true
                options:
                  path: /var/lib/grafana/dashboards/nebius-vm
        values.dashboards:
          # Nebius service dashboards use the service-provider Monitoring
          # service-metrics datasource name. Keep one imported example here;
          # cxcli-owned cluster-scoped dashboards live under nebius-kubernetes.
          nebius:
            nebius-disk:
              gnetId: 23425
              revision: 2
              uid: nebius-disk-user-stats
              datasource: Nebius Services
          nebius-kubernetes:
            kubernetes-cluster-monitoring:
              datasource: Nebius User Metrics
              json_file: grafana_dashboards/kubernetes-metrics.json
            kubernetes-gpu:
              datasource: Nebius Services
              json_file: grafana_dashboards/kubernetes-gpu.json
            kubernetes-logs-from-loki:
              datasource: Nebius Logs
              json_file: grafana_dashboards/kubernetes-logs.json
            kubernetes-traces:
              datasource: Nebius Traces
              json_file: grafana_dashboards/kubernetes-traces.json
          nebius-vm:
            vm-metrics:
              datasource: Nebius Services
              json_file: grafana_dashboards/vm-metrics.json
            vm-logs:
              datasource: Nebius Logs
              json_file: grafana_dashboards/vm-logs.json
    gateway-helm:
      source:
        portable:
          repo: oci://docker.io/envoyproxy
          chart: gateway-helm
          version: 1.7.0
      ui:
        title: Envoy Gateway control plane
        group: Platform
        enabled: false
      release:
        namespace: envoy-gateway-system
        name: envoy-gateway
        timeout: 10m
      # Helm chart defaults are merged into apps.charts[].values when missing.
      # Example:
      # values.service.type: LoadBalancer
      # values.deployment.replicas: 2
      defaults:
        values.config.envoyGateway.provider.type: Kubernetes
        values.deployment.replicas: 2
        values.deployment.pod.affinity: *nebius_cpu_only_node_affinity
        values.certgen.job.affinity: *nebius_cpu_only_node_affinity
    cert-manager:
      source:
        portable:
          repo: oci://quay.io/jetstack/charts
          chart: cert-manager
          version: v1.19.2
      ui:
        title: cert-manager for certificate automation
        group: Platform
        enabled: false
      release:
        namespace: cert-manager
        name: cert-manager
      defaults:
        values.crds.enabled: true
        values.replicaCount: 2
        values.affinity: *nebius_cpu_only_node_affinity
        values.webhook.replicaCount: 2
        values.webhook.affinity: *nebius_cpu_only_node_affinity
        values.cainjector.replicaCount: 2
        values.cainjector.affinity: *nebius_cpu_only_node_affinity
        values.startupapicheck.affinity: *nebius_cpu_only_node_affinity
    external-dns:
      source:
        portable:
          repo: https://kubernetes-sigs.github.io/external-dns
          chart: external-dns
          version: 1.20.0
      ui:
        title: ExternalDNS controller
        group: Platform
        enabled: false
      release:
        namespace: external-dns
        name: external-dns
      defaults:
        values.affinity: *nebius_cpu_only_node_affinity
    external-secrets:
      source:
        portable:
          repo: https://charts.external-secrets.io
          chart: external-secrets
          version: 2.4.1
      ui:
        title: External Secrets Operator
        group: Platform
        enabled: false
      release:
        namespace: external-secrets
        name: external-secrets
      defaults:
        values.replicaCount: 2
        values.leaderElect: true
        values.global.affinity: *nebius_cpu_only_node_affinity
        values.webhook.replicaCount: 2
        values.certController.replicaCount: 2
    n8n:
      source:
        portable:
          repo: oci://8gears.container-registry.com/library/n8n
          chart: n8n
          version: 2.0.1
      ui:
        title: n8n workflow automation
        group: Workloads
        enabled: false
      release:
        namespace: n8n
        name: n8n
      defaults:
        values.main.affinity: *nebius_cpu_only_node_affinity
        values.worker.affinity: *nebius_cpu_only_node_affinity
        values.webhook.affinity: *nebius_cpu_only_node_affinity
