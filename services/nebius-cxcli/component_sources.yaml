cli:
  flux:
    version: v2.8.0
  terraform:
    version: 1.14.1

shared:
  admin_ssh:
    user_name: ubuntu

infra:
  tf_modules:
    - module: mk8s
      portable_source: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/mk8s?ref=main
      local_source: ../../platform-infra/modules/mk8s
      description: Managed Kubernetes baseline cluster module
      group: Compute
      enable: true
      defaults:
        inputs.mk8s_cluster_public_endpoint: true
        inputs.kube_network_service_cidrs:
        - /20
      outputs:
        tf_outputs: true
        static:
          access: external
      handoff:
        cluster_id: cluster_id
        access: access
    - module: managed-postgresql
      portable_source: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/managed-postgresql?ref=main
      local_source: ../../platform-infra/modules/managed-postgresql
      description: Managed PostgreSQL database module
      group: Storage
      enable: false
      outputs:
        tf_outputs: true
    - module: sfs
      portable_source: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/sfs?ref=main
      local_source: ../../platform-infra/modules/sfs
      description: Shared filesystem and CSI integration module
      group: Storage
      enable: false
      outputs:
        tf_outputs: true
    - module: object-storage
      portable_source: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/object-storage?ref=main
      local_source: ../../platform-infra/modules/object-storage
      description: Object storage buckets module
      group: Storage
      enable: false
      outputs:
        tf_outputs: true
    - module: mysterybox
      portable_source: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/mysterybox?ref=main
      local_source: ../../platform-infra/modules/mysterybox
      description: MysteryBox secrets module
      group: Security
      enable: false
      outputs:
        tf_outputs: true
    - module: wireguard-jumphost
      portable_source: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/wireguard-jumphost?ref=main
      local_source: ../../platform-infra/modules/wireguard-jumphost
      description: WireGuard jump host module
      group: Network
      enable: false
      outputs:
        tf_outputs: true
      defaults:
        inputs.ssh_user_name: shared.admin_ssh.user_name
    - module: ssh-jumphost
      portable_source: git::https://github.com/nebius/nebius-ps-services.git//platform-infra/modules/ssh-jumphost?ref=main
      local_source: ../../platform-infra/modules/ssh-jumphost
      description: SSH-only hardened jump host module
      group: Security
      enable: false
      outputs:
        tf_outputs: true
      defaults:
        inputs.ssh_user_name: shared.admin_ssh.user_name

apps:
  helm_charts:
    - name: gateway-helm
      repo: oci://docker.io/envoyproxy
      version: 1.7.0
      namespace: envoy-gateway-system
      releasename: envoy-gateway
      description: Envoy Gateway control plane
      group: Platform
      enable: false
    - name: cert-manager
      repo: oci://quay.io/jetstack/charts
      version: v1.19.2
      namespace: cert-manager
      releasename: cert-manager
      description: cert-manager for certificate automation
      group: Platform
      enable: false
    - name: external-dns
      repo: https://kubernetes-sigs.github.io/external-dns
      version: 1.20.0
      namespace: external-dns
      releasename: external-dns
      description: ExternalDNS controller
      group: Platform
      enable: false
    - name: external-secrets
      repo: https://charts.external-secrets.io
      version: 2.0.1
      namespace: external-secrets
      releasename: external-secrets
      description: External Secrets Operator
      group: Platform
      enable: false
    - name: n8n
      repo: oci://8gears.container-registry.com/library/n8n
      version: 2.0.1
      namespace: n8n
      releasename: n8n
      description: n8n is an extendable workflow automation tool
      group: Workloads
      enable: false
