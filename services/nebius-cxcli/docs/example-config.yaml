version: v1

client_info:
  client_name: example-client
  nebius:
    tenant_id: tenant-REDACTED
    project_id: project-REDACTED
    region_id: us-central1
  notifications:
    inventory_markdown: true
    email: ops@example.com

infra:
  ssh_user_name: ubuntu
  ssh_public_key: ssh-ed25519 AAAA-REPLACE-WITH-YOUR-KEY
  components:
    - id: mk8s
      enabled: true
      source: ../../platform-infra/modules/mk8s
      inputs:
        subnet_id: vpcsubnet-REPLACE-ME
        cpu_nodes:
          count: 2
          platform: cpu-d3
          preset: 4vcpu-16gb
          preemptible: false
          public_ips: false
        gpu_nodes:
          enabled: false
        api_endpoint:
          public: false
    - id: object-storage
      enabled: true
      source: ../../platform-infra/modules/object-storage
      inputs:
        state_bucket:
          manage: true
          name: tfstate-tenant-REDACTED
          prefix: tfstate
          use_lockfile: true
        inventory_bucket:
          manage: true
          name: inventory-tenant-REDACTED
          prefix: inventory
    - id: wireguard-jumphost
      enabled: false
      source: ../../platform-infra/modules/wireguard-jumphost
      inputs:
        subnet_id: vpcsubnet-REPLACE-ME
        platform: cpu-d3
        preset: 4vcpu-16gb

apps:
  charts:
    - id: gateway-helm
      group: platform
      enabled: true
      repo: oci://docker.io/envoyproxy/gateway-helm
      version: 1.7.0
      namespace: envoy-gateway-system
      release-name: envoy-gateway
      values: {}
    - id: n8n
      group: workloads
      enabled: true
      repo: https://community-charts.github.io/helm-charts
      version: 1.16.29
      namespace: n8n
      release-name: n8n
      values:
        replicaCount: 2
