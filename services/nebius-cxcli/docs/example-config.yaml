version: v1

client_info:
  client_name: example-client
  env: dev
  cluster_name: example-cluster
  nebius:
    tenant_id: tenant-REDACTED
    project_id: project-REDACTED
    region_id: us-central1
  notifications:
    inventory_markdown: true
    email: ops@example.com

infra:
  ssh_user_name: ubuntu
  ssh_public_key: ssh-ed25519 AAAA-REPLACE-WITH-YOUR-KEY
  components:
    - id: mk8s
      enabled: true
      source: ../../platform-infra/modules/mk8s
      inputs:
        subnet_id: vpcsubnet-REPLACE-ME
        cpu_nodes:
          count: 2
          platform: cpu-d3
          preset: 4vcpu-16gb
          preemptible: false
          public_ips: false
        gpu_nodes:
          enabled: false
        api_endpoint:
          public: false
    - id: object-storage
      enabled: true
      source: ../../platform-infra/modules/object-storage
      inputs:
        state_bucket:
          manage: true
          name: tfstate-tenant-REDACTED
          prefix: tfstate
          use_lockfile: true
        inventory_bucket:
          manage: true
          name: inventory-tenant-REDACTED
          prefix: inventory
    - id: wireguard-jumphost
      enabled: false
      source: ../../platform-infra/modules/wireguard-jumphost
      inputs:
        subnet_id: vpcsubnet-REPLACE-ME
        platform: cpu-d3
        preset: 4vcpu-16gb

apps:
  releases:
    - id: envoy-gateway
      section: platform
      enabled: true
      values:
        namespace: envoy-gateway-system
        release_name: envoy-gateway
        chart:
          repo: https://envoyproxy.github.io/gateway-helm
          name: gateway-helm
          version: 1.4.2
        values: {}
    - id: n8n
      section: workloads
      enabled: true
      values:
        namespace: n8n
        release_name: n8n
        chart:
          repo: https://community-charts.github.io/helm-charts
          name: n8n
          version: 1.16.29
        values:
          replicaCount: 2

component_sources:
  infra:
    tf_modules:
      - module: mk8s
        source: ../../platform-infra/modules/mk8s
        group: Compute
        enable: true
      - module: object-storage
        source: ../../platform-infra/modules/object-storage
        group: Storage
        enable: true
      - module: wireguard-jumphost
        source: ../../platform-infra/modules/wireguard-jumphost
        group: Network
        enable: false
  apps:
    helm_charts:
      - name: gateway-helm
        repo: https://envoyproxy.github.io/gateway-helm
        version: 1.4.2
        namespace: envoy-gateway-system
        releasename: envoy-gateway
        group: Platform
        enable: true
      - name: n8n
        repo: https://community-charts.github.io/helm-charts
        version: 1.16.29
        namespace: n8n
        releasename: n8n
        group: Workloads
        enable: true
