<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Content-free target-wins active and passive Soperator jail rootfs</title>
  <desc id="desc">Fenced admission freezes the digest-pinned official target image, mandatory and optional protected paths, active rootfs identity, and exact passive PVC authority without extracting or comparing source and reference images. After forward-only commit, operation-owned jobs prove the passive slot empty and unconsumed, populate it, seal the materialization receipt, verify protected consumers, and switch them while retaining the old active slot. Mandatory data stays outside both rootfs generations on canonical physical SFS or optional VM-NFS backing storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/></marker>
    <style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.identity{fill:#eff6ff;stroke:#2563eb;stroke-width:2.5}.decision{fill:#fefce8;stroke:#ca8a04;stroke-width:2.5}.passive{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5}.switch{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}.data{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.title{font:700 31px Inter,Arial,sans-serif;fill:#0f172a}.head{font:700 17px Inter,Arial,sans-serif;fill:#0f172a}.body{font:500 13px Inter,Arial,sans-serif;fill:#334155}.small{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}.note{font:600 12.5px Inter,Arial,sans-serif;fill:#475569}</style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="600" y="48" text-anchor="middle">Protected jail rootfs: target-wins, populate, switch</text>
  <text class="body" x="600" y="76" text-anchor="middle">No reference rootfs · immutable target image · exact inactive destination · protected mounts outside both slots</text>

  <rect class="panel" x="42" y="102" width="1116" height="288" rx="18"/>
  <text class="head" x="66" y="136">Replaceable rootfs generations and fenced transition</text>
  <rect class="identity" x="64" y="166" width="250" height="172" rx="14"/>
  <text class="head" x="189" y="195" text-anchor="middle">Freeze slot authority</text>
  <text class="body" x="189" y="222" text-anchor="middle">active rootfs PVC identity</text>
  <text class="body" x="189" y="244" text-anchor="middle">passive PVC UID + storage contract</text>
  <text class="body" x="189" y="266" text-anchor="middle">Lease epoch + workload digest</text>
  <text class="body" x="189" y="288" text-anchor="middle">source retained; no cxcli write</text>
  <path class="flow" d="M320 252H338"/>
  <rect class="decision" x="348" y="166" width="250" height="172" rx="14"/>
  <text class="head" x="473" y="195" text-anchor="middle">Target-wins admission</text>
  <text class="body" x="473" y="222" text-anchor="middle">official target image digest</text>
  <text class="body" x="473" y="244" text-anchor="middle">mandatory + admitted paths</text>
  <text class="body" x="473" y="266" text-anchor="middle">target owns every other path</text>
  <text class="body" x="473" y="288" text-anchor="middle">no source/reference comparison</text>
  <path class="flow" d="M604 252H622"/>
  <rect class="passive" x="632" y="166" width="250" height="172" rx="14"/>
  <text class="head" x="757" y="195" text-anchor="middle">Populate passive slot</text>
  <text class="body" x="757" y="222" text-anchor="middle">after forward-only commit</text>
  <text class="body" x="757" y="244" text-anchor="middle">prove exact slot empty + unconsumed</text>
  <text class="body" x="757" y="266" text-anchor="middle">operation-owned inventory/populate Jobs</text>
  <text class="body" x="757" y="288" text-anchor="middle">seal materialization receipt</text>
  <path class="flow" d="M888 252H906"/>
  <rect class="switch" x="916" y="166" width="220" height="172" rx="14"/>
  <text class="head" x="1026" y="195" text-anchor="middle">Switch gate</text>
  <text class="body" x="1026" y="222" text-anchor="middle">PVC UID + fence + workload</text>
  <text class="body" x="1026" y="244" text-anchor="middle">target image + receipt</text>
  <text class="body" x="1026" y="266" text-anchor="middle">protected bindings + consumers</text>
  <text class="body" x="1026" y="288" text-anchor="middle">rebind only after exact proof</text>
  <text class="note" x="600" y="369" text-anchor="middle">The active source is not a pristine reference and remains intact for recovery after the switch.</text>

  <rect class="panel" x="42" y="410" width="1116" height="230" rx="18"/>
  <text class="head" x="66" y="446">Protected customer state stays outside both rootfs slots</text>
  <rect class="data" x="64" y="470" width="330" height="128" rx="14"/>
  <text class="head" x="229" y="499" text-anchor="middle">Mandatory protected paths</text>
  <text class="small" x="229" y="526" text-anchor="middle">/data · /home · /models · /scripts</text>
  <text class="body" x="229" y="550" text-anchor="middle">plus admitted optional paths</text>
  <text class="body" x="229" y="574" text-anchor="middle">retained path-specific PV/PVC identities</text>
  <rect class="data" x="435" y="470" width="300" height="128" rx="14"/>
  <text class="head" x="585" y="499" text-anchor="middle">Protected service state</text>
  <text class="body" x="585" y="526" text-anchor="middle">controller spool + accounting DB</text>
  <text class="body" x="585" y="550" text-anchor="middle">Secrets + SSH keys unchanged</text>
  <text class="body" x="585" y="574" text-anchor="middle">same mounts in both generations</text>
  <rect class="data" x="776" y="470" width="360" height="128" rx="14"/>
  <text class="head" x="956" y="499" text-anchor="middle">Backing storage authority</text>
  <text class="body" x="956" y="524" text-anchor="middle">physical SFS (canonical): filesystem + PV/PVC IDs</text>
  <text class="body" x="956" y="548" text-anchor="middle">VM-NFS (optional): VM + disk + allocation + export IDs</text>
  <text class="body" x="956" y="572" text-anchor="middle">exact retained identity; no name-based fallback</text>

  <text class="note" x="600" y="674" text-anchor="middle">Forward-only write-ahead recovery may recycle only the exact unconsumed inactive slot—never an unknown PVC.</text>
  <text class="note" x="600" y="699" text-anchor="middle">Both rootfs generations mount the same protected storage identities.</text>
</svg>
