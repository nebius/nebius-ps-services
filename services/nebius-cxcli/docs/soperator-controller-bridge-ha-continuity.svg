<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Soperator Controller Bridge HA Continuity</title>
  <desc id="desc">The source controller singleton hands Slurm authority to a temporary source-version high-availability bridge. After a guarded cold major-version transition, the same bridge runs the target version, then fences both temporary writers and hands authority to the final target controller singleton. Login Continuity must release its exact source-session hold before Slurm partitions are restored, and partitions are restored before temporary bridge cleanup.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172554"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker>
    <symbol id="controller" viewBox="0 0 100 72">
      <rect x="5" y="7" width="90" height="58" rx="10" fill="#fff" stroke="currentColor" stroke-width="3"/>
      <path d="M50 18 L66 27 L66 45 L50 54 L34 45 L34 27 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
      <path d="M50 18 V36 M34 27 L50 36 L66 27 M50 36 V54" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="83" cy="19" r="4.5" fill="currentColor"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 58 70">
      <rect x="8" y="30" width="42" height="32" rx="6" fill="#fff" stroke="currentColor" stroke-width="3"/>
      <path d="M17 30 V21 C17 9 24 5 29 5 C34 5 41 9 41 21 V30" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="29" cy="45" r="4" fill="currentColor"/><path d="M29 49 V55" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 40px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .panel { fill: #fff; stroke: #172554; stroke-width: 2.4; filter: url(#shadow); }
      .rail { fill: #172554; }
      .rail-title { font: 700 23px Inter, Arial, sans-serif; fill: #fff; }
      .rail-sub { font: 500 13px Inter, Arial, sans-serif; fill: #cbd5e1; }
      .section { font: 700 15px Inter, Arial, sans-serif; letter-spacing: .3px; }
      .node-label { font: 700 14px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-sub { font: 500 12px Inter, Arial, sans-serif; fill: #475569; }
      .micro { font: 600 11px Inter, Arial, sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #172554; stroke-width: 2.7; marker-end: url(#arrow-navy); }
      .handoff { fill: none; stroke: #15803d; stroke-width: 2.7; marker-end: url(#arrow-green); }
      .cold-flow { fill: none; stroke: #ea580c; stroke-width: 2.7; marker-end: url(#arrow-orange); }
      .ha { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 5; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.8; filter: url(#shadow); }
      .card-title { font: 700 15px Inter, Arial, sans-serif; fill: #0f172a; }
      .card-body { font: 500 12.5px Inter, Arial, sans-serif; fill: #334155; }
      .card-num { font: 700 17px Inter, Arial, sans-serif; fill: #fff; }
      .pill { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.4; }
      .pill-warn { fill: #fff7ed; stroke: #f97316; stroke-width: 1.4; }
      .pill-text { font: 700 11.5px Inter, Arial, sans-serif; }
      .banner { fill: #fff7ed; stroke: #f97316; stroke-width: 1.6; }
      .banner-text { font: 700 16px Inter, Arial, sans-serif; fill: #c2410c; }
      .blue { color: #2563eb; }.green { color: #15803d; }.orange { color: #ea580c; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="760"/>
  <text class="title" x="800" y="50" text-anchor="middle">Soperator Controller Bridge HA Continuity</text>
  <text class="subtitle" x="800" y="78" text-anchor="middle">One writer owns Slurm authority at every durable boundary</text>

  <rect class="panel" x="28" y="100" width="1544" height="286" rx="16"/>
  <rect class="rail" x="28" y="100" width="145" height="286" rx="16"/>
  <text class="rail-title" x="100" y="158" text-anchor="middle">Slurm</text>
  <text class="rail-title" x="100" y="185" text-anchor="middle">control</text>
  <text class="rail-sub" x="100" y="219" text-anchor="middle">single-writer</text>
  <text class="rail-sub" x="100" y="238" text-anchor="middle">authority</text>
  <path d="M67 286 H133 M67 301 H133 M67 316 H133" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="82" cy="286" r="3.5" fill="#4ade80"/><circle cx="82" cy="301" r="3.5" fill="#4ade80"/><circle cx="82" cy="316" r="3.5" fill="#4ade80"/>

  <text class="section" x="278" y="130" text-anchor="middle" fill="#c2410c">LIVE SOURCE</text>
  <use href="#controller" x="220" y="153" width="116" height="84" class="orange"/>
  <text class="node-label" x="278" y="257" text-anchor="middle">controller-0</text><text class="node-sub" x="278" y="276" text-anchor="middle">source singleton</text>
  <rect class="pill" x="208" y="309" width="140" height="28" rx="14"/><text class="pill-text" x="278" y="327" text-anchor="middle" fill="#166534">authority bound</text>

  <path class="flow" d="M354 197 H408"/><text class="micro" x="381" y="183" text-anchor="middle">fence + promote</text>

  <text class="section" x="545" y="130" text-anchor="middle" fill="#1d4ed8">TEMPORARY BRIDGE · SOURCE IMAGE (vN)</text>
  <use href="#controller" x="426" y="156" width="108" height="78" class="blue"/><use href="#controller" x="558" y="156" width="108" height="78" class="blue"/>
  <line class="ha" x1="534" y1="194" x2="558" y2="194"/>
  <text class="node-label" x="480" y="257" text-anchor="middle">primary</text><text class="node-label" x="612" y="257" text-anchor="middle">standby</text>
  <text class="node-sub" x="546" y="278" text-anchor="middle">two isolated bridge node groups</text>
  <rect class="pill" x="458" y="309" width="176" height="28" rx="14"/><text class="pill-text" x="546" y="327" text-anchor="middle" fill="#166534">jobs revalidated</text>

  <path class="cold-flow" d="M676 197 H758"/><use href="#lock" x="698" y="218" width="38" height="46" class="orange"/>
  <text class="micro" x="717" y="285" text-anchor="middle" fill="#c2410c">both writers stop</text><text class="micro" x="717" y="301" text-anchor="middle" fill="#c2410c">bounded RPC gap</text>

  <text class="section" x="955" y="130" text-anchor="middle" fill="#166534">TEMPORARY BRIDGE · TARGET IMAGE (vN+1)</text>
  <use href="#controller" x="790" y="156" width="108" height="78" class="green"/><use href="#controller" x="922" y="156" width="108" height="78" class="green"/>
  <line class="ha" x1="898" y1="194" x2="922" y2="194"/>
  <text class="node-label" x="844" y="257" text-anchor="middle">primary</text><text class="node-label" x="976" y="257" text-anchor="middle">backup1</text>
  <text class="node-sub" x="910" y="278" text-anchor="middle">target-version HA proven</text>
  <rect class="pill" x="822" y="309" width="176" height="28" rx="14"/><text class="pill-text" x="910" y="327" text-anchor="middle" fill="#166534">jobs + RPCs verified</text>

  <rect x="1048" y="147" width="158" height="118" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="6 5"/>
  <use href="#controller" x="1077" y="158" width="100" height="72" class="green"/><text class="node-label" x="1127" y="247" text-anchor="middle">controller-0</text>
  <text class="micro" x="1127" y="283" text-anchor="middle">staged as backup2</text><text class="micro" x="1127" y="299" text-anchor="middle">command-gated</text>
  <use href="#lock" x="1166" y="111" width="38" height="46" class="orange"/>

  <path class="handoff" d="M1219 197 H1279"/><text class="micro" x="1249" y="183" text-anchor="middle">fence bridge</text><text class="micro" x="1249" y="215" text-anchor="middle">take over</text>

  <text class="section" x="1410" y="130" text-anchor="middle" fill="#166534">FINAL TARGET</text>
  <use href="#controller" x="1352" y="153" width="116" height="84" class="green"/>
  <text class="node-label" x="1410" y="257" text-anchor="middle">controller-0</text><text class="node-sub" x="1410" y="276" text-anchor="middle">only UP controller</text>
  <rect class="pill" x="1310" y="309" width="200" height="28" rx="14"/><text class="pill-text" x="1410" y="327" text-anchor="middle" fill="#166534">singleton authority proven</text>
  <text class="micro" x="1410" y="354" text-anchor="middle">bridge retained until partition restore</text>

  <g>
    <rect class="card" x="30" y="412" width="245" height="210" rx="14"/><circle cx="57" cy="440" r="18" fill="#172554"/><text class="card-num" x="57" y="446" text-anchor="middle">1</text><text class="card-title" x="84" y="445">Bind exact state</text>
    <text class="card-body" x="48" y="476"><tspan x="48">Capture controller config, spool,</tspan><tspan x="48" dy="19">JWT, partitions, live jobs and the</tspan><tspan x="48" dy="19">source workload/Pod identities.</tspan><tspan x="48" dy="19">Verify shared-SFS placement.</tspan></text>
    <rect class="pill" x="48" y="579" width="209" height="25" rx="12.5"/><text class="pill-text" x="152" y="596" text-anchor="middle" fill="#166534">immutable evidence captured</text>

    <rect class="card" x="289" y="412" width="245" height="210" rx="14"/><circle cx="316" cy="440" r="18" fill="#172554"/><text class="card-num" x="316" y="446" text-anchor="middle">2</text><text class="card-title" x="343" y="445">Activate source bridge</text>
    <text class="card-body" x="307" y="476"><tspan x="307">Pause only UP partitions, pre-copy</tspan><tspan x="307" dy="19">state, fence the source singleton,</tspan><tspan x="307" dy="19">then prove source-image primary</tspan><tspan x="307" dy="19">and standby authority.</tspan></text>
    <rect class="pill" x="307" y="579" width="209" height="25" rx="12.5"/><text class="pill-text" x="411" y="596" text-anchor="middle" fill="#166534">source HA + jobs verified</text>

    <rect class="card" x="548" y="412" width="245" height="210" rx="14"/><circle cx="575" cy="440" r="18" fill="#ea580c"/><text class="card-num" x="575" y="446" text-anchor="middle">3</text><text class="card-title" x="602" y="445">Cross the cold boundary</text>
    <text class="card-body" x="566" y="476"><tspan x="566">Seal the fresh all-job/all-node</tspan><tspan x="566" dy="19">census, stop both source writers,</tspan><tspan x="566" dy="19">promote the cold delta, and start</tspan><tspan x="566" dy="19">both target-image writers.</tspan></text>
    <rect class="pill-warn" x="566" y="579" width="209" height="25" rx="12.5"/><text class="pill-text" x="670" y="596" text-anchor="middle" fill="#c2410c">bounded Slurm RPC gap</text>

    <rect class="card" x="807" y="412" width="245" height="210" rx="14"/><circle cx="834" cy="440" r="18" fill="#15803d"/><text class="card-num" x="834" y="446" text-anchor="middle">4</text><text class="card-title" x="861" y="445">Prove target bridge HA</text>
    <text class="card-body" x="825" y="476"><tspan x="825">Verify both target-image writers,</tspan><tspan x="825" dy="19">exact config/state, preserved jobs,</tspan><tspan x="825" dy="19">healthy RPCs and the target JWT</tspan><tspan x="825" dy="19">mount contract.</tspan></text>
    <rect class="pill" x="825" y="579" width="209" height="25" rx="12.5"/><text class="pill-text" x="929" y="596" text-anchor="middle" fill="#166534">target bridge HA verified</text>

    <rect class="card" x="1066" y="412" width="245" height="210" rx="14"/><circle cx="1093" cy="440" r="18" fill="#15803d"/><text class="card-num" x="1093" y="446" text-anchor="middle">5</text><text class="card-title" x="1120" y="445">Hand off to controller-0</text>
    <text class="card-body" x="1084" y="476"><tspan x="1084">Keep the target singleton gated,</tspan><tspan x="1084" dy="19">fence both bridge writers, dispatch</tspan><tspan x="1084" dy="19">exact takeover, then prove only-UP</tspan><tspan x="1084" dy="19">status plus config and job RPCs.</tspan></text>
    <rect class="pill" x="1084" y="579" width="209" height="25" rx="12.5"/><text class="pill-text" x="1188" y="596" text-anchor="middle" fill="#166534">singleton authority proven</text>

    <rect class="card" x="1325" y="412" width="245" height="210" rx="14"/><circle cx="1352" cy="440" r="18" fill="#15803d"/><text class="card-num" x="1352" y="446" text-anchor="middle">6</text><text class="card-title" x="1379" y="445">Restore, then clean up</text>
    <text class="card-body" x="1343" y="476"><tspan x="1343">After Login Continuity releases its</tspan><tspan x="1343" dy="19">exact source hold, finalize health;</tspan><tspan x="1343" dy="19">restore exact partitions, then</tspan><tspan x="1343" dy="19">delete the stopped bridge.</tspan></text>
    <rect class="pill" x="1343" y="579" width="209" height="25" rx="12.5"/><text class="pill-text" x="1447" y="596" text-anchor="middle" fill="#166534">scheduling restored first</text>
  </g>

  <rect class="banner" x="30" y="646" width="1540" height="82" rx="14"/>
  <path d="M58 706 L76 672 L94 706 Z" fill="#ea580c"/><rect x="74" y="683" width="4" height="13" rx="2" fill="#fff"/><circle cx="76" cy="701" r="2.3" fill="#fff"/>
  <text class="banner-text" x="815" y="676" text-anchor="middle">A Slurm major-version transition requires a brief, bounded controller RPC gap.</text>
  <text class="banner-text" x="815" y="699" text-anchor="middle">Running allocations continue on slurmd; direct RPCs pause while durable accepted actions remain queued.</text>
  <text class="banner-text" x="815" y="722" text-anchor="middle">The stopped bridge remains available for roll-forward recovery until exact partition restoration succeeds.</text>
</svg>
