[project]
name = "nebius-cxcli"
dynamic = ["version"]
description = "Nebius customer platform orchestration CLI"
readme = "README.md"
authors = [{ name = "Reza B." }]
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "nebius>=0.3.59,<1.0.0",
  "PyNaCl>=1.5.0,<2.0.0",
  "questionary>=2.1.0,<3.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "rich>=13.9.0,<15.0.0",
  "textual>=8.2.0,<9.0.0",
  "typer>=0.12.0,<1.0.0",
  "ruamel-yaml>=0.18.6,<0.19.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "mypy>=1.11.0,<2.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "ruff>=0.6.0,<1.0.0",
  "setuptools-scm>=8.0.0,<9.0.0",
  "watchfiles>=1.2.0,<2.0.0",
]

[project.scripts]
nebius-cxcli = "nebius_cxcli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nebius_cxcli*"]

[tool.setuptools.package-data]
nebius_cxcli = [
  "component_sources.yaml",
  "component_cli_settings.yaml",
  "grafana_dashboards/*.json",
  "soperator_migration_profiles.yaml",
]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"
write_to = "src/nebius_cxcli/_version.py"
tag_regex = "^nebius-cxcli-v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match nebius-cxcli-v*"
search_parent_directories = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["dist", "build", ".venv", "src/nebius_cxcli/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: slower or explicitly isolated validation lane",
]
filterwarnings = [
  "ignore:There is no current event loop:DeprecationWarning:nebius\\.aio\\.channel",
]

[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=8", "PyYAML>=6.0.2,<7.0.0"]
build-backend = "setuptools.build_meta"
