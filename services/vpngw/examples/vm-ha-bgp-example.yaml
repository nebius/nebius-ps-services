# Two-node VM-level HA example. VM roles are independent of tunnel ha_role.
---
version: 1

tenant_id: "${TENANT_ID}"
project_id: "${PROJECT_ID}"
region_id: "${REGION_ID}"

gateway_group:
  name: "nebius-vpn-gw"
  instance_count: 2
  external_ips:
    - ["203.0.113.10"]
    - ["203.0.113.20"]
  vm_ha:
    enabled: true
    cluster_id: "nebius-vpn-gw-ha"
    members:
      - node_id: "gateway-a"
        instance_index: 0
        role: "active"
        credential_sources:
          certificate_authority: "/operator-secrets/gateway-a/peer-ca.pem"
          certificate: "/operator-secrets/gateway-a/peer.crt"
          private_key: "/operator-secrets/gateway-a/peer.key"
          nebius_credentials: "/operator-secrets/gateway-a/nebius-credentials.json"
      - node_id: "gateway-b"
        instance_index: 1
        role: "passive"
        credential_sources:
          certificate_authority: "/operator-secrets/gateway-b/peer-ca.pem"
          certificate: "/operator-secrets/gateway-b/peer.crt"
          private_key: "/operator-secrets/gateway-b/peer.key"
          nebius_credentials: "/operator-secrets/gateway-b/nebius-credentials.json"
  subnet:
    name: "vpngw-subnet"
    cidr: null
    prefix_length: 24
  vm_spec:
    platform: "cpu-d3"
    preset: "4vcpu-16gb"
    disk_boot_image: "ubuntu24.04-driverless"
    disk_gb: 100
    disk_type: "network_ssd"
    disk_block_bytes: 4096
    num_nics: 1
    ssh_public_key: "${SSH_PUBLIC_KEY}"
    ssh_private_key_path: "~/.ssh/id_ed25519"

gateway:
  local_asn: 65010
  local_prefixes: ["10.10.0.0/16"]

defaults:
  crypto:
    ike_proposals: ["aes256-sha256-modp2048"]
    ike_lifetime_seconds: 28800
    esp_proposals: ["aes256-sha256-modp2048"]
    esp_lifetime_seconds: 3600
    dh_groups: [14]
  dpd:
    interval_seconds: 5
    timeout_seconds: 15
  ha_mode: "active-passive"
  routing:
    mode: "bgp"

connections:
  - name: "cloud-bgp"
    vendor: "generic"
    routing_mode: "bgp"
    bgp:
      enabled: true
      remote_asn: 65020
      advertise_local_prefixes: true
    tunnels:
      - name: "cloud-bgp-node-a"
        gateway_instance_index: 0
        ha_role: "active"
        remote_public_ip: "198.51.100.20"
        psk: "${BGP_NODE_A_PSK}"
        inner_cidr: "169.254.20.0/30"
        inner_local_ip: "169.254.20.1"
        inner_remote_ip: "169.254.20.2"
      - name: "cloud-bgp-node-b"
        gateway_instance_index: 1
        ha_role: "active"
        remote_public_ip: "198.51.100.21"
        psk: "${BGP_NODE_B_PSK}"
        inner_cidr: "169.254.21.0/30"
        inner_local_ip: "169.254.21.1"
        inner_remote_ip: "169.254.21.2"
