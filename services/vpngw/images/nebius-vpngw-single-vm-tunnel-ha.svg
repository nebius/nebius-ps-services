<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Single-VM Nebius VPN Gateway with tunnel-level high availability</title>
  <desc id="desc">One Nebius VPN Gateway VM carries two IPsec tunnels. Tunnel 0 is the preferred active path and tunnel 1 is the passive standby path. A tunnel failure can fail over locally, but a VM failure interrupts both tunnels because VM-level HA is disabled.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#0b1220" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .kicker { font-size: 13px; font-weight: 750; letter-spacing: 1.8px; text-transform: uppercase; }
      .hero { font-size: 32px; font-weight: 760; letter-spacing: -0.4px; }
      .subtitle { font-size: 16px; fill: #cbd5e1; }
      .section { font-size: 13px; font-weight: 750; letter-spacing: 1.2px; text-transform: uppercase; fill: #64748b; }
      .panel-title { font-size: 21px; font-weight: 730; }
      .label { font-size: 15px; font-weight: 680; }
      .small { font-size: 13.5px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .white { fill: #ffffff; }
      .accent-kicker { fill: #93c5fd; }
      .on-navy { fill: #bfdbfe; }
      .on-dark { fill: #cbd5e1; }
      .on-rose { fill: #fda4af; }
      .on-amber { fill: #fbbf24; }
      .footer-note { fill: #94a3b8; }
      .warning-glyph { fill: #fbbf24; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f5f7fb"/>
  <rect x="32" y="30" width="1376" height="126" rx="24" fill="#0b1220"/>
  <rect x="32" y="30" width="8" height="126" rx="4" fill="#4f8cff"/>
  <text x="72" y="64" class="kicker accent-kicker">Reference architecture · Nebius VPN Gateway</text>
  <text x="72" y="103" class="hero white">Single VM with tunnel-level high availability</text>
  <text x="72" y="132" class="subtitle">Redundant IPsec paths protect tunnel availability; the gateway VM remains the failure boundary.</text>
  <g transform="translate(1132 64)">
    <rect width="226" height="58" rx="14" fill="#211827" stroke="#fb7185" stroke-opacity="0.55"/>
    <circle cx="28" cy="29" r="8" fill="#fb7185"/>
    <text x="48" y="25" class="label white">VM-HA disabled</text>
    <text x="48" y="43" class="tiny on-rose">default topology</text>
  </g>

  <text x="60" y="197" class="section">Nebius network</text>
  <text x="500" y="197" class="section">Gateway instance</text>
  <text x="1040" y="197" class="section">Remote network</text>

  <g filter="url(#shadow)">
    <rect x="60" y="218" width="340" height="500" rx="20" fill="#ffffff" stroke="#d8dee9"/>
    <rect x="500" y="218" width="440" height="500" rx="20" fill="#ffffff" stroke="#b8c7e3"/>
    <rect x="1040" y="218" width="340" height="500" rx="20" fill="#ffffff" stroke="#d8dee9"/>
  </g>

  <g>
    <rect x="60" y="218" width="340" height="74" rx="20" fill="#f0f5ff"/>
    <rect x="60" y="272" width="340" height="20" fill="#f0f5ff"/>
    <circle cx="94" cy="254" r="14" fill="#2563eb"/>
    <circle cx="94" cy="254" r="6" fill="#bfdbfe"/>
    <text x="120" y="250" class="panel-title">Nebius VPC</text>
    <text x="120" y="270" class="tiny">Private workload network</text>

    <rect x="88" y="332" width="284" height="96" rx="14" fill="#f8fafc" stroke="#d8dee9"/>
    <text x="112" y="366" class="label">Workload subnets</text>
    <text x="112" y="391" class="small">Application traffic for remote prefixes</text>
    <rect x="112" y="403" width="142" height="6" rx="3" fill="#cbd5e1"/>

    <line x1="230" y1="428" x2="230" y2="492" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

    <rect x="88" y="500" width="284" height="122" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="112" y="536" class="label" fill="#166534">VPC route table</text>
    <text x="112" y="562" class="small">Remote prefixes → gateway VM</text>
    <rect x="112" y="582" width="210" height="26" rx="13" fill="#dcfce7"/>
    <text x="217" y="600" text-anchor="middle" class="tiny" fill="#166534">one private next hop</text>
  </g>

  <g>
    <rect x="500" y="218" width="440" height="86" rx="20" fill="#172554"/>
    <rect x="500" y="284" width="440" height="20" fill="#172554"/>
    <circle cx="540" cy="261" r="17" fill="#dbeafe"/>
    <rect x="532" y="253" width="16" height="16" rx="3" fill="#2563eb"/>
    <text x="570" y="257" class="panel-title white">nebius-vpngw0</text>
    <text x="570" y="279" class="tiny on-navy">one VM · one forwarding owner · two tunnel roles</text>

    <rect x="534" y="352" width="372" height="92" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="534" y="352" width="7" height="92" rx="3.5" fill="#2563eb"/>
    <circle cx="566" cy="398" r="9" fill="#2563eb"/>
    <text x="590" y="390" class="label">Tunnel 0 · active role</text>
    <text x="590" y="415" class="small">Preferred IPsec and BGP data path</text>
    <rect x="784" y="370" width="98" height="24" rx="12" fill="#dbeafe"/>
    <text x="833" y="387" text-anchor="middle" class="tiny" fill="#1d4ed8">preferred</text>

    <rect x="534" y="484" width="372" height="92" rx="15" fill="#fffbeb" stroke="#fcd34d"/>
    <rect x="534" y="484" width="7" height="92" rx="3.5" fill="#d97706"/>
    <circle cx="566" cy="530" r="9" fill="#d97706"/>
    <text x="590" y="522" class="label">Tunnel 1 · passive role</text>
    <text x="590" y="547" class="small">Established standby data path</text>
    <rect x="784" y="502" width="98" height="24" rx="12" fill="#fef3c7"/>
    <text x="833" y="519" text-anchor="middle" class="tiny" fill="#a16207">standby</text>

    <rect x="534" y="620" width="372" height="58" rx="14" fill="#f8fafc" stroke="#d8dee9"/>
    <text x="720" y="645" text-anchor="middle" class="label">strongSwan + FRR</text>
    <text x="720" y="665" text-anchor="middle" class="tiny">one forwarding plane selects the usable tunnel</text>
  </g>

  <g>
    <rect x="1040" y="218" width="340" height="74" rx="20" fill="#f0fdfa"/>
    <rect x="1040" y="272" width="340" height="20" fill="#f0fdfa"/>
    <circle cx="1074" cy="254" r="14" fill="#0f766e"/>
    <circle cx="1074" cy="254" r="6" fill="#99f6e4"/>
    <text x="1100" y="250" class="panel-title">Peer VPN</text>
    <text x="1100" y="270" class="tiny">cloud, datacenter, or branch</text>

    <rect x="1080" y="352" width="260" height="92" rx="15" fill="#f8fafc" stroke="#93c5fd"/>
    <text x="1106" y="388" class="label">Peer endpoint 0</text>
    <text x="1106" y="414" class="small">terminates tunnel 0</text>
    <circle cx="1310" cy="398" r="9" fill="#2563eb"/>

    <rect x="1080" y="484" width="260" height="92" rx="15" fill="#f8fafc" stroke="#fcd34d"/>
    <text x="1106" y="520" class="label">Peer endpoint 1</text>
    <text x="1106" y="546" class="small">terminates tunnel 1</text>
    <circle cx="1310" cy="530" r="9" fill="#d97706"/>

    <rect x="1080" y="620" width="260" height="58" rx="14" fill="#f8fafc" stroke="#d8dee9"/>
    <text x="1210" y="645" text-anchor="middle" class="label">Shared VM dependency</text>
    <text x="1210" y="665" text-anchor="middle" class="tiny">both tunnels terminate on one VM</text>
  </g>

  <line x1="372" y1="562" x2="500" y2="562" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <rect x="402" y="536" width="70" height="20" rx="10" fill="#f5f7fb"/>
  <text x="437" y="550" text-anchor="middle" class="tiny">VPC traffic</text>

  <line x1="906" y1="398" x2="1080" y2="398" stroke="#2563eb" stroke-width="5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <line x1="906" y1="530" x2="1080" y2="530" stroke="#d97706" stroke-width="4" stroke-dasharray="11 9" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>

  <g>
    <rect x="60" y="758" width="1320" height="100" rx="20" fill="#101827"/>
    <rect x="60" y="758" width="8" height="100" rx="4" fill="#f59e0b"/>
    <circle cx="108" cy="808" r="22" fill="#2b2116" stroke="#f59e0b"/>
    <text x="108" y="815" text-anchor="middle" font-size="22" font-weight="800" class="warning-glyph">!</text>
    <text x="148" y="796" class="label white">Availability boundary</text>
    <text x="148" y="824" class="small on-dark">Tunnel failure moves traffic to the standby path. VM failure makes both tunnels unavailable until this VM recovers.</text>
    <rect x="1128" y="784" width="202" height="48" rx="12" fill="#1e293b"/>
    <text x="1229" y="804" text-anchor="middle" class="tiny on-amber">TUNNEL HA</text>
    <text x="1229" y="822" text-anchor="middle" class="tiny footer-note">VM remains a SPOF</text>
  </g>
</svg>
