interface:
  display_name: "Align"
  short_description: "Changed-scope quality gate and alignment"
  default_prompt: "Use $align to perform a cautious changed-scope quality gate: synthesize the current thread, relevant Agent Memory, task state, and caller-supplied finding constraints; understand the project contract; preserve gated and deferred findings; fix only other clear low-risk issues; run code-review as a report-only child lane plus lint/syntax, security, cross-code, and focused test/build validation; and report blockers plus unresolved risks."
policy:
  allow_implicit_invocation: true
