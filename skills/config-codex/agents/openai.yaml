interface:
  display_name: "Config Codex"
  short_description: "Bootstrap a public-safe local Codex runtime setup"
  default_prompt: "Use $config-codex to configure my local Codex setup from public-safe templates: inspect first, back up only changed files, merge AGENTS.md/config.toml updates without replacing user-owned content, keep secrets out of config, install hooks/custom agents safely, create task-state layout, then validate and tell me how to restart and trust hooks."
