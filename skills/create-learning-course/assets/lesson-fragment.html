<section class="lesson" id="{{LESSON_ID}}">
  <h2>{{LESSON_NUMBER}}. {{LESSON_TITLE}}</h2>
  <div class="lesson-outcome">
    <h3>Objective</h3>
    {{OBJECTIVE_HTML}}
  </div>
  <div class="how-it-works">
    <h3>How it works</h3>
    {{CONNECTED_EXPLANATION_HTML}}
    <!-- Keep each diagram inside How it works beside its explanatory prose.
         Add further explanatory paragraphs/figures here when needed. -->
    <figure id="{{FIGURE_ID}}">
      {{INLINE_SVG_WITH_UNIQUE_IDS}}
      <figcaption>{{CAPTION_WITH_ESSENTIAL_MEANING}}</figcaption>
    </figure>
  </div>
  <div class="practice-links">
    <h3>Practice</h3>
    {{PRACTICE_HTML}}
  </div>
  <div class="mental-model">
    <h3>Mental model</h3>
    {{MENTAL_MODEL_HTML}}
  </div>
</section>
