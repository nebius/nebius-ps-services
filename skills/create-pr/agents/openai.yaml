interface:
  display_name: "Create PR"
  short_description: "Publish exact SDLC heads or prepare clean PRs"
  default_prompt: "Use $create-pr to inspect repository and Agentic SDLC state first. Reject every state-classified managed child, integration candidate, nested worker, or inconsistent ownership claim and route it to its local owner. For an unmanaged source, resolve the symbolic remote default and bind the exact PR base and head. When a matching unmanaged SDLC run exists, require passing UAT, a clean named branch, and current HEAD equal to the recorded promoted SHA; publish through one direct explicit-ref push and PR create action, and route required changes through sdlc-classify-failure and sdlc-start. Otherwise begin one root task with all selected refs before branch movement, including clean starts; reuse or prepare the selected non-default branches, run focused checks, stage from the repository root with git add -A, synchronize the frozen base through the shared helper and review its actual result without rebasing, push with explicit refspecs, open or reuse the exact base/head PR, continue validated commits and pushes under the shared commit helper PR grant until available checks finish, finish completed or zero-commit tasks explicitly, and report URLs and readiness."
policy:
  allow_implicit_invocation: false
