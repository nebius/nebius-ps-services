interface:
  display_name: "Create PR"
  short_description: "Open clean PRs after local checks finish"
  default_prompt: "Use $create-pr to inspect repository state, reuse the current non-default branch when no branch is named, never create a second feature branch for that path, run safe formatting, whitespace, lint, build, and focused test checks before committing dirty work, wait for local tests to finish before staging and committing, stage current dirty work from the repository root with git add -A, validate the staged diff, commit it on the current branch before switching, merging, or pushing, refresh the base-branch context, merge origin/<base> into each PR branch before PR creation so the branch has the latest base updates without rewriting history, never rebase or force-push in this skill, never path-limit PR staging, preserve one PR per branch, push with explicit refspecs, repair safe branch-owned validation or GitHub check failures before treating PR creation as complete, wait for available GitHub checks to reach a terminal state before reporting a PR ready, honor any explicit PR title or body from the user request, open or reuse the GitHub pull requests, and return the PR numbers, URLs, readiness state, validation state, and manual merge order."
