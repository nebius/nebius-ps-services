interface:
  display_name: "Create PR"
  short_description: "Publish exact SDLC heads or prepare clean PRs"
  default_prompt: "Use $create-pr to inspect repository and Agentic SDLC state first. Resolve the actual symbolic remote default and bind both the exact PR base and head. When a matching active SDLC run exists, use publication-only mode: require passing UAT, a clean named branch, and current HEAD equal to the exact recorded promoted SHA; publish through one direct push with an explicit HEAD refspec and one direct PR create action with explicit base and head; do not stage, edit, commit, merge the base, repair, switch branches, use shell wrappers or compound commands, or publish a different remote head; and route any required change through sdlc-classify-failure and sdlc-start before retrying. Otherwise use the generic PR workflow: reuse the current non-default branch when no branch is named, run focused checks before committing dirty work, stage from the repository root with git add -A, validate the staged diff, merge origin/<base> without rebasing, push with explicit refspecs, open or reuse the exact base/head PR, wait for available checks, and report URLs and readiness."
policy:
  allow_implicit_invocation: false
