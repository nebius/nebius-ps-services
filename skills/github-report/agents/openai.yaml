interface:
  display_name: "GitHub Report"
  short_description: "Report GitHub activity or rank LOC modifications"
  default_prompt: "Use $github-report to report all human contributors' completed GitHub activity for the last 90 days grouped by user, followed by one shared current open backlog per repository. For a lines-changed ranking, use --loc-modifications-report with optional --owner and --top."
policy:
  allow_implicit_invocation: true
