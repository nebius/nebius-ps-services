# Reference values for an explicitly owned driverful InfiniBand node set.
# Replace example.com/driverful with a caller-owned, verified label selector.
# This is not a Nebius-provided node label.
#
# The host image already owns the OFED path, so Network Operator stays focused
# on Kubernetes-side discovery and RDMA exposure.

operator:
  ofedDriver:
    deploy: false

nfd:
  enabled: true
  deployNodeFeatureRules: true

node-feature-discovery:
  worker:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: example.com/driverful
                  operator: In
                  values:
                    - "true"

nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
      - matchExpressions:
          - key: feature.node.kubernetes.io/pci-15b3.present
            operator: In
            values:
              - "true"
