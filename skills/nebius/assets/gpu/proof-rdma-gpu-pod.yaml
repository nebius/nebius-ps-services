# Active diagnostic: creates a GPU-consuming pod. Not GPUDirect/NCCL proof.
apiVersion: v1
kind: Pod
metadata:
  generateName: rdma-gpu-proof-
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: proof
      # Replace with a CUDA-enabled image that is allowed in the target
      # environment.
      image: <cuda-enabled-image>
      command:
        - /bin/bash
        - -lc
      args:
        - |
          set -euo pipefail
          nvidia-smi
          test -d /dev/infiniband
          ls -l /dev/infiniband
      resources:
        limits:
          nvidia.com/gpu: "1"
          rdma/shared_device: "1"
