interface:
  display_name: "Publish Release"
  short_description: "Publish GitHub Releases end to end"
  default_prompt: "Use $publish-release to commit current work, push and merge its PR, run local review-pr and safe repairs, use merge-pr for protected Actions approval/merge, publish and verify the release; use --resume after an interruption."
