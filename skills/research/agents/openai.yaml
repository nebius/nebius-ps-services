interface:
  display_name: "Research"
  short_description: "Technical due diligence research for design decisions"
  default_prompt: "Use $research to investigate one technology, architecture pattern, API, protocol, RFC, product, or feature requirement. Search relevant internal context first, verify technical claims with official or authoritative sources, label provenance, and return bounded findings to the owning design or stack decision."
