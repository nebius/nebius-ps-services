interface:
  display_name: "Review GitHub Issues"
  short_description: "Group GitHub issues and save shared batch plans"
  default_prompt: "Use $review-github-issues to review open issues, explicit numbers or exact-label batches (default five total), group shared remediation, apply justified existing labels/comments/closures and save accepted plans. Preserve unrelated labels; PR-caller mode advises read-only."
policy:
  allow_implicit_invocation: false
