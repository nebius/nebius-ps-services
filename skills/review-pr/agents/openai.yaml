interface:
  display_name: "Review PR"
  short_description: "Review PR readiness without SDLC head drift"
  default_prompt: "Use $review-pr to review a GitHub pull request by number, URL, or current branch against its base branch. When it maps to an active Agentic SDLC run, use findings-and-readiness-only mode: require the PR head to equal the clean exact promoted SHA, never change the branch or PR head, and route every required fix through sdlc-classify-failure and sdlc-start before the gates rerun. Otherwise a root explicit combined review-and-merge request delegates once early to merge-pr; a parent-owned review-pr call never re-delegates. Use nested read-only code-review for the complete frozen diff and route to the smallest relevant specialists, assess accepted behavior, safety and compatibility, prove safe repairs on writable branches, then invoke root-owned maintain-project-specs for every affected project before final review, delegate all safe repair commits and base sync to create-pr private preparation without recursion, revalidate/re-review and post exact-head/base COMMENT attestation. Plain review never initiates merging; preserve parent grant and deadlines, and never issue approval or merge effects directly; stop for unsafe findings and human objections."
policy:
  allow_implicit_invocation: false
