interface:
  display_name: "Review PR"
  short_description: "Review PRs in an isolated private checkout"
  default_prompt: "Use $review-pr to review a GitHub pull request by number, URL, current branch, or an exact-label batch (default five) against its base branch. Freeze the selection without refills and collect all direct closing links into shared issue context before any per-PR dispatch; reconcile each owner outcome before continuing. Terminal labels audit only and never dispatch enrolled process. Assess directly closing-linked issues independently through the read-only issue adviser; batch flags grant no closure or merge authority. Preserve the caller checkout, files, index and local refs throughout every standalone or nested review. Use canonical private review execution for checkout-dependent work and safe repairs; publish to the existing remote PR without importing repairs locally. Retain the original grant, return execution evidence to the parent, and never fall back to switching the caller. When it maps to an active Agentic SDLC run, use findings-and-readiness-only mode: require the PR head to equal the clean exact promoted SHA, never change the branch or PR head, and route every required fix through sdlc-classify-failure and sdlc-start before the gates rerun. Terminal-label audits never delegate merge even with combined wording. For other selections a root explicit combined review-and-merge request delegates once per PR to merge-pr; a parent-owned review-pr call never re-delegates. Use nested read-only code-review for the complete frozen diff and route to the smallest relevant specialists, assess accepted behavior, safety and compatibility, prove safe repairs on writable branches, then invoke root-owned maintain-project-specs for every affected project before final review, delegate all safe repair commits and base sync to create-pr private preparation without recursion, revalidate/re-review and post exact-head/base COMMENT attestation. Plain review never initiates merging; preserve parent grant and deadlines, and never issue approval or merge effects directly; stop for unsafe findings and human objections."
policy:
  allow_implicit_invocation: false
