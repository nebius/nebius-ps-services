interface:
  display_name: "SDLC Create Plan"
  short_description: "Lock a delivery slice plan"
  default_prompt: "Use $sdlc-create-plan to create a local locked plan for one admitted delivery slice with original requirement and feature mappings. For a classified post-evaluation repair, create only immutable corrective plan vN+1, preserve all existing task definitions and completed digests, append diagnosis-bound corrective tasks and waves, and bind the original evaluator oracle."
