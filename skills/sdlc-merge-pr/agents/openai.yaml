interface:
  display_name: "SDLC Merge PR"
  short_description: "Merge only the exact reviewed SDLC head"
  default_prompt: "Use $sdlc-merge-pr only as the SDLC delivery owner. Require accepted run-level opt-in, exact promoted/reviewed/qualified evidence, all mandatory criteria, clean live trial, current base, CI and required approvals. Use the already-installed protected direct-merge broker; reject queues and raw merge APIs. Reconcile ambiguous submission without repeating it, verify the merged result, and block dependent slices on failed result verification."
policy:
  allow_implicit_invocation: false
