interface:
  display_name: "Task Implementer"
  short_description: "Coordinate private prompts through isolated dependency waves"
  default_prompt: "Use $task-implementer workspace init [project-folder] once, then $task-implementer run <prompt-path-or-unique-filename>. Keep the two-command public surface and IDs private; plan deterministic dependency waves from complete write claims and conflict domains; use isolated full-repository worktrees and one reviewed direct-child commit per worker; integrate in stable order; validate and review the combined result; reconcile steering; promote only by ff-only merge; and clean up verified reachable resources without force."
policy:
  allow_implicit_invocation: false
