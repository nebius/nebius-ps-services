interface:
  display_name: "Task Implementer"
  short_description: "Sequential brownfield task implementation"
  default_prompt: "Use $task-implementer to split a complex brownfield request into ordered task-1..task-n steps, then for each task gather context with brainstorm when useful, route design or contract choices through design, write a short plan, implement one task per fresh Codex session, run validation and code-review, fix scoped findings, commit through $commit, and maintain a markdown handoff checkpoint."
policy:
  allow_implicit_invocation: false
