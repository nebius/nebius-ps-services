interface:
  display_name: "Task Implementer"
  short_description: "Steer private prompts through planned brownfield tasks"
  default_prompt: "Use $task-implementer workspace init [project-folder] once, then $task-implementer run <prompt-path-or-unique-filename> in each fresh session. Reuse the same edited prompt for steering, keep IDs private, reconcile managed requirements and just-in-time design, claim exactly one dependency-ready task from a clean worktree, lock its plan and exact file allowlist before product edits, validate/review/commit/checkpoint once, hand off, and stop the session."
policy:
  allow_implicit_invocation: false
