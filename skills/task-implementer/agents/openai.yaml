interface:
  display_name: "Task Implementer"
  short_description: "Private prompts to sequential brownfield tasks"
  default_prompt: "Use $task-implementer prepare <prompt-path> to validate and snapshot one private Markdown ask, inspect the brownfield repository, create a reviewable task-1..task-n handoff queue, and stop without product edits. After approval, use run or continue for exactly one task per fresh Codex session through brainstorm/design/plan, validation, code-review, scoped fixes, and $commit; use reconcile for edited active prompts without implementation."
policy:
  allow_implicit_invocation: false
